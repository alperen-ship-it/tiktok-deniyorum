<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Hedef çubuğu — beğeni / elmas / takipçi</title>
<link rel="stylesheet" href="_shared/base.css">
<style>
  #box {
    position: fixed;
    left: 50%;
    bottom: 46px;
    transform: translateX(-50%);
    width: min(880px, calc(100vw - 80px));
    padding: 18px 22px 20px;
    border-radius: 22px;
  }

  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 16px;
  }
  .label { font-size: 21px; font-weight: 700; letter-spacing: -.2px; }
  .nums { font-size: 20px; font-variant-numeric: tabular-nums; opacity: .9; }
  .nums .cur { font-size: 30px; font-weight: 900; color: var(--tt-cyan); }
  .nums .sep { opacity: .4; margin: 0 4px; }

  .track {
    position: relative;
    height: 30px;
    border-radius: 15px;
    background: rgba(255, 255, 255, .10);
    overflow: hidden;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .4);
  }

  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 15px;
    background: linear-gradient(90deg, #25f4ee, #4fa8ff 45%, #fe2c55);
    /* cubuk kasilmasin diye genislik gecisi yumusak ama kisa */
    transition: width .45s cubic-bezier(.16, 1, .3, 1);
  }

  /* Ilerleyen cizgiler — hareket hissi versin */
  .fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(115deg,
      rgba(255,255,255,.16) 0 12px, transparent 12px 26px);
    animation: slide 1.1s linear infinite;
  }
  @keyframes slide { to { background-position: 52px 0; } }

  .pct {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .5px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, .8);
  }

  #done {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s;
  }
  #done.on { opacity: 1; }
  #done .big {
    font-size: 94px;
    font-weight: 900;
    letter-spacing: -4px;
    background: linear-gradient(180deg, #fff, #25f4ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 8px 30px rgba(37, 244, 238, .6));
    animation: punch .6s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes punch { from { transform: scale(.3) rotate(-6deg); opacity: 0; } }
  #done .sub { font-size: 24px; opacity: .85; margin-top: 6px; }
</style>
</head>
<body>

<div id="box" class="tt-card tt-outline">
  <div class="top">
    <div class="label" id="label">BEĞENİ HEDEFİ</div>
    <div class="nums"><span class="cur" id="cur">0</span><span class="sep">/</span><span id="goal">0</span></div>
  </div>
  <div class="track"><div class="fill" id="fill"></div><div class="pct" id="pct">%0</div></div>
</div>

<div id="done"><div><div class="big">HEDEF TAMAM!</div><div class="sub" id="doneSub"></div></div></div>

<script src="_shared/tt.js"></script>
<script>
(() => {
  'use strict';

  const q = new URLSearchParams(location.search);

  // ?mode=likes|diamonds|follows|shares   ?goal=5000   ?label=ÖZEL YAZI
  // ?next=1  -> hedefe ulasinca hedefi ikiye katlayip devam et
  const MODE = (q.get('mode') || 'likes').toLowerCase();
  const NEXT = q.get('next') === '1';

  const PRESET = {
    likes:    { goal: 5000,  label: 'BEĞENİ HEDEFİ',   unit: '❤️' },
    diamonds: { goal: 1000,  label: 'ELMAS HEDEFİ',    unit: '💎' },
    follows:  { goal: 100,   label: 'TAKİPÇİ HEDEFİ',  unit: '💜' },
    shares:   { goal: 50,    label: 'PAYLAŞIM HEDEFİ', unit: '🔁' },
  };
  const P = PRESET[MODE] || PRESET.likes;

  let goal = Number(q.get('goal')) || P.goal;
  let cur = 0;

  const elCur = document.getElementById('cur');
  const elGoal = document.getElementById('goal');
  const elFill = document.getElementById('fill');
  const elPct = document.getElementById('pct');
  const elDone = document.getElementById('done');

  document.getElementById('label').textContent = q.get('label') || P.label;
  document.getElementById('doneSub').textContent = P.unit + ' ' + (q.get('label') || P.label).toLowerCase();

  function render() {
    const pct = Math.min(100, (cur / goal) * 100);
    elCur.textContent = TT.short(cur);
    elGoal.textContent = TT.short(goal);
    elFill.style.width = pct + '%';
    elPct.textContent = '%' + pct.toFixed(pct < 10 ? 1 : 0);
  }

  function add(n) {
    cur += n;
    render();

    if (cur >= goal) {
      elDone.classList.add('on');
      setTimeout(() => {
        elDone.classList.remove('on');
        if (NEXT) {
          // Hedefi buyut ve devam et: yayin boyunca surekli bir ugras kalir
          goal = Math.round(goal * 2);
          render();
        }
      }, 4000);
    }
  }

  if (MODE === 'likes') {
    TT.on('like', (ev) => {
      // totalLikes varsa onu kullan (daha dogru), yoksa artimli say
      if (ev.totalLikes) { cur = ev.totalLikes; render(); if (cur >= goal) add(0); }
      else add(ev.likes || 1);
    });
  } else if (MODE === 'diamonds') {
    TT.on('gift', (ev) => {
      if (ev.gift.streaking) return;
      add(ev.gift.value || ev.gift.diamonds * (ev.gift.count || 1));
    });
  } else if (MODE === 'follows') {
    TT.on('follow', () => add(1));
  } else if (MODE === 'shares') {
    TT.on('share', () => add(1));
  }

  render();
})();
</script>
</body>
</html>
