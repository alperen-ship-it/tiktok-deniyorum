<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Oyun Merkezi — tek link, tam otomasyon</title>
<style>
  /* TEK LINK MODU.
     Yayinci LIVE Studio'ya SADECE bu sayfayi ekler; oyunlar burada doner.
     Neden iframe: her oyun kendi sabit 1920x1080 kabugunu, fizigini ve
     durumunu yonetiyor — hepsini tek sayfada birlestirmek yerine oldugu
     gibi yukleyip sirayla gostermek hem basit hem saglam. Ayni kaynaktan
     (kopru) servis edildikleri icin postMessage ile konusabiliyoruz. */
  html, body { margin: 0; width: 100%; height: 100%; background: #1a1145; overflow: hidden; }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    opacity: 1; transition: opacity .45s ease;
  }
  iframe.soluk { opacity: 0; }

  /* "Siradaki oyun" rozeti — son 45 saniyede gorunur.

     DIKEY (varsayilan, PLAN-DIKEY A8): rozet KOMUT kutusunun ICINDE durur
     (60,392 960x84 — oyunun "YAZ →" seridi), son 45 sn onun yerine gecer;
     ust 240px'e ASLA girmez. Kutu, sayfanin kendi olcegiyle (--o, JS) yerlesir:
     iframe'in ic tuvaliyle ayni formul min(en/1080, boy/1920). Metin 40px
     (tasarim pikseli) * --o. Yalniz opacity canlanir.
     YATAY (?yatay=1): eski ustte hap rozet. */
  #siradaki {
    position: fixed; z-index: 5; white-space: nowrap;
    background: #2b2170; color: #fff;
    font-family: system-ui, sans-serif; font-weight: 900; letter-spacing: .3px;
  }
  #siradaki b { color: #ffd23f; }

  html.dikey #siradaki {
    left: calc(var(--dx, 0px) + 60px * var(--o, 1));
    top: calc(var(--dy, 0px) + 392px * var(--o, 1));
    width: calc(960px * var(--o, 1)); height: calc(84px * var(--o, 1));
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: #2a2358;
    border: calc(4px * var(--o, 1)) solid #191434; border-radius: calc(22px * var(--o, 1));
    font-size: calc(40px * var(--o, 1)); line-height: 1;
    opacity: 0; transition: opacity .4s ease; pointer-events: none;
  }
  html.dikey #siradaki.acik { opacity: 1; }

  html.yatay #siradaki {
    top: 14px; left: 50%; transform: translate(-50%, -80px);
    border: 3px solid #17123a; border-radius: 999px;
    box-shadow: 5px 5px 0 rgba(10, 6, 30, .5);
    padding: 10px 22px;
    font-size: 22px; line-height: 1;
    transition: transform .4s ease;
  }
  html.yatay #siradaki.acik { transform: translate(-50%, 0); }
</style>
</head>
<body>

<iframe id="sahne" allow="autoplay"></iframe>
<div id="siradaki"></div>

<script>
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);

  // ---- yon ve olcek ----------------------------------------------------------
  // Oyunlar varsayilan DIKEY 1080x1920; ?yatay=1 eski 1920x1080 (oyunlara da
  // aynen aktarilir, asagida). Rozetin yeri icin ayni olcek formulu: tt.js'teki
  // --tt-olcek = min(en/TUVAL.w, boy/TUVAL.h) ve letterbox payi.
  const YATAY = q.get('yatay') === '1' || q.get('yatay') === 'true';
  document.documentElement.classList.add(YATAY ? 'yatay' : 'dikey');
  function olcekle() {
    if (YATAY) return;
    const w = innerWidth, h = innerHeight, o = Math.min(w / 1080, h / 1920);
    const st = document.documentElement.style;
    st.setProperty('--o', String(o));
    st.setProperty('--dx', ((w - 1080 * o) / 2).toFixed(2) + 'px');
    st.setProperty('--dy', ((h - 1920 * o) / 2).toFixed(2) + 'px');
  }
  olcekle();
  addEventListener('resize', olcekle);

  // ---- ayarlar -------------------------------------------------------------
  // ?dk=6            oyun basina sure (dakika)
  // ?sn=90           ayni sey saniye cinsinden (test icin; dk'yi ezer)
  // ?oyunlar=bilye,at  donecek oyunlar ve sirasi
  // ?duyuru=0        gecislerde sohbet botuna yazma
  // Geri kalan TUM parametreler oyunlara AYNEN aktarilir (?lite=1&sag=24...)
  const OYUNLAR = {
    bilye: { dosya: 'bilye.html', ad: 'Misket Yarışı', ikon: '🏁' },
    bilgi: { dosya: 'bilgi.html', ad: 'Bilgi Yarışması', ikon: '🧠' },
    pk:    { dosya: 'pk.html',    ad: 'PK Savaşı',    ikon: '⚔️' },
    at:    { dosya: 'at.html',    ad: 'At Yarışı',    ikon: '🏇' },
    // Rotasyon disi ama duruyor (?oyunlar= ile acilir):
    //   tepe  — kendi tasarimim, kanitlanmis format degil
    //   kalan — battle royale, kullanici istemedi
    tepe:  { dosya: 'tepe.html',  ad: 'Tepe Savaşı',  ikon: '👑' },
    kalan: { dosya: 'kalan.html', ad: 'Son Ayakta Kalan', ikon: '💀' },
    //   halay — ortak dans sahnesi (yarisma degil): yaz/begen = halaya gir,
    //           @isim ya da numara = dansa kaldir. Varsayilan siraya ALINMADI;
    //           ?oyunlar=...,halay ile acilir.
    halay: { dosya: 'halay.html', ad: 'Halay', ikon: '💃' },
  };
  const SIRA = (q.get('oyunlar') || 'bilye,bilgi,pk,at')
    .split(',').map((s) => s.trim()).filter((s) => OYUNLAR[s]);
  if (!SIRA.length) SIRA.push('bilye', 'bilgi', 'pk', 'at');

  const SURE_MS = q.has('sn')
    ? (Number(q.get('sn')) || 90) * 1000
    : (Number(q.get('dk')) || 6) * 60 * 1000;
  const DUYURU = q.get('duyuru') !== '0' && q.get('mock') !== '1';

  // Oyunlara aktarilacak parametreler (merkyzin kendi anahtarlarini cikar)
  const aktar = new URLSearchParams(q);
  for (const k of ['dk', 'sn', 'oyunlar', 'duyuru']) aktar.delete(k);
  const EK = aktar.toString() ? '&' + aktar.toString() : '';

  // ---- durum ---------------------------------------------------------------
  const sahne = document.getElementById('sahne');
  const rozet = document.getElementById('siradaki');
  let indeks = 0;
  let basladi = 0;               // bu oyunun acilis zamani
  let gecisBekliyor = false;     // sure doldu, tur bitisini bekliyoruz
  let sonNabiz = 0;              // ic cerceveden gelen son yasam sinyali

  function oyunAc(i) {
    indeks = (i + SIRA.length) % SIRA.length;
    const o = OYUNLAR[SIRA[indeks]];
    // Kopruye hangi oyunun ekranda oldugunu bildir: olaylari dogru oyuna
    // yazsin. Boylece "hangi oyun daha cok yazdiriyor" tahminle degil
    // sayiyla cevaplaniyor. Kopru yoksa sessizce duser.
    try { fetch('/api/oyun?ad=' + encodeURIComponent(SIRA[indeks]), { method: 'POST', headers: { 'X-TT': '1' } }).catch(() => {}); } catch { /* olsun */ }
    sahne.classList.add('soluk');
    setTimeout(() => {
      sahne.src = o.dosya + '?' + 'ic=1' + EK;
      sahne.onload = () => sahne.classList.remove('soluk');
      basladi = Date.now();
      sonNabiz = 0;
      gecisBekliyor = false;
      rozet.classList.remove('acik');
    }, 460);
  }

  function siradakiOyun() { return OYUNLAR[SIRA[(indeks + 1) % SIRA.length]]; }

  function gecisiIste() {
    if (SIRA.length < 2) return;         // tek oyun donuyorsa gecis yok
    gecisBekliyor = true;
  }

  function gec() {
    const o = siradakiOyun();
    if (DUYURU) {
      // Sohbet botuna gecis duyurusu — izleyici oyunun degistigini
      // sohbetten de gorsun. Kopru yoksa fetch sessizce duser.
      try {
        fetch('/api/soyle?text=' + encodeURIComponent(
          `🎮 Sıradaki oyun: ${o.ikon} ${o.ad} — ekrana bak, katıl!`),
          { method: 'POST', headers: { 'X-TT': '1' } }).catch(() => {});
      } catch { /* olsun */ }
    }
    oyunAc(indeks + 1);
  }

  // Oyunlar tur bitiminde parent'a haber veriyor; gecisi TUR ARASINDA
  // yapiyoruz ki yaris/eleme ortasinda ekran degismesin.
  addEventListener('message', (ev) => {
    if (!ev.data) return;
    if (ev.data.tt === 'nabiz') { sonNabiz = Date.now(); return; }
    if (ev.data.tt === 'tur-bitti' && gecisBekliyor) gec();
  });

  setInterval(() => {
    const gecen = Date.now() - basladi;

    // Son 45 saniyede "siradaki" rozetini goster
    if (SIRA.length > 1 && gecen > SURE_MS - 45 * 1000) {
      const o = siradakiOyun();
      // Sabit oyun adi (viewer metni degil); yine de DOM ile kur.
      rozet.textContent = 'birazdan: ';
      const kalin = document.createElement('b');
      kalin.textContent = o.ikon + ' ' + o.ad;
      rozet.appendChild(kalin);
      rozet.classList.add('acik');
    }

    if (!gecisBekliyor && gecen >= SURE_MS) gecisiIste();

    // EMNIYET: sadece DONMUS sayfa icin. Oyun nabiz attigi surece turunu
    // sonuna kadar oynatiyoruz — 10 etaplik yaris ya da 40 soruluk bilgi
    // turu ortasindan kesilmesin diye. Nabiz 30 sn kesilirse sayfa
    // gercekten donmustur, o zaman zorla geciyoruz.
    if (gecisBekliyor && sonNabiz && Date.now() - sonNabiz > 30000) gec();
  }, 1000);

  oyunAc(0);
})();
</script>
</body>
</html>
