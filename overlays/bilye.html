<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Misket Yarışı — sohbet katılır, misketler yarışır</title>
<link rel="stylesheet" href="_shared/base.css">
<link rel="stylesheet" href="_shared/oyun-tema.css">
<style>
  /* Bilye yarisinin butun olayi UZUN DIKEY PIST. Siralamayi tema gibi ayri
     bir blok yapinca pist 200 piksele dusuyor ve oyun kayboluyor; onun yerine
     pistin ustune HUD olarak biniyor. Gercek oyunlarda da boyle. */
  /* 16:9'da pisti tum genislige yaymak yanlis: pist DIKEY, ekran GENIS.
     Yayarsan dikey gorus alani daraliyor ve yaristan bir sey gorunmuyor.
     Gercek yaris yayinlarindaki gibi: ortada dar-uzun sahne, yaninda
     tam boy siralama rayi. Genis ekran HUD'a calisiyor, piste degil. */
  #alan { overflow: hidden; flex: 1; display: flex; gap: 14px; padding: 12px; }
  #pist { flex: none; width: 660px; position: relative; }
  #pist canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ust { padding: 9px 14px; }
  #baslik { font-size: 28px; }
  #rozet { font-size: 27px; }

  /* Panel eskiden sag USTTEYDI ve tam bilyelerin yaristigi yeri kapatiyordu.
     Kamera lideri ust ucte tuttugu icin aksiyon hep ustte oluyor; panel
     alta indi. */
  /* Ray: pistin yaninda, tam boy. Artik pistin uzerini kapatmiyor. */
  #siralama {
    flex: 1; min-width: 0; align-self: stretch;
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px; z-index: 3;
    background: rgba(18,12,51,.66);
    border: 3px solid var(--cizgi); border-radius: 18px;
  }
  #siralama::before {
    content: 'CANLI SIRALAMA';
    font-size: 26px; font-weight: 900; letter-spacing: 1.4px;
    color: #a89ce0; padding: 2px 4px 6px;
  }
  .sira { padding: 8px 12px; gap: 11px; background: rgba(0,0,0,.32); }
  .sira .rozet { width: 40px; height: 40px; font-size: 24px; }
  .sira .ad { font-size: 34px; }
  .sira .adet { font-size: 32px; min-width: 84px; }
  .sira.bos { font-size: 26px; padding: 14px; }


  /* Etap gostergesi: pistin ust kosesinde, yarisin neresinde oldugumuz.
     Uzun pistte izleyicinin "daha ne kadar var" sorusunun cevabi. */
  #etapHud {
    position: absolute; top: 10px; left: 10px; z-index: 3;
    display: none; align-items: center; gap: 10px;
    background: rgba(12, 8, 40, .86);
    border: 2px solid var(--cizgi); border-radius: 12px;
    padding: 6px 14px;
  }
  #etapHud.acik { display: inline-flex; }
  #etapNo { font-size: 30px; font-weight: 900; color: var(--altin);
            font-variant-numeric: tabular-nums; }
  #etapAd { font-size: 28px; font-weight: 800; color: #d9d2ff; letter-spacing: 1px; }

  /* Katilim ekrani — yarisa girenlerin baloncuklari */
  #kuyruk {
    position: absolute; inset: 0; display: flex; flex-wrap: wrap;
    align-content: flex-start; gap: 6px; padding: 12px; overflow: hidden;
  }
  #kuyruk.gizli { display: none; }
  /* Katilanlar sag panelde: iri, okunur, sarilan bir bulut */
  #fisAlan {
    display: flex; flex-wrap: wrap; gap: 9px; padding: 10px 6px 4px;
    align-content: flex-start; overflow: hidden;
  }
  .fis {
    font-size: 26px; font-weight: 800; padding: 5px 14px; border-radius: 999px;
    border: 3px solid var(--cizgi); color: #1a1145;
    max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="zemin"></div>

<div id="kok" class="tt-oyun">

  <div id="ust" class="kutu">
    <div id="rozet">🏁</div>
    <div id="baslikSar">
      <div id="baslik">Misket Yarışı</div>
      <div id="cagri">sohbete yaz · yarışa katıl</div>
    </div>
    <div id="komut"><span class="yazEt">YAZ</span> <span id="komutMetin">HERHANGİ BİR ŞEY</span></div>
    <div id="sayac">
      <div id="sayacBuyuk">0</div>

  <div id="alan" class="kutu">
    <div id="pist">
      <canvas id="tuval"></canvas>

    </div>
    <div id="siralama"></div>
    <div id="kazanan">
      <div>
        <div class="kupa">🏆</div>
        <div class="kimAd" id="kazananAd">—</div>
        <div class="altYazi" id="kazananAlt">birazdan yeni yarış</div>

    </div>
  </div>

  <div id="akis"></div>

</div>

<script src="_shared/tt.js"></script>
<script src="_shared/kimlik.js"></script>

<script>
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) || d : d);

  // ---- ayarlar -------------------------------------------------------------
  const KATILIM_SN = num('katilim', 25);   // katilim penceresi
  const MAX        = num('max', 50);       // ayni anda kac misket (perf siniri)
  const KUTLAMA_SN = num('kutlama', 7);    // kazanan ekrani
  const ETAP_SAYISI = Math.max(3, Math.min(16, num('etap', 10)));  // pist kac etap
  const ANAHTAR    = (q.get('kelime') || '').toLowerCase();  // bos = her yorum katar

  // ---- dunya ---------------------------------------------------------------
  // Pist 1000 birim genis; yukseklik asagida uretiliyor. Tuval bu dunyayi
  // olcekleyerek ciziyor, boylece ekran boyutundan bagimsiz ayni yaris.
  const EN = 1000;
  const R  = 15;            // bilye yaricapi
  const YERCEKIMI = 1100;
  const ESNEKLIK = 0.42;    // carpismada korunan hiz
  const SURTUNME = 0.995;

  let pistBoy = 0;
  let pegler = [];          // {x,y,r}
  let duvarlar = [];        // {x1,y1,x2,y2}
  let bitis = 0;
  let etaplar = [];         // {ad, ikon, y0, y1}  — pistin bolumleri

  /* ---- ETAPLAR ------------------------------------------------------------
     Pist eskiden tek parca uzun bir dususten ibaretti: 7 bolum vardi ama
     hicbiri ADLANDIRILMAMISTI, yani izleyici icin hepsi ayni goruntuydu ve
     yaris "misketler dusuyor" hissinden oteye gecmiyordu.

     Artik pist ADI OLAN etaplara bolundu. Her etabin kendi mekanigi var,
     girisine isaretli bir bant ciziliyor, lider yeni etaba girince spiker
     bunu soyluyor ve HUD "ETAP 4/10 — DAR BOĞAZ" yaziyor. Ayni fizik,
     ama izleyici artik yarisin NEREsinde oldugunu biliyor — uzun yaris
     ancak boyle izlenebilir oluyor. */
  function eCiviTarlasi(y) {
    for (let s = 0; s < 7; s++) {
      const kaydir = (s % 2) * 55;
      for (let x = 60 + kaydir; x < EN - 40; x += 110) pegler.push({ x, y: y + s * 78, r: 14 });
    }
    return y + 7 * 78 + 40;
  }

  function eZikzak(y, i) {
    const sol = i % 2 === 0;
    duvarlar.push(sol ? { x1: 0, y1: y, x2: EN - 150, y2: y + 175 }
                      : { x1: EN, y1: y, x2: 150, y2: y + 175 });
    for (let k = 1; k <= 4; k++) {
      pegler.push({ x: sol ? k * 165 : EN - k * 165, y: y + 42 * k + 26, r: 9 });
    }
    y += 200;
    duvarlar.push(sol ? { x1: EN, y1: y, x2: 150, y2: y + 175 }
                      : { x1: 0, y1: y, x2: EN - 150, y2: y + 175 });
    return y + 215;
  }

  function eDegirmen(y) {
    for (let s = 0; s < 3; s++) {
      pegler.push({ x: EN * 0.5,  y: y + s * 118, r: 30 });
      pegler.push({ x: EN * 0.16, y: y + 59 + s * 118, r: 19 });
      pegler.push({ x: EN * 0.84, y: y + 59 + s * 118, r: 19 });
      pegler.push({ x: EN * 0.33, y: y + s * 118, r: 12 });
      pegler.push({ x: EN * 0.67, y: y + s * 118, r: 12 });
    }
    return y + 3 * 118 + 45;
  }

  /* Dar bogaz: iki duvar ortada dar bir agiz birakir. Kalabalik burada
     tikanir, sonra teker teker firlar — yarisin en gergin ani. */
  function eDarBogaz(y) {
    const agiz = 130;
    duvarlar.push({ x1: 0,  y1: y,       x2: EN / 2 - agiz, y2: y + 230 });
    duvarlar.push({ x1: EN, y1: y,       x2: EN / 2 + agiz, y2: y + 230 });
    duvarlar.push({ x1: EN / 2 - agiz, y1: y + 230, x2: EN / 2 - agiz - 40, y2: y + 330 });
    duvarlar.push({ x1: EN / 2 + agiz, y1: y + 230, x2: EN / 2 + agiz + 40, y2: y + 330 });
    pegler.push({ x: EN / 2, y: y + 120, r: 22 });
    return y + 380;
  }

  /* Hiz tuneli: civi yok, sadece dikey ayiricilar. Misketler serbest
     dususe gecip birbirinden AYRILIYOR — surekli civi carpismasindan sonra
     araliklarin acildigi nefes alma bolumu. */
  function eHizTuneli(y) {
    const serit = 5, boy = 420;
    for (let k = 1; k < serit; k++) {
      const x = (EN / serit) * k;
      duvarlar.push({ x1: x, y1: y + 40, x2: x, y2: y + boy - 40 });
    }
    duvarlar.push({ x1: 0, y1: y, x2: EN * 0.12, y2: y + 40 });
    duvarlar.push({ x1: EN, y1: y, x2: EN * 0.88, y2: y + 40 });
    return y + boy + 30;
  }

  /* Sarkac dizisi: buyuk toplar sasirtmali, misketleri yana savuruyor. */
  function eSarkac(y) {
    for (let s = 0; s < 4; s++) {
      const kaydir = (s % 2) ? EN * 0.25 : 0;
      for (let k = 0; k < 3; k++) {
        pegler.push({ x: EN * 0.17 + kaydir + k * EN * 0.33, y: y + s * 105, r: 26 });
      }
    }
    return y + 4 * 105 + 50;
  }

  const ETAP_TIPLERI = [
    { ad: 'ÇİVİ TARLASI', ikon: '🔩', kur: eCiviTarlasi },
    { ad: 'ZİKZAK RAMPA', ikon: '⚡', kur: eZikzak },
    { ad: 'DAR BOĞAZ',    ikon: '⌛', kur: eDarBogaz },
    { ad: 'DEĞİRMEN',     ikon: '🎡', kur: eDegirmen },
    { ad: 'HIZ TÜNELİ',   ikon: '🚀', kur: eHizTuneli },
    { ad: 'SARKAÇLAR',    ikon: '🪀', kur: eSarkac },
  ];

  /** Rastgele ama oynanabilir bir pist uret. */
  function pistUret() {
    pegler = []; duvarlar = []; etaplar = [];
    let y = 420;

    // Baslangic hunisi — misketler ortaya toplansin
    duvarlar.push({ x1: -40, y1: 250, x2: 330, y2: 400 });
    duvarlar.push({ x1: EN + 40, y1: 250, x2: EN - 330, y2: 400 });

    // Etap sirasi: her tur listeyi bir kaydirarak geciyoruz, boylece ayni
    // sira arka arkaya cikmiyor ama "once civi sonra rampa" ritmi bozulmuyor.
    const bas = Math.floor(Math.random() * ETAP_TIPLERI.length);
    for (let b = 0; b < ETAP_SAYISI; b++) {
      const tip = ETAP_TIPLERI[(bas + b) % ETAP_TIPLERI.length];
      const y0 = y;
      y = tip.kur(y, b);
      etaplar.push({ ad: tip.ad, ikon: tip.ikon, y0, y1: y });
    }

    // Bitis hunisi
    duvarlar.push({ x1: 0, y1: y, x2: EN * 0.34, y2: y + 220 });
    duvarlar.push({ x1: EN, y1: y, x2: EN * 0.66, y2: y + 220 });
    etaplar.push({ ad: 'SON DÜZLÜK', ikon: '🏁', y0: y, y1: y + 300 });
    y += 300;

    bitis = y;
    pistBoy = y + 200;

    // Yan duvarlar
    duvarlar.push({ x1: 0, y1: 0, x2: 0, y2: pistBoy });
    duvarlar.push({ x1: EN, y1: 0, x2: EN, y2: pistBoy });
  }

  /** Verilen y hangi etapta? (lider takibi icin) */
  function etapBul(y) {
    for (let i = 0; i < etaplar.length; i++) if (y < etaplar[i].y1) return i;
    return etaplar.length - 1;
  }

  /** HUD'daki etap gostergesini guncelle. */
  function etapYaz(i) {
    const hud = document.getElementById('etapHud');
    const e = etaplar[i];
    if (!hud || !e) return;
    if (durum !== 'yaris') { hud.classList.remove('acik'); return; }
    document.getElementById('etapNo').textContent = (i + 1) + '/' + etaplar.length;
    document.getElementById('etapAd').textContent = e.ikon + ' ' + e.ad;
    hud.classList.add('acik');
  }

  // ---- bilyeler ------------------------------------------------------------
  const RENKLER = [
    '#ff4d4d', '#3fb9ff', '#ffd23f', '#7ed957', '#ff5fc8', '#ffa62b',
    '#a86bff', '#21d1a1', '#5b7fff', '#b6e02b', '#e05cff', '#00c2c7',
  ];

  let bilyeler = [];        // {ad, kid, renk, x, y, vx, vy, bitti, sira}
  let bitirenler = [];
  let katilanlar = new Map();   // kid -> ad  (bu yarisa girenler)
  let kuyruk = new Map();       // sonraki yarisi bekleyenler

  let durum = 'katilim';        // katilim | yaris | bitti
  let sayacSn = KATILIM_SN;
  let kazananAdi = '';

  function bilyeKur() {
    bilyeler = [];
    bitirenler = [];
    let i = 0;
    for (const [kid, ad] of katilanlar) {
      // Ust bantta rastgele dagit, hafif yatay hiz ver — her yaris farkli olsun
      const kim = Kimlik.al(kid);   // kalici skin: ayni izleyici her yayinda ayni bilye
      bilyeler.push({
        ad, kid,
        renk: kim.renk,
        x: 90 + Math.random() * (EN - 180),
        y: 60 + Math.random() * 160,
        vx: (Math.random() - 0.5) * 120,
        vy: 0,
        bitti: false, sira: 0, iz: [],
      });
      i++;
    }
  }

  // ---- fizik ---------------------------------------------------------------
  /** Bir noktanin dogru parcasina en yakin noktasi. */
  function enYakin(px, py, d) {
    const dx = d.x2 - d.x1, dy = d.y2 - d.y1;
    const uzun = dx * dx + dy * dy;
    let t = uzun ? ((px - d.x1) * dx + (py - d.y1) * dy) / uzun : 0;
    t = Math.max(0, Math.min(1, t));
    return { x: d.x1 + t * dx, y: d.y1 + t * dy };
  }

  function adim(dt) {
    let liderY = 0;
    for (const b of bilyeler) if (!b.bitti && b.y > liderY) liderY = b.y;

    for (const b of bilyeler) {
      if (b.bitti) continue;

      // Lastik bant: liderden %10+ geride kalana kademeli ekstra yercekimi.
      // Pakete dokunmaz, sadece kopanlari toparlar — yoksa kamera lideri
      // izlerken pist bombos gorunuyor.
      const gerilik = (liderY - b.y) / Math.max(1, bitis);
      const yardim = gerilik > 0.1 ? Math.min(0.5, (gerilik - 0.1) * 3) : 0;

      b.vy += YERCEKIMI * (1 + yardim) * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vx *= SURTUNME; b.vy *= SURTUNME;

      // --- civiler ---
      for (const p of pegler) {
        const dx = b.x - p.x, dy = b.y - p.y;
        const mesafe2 = dx * dx + dy * dy;
        const engel = R + p.r;
        if (mesafe2 >= engel * engel || mesafe2 === 0) continue;
        const mesafe = Math.sqrt(mesafe2);
        const nx = dx / mesafe, ny = dy / mesafe;
        b.x = p.x + nx * engel;
        b.y = p.y + ny * engel;
        const hiz = b.vx * nx + b.vy * ny;
        if (hiz < 0) { b.vx -= (1 + ESNEKLIK) * hiz * nx; b.vy -= (1 + ESNEKLIK) * hiz * ny; }
      }

      // --- duvarlar ---
      for (const d of duvarlar) {
        const y = enYakin(b.x, b.y, d);
        const dx = b.x - y.x, dy = b.y - y.y;
        const mesafe2 = dx * dx + dy * dy;
        if (mesafe2 >= R * R || mesafe2 === 0) continue;
        const mesafe = Math.sqrt(mesafe2);
        const nx = dx / mesafe, ny = dy / mesafe;
        b.x = y.x + nx * R;
        b.y = y.y + ny * R;
        const hiz = b.vx * nx + b.vy * ny;
        if (hiz < 0) { b.vx -= (1 + ESNEKLIK) * hiz * nx; b.vy -= (1 + ESNEKLIK) * hiz * ny; }
      }

      // --- bitis ---
      if (b.y > bitis) {
        b.bitti = true;
        b.sira = bitirenler.length + 1;
        bitirenler.push(b);
        if (bitirenler.length === 1) yarisBitti(b);
      }
    }

    // --- bilye-bilye ---
    for (let i = 0; i < bilyeler.length; i++) {
      const a = bilyeler[i];
      if (a.bitti) continue;
      for (let j = i + 1; j < bilyeler.length; j++) {
        const c = bilyeler[j];
        if (c.bitti) continue;
        const dx = c.x - a.x, dy = c.y - a.y;
        const mesafe2 = dx * dx + dy * dy;
        const engel = R * 2;
        if (mesafe2 >= engel * engel || mesafe2 === 0) continue;
        const mesafe = Math.sqrt(mesafe2);
        const nx = dx / mesafe, ny = dy / mesafe;
        const ort = (engel - mesafe) / 2;
        a.x -= nx * ort; a.y -= ny * ort;
        c.x += nx * ort; c.y += ny * ort;
        const goreli = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
        if (goreli < 0) {
          const p = goreli * ESNEKLIK;
          a.vx += p * nx; a.vy += p * ny;
          c.vx -= p * nx; c.vy -= p * ny;
        }
      }
    }
  }

  // ---- cizim ---------------------------------------------------------------
  const tuval = document.getElementById('tuval');
  const ctx = tuval.getContext('2d');

  // ---- pist katmani: statik geometri tek tuvalde ----
  let pistTuval = null, pistSb = 1;   // sb = dunya birimi basina piksel

  function pistPisir() {
    if (!pistBoy || !olcek) return;
    let sb = olcek * dprSec();
    // Bellek tavani: ~11M piksel (RGBA ~44MB). Asarsa olcegi dusur —
    // arka plan hafif yumusar, kimse fark etmez.
    let w = Math.ceil(EN * sb), h = Math.ceil(pistBoy * sb);
    const TAVAN = 11e6;
    if (w * h > TAVAN) {
      sb *= Math.sqrt(TAVAN / (w * h));
      w = Math.ceil(EN * sb); h = Math.ceil(pistBoy * sb);
    }
    pistTuval = document.createElement('canvas');
    pistTuval.width = w; pistTuval.height = h;
    pistSb = sb;
    const x = pistTuval.getContext('2d');
    x.scale(sb, sb);

    // duvarlar: iki katman
    x.lineCap = 'round';
    x.strokeStyle = '#241b5e'; x.lineWidth = 13;
    x.beginPath();
    for (const d of duvarlar) { x.moveTo(d.x1, d.y1); x.lineTo(d.x2, d.y2); }
    x.stroke();
    x.strokeStyle = '#7d6ce0'; x.lineWidth = 7;
    x.beginPath();
    for (const d of duvarlar) { x.moveTo(d.x1, d.y1); x.lineTo(d.x2, d.y2); }
    x.stroke();

    // civiler: golge + sprite
    for (const p of pegler) {
      x.globalAlpha = .3; x.fillStyle = '#000';
      x.beginPath(); x.arc(p.x + 2, p.y + 3, p.r, 0, 6.2832); x.fill();
      x.globalAlpha = 1;
      x.drawImage(civiSprite, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }

    // Etap bantlari: her etabin girisine adi yazili bir serit. Yarisin
    // "bolumleri var" hissi buradan geliyor — statik katmanda pisiyor,
    // yani kare basina maliyeti sifir.
    x.textBaseline = 'middle';
    for (let i = 0; i < etaplar.length; i++) {
      const e = etaplar[i];
      if (i === 0) continue;                 // ilk etap girisinde bant olmasin
      x.fillStyle = 'rgba(255,210,63,.13)';
      x.fillRect(0, e.y0 - 26, EN, 52);
      x.fillStyle = 'rgba(255,210,63,.6)';
      x.fillRect(0, e.y0 - 26, EN, 3);
      x.fillRect(0, e.y0 + 23, EN, 3);
      x.fillStyle = '#ffe9a8';
      x.font = '900 34px Outfit, system-ui, sans-serif';
      x.textAlign = 'center';
      x.fillText(`${e.ikon}  ${i + 1}. ETAP · ${e.ad}`, EN / 2, e.y0);
    }
    x.textAlign = 'left';

    // bitis cizgisi
    for (let bx = 0; bx < EN; bx += 40) {
      for (let k = 0; k < 2; k++) {
        x.fillStyle = ((bx / 40 + k) % 2) ? '#17123a' : '#fff';
        x.fillRect(bx, bitis + k * 11, 40, 11);
      }
    }
  }

  // Civi kuresi bir kez pisirilir; cizimde drawImage ile olceklenir
  const civiSprite = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(22, 20, 4, 32, 34, 32);
    g.addColorStop(0, '#cfc4ff'); g.addColorStop(1, '#6f5fc4');
    x.beginPath(); x.arc(32, 32, 30, 0, 6.2832);
    x.fillStyle = g; x.fill();
    return c;
  })();
  let W = 0, H = 0, olcek = 1, kamera = 0;

  function dprSec() {
    if (document.documentElement.classList.contains('tt-lite')) return 1;
    return Math.min(1.5, window.devicePixelRatio || 1);
  }

  function boyutla() {
    const r = tuval.getBoundingClientRect();
    if (!r.width || !r.height) return;              // henuz yerlesmedi
    const dpr = dprSec();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    tuval.width = Math.round(W * dpr);
    tuval.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    olcek = W / EN;
    pistPisir();
  }
  // Tek seferlik olcum yetmiyor: sayfa ilk acildiginda yerlesim daha
  // oturmamis oluyor, tuvalin arka tamponu yanlis oranda kaliyor ve
  // daireler ELIPS goruntuleniyordu. ResizeObserver her gercek boyut
  // degisiminde yeniden olcuyor.
  if (window.ResizeObserver) new ResizeObserver(boyutla).observe(tuval);
  addEventListener('resize', boyutla);
  addEventListener('tt-yon', boyutla);

  // Rengi acip koyultan yardimcilar — kure golgelemesi icin.
  function ton(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.max(0, ((n >> 16) & 255) + k));
    const g = Math.min(255, Math.max(0, ((n >> 8) & 255) + k));
    const b = Math.min(255, Math.max(0, (n & 255) + k));
    return `rgb(${r} ${g} ${b})`;
  }

  /** Bilyeyi KURE gibi ciz: duz daire "ucuz" duruyor.
   *  Isik sol ustten: radyal gradyan + parlama noktasi + koyu kenar + golge. */
  function bilyeCiz(b) {
    // yere dusen golge (kalite dusunce ilk kisilan sey)
    if (kalite === 0) {
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(b.x + 3, b.y + R * 0.85, R * 0.85, R * 0.32, 0, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Kure onceden pisirildi (kimlik.js): karede sadece drawImage.
    // Onceki kod her bilye icin her karede createRadialGradient cagiriyordu —
    // GPU'suz renderda en pahali satir oydu.
    Kimlik.ciz(ctx, b.kid, b.x, b.y, R * 2.15);
  }

  function ciz() {
    ctx.clearRect(0, 0, W, H);

    // Kamera: en ondeki bilyeyi ekranin ust ucte birinde tut
    let onde = 0;
    for (const b of bilyeler) if (!b.bitti && b.y > onde) onde = b.y;
    if (durum === 'katilim') onde = 200;
    // Lideri ekranin %42'sinde tut: %34'te arkadaki paket ekran disinda
    // kaliyordu ve yaris tek bilyeden ibaret goruniyordu.
    const hedef = onde * olcek - H * 0.52;
    kamera += (hedef - kamera) * 0.12;
    kamera = Math.max(0, Math.min(kamera, pistBoy * olcek - H));

    // Statik pist: tek kopyalama. (Onceden burada duvar konturlari,
    // ~60 civi ve bitis cizgisi her karede yeniden ciziliyordu.)
    if (pistTuval) {
      const kaynakY = (kamera / olcek) * pistSb;
      const kaynakH = Math.min(pistTuval.height - kaynakY, (H / olcek) * pistSb);
      if (kaynakH > 0) {
        ctx.drawImage(pistTuval, 0, kaynakY, pistTuval.width, kaynakH,
                      0, 0, W, kaynakH / pistSb * olcek);
      }
    }

    ctx.save();
    ctx.translate(0, -kamera);
    ctx.scale(olcek, olcek);

    const ustSinir = kamera / olcek - 60;
    const altSinir = (kamera + H) / olcek + 60;

    // --- iz (motion trail): hiz hissi duz daireyle gelmiyor ---
    for (const b of bilyeler) {
      if (kalite > 0) break;
      if (b.bitti || !b.iz) continue;
      for (let i = 0; i < b.iz.length; i++) {
        const p = b.iz[i];
        if (p.y < ustSinir || p.y > altSinir) continue;
        ctx.globalAlpha = 0.05 + 0.16 * (i / b.iz.length);
        ctx.beginPath(); ctx.arc(p.x, p.y, R * (0.45 + 0.45 * i / b.iz.length), 0, 6.2832);
        ctx.fillStyle = b.renk; ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // --- bilyeler ---
    for (const b of bilyeler) {
      if (b.bitti) continue;
      if (b.y < ustSinir || b.y > altSinir) continue;
      bilyeCiz(b);
    }
    ctx.restore();

    // --- lider etiketleri (ekran uzayi: olcekten bagimsiz okunakli) ---
    // Sadece lider etiketlenir: uc etiket birden, bilyeler kumelendiginde
    // ust uste binip okunmaz hale geliyordu. Sira zaten rayda yaziyor.
    const canli = bilyeler.filter((b) => !b.bitti).sort((a, b) => b.y - a.y).slice(0, 1);
    ctx.font = '800 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    canli.forEach((b, i) => {
      const ey = b.y * olcek - kamera;
      // Kenarda kirpilmasin: etiketi sahne icinde tut
      const ex = Math.min(W - 70, Math.max(70, b.x * olcek));
      if (ey < 24 || ey > H) return;
      const etiket = (i + 1) + '. ' + b.ad;
      const en = ctx.measureText(etiket).width + 14;
      const ty = ey - R * olcek - 20;
      ctx.fillStyle = 'rgba(12,8,40,.82)';
      ctx.beginPath(); ctx.roundRect(ex - en / 2, ty, en, 19, 7); ctx.fill();
      ctx.fillStyle = i === 0 ? '#ffd23f' : '#fff';
      ctx.fillText(etiket, ex, ty + 14);
    });
  }

  // ---- dongu ---------------------------------------------------------------
  // ---- spiker --------------------------------------------------------------
  // Jelle's Marble Runs'in isi tutan yani yarisi SPOR YAYINI gibi anlatmasi:
  // canli siralama, pozisyon degisimi, "son duzluk". Sessiz bir fizik
  // simulasyonu ucuz duruyor; olaylari soyleyince yaris haline geliyor.
  let sonLider = null, sonDuzlukDendi = false, spikerBekle = 0;
  let sonEtap = -1;

  function spikerKontrol() {
    const canli = bilyeler.filter((b) => !b.bitti);
    if (!canli.length) return;
    let lider = canli[0];
    for (const b of canli) if (b.y > lider.y) lider = b;

    // Etap gecisi: bekleme sayacindan BAGIMSIZ, cunku yarisin iskeleti bu.
    // Lider yeni bir etaba girdiginde hem HUD hem spiker haber veriyor.
    const ei = etapBul(lider.y);
    if (ei !== sonEtap) {
      sonEtap = ei;
      etapYaz(ei);
      if (ei > 0 && etaplar[ei]) {
        Ses.cal('etap');
        akis(`${etaplar[ei].ikon} <b>${ei + 1}. ETAP</b> · ${etaplar[ei].ad}`,
             { oncelik: 3, anahtar: 'etap' });
        spikerBekle = 60;
      }
    }

    if (spikerBekle > 0) { spikerBekle--; return; }

    if (sonLider && lider.kid !== sonLider) {
      akis('⚡ ' + Spiker.sec(
        ['<span class="kim">%s</span> ÖNE GEÇTİ', '<span class="kim">%s</span> lider!',
         '<span class="kim">%s</span> araları yarıyor', '<span class="kim">%s</span> burnu önde'],
        lider.ad), { oncelik: 2, anahtar: 'lider' });
      spikerBekle = 90;
    }
    sonLider = lider.kid;

    if (!sonDuzlukDendi && lider.y > bitis * 0.86) {
      sonDuzlukDendi = true;
      akis('🔥 <b>SON DÜZLÜK!</b>', { oncelik: 3 });
      // Finis agir cekimi: yaris yayinlarindaki an. dt dongu icinde
      // Finis.carpan ile carpiliyor.
      Finis.agirCekim(1.8, 0.35);
      spikerBekle = 90;
    }
  }

  // ---- otomatik kalite: makine yetisemiyorsa susu kis ----
  // 0 = tam (iz + golge) · 1 = iz ve golge yok · 2 = ustune kare atlama.
  // Karar gercek kare suresinin kayan ortalamasiyla veriliyor; toparlanirsa
  // kalite geri acilir. Lite modda 1'den baslar.
  let kalite = document.documentElement.classList.contains('tt-lite') ? 1 : 0;
  let karemsOrt = 16, agir = 0, hafif = 0, cizAtla = false;

  function kaliteGuncelle(ms) {
    karemsOrt = karemsOrt * 0.95 + ms * 0.05;
    if (karemsOrt > 30) {
      if (++agir > 60 && kalite < 2) { kalite++; agir = 0; karemsOrt = 20; }
      hafif = 0;
    } else if (karemsOrt < 19) {
      if (++hafif > 300 && kalite > 0) { kalite--; hafif = 0; }
      agir = 0;
    } else { agir = 0; hafif = 0; }
  }

  let sonZaman = 0, izSayac = 0;
  function dongu(t) {
    requestAnimationFrame(dongu);
    if (!sonZaman) sonZaman = t;
    const hamMs = t - sonZaman;
    let dt = hamMs / 1000;
    sonZaman = t;
    kaliteGuncelle(hamMs);
    if (dt > 0.05) dt = 0.05;          // sekme olursa fizigi patlatma
    dt *= Finis.carpan;                // son duzlukte agir cekim

    if (durum === 'yaris') {
      // Uc alt adim: hizli bilye civiyi delip gecmesin
      for (let i = 0; i < 3; i++) adim(dt / 3);
      // Iz noktalari — hiz hissi icin
      izSayac += dt;
      if (kalite === 0 && izSayac > 0.045) {
        izSayac = 0;
        for (const b of bilyeler) {
          if (b.bitti) continue;
          b.iz.push({ x: b.x, y: b.y });
          if (b.iz.length > 5) b.iz.shift();
        }
      }
      spikerKontrol();
    }
    // kalite 2: cizimi kare asiri atla (fizik tam hizda surer)
    cizAtla = !cizAtla;
    if (kalite < 2 || cizAtla) ciz();
  }

  // ---- akis / siralama -----------------------------------------------------
  const akisEl = document.getElementById('akis');
  Spiker.kur(akisEl);
  function akis(html, o) { Spiker.soyle(html, o); }

  const sirEl = document.getElementById('siralama');
  const MADALYA = ['🥇', '🥈', '🥉'];
  function siralamaCiz() {
    if (durum === 'katilim') {
      const kalan = Math.max(0, Math.ceil(sayacSn));
      const g = [...katilanlar.entries()].slice(-18);
      sirEl.innerHTML =
        `<div class="sira bos">katılım açık · <b>${kalan} sn</b></div>` +
        (g.length
          ? `<div id="fisAlan">` + g.map(([kid, ad]) =>
              `<div class="fis" style="background:${Kimlik.al(kid).renk}">${ad}</div>`).join('') + '</div>'
          : '<div class="sira bos">ilk yazan sen ol — misketin pistte belirsin</div>') +
        (kuyruk.size ? `<div class="sira bos">${kuyruk.size} kişi sıradaki yarışta</div>` : '');
      return;
    }
    const list = bitirenler.slice(0, 5);
    if (!list.length) {
      // Yaris suruyor: onde gidenleri goster
      const onde = bilyeler.filter((b) => !b.bitti).sort((a, b) => b.y - a.y).slice(0, 5);
      sirEl.innerHTML = onde.length
        ? onde.map((b, i) => satirHtml(i, b, Math.round(b.y / bitis * 100) + '%')).join('')
        : '<div class="sira bos">yarış başlıyor…</div>';
      onde.forEach((b, i) => oncekiSira.set(b.kid, i));
      return;
    }
    sirEl.innerHTML = list.map((b, i) => satirHtml(i, b, b.sira + '.')).join('');
  }
  // Onceki sira: yukselen/dusen oklari icin. Gercek yaris yayinlarinda
  // pozisyon degisimi en cok izlenen sey.
  let oncekiSira = new Map();

  function satirHtml(i, b, sag) {
    const rz = MADALYA[i] || (i + 1);
    const stil = i < 3 ? `background:${['#ffd23f', '#d8dbe6', '#e29a5a'][i]}` : 'background:#6b5fb8;color:#fff';
    const onc = oncekiSira.get(b.kid);
    let ok = '';
    if (onc != null && onc !== i) {
      ok = onc > i ? '<span style="color:#7ed957;font-size:20px">▲</span>'
                   : '<span style="color:#ff6b6b;font-size:20px">▼</span>';
    }
    const yuzde = Math.max(0, Math.min(100, Math.round(b.y / bitis * 100)));
    return `<div class="sira${i === 0 ? ' lider' : ''}" style="position:relative;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${yuzde}%;
                  background:${b.renk};opacity:.16;pointer-events:none"></div>
      <div class="rozet" style="${stil};position:relative">${rz}</div>
      ${Kimlik.cip(b.kid, 26)}
      <div class="ad" style="position:relative">${b.ad} ${ok}</div>
      <div class="adet" style="position:relative">${sag}</div>
    </div>`;
  }

  const kuyrukEl = document.getElementById('kuyruk');
  /* Katilanlarin fisleri ESKIDEN pistin ustune biniyordu: hem pisti
     kapatiyor hem etap gostergesiyle cakisiyordu. Artik sagdaki panelde
     duruyorlar (katilim sirasinda orasi zaten bombostu). Iki sorun birden
     cozuluyor: pist gorunur kaliyor, bos panel ise ise yariyor. */
  function kuyrukCiz() {
    kuyrukEl.classList.add('gizli');
  }

  function sayacCiz() {
    document.getElementById('sayacBuyuk').textContent = katilanlar.size;
  }

  // ---- durum makinesi ------------------------------------------------------
  const kazananEl = document.getElementById('kazanan');

  function yarisBitti(b) {
    Ses.cal('bitis');
    Juice.sars(0.45);
    kazananAdi = b.ad;
    durum = 'bitti';
    sayacSn = KUTLAMA_SN;
    Finis.kart(kazananEl, {
      url: Kimlik.al(b.kid).url,
      isim: b.ad,
      alt: Kimlik.botMu(b.kid)
        ? 'demo yarış — sohbete yaz, sıradakinde SEN varsın'
        : `${bilyeler.length} bilye arasından birinci`,
    });
    document.getElementById('cagri').textContent = b.ad + ' kazandı';
    akis(`🏆 <span class="kim">${b.ad}</span> BİRİNCİ`, { oncelik: 3, sure: 4500 });
    // Sohbet botu: kazanani etiketle — ama demo botunu kutlama :)
    if (!Kimlik.botMu(b.kid)) {
      TT.soyle(`🏁 @${uidler.get(b.kid) || b.ad} bilye yarışını kazandı! Tebrikler 🎉`);
    }
  }

  function katilimaDon() {
    document.getElementById('etapHud')?.classList.remove('acik');
    sonEtap = -1;
    durum = 'katilim';
    // Oyun merkezi (oyun.html) icinde calisiyorsak tur bitisini haber ver —
    // merkez oyun gecisini TUR ARASINDA yapar, yaris ortasinda degil.
    try { if (parent !== window) parent.postMessage({ tt: 'tur-bitti' }, '*'); } catch { /* tek basina */ }
    sayacSn = KATILIM_SN;
    Finis.kapat(kazananEl);
    document.getElementById('cagri').textContent = 'sohbete yaz · yarışa katıl';
    katilanlar = new Map();
    // Bekleyenleri yeni yarisa al
    for (const [kid, ad] of kuyruk) {
      if (katilanlar.size >= MAX) break;
      katilanlar.set(kid, ad);
    }
    kuyruk = new Map();
    bilyeler = []; bitirenler = [];
    sonLider = null; sonDuzlukDendi = false; oncekiSira = new Map();
    pistUret();
    pistPisir();
    kamera = 0;
    sayacCiz(); kuyrukCiz(); siralamaCiz();
    akis('🏁 <b>YENİ YARIŞ</b> — sohbete yaz, katıl');
  }

  let demoTur = false;

  function yarisBasla() {
    // CAZIBE MODU: kimse yoksa bekleme — botlarla demo turu don. Gelen
    // izleyici oyunu IZLEYEREK anlar; yazdigi an siradaki tur gercek olur.
    const gercek = katilanlar.size;
    demoTur = gercek === 0;
    if (gercek < 5) {
      const eksik = (gercek === 0 ? 6 : 5) - gercek;
      for (let i = 0; i < eksik; i++) {
        const b = Kimlik.bot(i);
        if (!katilanlar.has(b.kid)) katilanlar.set(b.kid, b.ad);
      }
    }
    durum = 'yaris';
    Ses.cal('start');
    bilyeKur();
    kuyrukCiz();
    sayacCiz();
    if (demoTur) {
      document.getElementById('cagri').textContent = '🤖 demo — sohbete yaz, sıradaki yarış senin';
      akis('🤖 <b>DEMO YARIŞ</b> — sohbete bir şey yaz, sen de katıl', { oncelik: 2, sure: 4200 });
    } else {
      akis(`🚦 <b>START</b> — ${katilanlar.size} bilye yarışıyor`);
    }
  }

  setInterval(() => {
    sayacSn -= 0.25;
    if (durum === 'katilim' && sayacSn <= 0) yarisBasla();
    else if (durum === 'bitti' && sayacSn <= 0) katilimaDon();
    if (durum !== 'bitti') siralamaCiz();
  }, 250);

  // ---- olaylar -------------------------------------------------------------
  const kimlik = (u) => (u && (u.id || u.uniqueId)) || '';
  const isim = (u) => (u && (u.nickname || u.uniqueId)) || 'anon';

  const uidler = new Map();   // kid -> uniqueId (@etiket icin)

  TT.on('chat', (ev) => {
    const kid = kimlik(ev.user);
    if (!kid) return;
    if (ev.user && ev.user.uniqueId) uidler.set(kid, ev.user.uniqueId);
    if (ANAHTAR && !String(ev.comment || '').toLowerCase().includes(ANAHTAR)) return;

    if (durum === 'katilim') {
      if (katilanlar.has(kid)) return;
      if (katilanlar.size >= MAX) { kuyruk.set(kid, isim(ev.user)); return; }
      katilanlar.set(kid, isim(ev.user));
      Ses.cal('katil', 120);
      sayacCiz(); kuyrukCiz();
    } else if (!katilanlar.has(kid)) {
      kuyruk.set(kid, isim(ev.user));      // yaris suruyor, sonrakine yaz
    }
  });

  // Hediye: sahibinin bilyesine ileri itki — yaris sirasinda ise yariyor
  TT.on('gift', (ev) => {
    const kid = kimlik(ev.user);
    const b = bilyeler.find((x) => x.kid === kid && !x.bitti);
    if (!b) return;
    b.vy += 420;
    b.vx += (Math.random() - 0.5) * 160;
    akis(`🎁 <span class="kim">${isim(ev.user)}</span> <span class="ok">▸</span> misketine itki`);
  });

  // ---- basla ---------------------------------------------------------------
  boyutla();
  pistUret();
  pistPisir();
  sayacCiz(); kuyrukCiz(); siralamaCiz();
  requestAnimationFrame(dongu);

  TT.uyanis({
    baslik: 'MİSKET YARIŞI',
    komutlar: ['bir şey yaz'],
    aciklama: 'Sohbete yazan herkes yarışa girer · 🎁 hediye misketini ileri iter',
    cagri: 'yaz ve misketini pistte gör',
  });
})();
</script>
</body>
</html>
