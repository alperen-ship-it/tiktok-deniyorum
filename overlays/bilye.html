<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Misket Yarışı — sohbet katılır, misketler yarışır</title>
<link rel="stylesheet" href="_shared/base.css">
<link rel="stylesheet" href="_shared/oyun-tema.css">
<style>
  /* KIMLIK RENGI — Misket: altin — amiral oyun, altin zaten 'lider' rengi.
     Rotasyonda izleyici bu oyunu BASLIGI OKUMADAN taniyabilsin diye. */
  :root { --oyun-renk: #f6c94f; }
  /* Bilye yarisinin butun olayi UZUN DIKEY PIST. Siralamayi tema gibi ayri
     bir blok yapinca pist 200 piksele dusuyor ve oyun kayboluyor; onun yerine
     pistin ustune HUD olarak biniyor. Gercek oyunlarda da boyle. */
  /* 16:9'da pisti tum genislige yaymak yanlis: pist DIKEY, ekran GENIS.
     Yayarsan dikey gorus alani daraliyor ve yaristan bir sey gorunmuyor.
     Gercek yaris yayinlarindaki gibi: ortada dar-uzun sahne, yaninda
     tam boy siralama rayi. Genis ekran HUD'a calisiyor, piste degil. */
  html.tt-yatay #alan { overflow: hidden; flex: 1; display: flex; gap: 14px; padding: 12px; }
  html.tt-yatay #pist { flex: none; width: 660px; position: relative; }
  html.tt-yatay #pist canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  html.tt-yatay #ust { padding: 9px 14px; }
  html.tt-yatay #baslik { font-size: 28px; }
  html.tt-yatay #rozet { font-size: 27px; }

  /* Panel eskiden sag USTTEYDI ve tam bilyelerin yaristigi yeri kapatiyordu.
     Kamera lideri ust ucte tuttugu icin aksiyon hep ustte oluyor; panel
     alta indi. */
  /* Ray: pistin yaninda, tam boy. Artik pistin uzerini kapatmiyor. */
  html.tt-yatay #siralama {
    flex: 1; min-width: 0; align-self: stretch;
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px; z-index: 3;
    background: rgba(18,12,51,.66);
    border: 3px solid var(--cizgi); border-radius: 18px;
  }
  html.tt-yatay #siralama::before {
    content: 'CANLI SIRALAMA';
    font-size: 26px; font-weight: 900; letter-spacing: 1.4px;
    color: #a89ce0; padding: 2px 4px 6px;
  }
  html.tt-yatay .sira { padding: 8px 12px; gap: 11px; background: rgba(0,0,0,.32); }
  html.tt-yatay .sira .rozet { width: 40px; height: 40px; font-size: 24px; }
  html.tt-yatay .sira .adet { font-size: 32px; min-width: 84px; }
  html.tt-yatay .sira.bos { font-size: 26px; padding: 14px; }


  /* Etap gostergesi: pistin ust kosesinde, yarisin neresinde oldugumuz.
     Uzun pistte izleyicinin "daha ne kadar var" sorusunun cevabi. */
  html.tt-yatay #etapHud {
    position: absolute; top: 10px; left: 10px; z-index: 3;
    display: none; align-items: center; gap: 10px;
    background: rgba(12, 8, 40, .86);
    border: 2px solid var(--cizgi); border-radius: 12px;
    padding: 6px 14px;
  }
  html.tt-yatay #etapHud.acik { display: inline-flex; }
  #etapNo { font-size: 30px; font-weight: 900; color: var(--altin);
            font-variant-numeric: tabular-nums; }
  #etapAd { font-size: 28px; font-weight: 800; color: #d9d2ff; letter-spacing: 1px; }

  /* Katilim ekrani — yarisa girenlerin baloncuklari */
  html.tt-yatay #kuyruk {
    position: absolute; inset: 0; display: flex; flex-wrap: wrap;
    align-content: flex-start; gap: 6px; padding: 12px; overflow: hidden;
  }
  #kuyruk.gizli { display: none; }
  /* Katilanlar sag panelde: iri, okunur, sarilan bir bulut */
  html.tt-yatay #fisAlan {
    display: flex; flex-wrap: wrap; gap: 9px; padding: 10px 6px 4px;
    align-content: flex-start; overflow: hidden;
  }
  html.tt-yatay .fis {
    font-size: 26px; font-weight: 800; padding: 5px 14px; border-radius: 999px;
    border: 3px solid var(--cizgi); color: #1a1145;
    max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ===================== DIKEY (1080x1920) =====================
     Kutular kabuktan: SAHNE 960x672 (#alan = tuval), PANO 460x490 (#siralama),
     UST / KOMUT / SPIKER / KAZANAN ortak. Tum olculer --dk-* degiskenlerinden. */
  html.tt-dikey #alan {
    padding: 0; border: 0; border-radius: 20px; display: block; position: relative;
    background: rgba(18,12,51,.5);
  }
  html.tt-dikey #pist { position: absolute; inset: 0; }
  html.tt-dikey #pist canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Etap bilgisi dikeyde UST'un durum satirinda (#cagri); pist ustunde HUD yok. */
  html.tt-dikey #etapHud, html.tt-dikey #kuyruk { display: none !important; }

  /* PANO: kabuk koordinatlarinda (fixed + donusumlu #kok = #kok'a gore). */
  html.tt-dikey #siralama {
    position: fixed;
    left: var(--dk-pano-x); top: var(--dk-pano-y);
    width: var(--dk-pano-w); height: var(--dk-pano-h);
    box-sizing: border-box;
    display: flex; flex-direction: column; gap: 4px;
    padding: 8px 8px 6px; overflow: hidden; z-index: 3;
    background: rgba(18,12,51,.78);
    border: 3px solid var(--cizgi); border-radius: 20px;
  }
  html.tt-dikey #siralama::before {
    content: attr(data-baslik);
    flex: none; font-size: 30px; font-weight: 900; letter-spacing: 1px;
    color: #a89ce0; padding: 0 6px 2px; line-height: 36px;
  }
  html.tt-dikey .sira {
    flex: none; position: relative; overflow: hidden;
    padding: 3px 8px; gap: 10px; background: rgba(0,0,0,.32); border-bottom: 0;
  }
  html.tt-dikey .sira .rozet { width: 46px; height: 46px; border-radius: 13px; font-size: 30px; position: relative; }
  html.tt-dikey .sira .ad { position: relative; line-height: 1.05; padding: 2px 0; }
  html.tt-dikey .sira .bar { position: absolute; left: 0; top: 0; bottom: 0; opacity: .2; pointer-events: none; }
  html.tt-dikey .sira .nokta { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--cizgi); position: relative; }
  html.tt-dikey .sira.bos { font-size: 30px; padding: 6px 8px; line-height: 1.15; justify-content: flex-start; }
</style>
</head>
<body>
<div id="zemin"></div>

<div id="kok" class="tt-oyun">

  <div id="ust" class="kutu">
    <div id="rozet">🏁</div>
    <div id="baslikSar">
      <div id="baslik">Misket Yarışı</div>
      <div id="cagri">katılım açık</div>
    </div>
    <div id="komut"><span class="yazEt">YAZ</span> <span id="komutMetin">HERHANGİ BİR ŞEY</span></div>
    <div id="sayac">
      <div id="sayacBuyuk">0</div>
      <div id="sayacKucuk">yarışçı</div>
    </div>
  </div>

  <div id="alan" class="kutu">
    <div id="pist">
      <canvas id="tuval"></canvas>
      <div id="etapHud"><span id="etapNo">1/10</span><span id="etapAd">ÇİVİ TARLASI</span></div>
      <div id="kuyruk"></div>
    </div>
    <div id="siralama"></div>
    <!-- Icerigi Finis.kart doldurur (asamali acilis). Elle iskelet
         birakmak yaniltici: hem hemen eziliyor hem .fkIc icermedigi icin
         CSS'le tutarsiz kaliyordu. -->
    <div id="kazanan"></div>
  </div>

  <div id="akis"></div>

</div>

<script src="_shared/tt.js"></script>
<script src="_shared/kimlik.js"></script>
<script src="_shared/profil.js"></script>
<script src="_shared/spiker.js"></script>
<script src="_shared/finis.js"></script>
<script src="_shared/juice.js"></script>
<script src="_shared/ses.js"></script>
<script>
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) || d : d);

  // ---- ayarlar -------------------------------------------------------------
  const KATILIM_SN = num('katilim', 25);   // katilim penceresi
  const MAX        = num('max', 50);       // ayni anda kac misket (perf siniri)
  const KUTLAMA_SN = num('kutlama', 7);    // kazanan ekrani
  const ETAP_SAYISI = Math.max(3, Math.min(16, num('etap', 8)));  // pist kac etap
  const ANAHTAR    = (q.get('kelime') || '').toLowerCase();  // bos = her yorum katar

  // ---- dunya ---------------------------------------------------------------
  // Pist 1000 birim genis; yukseklik asagida uretiliyor. Tuval bu dunyayi
  // olcekleyerek ciziyor, boylece ekran boyutundan bagimsiz ayni yaris.
  /* DIKEY (PLAN-DIKEY B): SAHNE 960x672'de 5 satirlik YILAN pist. Dunya = tuval
     (960x672 tasarim pikseli), yercekimi gercekten asagi; satirlar dönüşümlü
     saga/sola hafif egimli, uclarda zeminde bosluk var: bilye oradan alttaki satira
     duser. Yatayda (?yatay=1, donmus) eski 1000 birim genis uzun dusey pist. */
  const DIKEY = !!(window.TT && TT.dikey);
  const EN = DIKEY ? 960 : 1000;
  const R_ESKI = 15;
  let R = DIKEY ? 22 : R_ESKI;   // bilye yaricapi (dikeyde kalabaliga gore kuculur: rHesapla)
  const R_TASARIM = 22;          // dikey pistin bosluklari bu yaricapa gore tasarlandi
  const YERCEKIMI = DIKEY ? 1200 : 780;   // 1100'de yaris 23 sn suruyordu; etap anonslari yetismiyordu
  // Dikey yilan pist olculeri
  const SURUS = 0.062 * YERCEKIMI;   // dikey: satir yonu suruc ivmesi (px/sn^2)
  const SATIR = 5, SATIR_P = 124, SATIR_D = 48, SATIR_BAS = 100, BOSLUK = 84;
  const XE = 960 - BOSLUK;       // satirin zemininin bittigi x (cift satir) / basladigi mesafe
  const YARIM_UZ = 480;          // bir etap = yarim satir
  const ESNEKLIK = 0.42;    // carpismada korunan hiz
  const SURTUNME = 0.995;

  let pistBoy = DIKEY ? 672 : 0;
  let pegler = [];          // {x,y,r}
  let duvarlar = [];        // {x1,y1,x2,y2}
  let bitis = 0;
  let etaplar = [];         // {ad, ikon, y0, y1}  — pistin bolumleri

  /* ---- ETAPLAR ------------------------------------------------------------
     Pist eskiden tek parca uzun bir dususten ibaretti: 7 bolum vardi ama
     hicbiri ADLANDIRILMAMISTI, yani izleyici icin hepsi ayni goruntuydu ve
     yaris "misketler dusuyor" hissinden oteye gecmiyordu.

     Artik pist ADI OLAN etaplara bolundu. Her etabin kendi mekanigi var,
     girisine isaretli bir bant ciziliyor, lider yeni etaba girince spiker
     bunu soyluyor ve HUD "ETAP 4/10 — DAR BOĞAZ" yaziyor. Ayni fizik,
     ama izleyici artik yarisin NEREsinde oldugunu biliyor — uzun yaris
     ancak boyle izlenebilir oluyor. */
  function eCiviTarlasi(y) {
    for (let s = 0; s < 7; s++) {
      const kaydir = (s % 2) * 55;
      for (let x = 60 + kaydir; x < EN - 40; x += 110) pegler.push({ x, y: y + s * 78, r: 14 });
    }
    return y + 7 * 78 + 40;
  }

  function eZikzak(y, i) {
    const sol = i % 2 === 0;
    duvarlar.push(sol ? { x1: 0, y1: y, x2: EN - 150, y2: y + 175 }
                      : { x1: EN, y1: y, x2: 150, y2: y + 175 });
    for (let k = 1; k <= 4; k++) {
      pegler.push({ x: sol ? k * 165 : EN - k * 165, y: y + 42 * k + 26, r: 9 });
    }
    y += 200;
    duvarlar.push(sol ? { x1: EN, y1: y, x2: 150, y2: y + 175 }
                      : { x1: 0, y1: y, x2: EN - 150, y2: y + 175 });
    return y + 215;
  }

  function eDegirmen(y) {
    for (let s = 0; s < 3; s++) {
      pegler.push({ x: EN * 0.5,  y: y + s * 118, r: 30 });
      pegler.push({ x: EN * 0.16, y: y + 59 + s * 118, r: 19 });
      pegler.push({ x: EN * 0.84, y: y + 59 + s * 118, r: 19 });
      pegler.push({ x: EN * 0.33, y: y + s * 118, r: 12 });
      pegler.push({ x: EN * 0.67, y: y + s * 118, r: 12 });
    }
    return y + 3 * 118 + 45;
  }

  /* Dar bogaz: iki duvar ortada dar bir agiz birakir. Kalabalik burada
     tikanir, sonra teker teker firlar — yarisin en gergin ani. */
  function eDarBogaz(y) {
    const agiz = 130;
    duvarlar.push({ x1: 0,  y1: y,       x2: EN / 2 - agiz, y2: y + 230 });
    duvarlar.push({ x1: EN, y1: y,       x2: EN / 2 + agiz, y2: y + 230 });
    duvarlar.push({ x1: EN / 2 - agiz, y1: y + 230, x2: EN / 2 - agiz - 40, y2: y + 330 });
    duvarlar.push({ x1: EN / 2 + agiz, y1: y + 230, x2: EN / 2 + agiz + 40, y2: y + 330 });
    pegler.push({ x: EN / 2, y: y + 120, r: 22 });
    return y + 380;
  }

  /* Hiz tuneli: civi yok, sadece dikey ayiricilar. Misketler serbest
     dususe gecip birbirinden AYRILIYOR — surekli civi carpismasindan sonra
     araliklarin acildigi nefes alma bolumu. */
  function eHizTuneli(y) {
    const serit = 5, boy = 420;
    for (let k = 1; k < serit; k++) {
      const x = (EN / serit) * k;
      duvarlar.push({ x1: x, y1: y + 40, x2: x, y2: y + boy - 40 });
    }
    duvarlar.push({ x1: 0, y1: y, x2: EN * 0.12, y2: y + 40 });
    duvarlar.push({ x1: EN, y1: y, x2: EN * 0.88, y2: y + 40 });
    return y + boy + 30;
  }

  /* Sarkac dizisi: buyuk toplar sasirtmali, misketleri yana savuruyor. */
  function eSarkac(y) {
    for (let s = 0; s < 4; s++) {
      const kaydir = (s % 2) ? EN * 0.25 : 0;
      for (let k = 0; k < 3; k++) {
        pegler.push({ x: EN * 0.17 + kaydir + k * EN * 0.33, y: y + s * 105, r: 26 });
      }
    }
    return y + 4 * 105 + 50;
  }

  const ETAP_TIPLERI = [
    { ad: 'ÇİVİ TARLASI', ikon: '🔩', kur: eCiviTarlasi },
    { ad: 'ZİKZAK RAMPA', ikon: '⚡', kur: eZikzak },
    { ad: 'DAR BOĞAZ',    ikon: '⌛', kur: eDarBogaz },
    { ad: 'DEĞİRMEN',     ikon: '🎡', kur: eDegirmen },
    { ad: 'HIZ TÜNELİ',   ikon: '🚀', kur: eHizTuneli },
    { ad: 'SARKAÇLAR',    ikon: '🪀', kur: eSarkac },
  ];

  // ---- DIKEY yilan pist geometrisi ----
  function zemY(r, x) { return SATIR_BAS + r * SATIR_P + SATIR_D * ((r % 2 === 0 ? x : 960 - x) / XE); }
  function tavY(r, x) { return r === 0 ? 0 : zemY(r - 1, x); }
  function sX(r, s) { return r % 2 === 0 ? s : 960 - s; }       // satir ici mesafe -> x
  function satirBul(x, y) { for (let i = 0; i < SATIR - 1; i++) if (y < zemY(i, x)) return i; return SATIR - 1; }
  function ilerle(b) {
    if (!DIKEY) return b.y;
    const r = b.r = satirBul(b.x, b.y);
    return r * 960 + (r % 2 === 0 ? b.x : 960 - b.x);
  }
  const DK_BITIS_S = 840;        // son satirda bitis cizgisi (satir ici mesafe)
  // Yerel yardimci: satir r'de, mesafe s'de, tavan-zemin araligi h ve zemin ustu yuksekligi f*h
  function dkNokta(r, s, f) { const x = sX(r, s), z = zemY(r, x), t = tavY(r, x); return { x, y: z - f * (z - t), h: z - t, z, t }; }
  const KAPAT = 2 * R_TASARIM + 10;   // bilyenin altindan/ustunden gecebilecegi en dar aralik
  /* Bilye zeminde YURUR ve zemindeki bir kabartiyi asamaz (olculdu: 12 px'lik kabarti
     yarisi durduruyor). Bu yuzden butun engeller TAVANDAN sarkar; bilye altindan gecer,
     kalabalik birbirine ve sarkik uclara carparak karisir. */
  function dkSarkik(r, s, yaricap, derinlik) {
    const n = dkNokta(r, s, 0);
    const alt = Math.min(derinlik, n.h - KAPAT);          // sarkik ucun tavandan inebilecegi en fazla
    if (alt < 12) return false;
    const rad = Math.min(yaricap, alt / 2);
    duvarlar.push({ x1: n.x, y1: n.t, x2: n.x, y2: n.t + alt - rad });   // sap
    pegler.push({ x: n.x, y: n.t + alt - rad, r: rad });
    return true;
  }
  function dkTavanDuvar(r, s, derinlik) {            // tavandan inen dikey duvar; zemin tarafi acik
    const n = dkNokta(r, s, 0);
    const uz = Math.min(derinlik, n.h - KAPAT);
    if (uz < 10) return;
    duvarlar.push({ x1: n.x, y1: n.t, x2: n.x, y2: n.t + uz });
  }

  const DK_ETAP = {
    // (r, s0): etabin ilk ve son ~100 px'i bos (dusus/giris)
    'ÇİVİ TARLASI'(r, s0) {
      for (let s = s0 + 110, k = 0; s <= s0 + 380; s += 62, k++) {
        dkSarkik(r, s, 8, k % 2 === 0 ? 34 : 60);
      }
    },
    'ZİKZAK RAMPA'(r, s0) {
      // alcalan tavan: yatay tavan duvarlari kademeli iner (sikisma-acilma)
      for (let s = s0 + 130, k = 0; s <= s0 + 370; s += 120, k++) dkTavanDuvar(r, s, 60 + k * 30);
    },
    'DAR BOĞAZ'(r, s0) {
      for (const s of [s0 + 170, s0 + 330]) dkTavanDuvar(r, s, 999);   // bogaz: yalniz KAPAT kadar aralik
    },
    'DEĞİRMEN'(r, s0) {
      for (let s = s0 + 120, k = 0; s <= s0 + 380; s += 70, k++) {
        dkSarkik(r, s, 12, k % 2 === 0 ? 54 : 78);
      }
    },
    'HIZ TÜNELİ'() { /* bos ve hizlandirici: adim() bu etapta suruc kuvvetini artirir */ },
    'SARKAÇLAR'(r, s0) {
      for (let s = s0 + 130; s <= s0 + 380; s += 100) dkSarkik(r, s, 17, 66);
    },
    'SON DÜZLÜK'() { /* bos: bitis cizgisine kadar duz */ },
  };

  function pistUretDikey() {
    pegler = []; duvarlar = []; etaplar = [];
    // zeminler: cift satir soldan saga, tek satir sagdan sola; uc boslugu BOSLUK px
    for (let r = 0; r < SATIR; r++) {
      const x0 = r % 2 === 0 ? 0 : 960, x1 = r % 2 === 0 ? XE : 960 - XE;
      duvarlar.push({ x1: x0, y1: zemY(r, x0), x2: x1, y2: zemY(r, x1) });
    }
    // yan duvarlar + tavan
    duvarlar.push({ x1: 0, y1: -200, x2: 0, y2: 700 });
    duvarlar.push({ x1: 960, y1: -200, x2: 960, y2: 700 });
    duvarlar.push({ x1: 0, y1: 0, x2: 960, y2: 0 });
    // 10 etap = 10 yarim satir (9 etap + SON DUZLUK)
    const bas = Math.floor(Math.random() * ETAP_TIPLERI.length);
    for (let h = 0; h < SATIR * 2; h++) {
      const r = h >> 1, s0 = (h % 2) * YARIM_UZ;
      let tip;
      if (h === SATIR * 2 - 1) tip = { ad: 'SON DÜZLÜK', ikon: '🏁' };
      else tip = ETAP_TIPLERI[(bas + h) % ETAP_TIPLERI.length];
      if (h > 0) (DK_ETAP[tip.ad] || (() => {}))(r, s0);   // 1. etap = baslangic izgarasi: engelsiz (ust katmandaki bilye duvar arkasinda kalmasin)
      etaplar.push({ ad: tip.ad, ikon: tip.ikon, y0: h * YARIM_UZ, y1: h === SATIR * 2 - 1 ? 1e9 : (h + 1) * YARIM_UZ, r, s0 });
    }
    bitis = (SATIR - 1) * 960 + DK_BITIS_S;
    pistBoy = 672;
  }

  /** Rastgele ama oynanabilir bir pist uret. */
  function pistUret() {
    if (DIKEY) return pistUretDikey();
    pegler = []; duvarlar = []; etaplar = [];
    let y = 420;

    // Baslangic hunisi — misketler ortaya toplansin
    duvarlar.push({ x1: -40, y1: 250, x2: 330, y2: 400 });
    duvarlar.push({ x1: EN + 40, y1: 250, x2: EN - 330, y2: 400 });

    // Etap sirasi: her tur listeyi bir kaydirarak geciyoruz, boylece ayni
    // sira arka arkaya cikmiyor ama "once civi sonra rampa" ritmi bozulmuyor.
    const bas = Math.floor(Math.random() * ETAP_TIPLERI.length);
    for (let b = 0; b < ETAP_SAYISI; b++) {
      const tip = ETAP_TIPLERI[(bas + b) % ETAP_TIPLERI.length];
      const y0 = y;
      y = tip.kur(y, b);
      etaplar.push({ ad: tip.ad, ikon: tip.ikon, y0, y1: y });
    }

    // Bitis hunisi
    duvarlar.push({ x1: 0, y1: y, x2: EN * 0.34, y2: y + 220 });
    duvarlar.push({ x1: EN, y1: y, x2: EN * 0.66, y2: y + 220 });
    etaplar.push({ ad: 'SON DÜZLÜK', ikon: '🏁', y0: y, y1: y + 300 });
    y += 300;

    bitis = y;
    pistBoy = y + 200;

    // Yan duvarlar
    duvarlar.push({ x1: 0, y1: 0, x2: 0, y2: pistBoy });
    duvarlar.push({ x1: EN, y1: 0, x2: EN, y2: pistBoy });
  }

  /** Verilen y hangi etapta? (lider takibi icin) */
  function etapBul(y) {
    for (let i = 0; i < etaplar.length; i++) if (y < etaplar[i].y1) return i;
    return etaplar.length - 1;
  }

  /** HUD'daki etap gostergesini guncelle. */
  function etapYaz(i) {
    const hud = document.getElementById('etapHud');
    const e = etaplar[i];
    if (!hud || !e) return;
    if (DIKEY) { if (durum === 'yaris') cagriYaz(`ETAP ${i + 1}/${etaplar.length} · ${e.ad}`); return; }
    if (durum !== 'yaris') { hud.classList.remove('acik'); return; }
    document.getElementById('etapNo').textContent = (i + 1) + '/' + etaplar.length;
    document.getElementById('etapAd').textContent = e.ikon + ' ' + e.ad;
    hud.classList.add('acik');
  }

  // ---- bilyeler ------------------------------------------------------------
  const RENKLER = [
    '#ff4d4d', '#3fb9ff', '#ffd23f', '#7ed957', '#ff5fc8', '#ffa62b',
    '#a86bff', '#21d1a1', '#5b7fff', '#b6e02b', '#e05cff', '#00c2c7',
  ];

  let bilyeler = [];        // {ad, kid, renk, x, y, vx, vy, bitti, sira}
  let bitirenler = [];
  let katilanlar = new Map();   // kid -> ad  (bu yarisa girenler)
  let kuyruk = new Map();       // sonraki yarisi bekleyenler

  /* KISISEL KAYIT — bu oyunda hicbir sey saklanmiyordu: yaziyorsun,
     23 saniye bir top koşuyor, sonra oyun seni unutuyordu. Marbles on
     Stream'i tutan sey yarisin kendisi degil, yarislar USTUNE biriken
     kayitti. Kucuk ama gercek: kacinci yarisin, kac galibiyetin. */
  let kayit = new Map();
  try {
    for (const [k, v] of JSON.parse(localStorage.getItem('tt-misket-kayit') || '[]')) kayit.set(k, v);
  } catch { /* sifirdan */ }
  function kayitAl(kid) { return kayit.get(kid) || { yaris: 0, galip: 0 }; }
  function kayitYaz() {
    try {
      localStorage.setItem('tt-misket-kayit',
        JSON.stringify([...kayit.entries()].slice(-400)));
    } catch { /* olsun */ }
  }

  let durum = 'katilim';        // katilim | yaris | bitti
  let sayacSn = KATILIM_SN;
  let kazananAdi = '';

  /* DIKEY: bilye boyu kalabaliga gore (24'e kadar 44 px, sonra kuculur) ve
     baslangic yuvalari: 1. satirin basinda izgara, her turda karisik sirayla
     (yuva = katilim sirasina gore, ama yuva SIRASI rastgele: kimse hep one dusmez). */
  function rHesapla(n) {
    if (!DIKEY) return R_ESKI;
    return Math.max(11, Math.min(R_TASARIM, R_TASARIM * Math.sqrt(24 / Math.max(1, n))));
  }
  let yuvaSira = [];
  function yuvaKaristir() {
    yuvaSira = Array.from({ length: 160 }, (_, i) => i);
    for (let i = yuvaSira.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [yuvaSira[i], yuvaSira[j]] = [yuvaSira[j], yuvaSira[i]];
    }
  }
  yuvaKaristir();
  /** i. bilyenin yuvasi: ilk n yuva icinde karisik (az kisi ayni kumede baslar, kimse one dusmez). */
  function yuvaDizi(n) { return yuvaSira.filter((v) => v < n); }
  /** n bilye icin baslangic izgara noktalari (sutun-sutun, soldan saga). */
  function yuvalar(n, r) {
    const sp = r * 2 + 3, out = [];
    for (let x = 22 + r; x < 940 - r && out.length < Math.max(n, 160); x += sp) {
      for (let y = 10 + r; y + r + 3 < zemY(0, x); y += sp) out.push({ x, y });
    }
    return out;
  }

  function bilyeKur() {
    bilyeler = [];
    bitirenler = [];
    R = rHesapla(katilanlar.size);
    const yv = DIKEY ? yuvalar(katilanlar.size, R) : null;
    const yd = DIKEY ? yuvaDizi(katilanlar.size) : null;
    let i = 0;
    for (const [kid, ad] of katilanlar) {
      // Ust bantta rastgele dagit, hafif yatay hiz ver — her yaris farkli olsun
      const kim = Kimlik.al(kid);   // kalici skin: ayni izleyici her yayinda ayni bilye
      let x = 90 + Math.random() * (EN - 180), y = 60 + Math.random() * 160;
      if (DIKEY) {
        const y0 = yv[yd[i]] || yv[i % yv.length];
        x = y0.x; y = y0.y;
      }
      bilyeler.push({
        ad, kid,
        renk: kim.renk,
        x, y,
        vx: (Math.random() - 0.5) * (DIKEY ? 60 : 120),
        vy: 0,
        bitti: false, sira: 0, iz: [], p: 0, ps: 0, psT: 0,
      });
      i++;
    }
    for (const b of bilyeler) b.p = ilerle(b);
  }

  // ---- fizik ---------------------------------------------------------------
  /** Bir noktanin dogru parcasina en yakin noktasi. */
  function enYakin(px, py, d) {
    const dx = d.x2 - d.x1, dy = d.y2 - d.y1;
    const uzun = dx * dx + dy * dy;
    let t = uzun ? ((px - d.x1) * dx + (py - d.y1) * dy) / uzun : 0;
    t = Math.max(0, Math.min(1, t));
    return { x: d.x1 + t * dx, y: d.y1 + t * dy };
  }

  function adim(dt) {
    let liderY = 0;
    for (const b of bilyeler) if (!b.bitti && b.p > liderY) liderY = b.p;
    const sur = Math.pow(SURTUNME, dt * 180);   // sure bazli: kare hizindan bagimsiz

    for (const b of bilyeler) {
      if (b.bitti) continue;

      // Lastik bant: liderden %10+ geride kalana kademeli ekstra yercekimi.
      // Pakete dokunmaz, sadece kopanlari toparlar — yoksa kamera lideri
      // izlerken pist bombos gorunuyor.
      const gerilik = (liderY - b.p) / Math.max(1, bitis);
      const yardim = gerilik > 0.1 ? Math.min(0.5, (gerilik - 0.1) * 3) : 0;

      b.vy += YERCEKIMI * (1 + yardim) * dt;
      if (DIKEY) {
        // Pist 'hafif egimli' kabul: satir yonunde sabit suruc (zeminin gorsel egimi kucuk,
        // gercek egim bilyeyi kabartilarin ustunden tasimaya yetmiyordu). Herkese ayni; hediye/yazi etkisiz.
        const hiz = etaplar[etapBul(b.p)];
        b.vx += ((b.r || 0) % 2 === 0 ? 1 : -1) * SURUS * Math.pow(R / R_TASARIM, 0.6) * (1 + yardim) * (hiz && hiz.ad === 'HIZ TÜNELİ' ? 2.2 : 1) * dt;
      }
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vx *= sur; b.vy *= sur;

      // --- civiler ---
      for (const p of pegler) {
        const dx = b.x - p.x, dy = b.y - p.y;
        const mesafe2 = dx * dx + dy * dy;
        const engel = R + p.r;
        if (mesafe2 >= engel * engel || mesafe2 === 0) continue;
        const mesafe = Math.sqrt(mesafe2);
        const nx = dx / mesafe, ny = dy / mesafe;
        b.x = p.x + nx * engel;
        b.y = p.y + ny * engel;
        const hiz = b.vx * nx + b.vy * ny;
        if (hiz < 0) { b.vx -= (1 + ESNEKLIK) * hiz * nx; b.vy -= (1 + ESNEKLIK) * hiz * ny; }
      }

      // --- duvarlar ---
      for (const d of duvarlar) {
        const y = enYakin(b.x, b.y, d);
        const dx = b.x - y.x, dy = b.y - y.y;
        const mesafe2 = dx * dx + dy * dy;
        if (mesafe2 >= R * R || mesafe2 === 0) continue;
        const mesafe = Math.sqrt(mesafe2);
        const nx = dx / mesafe, ny = dy / mesafe;
        b.x = y.x + nx * R;
        b.y = y.y + ny * R;
        const hiz = b.vx * nx + b.vy * ny;
        if (hiz < 0) { b.vx -= (1 + ESNEKLIK) * hiz * nx; b.vy -= (1 + ESNEKLIK) * hiz * ny; }
      }

      // --- ilerleme + bitis ---
      b.p = ilerle(b);
      if (DIKEY ? b.p >= bitis : b.y > bitis) {
        b.bitti = true;
        b.sira = bitirenler.length + 1;
        bitirenler.push(b);
        if (bitirenler.length === 1) yarisBitti(b);
        continue;
      }
      // Tikanma onlemi (yalniz dikey): 2.5 sn'de 25 px'ten az ilerleyen bilyeye
      // yonunde kucuk bir itki. Hediye/izleyici ile ilgisi yok; herkese ayni kural.
      if (DIKEY) {
        b.psT += dt;
        if (b.psT > 2.5) {
          if (b.p - b.ps < 25) { b.vx += (satirBul(b.x, b.y) % 2 === 0 ? 1 : -1) * 150; b.vy -= 90; }
          b.ps = b.p; b.psT = 0;
        }
      }
    }

    // --- bilye-bilye ---
    for (let i = 0; i < bilyeler.length; i++) {
      const a = bilyeler[i];
      if (a.bitti) continue;
      for (let j = i + 1; j < bilyeler.length; j++) {
        const c = bilyeler[j];
        if (c.bitti) continue;
        const dx = c.x - a.x, dy = c.y - a.y;
        const mesafe2 = dx * dx + dy * dy;
        const engel = R * 2;
        if (mesafe2 >= engel * engel || mesafe2 === 0) continue;
        const mesafe = Math.sqrt(mesafe2);
        const nx = dx / mesafe, ny = dy / mesafe;
        const ort = (engel - mesafe) / 2;
        a.x -= nx * ort; a.y -= ny * ort;
        c.x += nx * ort; c.y += ny * ort;
        const goreli = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
        if (goreli < 0) {
          const p = goreli * ESNEKLIK;
          a.vx += p * nx; a.vy += p * ny;
          c.vx -= p * nx; c.vy -= p * ny;
        }
      }
    }
  }

  // ---- cizim ---------------------------------------------------------------
  const tuval = document.getElementById('tuval');
  const ctx = tuval.getContext('2d');

  // ---- pist katmani: statik geometri tek tuvalde ----
  let pistTuval = null, pistSb = 1;   // sb = dunya birimi basina piksel

  function pistPisir() {
    if (!pistBoy || !olcek) return;
    let sb = olcek * dprSec();
    // Bellek tavani: ~11M piksel (RGBA ~44MB). Asarsa olcegi dusur —
    // arka plan hafif yumusar, kimse fark etmez.
    let w = Math.ceil(EN * sb), h = Math.ceil(pistBoy * sb);
    const TAVAN = 11e6;
    if (w * h > TAVAN) {
      sb *= Math.sqrt(TAVAN / (w * h));
      w = Math.ceil(EN * sb); h = Math.ceil(pistBoy * sb);
    }
    pistTuval = document.createElement('canvas');
    pistTuval.width = w; pistTuval.height = h;
    pistSb = sb;
    const x = pistTuval.getContext('2d');
    x.scale(sb, sb);
    if (DIKEY) { pistPisirDikey(x); return; }

    // duvarlar: iki katman
    x.lineCap = 'round';
    x.strokeStyle = '#241b5e'; x.lineWidth = 13;
    x.beginPath();
    for (const d of duvarlar) { x.moveTo(d.x1, d.y1); x.lineTo(d.x2, d.y2); }
    x.stroke();
    x.strokeStyle = '#7d6ce0'; x.lineWidth = 7;
    x.beginPath();
    for (const d of duvarlar) { x.moveTo(d.x1, d.y1); x.lineTo(d.x2, d.y2); }
    x.stroke();

    // civiler: golge + sprite
    for (const p of pegler) {
      x.globalAlpha = .3; x.fillStyle = '#000';
      x.beginPath(); x.arc(p.x + 2, p.y + 3, p.r, 0, 6.2832); x.fill();
      x.globalAlpha = 1;
      x.drawImage(civiSprite, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }

    // Etap bantlari: her etabin girisine adi yazili bir serit. Yarisin
    // "bolumleri var" hissi buradan geliyor — statik katmanda pisiyor,
    // yani kare basina maliyeti sifir.
    x.textBaseline = 'middle';
    for (let i = 0; i < etaplar.length; i++) {
      const e = etaplar[i];
      if (i === 0) continue;                 // ilk etap girisinde bant olmasin
      x.fillStyle = 'rgba(255,210,63,.13)';
      x.fillRect(0, e.y0 - 26, EN, 52);
      x.fillStyle = 'rgba(255,210,63,.6)';
      x.fillRect(0, e.y0 - 26, EN, 3);
      x.fillRect(0, e.y0 + 23, EN, 3);
      x.fillStyle = '#ffe9a8';
      x.font = '900 34px Outfit, system-ui, sans-serif';
      x.textAlign = 'center';
      x.fillText(`${e.ikon}  ${i + 1}. ETAP · ${e.ad}`, EN / 2, e.y0);
    }
    x.textAlign = 'left';

    // bitis cizgisi
    for (let bx = 0; bx < EN; bx += 40) {
      for (let k = 0; k < 2; k++) {
        x.fillStyle = ((bx / 40 + k) % 2) ? '#17123a' : '#fff';
        x.fillRect(bx, bitis + k * 11, 40, 11);
      }
    }
  }

  /** DIKEY statik katman: satir seritleri, zeminler, engeller, etap bayraklari + adlari, bitis. */
  function pistPisirDikey(x) {
    // seritlerin ici (tavan-zemin araligi): hafif aydinlik
    for (let r = 0; r < SATIR; r++) {
      x.beginPath();
      for (let px = 0; px <= 960; px += 24) { const y = tavY(r, px); px ? x.lineTo(px, y) : x.moveTo(px, y); }
      for (let px = 960; px >= 0; px -= 24) x.lineTo(px, zemY(r, px));
      x.closePath();
      x.fillStyle = r % 2 ? 'rgba(139,92,246,.07)' : 'rgba(255,255,255,.045)';
      x.fill();
    }
    x.lineCap = 'round';
    x.strokeStyle = '#241b5e'; x.lineWidth = 12;
    x.beginPath();
    for (const d of duvarlar) { x.moveTo(d.x1, d.y1); x.lineTo(d.x2, d.y2); }
    x.stroke();
    x.strokeStyle = '#7d6ce0'; x.lineWidth = 6;
    x.beginPath();
    for (const d of duvarlar) { x.moveTo(d.x1, d.y1); x.lineTo(d.x2, d.y2); }
    x.stroke();
    for (const p of pegler) {
      x.globalAlpha = .3; x.fillStyle = '#000';
      x.beginPath(); x.arc(p.x + 2, p.y + 3, p.r, 0, 6.2832); x.fill();
      x.globalAlpha = 1;
      x.drawImage(civiSprite, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }
    // etap adlari (30px, tavana yakin, soluk) + etap bayraklari (zeminde)
    x.textBaseline = 'alphabetic'; x.textAlign = 'center';
    x.font = '900 30px Outfit, system-ui, sans-serif';
    for (let i = 0; i < etaplar.length; i++) {
      const e = etaplar[i];
      const orta = dkNokta(e.r, e.s0 + YARIM_UZ / 2, 0);
      x.fillStyle = 'rgba(255,233,168,.62)';
      x.fillText(`${e.ikon} ${i + 1}. ${e.ad}`, orta.x, orta.t + 34);
      if (i > 0 && e.s0 === 0) continue;       // satir basi: alttaki satira duser, bayrak yok
      if (i === 0) continue;
      const f = dkNokta(e.r, e.s0, 0);
      x.strokeStyle = '#ffe9a8'; x.lineWidth = 4;
      x.beginPath(); x.moveTo(f.x, f.z); x.lineTo(f.x, f.z - 34); x.stroke();
      x.fillStyle = '#ffd23f';
      const yon = e.r % 2 === 0 ? 1 : -1;
      x.beginPath(); x.moveTo(f.x, f.z - 34); x.lineTo(f.x + 22 * yon, f.z - 27); x.lineTo(f.x, f.z - 20); x.closePath(); x.fill();
    }
    x.textAlign = 'left';
    // bitis cizgisi: son satirda kareli serit
    const sonR = SATIR - 1, bx = sX(sonR, DK_BITIS_S);
    const bn = dkNokta(sonR, DK_BITIS_S, 0);
    for (let k = 0, y = bn.t; y < bn.z; y += 11, k++) {
      for (let c = 0; c < 2; c++) { x.fillStyle = (k + c) % 2 ? '#17123a' : '#fff'; x.fillRect(bx - 11 + c * 11, y, 11, 11); }
    }
  }

  // Civi kuresi bir kez pisirilir; cizimde drawImage ile olceklenir
  const civiSprite = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(22, 20, 4, 32, 34, 32);
    g.addColorStop(0, '#cfc4ff'); g.addColorStop(1, '#6f5fc4');
    x.beginPath(); x.arc(32, 32, 30, 0, 6.2832);
    x.fillStyle = g; x.fill();
    return c;
  })();
  let W = 0, H = 0, olcek = 1, kamera = 0;

  function dprSec() {
    if (document.documentElement.classList.contains('tt-lite')) return 1;
    return Math.min(1.5, window.devicePixelRatio || 1);
  }

  function boyutla() {
    const r = tuval.getBoundingClientRect();
    if (!r.width || !r.height) return;              // henuz yerlesmedi
    const dpr = dprSec();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    tuval.width = Math.round(W * dpr);
    tuval.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    olcek = W / EN;
    pistPisir();
  }
  // Tek seferlik olcum yetmiyor: sayfa ilk acildiginda yerlesim daha
  // oturmamis oluyor, tuvalin arka tamponu yanlis oranda kaliyor ve
  // daireler ELIPS goruntuleniyordu. ResizeObserver her gercek boyut
  // degisiminde yeniden olcuyor.
  if (window.ResizeObserver) new ResizeObserver(boyutla).observe(tuval);
  addEventListener('resize', boyutla);
  addEventListener('tt-yon', boyutla);

  // Rengi acip koyultan yardimcilar — kure golgelemesi icin.
  function ton(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.max(0, ((n >> 16) & 255) + k));
    const g = Math.min(255, Math.max(0, ((n >> 8) & 255) + k));
    const b = Math.min(255, Math.max(0, (n & 255) + k));
    return `rgb(${r} ${g} ${b})`;
  }

  /** Bilyeyi KURE gibi ciz: duz daire "ucuz" duruyor.
   *  Isik sol ustten: radyal gradyan + parlama noktasi + koyu kenar + golge. */
  function bilyeCiz(b) {
    // yere dusen golge (kalite dusunce ilk kisilan sey)
    if (kalite === 0) {
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(b.x + 3, b.y + R * 0.85, R * 0.85, R * 0.32, 0, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Kure onceden pisirildi (kimlik.js): karede sadece drawImage.
    // Onceki kod her bilye icin her karede createRadialGradient cagiriyordu —
    // GPU'suz renderda en pahali satir oydu.
    Kimlik.ciz(ctx, b.kid, b.x, b.y, R * 2.15);
  }

  /* ---- DIKEY cizim: kamera yok, pistin tamami gorunur ---- */
  const ETIKET_PX = 40;                 // lider/yazan/hediye etiketi: >=40px
  const ETIKET_FONT = `800 ${ETIKET_PX}px Outfit, system-ui, sans-serif`;
  const etiketKonum = new Map();         // kid -> {x,y} yumusatilmis (sure bazli)
  let sonYazan = null;                   // {kid, ad, t}
  let sonHediye = null;                  // {kid, ad, t}
  const ETIKET_YAZAN_SN = 6, ETIKET_HEDIYE_SN = 9;

  /** Adi etiket genisligine sigdir: sigmazsa satirlara bol (ayrac sonra harf); "…" yok. */
  function adSatirlari(ad, enMax) {
    ctx.font = ETIKET_FONT;
    if (ctx.measureText(ad).width <= enMax) return [ad];
    if (!/[_.\-\s]/.test(ad)) {                       // tek parca ad: esit uzunlukta satirlara bol
      const hf = [...ad], n = Math.ceil(ctx.measureText(ad).width / enMax), k = Math.ceil(hf.length / n);
      const out = [];
      for (let i = 0; i < hf.length; i += k) out.push(hf.slice(i, i + k).join(''));
      return out;
    }
    const parca = ad.match(/[^_.\-\s]*[_.\-\s]+|[^_.\-\s]+/g) || [ad];
    const satirlar = []; let cur = '';
    const ekle = (t) => {
      for (const ch of [...t]) {
        if (cur && ctx.measureText(cur + ch).width > enMax) { satirlar.push(cur); cur = ''; }
        cur += ch;
      }
    };
    for (const p of parca) {
      if (ctx.measureText(cur + p).width <= enMax) cur += p;
      else if (cur && ctx.measureText(p).width <= enMax) { satirlar.push(cur); cur = p; }
      else ekle(p);                                   // tek parca bile sigmiyor: harf harf bol
    }
    if (cur) satirlar.push(cur);
    return satirlar;
  }

  function etiketleriCiz(dt) {
    const canli = bilyeler.filter((b) => !b.bitti);
    if (!canli.length) return;
    const simdi = performance.now() / 1000;
    let lider = canli[0];
    for (const b of canli) if (b.p > lider.p) lider = b;
    const adaylar = [{ b: lider, on: '1. ', renk: '#ffd23f' }];
    const ekleKid = (o, sn, on, renk) => {
      if (!o || simdi - o.t > sn) return;
      const b = canli.find((x) => x.kid === o.kid);
      if (b && !adaylar.some((a) => a.b === b)) adaylar.push({ b, on, renk });
    };
    ekleKid(sonYazan, ETIKET_YAZAN_SN, '', '#fff');          // oncelik 2: son yazan
    ekleKid(sonHediye, ETIKET_HEDIYE_SN, '🎁 ', '#ffe9a8');  // oncelik 3: son hediye
    const yerlesen = [];
    const k = 1 - Math.exp(-dt * 14);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    for (const a of adaylar.slice(0, 3)) {
      const b = a.b;
      const satirlar = adSatirlari(a.on + b.ad, 560);
      ctx.font = ETIKET_FONT;
      let gen = 0; for (const t of satirlar) gen = Math.max(gen, ctx.measureText(t).width);
      const w = gen + 28, h = satirlar.length * 46 + 10;
      const cx = Math.min(960 - w / 2 - 4, Math.max(w / 2 + 4, b.x));
      let sol = etiketKonum.get(b.kid);
      const adayY = [b.y - R - 8 - h, b.y + R + 8];          // once ustte, olmazsa altta
      let secilen = null;
      for (const ty of adayY) {
        if (ty < 4 || ty + h > 668) continue;
        const r = { x: cx - w / 2, y: ty, w, h };
        if (yerlesen.some((o) => r.x < o.x + o.w + 6 && r.x + r.w + 6 > o.x && r.y < o.y + o.h + 6 && r.y + r.h + 6 > o.y)) continue;
        secilen = r; break;
      }
      if (!secilen) continue;                                // dusuk oncelikli etiket birakilir
      if (!sol) sol = etiketKonum.set(b.kid, { x: secilen.x, y: secilen.y }).get(b.kid);
      else { sol.x += (secilen.x - sol.x) * k; sol.y += (secilen.y - sol.y) * k; }
      const r = { x: sol.x, y: sol.y, w, h };
      // yumusatma yerlesmis dikdortgenlerle cakisirsa hedefe oturt
      if (yerlesen.some((o) => r.x < o.x + o.w + 6 && r.x + r.w + 6 > o.x && r.y < o.y + o.h + 6 && r.y + r.h + 6 > o.y)) { r.x = secilen.x; r.y = secilen.y; sol.x = r.x; sol.y = r.y; }
      yerlesen.push(r);
      ctx.fillStyle = 'rgba(12,8,40,.88)';
      ctx.beginPath(); ctx.roundRect(r.x, r.y, w, h, 12); ctx.fill();
      ctx.fillStyle = a.renk;
      satirlar.forEach((t, i) => ctx.fillText(t, r.x + w / 2, r.y + 5 + 38 + i * 46 - 4));
    }
  }

  let cizSon = 0;
  function cizDikey() {
    const t = performance.now();
    const dt = cizSon ? Math.min(0.1, (t - cizSon) / 1000) : 0.016;
    cizSon = t;
    ctx.clearRect(0, 0, W, H);
    if (pistTuval) ctx.drawImage(pistTuval, 0, 0, pistTuval.width, pistTuval.height, 0, 0, EN * olcek, pistBoy * olcek);
    ctx.save();
    ctx.scale(olcek, olcek);
    if (durum === 'katilim') {
      // bekleyen misketler baslangic izgarasinda (yuva = katilim sirasi, yuva sirasi karisik)
      const n = katilanlar.size, r = rHesapla(n), yv = yuvalar(n, r), yd = yuvaDizi(n);
      let i = 0;
      for (const kid of katilanlar.keys()) {
        const y0 = yv[yd[i]] || yv[i % yv.length];
        if (y0) Kimlik.ciz(ctx, kid, y0.x, y0.y, r * 2.15);
        i++;
      }
    } else {
      // iz (hareket cizgisi)
      for (const b of bilyeler) {
        if (kalite > 0) break;
        if (b.bitti || !b.iz) continue;
        for (let i = 0; i < b.iz.length; i++) {
          const p = b.iz[i];
          ctx.globalAlpha = 0.05 + 0.16 * (i / b.iz.length);
          ctx.beginPath(); ctx.arc(p.x, p.y, R * (0.45 + 0.45 * i / b.iz.length), 0, 6.2832);
          ctx.fillStyle = b.renk; ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      const simdi = performance.now() / 1000;
      for (const b of bilyeler) {
        if (b.bitti) continue;
        // hediye gonderenin bilyesi: sadece gorsel halka (sonucu degistirmez)
        if (sonHediye && sonHediye.kid === b.kid && simdi - sonHediye.t < ETIKET_HEDIYE_SN) {
          ctx.globalAlpha = 0.85; ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(b.x, b.y, R * 1.35, 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1;
        }
        bilyeCiz(b);
      }
    }
    ctx.restore();
    if (durum === 'yaris') {
      ctx.save(); ctx.scale(olcek, olcek);
      etiketleriCiz(dt);
      ctx.restore();
    }
  }

  function ciz() {
    if (DIKEY) return cizDikey();
    ctx.clearRect(0, 0, W, H);

    // Kamera: en ondeki bilyeyi ekranin ust ucte birinde tut
    let onde = 0;
    for (const b of bilyeler) if (!b.bitti && b.y > onde) onde = b.y;
    if (durum === 'katilim') onde = 200;
    // Lideri ekranin %42'sinde tut: %34'te arkadaki paket ekran disinda
    // kaliyordu ve yaris tek bilyeden ibaret goruniyordu.
    const hedef = onde * olcek - H * 0.52;
    kamera += (hedef - kamera) * (1 - Math.pow(1 - 0.12, Math.min(0.1, (performance.now() - (ciz._t || performance.now())) / 1000) * 60));
    ciz._t = performance.now();
    kamera = Math.max(0, Math.min(kamera, pistBoy * olcek - H));

    // Statik pist: tek kopyalama. (Onceden burada duvar konturlari,
    // ~60 civi ve bitis cizgisi her karede yeniden ciziliyordu.)
    if (pistTuval) {
      const kaynakY = (kamera / olcek) * pistSb;
      const kaynakH = Math.min(pistTuval.height - kaynakY, (H / olcek) * pistSb);
      if (kaynakH > 0) {
        ctx.drawImage(pistTuval, 0, kaynakY, pistTuval.width, kaynakH,
                      0, 0, W, kaynakH / pistSb * olcek);
      }
    }

    ctx.save();
    ctx.translate(0, -kamera);
    ctx.scale(olcek, olcek);

    const ustSinir = kamera / olcek - 60;
    const altSinir = (kamera + H) / olcek + 60;

    // --- iz (motion trail): hiz hissi duz daireyle gelmiyor ---
    for (const b of bilyeler) {
      if (kalite > 0) break;
      if (b.bitti || !b.iz) continue;
      for (let i = 0; i < b.iz.length; i++) {
        const p = b.iz[i];
        if (p.y < ustSinir || p.y > altSinir) continue;
        ctx.globalAlpha = 0.05 + 0.16 * (i / b.iz.length);
        ctx.beginPath(); ctx.arc(p.x, p.y, R * (0.45 + 0.45 * i / b.iz.length), 0, 6.2832);
        ctx.fillStyle = b.renk; ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // --- bilyeler ---
    for (const b of bilyeler) {
      if (b.bitti) continue;
      if (b.y < ustSinir || b.y > altSinir) continue;
      bilyeCiz(b);
    }
    ctx.restore();

    // --- lider etiketleri (ekran uzayi: olcekten bagimsiz okunakli) ---
    // Sadece lider etiketlenir: uc etiket birden, bilyeler kumelendiginde
    // ust uste binip okunmaz hale geliyordu. Sira zaten rayda yaziyor.
    const canli = bilyeler.filter((b) => !b.bitti).sort((a, b) => b.y - a.y).slice(0, 1);
    ctx.font = '800 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    canli.forEach((b, i) => {
      const ey = b.y * olcek - kamera;
      // Kenarda kirpilmasin: etiketi sahne icinde tut
      const ex = Math.min(W - 70, Math.max(70, b.x * olcek));
      if (ey < 24 || ey > H) return;
      const etiket = (i + 1) + '. ' + b.ad;
      const en = ctx.measureText(etiket).width + 14;
      const ty = ey - R * olcek - 20;
      ctx.fillStyle = 'rgba(12,8,40,.82)';
      ctx.beginPath(); ctx.roundRect(ex - en / 2, ty, en, 19, 7); ctx.fill();
      ctx.fillStyle = i === 0 ? '#ffd23f' : '#fff';
      ctx.fillText(etiket, ex, ty + 14);
    });
  }

  // ---- dongu ---------------------------------------------------------------
  // ---- spiker --------------------------------------------------------------
  // Jelle's Marble Runs'in isi tutan yani yarisi SPOR YAYINI gibi anlatmasi:
  // canli siralama, pozisyon degisimi, "son duzluk". Sessiz bir fizik
  // simulasyonu ucuz duruyor; olaylari soyleyince yaris haline geliyor.
  let sonLider = null, sonDuzlukDendi = false, spikerBekle = 0;   // spikerBekle: SANIYE
  let sonEtap = -1;

  function spikerKontrol(dt) {
    const canli = bilyeler.filter((b) => !b.bitti);
    if (!canli.length) return;
    let lider = canli[0];
    for (const b of canli) if (b.p > lider.p) lider = b;

    // Etap gecisi: bekleme sayacindan BAGIMSIZ, cunku yarisin iskeleti bu.
    // Lider yeni bir etaba girdiginde hem HUD hem spiker haber veriyor.
    const ei = etapBul(lider.p);
    if (ei !== sonEtap) {
      sonEtap = ei;
      etapYaz(ei);
      if (ei > 0 && etaplar[ei]) {
        Ses.cal('etap');
        // Etaplar bu oyunun iskeleti; gecis su ana kadar sadece DUYULUYORDU.
        // HUD'a olcek darbesi: oransal, lite modda da calisiyor.
        Juice.vur(document.getElementById('etapHud'), 0.5);
        akis(`${etaplar[ei].ikon} <b>${ei + 1}. ETAP</b> · ${etaplar[ei].ad}`,
             { oncelik: 3, anahtar: 'etap' });
        spikerBekle = 1;
      }
    }

    if (spikerBekle > 0) { spikerBekle -= dt; return; }

    if (sonLider && lider.kid !== sonLider) {
      // Ad DOM'a textContent ile girer (Spiker.satir): ham HTML yok.
      const kalip = [[' ÖNE GEÇTİ'], [' lider!'], [' araları yarıyor'], [' burnu önde']];
      Spiker.satir(['⚡ ', { kim: lider.ad }, kalip[Math.floor(Math.random() * kalip.length)][0]],
                   { oncelik: 2, anahtar: 'lider' });
      spikerBekle = 1.5;
    }
    sonLider = lider.kid;

    if (!sonDuzlukDendi && lider.p > bitis * 0.86) {
      sonDuzlukDendi = true;
      Ses.muzikHizli(1.3);       // son duzlukte tempo yukselsin
      akis('🔥 <b>SON DÜZLÜK!</b>', { oncelik: 3 });
      // Finis agir cekimi: yaris yayinlarindaki an. dt dongu icinde
      // Finis.carpan ile carpiliyor.
      Finis.agirCekim(1.8, 0.35);
      spikerBekle = 1.5;
    }
  }

  // ---- otomatik kalite: makine yetisemiyorsa susu kis ----
  // 0 = tam (iz + golge) · 1 = iz ve golge yok · 2 = ustune kare atlama.
  // Karar gercek kare suresinin kayan ortalamasiyla veriliyor; toparlanirsa
  // kalite geri acilir. Lite modda 1'den baslar.
  let kalite = document.documentElement.classList.contains('tt-lite') ? 1 : 0;
  let karemsOrt = 16, agir = 0, hafif = 0, cizAtla = false;

  function kaliteGuncelle(ms) {
    karemsOrt = karemsOrt * 0.95 + ms * 0.05;
    if (karemsOrt > 30) {
      if (++agir > 60 && kalite < 2) { kalite++; agir = 0; karemsOrt = 20; }
      hafif = 0;
    } else if (karemsOrt < 19) {
      if (++hafif > 300 && kalite > 0) { kalite--; hafif = 0; }
      agir = 0;
    } else { agir = 0; hafif = 0; }
  }

  let sonZaman = 0, izSayac = 0;
  function dongu(t) {
    requestAnimationFrame(dongu);
    if (!sonZaman) sonZaman = t;
    const hamMs = t - sonZaman;
    let dt = hamMs / 1000;
    sonZaman = t;
    kaliteGuncelle(hamMs);
    if (dt > 0.05) dt = 0.05;          // sekme olursa fizigi patlatma
    dt *= Finis.carpan;                // son duzlukte agir cekim

    if (durum === 'yaris') {
      // Alt adimlar sure bazli (>=3; 30 fps'te 6): hizli bilye civiyi delip gecmesin
      const n = Math.max(3, Math.ceil(dt / 0.0062));
      for (let i = 0; i < n; i++) adim(dt / n);
      // Iz noktalari — hiz hissi icin
      izSayac += dt;
      if (kalite === 0 && izSayac > 0.045) {
        izSayac = 0;
        for (const b of bilyeler) {
          if (b.bitti) continue;
          b.iz.push({ x: b.x, y: b.y });
          if (b.iz.length > 5) b.iz.shift();
        }
      }
      spikerKontrol(dt);
    }
    // kalite 2: cizimi kare asiri atla (fizik tam hizda surer)
    cizAtla = !cizAtla;
    if (kalite < 2 || cizAtla) ciz();
  }

  // ---- akis / siralama -----------------------------------------------------
  const akisEl = document.getElementById('akis');
  Spiker.kur(akisEl);
  function akis(html, o) { Spiker.soyle(html, o); }

  const sirEl = document.getElementById('siralama');
  const MADALYA = ['🥇', '🥈', '🥉'];
  const cagriEl = document.getElementById('cagri');
  function cagriYaz(t) { if (cagriEl.textContent !== t) cagriEl.textContent = t; }

  /* ---- DOM kurucular: izleyici adi YALNIZ textContent ile girer ---- */
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function chipEl(kid, boyut) {           // Kimlik.cip: izleyici metni icermeyen kucuk gorsel
    const t = document.createElement('template');
    t.innerHTML = Kimlik.cip(kid, boyut);
    return t.content.firstChild;
  }
  /** Sira listesindeki ad: dikeyde 54px -> 40px -> satira sar (TT.adSigdir), yatayda eski boyut. */
  function adKur(ad) { return el('div', 'ad', ad); }
  function adSigdirAll() {
    if (!DIKEY) return;
    for (const a of sirEl.querySelectorAll('.ad')) TT.adSigdir(a, 54, 40);
    // PANO'ya sigmayan son satirlari birak (ad + sira rakami eksiksiz kalsin)
    const satirlar = sirEl.querySelectorAll('.sira');
    for (let i = satirlar.length - 1; i > 2 && sirEl.scrollHeight > sirEl.clientHeight + 1; i--) satirlar[i].remove();
  }

  // Onceki sira: yukselen/dusen oklari icin (yalniz yatay). Gercek yaris yayinlarinda
  // pozisyon degisimi en cok izlenen sey.
  let oncekiSira = new Map();
  let panoImza = '';

  function satirKur(i, b, sag) {
    const rz = MADALYA[i] || (i + 1);
    const stil = i < 3 ? ['#ffd23f', '#d8dbe6', '#e29a5a'][i] : '#6b5fb8';
    const yuzde = Math.max(0, Math.min(100, Math.round(b.p / bitis * 100)));
    const row = el('div', 'sira' + (i === 0 ? ' lider' : ''));
    row.style.position = 'relative'; row.style.overflow = 'hidden';
    const bar = el('div', 'bar');
    if (!DIKEY) { bar.style.cssText = 'position:absolute;left:0;top:0;bottom:0;pointer-events:none;opacity:.16'; }
    bar.style.width = yuzde + '%'; bar.style.background = b.renk;
    row.append(bar);
    const rozet = el('div', 'rozet', String(rz));
    rozet.style.background = stil; rozet.style.position = 'relative';
    if (i >= 3) rozet.style.color = '#fff';
    row.append(rozet);
    if (!DIKEY) row.append(chipEl(b.kid, 26));
    const ad = adKur(b.ad);
    if (!DIKEY) {
      ad.style.position = 'relative';
      const onc = oncekiSira.get(b.kid);
      if (onc != null && onc !== i) {
        const ok = el('span', null, onc > i ? ' ▲' : ' ▼');
        ok.style.cssText = 'font-size:20px;color:' + (onc > i ? '#7ed957' : '#ff6b6b');
        ad.append(ok);
      }
    }
    row.append(ad);
    if (!DIKEY) { const adet = el('div', 'adet', sag); adet.style.position = 'relative'; row.append(adet); }
    row._bar = bar;
    return row;
  }

  function siralamaCiz() {
    sirEl.dataset.baslik = durum === 'katilim' ? 'KATILANLAR' : 'CANLI SIRALAMA';
    if (durum === 'katilim') {
      const kalan = Math.max(0, Math.ceil(sayacSn));
      const g = [...katilanlar.entries()].slice(DIKEY ? -5 : -18);
      const imza = 'k|' + kalan + '|' + g.map((x) => x[0]).join(',') + '|' + kuyruk.size;
      if (imza === panoImza) return;
      panoImza = imza;
      sirEl.textContent = '';
      const bas = el('div', 'sira bos');
      bas.append('katılım açık · ', el('b', null, kalan + ' sn'));
      sirEl.append(bas);
      if (DIKEY) {
        if (g.length) {
          for (const [kid, ad] of g.reverse()) {       // en yeni en ustte
            const row = el('div', 'sira');
            const nk = el('div', 'nokta'); nk.style.background = Kimlik.al(kid).renk;
            row.append(nk, adKur(ad));
            sirEl.append(row);
          }
        } else sirEl.append(el('div', 'sira bos', 'ilk yazan sen ol — misketin pistte belirsin'));
      } else if (g.length) {
        const fa = el('div'); fa.id = 'fisAlan';
        for (const [kid, ad] of g) {
          const f = el('div', 'fis', ad); f.style.background = Kimlik.al(kid).renk; fa.append(f);
        }
        sirEl.append(fa);
      } else sirEl.append(el('div', 'sira bos', 'ilk yazan sen ol — misketin pistte belirsin'));
      if (kuyruk.size) sirEl.append(el('div', 'sira bos', kuyruk.size + ' kişi sıradaki yarışta'));
      adSigdirAll();
      return;
    }
    const N = DIKEY ? 6 : 5;
    const list = bitirenler.slice(0, N);
    let onde, sagFn;
    if (!list.length) {
      // Yaris suruyor: onde gidenleri goster
      onde = bilyeler.filter((b) => !b.bitti).sort((a, b) => b.p - a.p).slice(0, N);
      sagFn = (b) => Math.round(b.p / bitis * 100) + '%';
    } else { onde = list; sagFn = (b) => b.sira + '.'; }
    if (!onde.length) {
      if (panoImza !== 'bos') { panoImza = 'bos'; sirEl.textContent = ''; sirEl.append(el('div', 'sira bos', 'yarış başlıyor…')); }
      return;
    }
    const imza = 'y|' + (list.length ? 'b' : 'c') + '|' + onde.map((b) => b.kid).join(',') + (DIKEY ? '' : '|' + onde.map((b, i) => sagFn(b)).join(','));
    if (imza === panoImza && DIKEY) {
      // ayni siralama: yalniz ilerleme cubuklarini guncelle (DOM'u yeniden kurma)
      const rows = sirEl.querySelectorAll('.sira');
      onde.forEach((b, i) => { if (rows[i] && rows[i]._bar) rows[i]._bar.style.width = Math.max(0, Math.min(100, Math.round(b.p / bitis * 100))) + '%'; });
      return;
    }
    panoImza = imza;
    sirEl.textContent = '';
    onde.forEach((b, i) => sirEl.append(satirKur(i, b, sagFn(b))));
    if (!list.length) onde.forEach((b, i) => oncekiSira.set(b.kid, i));
    adSigdirAll();
  }

  const kuyrukEl = document.getElementById('kuyruk');
  /* Katilanlarin fisleri ESKIDEN pistin ustune biniyordu: hem pisti
     kapatiyor hem etap gostergesiyle cakisiyordu. Artik sagdaki panelde
     duruyorlar (katilim sirasinda orasi zaten bombostu). Iki sorun birden
     cozuluyor: pist gorunur kaliyor, bos panel ise ise yariyor. */
  function kuyrukCiz() {
    kuyrukEl.classList.add('gizli');
  }

  function sayacCiz() {
    document.getElementById('sayacBuyuk').textContent = katilanlar.size;
  }

  // ---- durum makinesi ------------------------------------------------------
  const kazananEl = document.getElementById('kazanan');

  function yarisBitti(b) {
    Ses.muzikDur(0.35);
    // Zafer sesi burada DEGIL: Finis.kart onu ismin 2 kare ARKASINDAN calar.
    // Sesi goruntuden once tetiklemek es zamanli hissettirmiyor — tersi
    // gerekiyor (finis.js'teki nota bak).
    // Kayitlari isle: katilan herkese +1 yaris, kazanana +1 galibiyet
    for (const kid of katilanlar.keys()) {
      if (Kimlik.botMu(kid)) continue;
      const k = kayitAl(kid);
      k.yaris++;
      const kazandi = !!(b && kid === b.kid);
      if (kazandi) k.galip++;
      kayit.set(kid, k);
      // Omurluk profil: katilan herkes kazanir, kazanan daha cok.
      // Sadece kazanani odullendirmek, kaybeden yarisini bos gecirtiyor.
      Profil.ekle(kid, katilanlar.get(kid), {
        misketYaris: 1, misketGalip: kazandi ? 1 : 0,
        xp: Math.round((kazandi ? 30 : 8) * kademe().carpan),
      });
    }
    kayitYaz();
    Juice.sars(0.45);
    kazananAdi = b.ad;
    durum = 'bitti';
    sayacSn = KUTLAMA_SN;
    Finis.kart(kazananEl, {
      url: Kimlik.al(b.kid).url,
      isim: b.ad,
      alt: Kimlik.botMu(b.kid)
        ? 'sıradaki yarışta senin misketin de olsun'
        : `${bilyeler.length} bilye arasından birinci`,
    });
    cagriYaz(DIKEY ? 'yarış bitti' : b.ad + ' kazandı');   // dikeyde ad KAZANAN kartinda (ustte sigmaz)
    Spiker.satir(['🏆 ', { kim: b.ad }, ' BİRİNCİ'], { oncelik: 3, sure: 4500 });
    // Sohbet botu: kazanani etiketle — ama demo botunu kutlama :)
    if (!Kimlik.botMu(b.kid)) {
      TT.soyle(`🏁 @${uidler.get(b.kid) || b.ad} bilye yarışını kazandı! Tebrikler 🎉`);
    }
  }

  function katilimaDon() {
    sonKademe = '';
    document.getElementById('etapHud')?.classList.remove('acik');
    sonEtap = -1;
    durum = 'katilim';
    sonYazan = null; sonHediye = null; etiketKonum.clear(); panoImza = '';
    yuvaKaristir();
    // Oyun merkezi (oyun.html) icinde calisiyorsak tur bitisini haber ver —
    // merkez oyun gecisini TUR ARASINDA yapar, yaris ortasinda degil.
    try { if (parent !== window) parent.postMessage({ tt: 'tur-bitti' }, '*'); } catch { /* tek basina */ }
    sayacSn = KATILIM_SN;
    Finis.kapat(kazananEl);
    cagriYaz('katılım açık');
    katilanlar = new Map();
    // Bekleyenleri yeni yarisa al
    for (const [kid, ad] of kuyruk) {
      if (katilanlar.size >= MAX) break;
      katilanlar.set(kid, ad);
    }
    kuyruk = new Map();
    bilyeler = []; bitirenler = [];
    sonLider = null; sonDuzlukDendi = false; oncekiSira = new Map();
    pistUret();
    pistPisir();
    kamera = 0;
    sayacCiz(); kuyrukCiz(); siralamaCiz();
    akis('🏁 <b>YENİ YARIŞ</b> — sohbete yaz, katıl');
  }

  let demoTur = false;

  function yarisBasla() {
    // CAZIBE MODU: kimse yoksa bekleme — botlarla demo turu don. Gelen
    // izleyici oyunu IZLEYEREK anlar; yazdigi an siradaki tur gercek olur.
    const gercek = katilanlar.size;
    demoTur = gercek === 0;
    /* Tek gercek oyuncu 4 botun arasina atilinca ~%80 kaybediyordu ve
       bu onun ILK deneyimi oluyordu. Az kisi varsa bot sayisini kis:
       1 kisi -> 2 bot (kazanma ihtimali dusuk kalmasin), 2 kisi -> 1 bot. */
    if (gercek < 5) {
      const hedef = gercek === 0 ? 6 : (gercek === 1 ? 3 : gercek + 1);
      const eksik = Math.max(0, hedef - gercek);
      for (let i = 0; i < eksik; i++) {
        const b = Kimlik.bot(i);
        if (!katilanlar.has(b.kid)) katilanlar.set(b.kid, b.ad);
      }
    }
    durum = 'yaris';
    Ses.cal('start');
    Ses.muzik('bilye');
    bilyeKur();
    panoImza = '';
    kuyrukCiz();
    sayacCiz();
    if (demoTur) {
      cagriYaz(DIKEY ? 'yarış sürüyor · sen de yaz' : 'yarış sürüyor — sıradakine sen de gir');
      akis('👇 <b>BİR ŞEY YAZ</b> — sıradaki yarışta senin misketin de olsun',
           { oncelik: 2, sure: 4200 });
    } else {
      if (DIKEY) cagriYaz('yarış sürüyor');
      akis(`🚦 <b>START</b> — ${katilanlar.size} bilye yarışıyor`);
    }
  }

  let sayacT = performance.now();
  setInterval(() => {
    const simdi = performance.now();
    sayacSn -= Math.min(1, (simdi - sayacT) / 1000);     // saat bazli (setInterval kaymasi sayilmaz)
    sayacT = simdi;
    if (DIKEY && durum === 'katilim') cagriYaz(`katılım açık · ${Math.max(0, Math.ceil(sayacSn))} sn`);
    if (durum === 'katilim' && sayacSn <= 0) yarisBasla();
    else if (durum === 'bitti' && sayacSn <= 0) katilimaDon();
    if (durum !== 'bitti') siralamaCiz();
  }, 250);

  const DURUM_METNI = () => durum === 'katilim' ? '— misketin pistte' : '— sıradaki yarışta senin misketin de var';
  /* ILK TEMAS — oyun hangi durumda olursa olsun yazana karsilik ver.
     Olculen kusur: dongunun buyuk kismi "olu pencere"ydi; o aralikta
     yazan kisi ekranda hicbir sey gormuyordu. */
  TT.on('ilktemas', (e) => {
    const p = Profil.ekle(e.kid, isim(e.user), { mesaj: 1, xp: 2 });
    const oz = Profil.ozet(e.kid);
    Spiker.satir([{ kim: isim(e.user) }, ' ' + DURUM_METNI(), ' · ', oz ? String(oz) : { b: 'İLK KEZ' }],
                 { oncelik: 2, anahtar: 'temas' });
    if (window.Ses) Ses.cal('katil', 150);
  });

  const KADEME_SAYI = () => katilanlar.size;
  /* ---- KADEME: kalabalik odulu buyutur ----
     Tek basina yazan biri "bunun ne anlami var" hissediyordu. Kademe
     sistemi katilimi KOLEKTIF bir sey haline getiriyor: kisi sayisi
     artinca odul carpani goruniyor bicimde buyuyor.
     Onemli ayrinti: duyuru SADECE kademe DEGISINCE yapiliyor. 500 kisi
     katilsa bile ~5 duyuru cikar, her katilimda bir satir degil. */
  const KADEMELER = [
    { esik: 3,   ad: 'MAHALLE',    carpan: 1.0 },
    { esik: 8,   ad: 'ŞEHİR KUPASI', carpan: 1.4 },
    { esik: 18,  ad: 'BÜYÜK PRİ',  carpan: 1.8 },
    { esik: 35,  ad: 'ŞAMPİYONA',  carpan: 2.4 },
    { esik: 1e9, ad: 'EFSANE TUR', carpan: 3.0 },
  ];
  let sonKademe = '';
  function kademe() { return KADEMELER.find((k) => KADEME_SAYI() <= k.esik); }
  function kademeKontrol() {
    const k = kademe();
    if (k.ad === sonKademe) return;
    const ilk = sonKademe === '';
    sonKademe = k.ad;
    if (ilk) return;                       // acilista duyurma
    akis(`⬆️ <b>${k.ad}</b> — ${KADEME_SAYI()} kişi · ödül x${k.carpan}`,
         { oncelik: 3, sure: 3600, anahtar: 'kademe' });
    if (window.Juice) Juice.sars(0.18);
    if (window.Ses) Ses.cal('etap');
  }

  // ---- olaylar -------------------------------------------------------------
  const kimlik = (u) => (u && (u.id || u.uniqueId)) || '';
  const isim = (u) => (u && (u.nickname || u.uniqueId)) || 'anon';

  const uidler = new Map();   // kid -> uniqueId (@etiket icin)

  TT.on('chat', (ev) => {
    const kid = kimlik(ev.user);
    if (!kid) return;
    if (ev.user && ev.user.uniqueId) uidler.set(kid, ev.user.uniqueId);
    if (ANAHTAR && !String(ev.comment || '').toLowerCase().includes(ANAHTAR)) return;
    sonYazan = { kid, ad: isim(ev.user), t: performance.now() / 1000 };   // yalniz AD: yorum metni hicbir yerde tutulmaz

    if (durum === 'katilim') {
      if (katilanlar.has(kid)) return;
      if (katilanlar.size >= MAX) { kuyruk.set(kid, isim(ev.user)); return; }
      katilanlar.set(kid, isim(ev.user));
      Ses.cal('katil', 120);
      kademeKontrol();
      // Tekrar gelene gecmisini soyle: "sen buraya aitsin" sinyali.
      const k = kayitAl(kid);
      if (k.yaris >= 1) {
        Spiker.satir(['🎽 ', { kim: isim(ev.user) }, ` — ${k.yaris + 1}. yarışın`,
                      ...(k.galip ? [' · ', { b: k.galip + ' galibiyet' }] : [])], { anahtar: 'gecmis' });
      }
      sayacCiz(); kuyrukCiz();
    } else if (!katilanlar.has(kid)) {
      kuyruk.set(kid, isim(ev.user));      // yaris suruyor, sonrakine yaz
    }
  });

  /* Hediye: TESEKKUR + ad. Sonucu DEGISTIRMEZ (PLAN-DIKEY: hediye kimin kazanacagini
     degistirmez, sonuc satin almaz): fizige hicbir etkisi yok; gonderenin bilyesine
     yalniz gorsel halka + etiket. Eskiden misketi ileri itiyordu — kaldirildi.
     Hicbir hediye sessizce dusmez: Spiker kuyrugu dolunca dusuk oncelikli soz
     kaybolabildigi icin hediyeler KENDI kuyruguna girer, birer birer gosterilir.
     gift.streaking === true olan seri tikleri sayilmaz. */
  const hediyeKuyruk = [];            // {ad, kademe, sira}
  let hediyeSon = 0, hediyeSira = 0;
  // Kademe (elmas): 0 <10 · 1 <100 · 2 <1000 · 3 >=1000. Buyuk hediye sirada beklemez.
  const hediyeKademe = (g) => { const d = Number(g && (g.diamonds || g.value)) || 0; return d >= 1000 ? 3 : d >= 100 ? 2 : d >= 10 ? 1 : 0; };
  TT.on('gift', (ev) => {
    if (ev.gift && ev.gift.streaking === true) return;
    const kid = kimlik(ev.user);
    const ad = isim(ev.user);
    sonHediye = { kid, ad, t: performance.now() / 1000 };
    hediyeKuyruk.push({ ad, kademe: hediyeKademe(ev.gift), sira: hediyeSira++ });   // sinir YOK: hicbiri dusmez
  });
  /** 100 ms'lik saatte cagrilir. En yuksek kademe once, kademe icinde ilk gelen once.
   *  3'ten fazla bekleyen varsa ayni kademedekiler tek satirda birlesir (en fazla 3 ad),
   *  boylece 40'lik yigin ~14 sn'de tamamen anilir. Satir oncelik 4: baska sozle ezilmez. */
  function hediyeAkit() {
    if (!hediyeKuyruk.length) return;
    const simdi = performance.now();
    const kalabalik = hediyeKuyruk.length > 3;
    if (simdi - hediyeSon < (kalabalik ? 900 : 1600)) return;
    hediyeSon = simdi;
    let en = 0;
    for (const h of hediyeKuyruk) if (h.kademe > en) en = h.kademe;
    const grup = [];
    for (let i = 0; i < hediyeKuyruk.length && grup.length < (kalabalik ? 3 : 1); i++) {
      if (hediyeKuyruk[i].kademe === en) { grup.push(hediyeKuyruk[i]); hediyeKuyruk.splice(i, 1); i--; }
    }
    const parcalar = ['🎁 '];
    grup.forEach((h, i) => { if (i) parcalar.push(', '); parcalar.push({ kim: h.ad }); });
    parcalar.push(grup.length > 1 ? ' — teşekkürler' : ' hediye gönderdi — teşekkürler');
    Spiker.satir(parcalar, { oncelik: 4, sure: kalabalik ? 1000 : 1900 });
  }
  setInterval(hediyeAkit, 100);

  window.__dbg = () => ({ geo: { pegler, duvarlar, etaplar }, durum, R, b: bilyeler.map((b) => [b.ad, Math.round(b.x), Math.round(b.y), Math.round(b.vx), Math.round(b.vy), Math.round(b.p), b.bitti]) });  // DBG-SIL
  // ---- basla ---------------------------------------------------------------
  boyutla();
  pistUret();
  pistPisir();
  sayacCiz(); kuyrukCiz(); siralamaCiz();
  requestAnimationFrame(dongu);

  TT.uyanis({
    baslik: 'MİSKET YARIŞI',
    komutlar: ['bir şey yaz'],
    aciklama: 'Sohbete yazan herkes yarışa girer · 🎁 hediye gönderenin adı ekranda anılır',
    cagri: 'yaz ve misketini pistte gör',
  });
})();
</script>
