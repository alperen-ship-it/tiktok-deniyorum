<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>PK Savaşı — tarafını yaz, kazandır</title>
<link rel="stylesheet" href="_shared/base.css">
<link rel="stylesheet" href="_shared/oyun-tema.css">
<style>
  /* KIMLIK RENGI — PK: mercan — kapisma/gerilim.
     Rotasyonda izleyici bu oyunu BASLIGI OKUMADAN taniyabilsin diye. */
  :root { --oyun-renk: #ff8f73; }
  /* TikTok'un KENDI formati (PK Battle) + tartisma "bait"i.
     Iki taraf bir konuda kapisir; izleyici tarafinin adini yazar ve HER
     MESAJ tarafini ileri iter. Bait'in isi: kimse kararsiz kalmaz —
     "kedi mi kopek mi" gorunce yazmadan duramazsin. Yorum motoru budur. */
  #orta { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }

  /* ---- konu bandi ---- */
  #konuKutu { flex: none; padding: 14px 24px; text-align: center; }
  #konuUst { font-size: 28px; font-weight: 900; letter-spacing: 3px; color: var(--soluk); }
  #konu {
    margin-top: 4px; font-size: var(--tip-vurgu); font-weight: 900;
    color: var(--murekkep); line-height: 1;
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  #konu .vs { font-size: 34px; color: var(--soluk); font-weight: 900; }

  /* ---- halat / metre: oyunun kahramani ---- */
  #metreKutu { flex: none; padding: 16px; }
  #metre {
    position: relative; height: 132px; border-radius: 18px; overflow: hidden;
    border: 2px solid var(--cizgi); background: #191434;
  }
  .yan {
    position: absolute; top: 0; bottom: 0;
    display: flex; align-items: center; gap: 14px; padding: 0 22px;
    transition: width .45s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden; white-space: nowrap;
  }
  #yanA { left: 0; justify-content: flex-start; }
  #yanB { right: 0; justify-content: flex-end; }
  .yan .ikon { font-size: 62px; line-height: 1; }
  .yan .bilgi { display: flex; flex-direction: column; }
  .yan .ad { font-size: 40px; font-weight: 900; color: #191434; line-height: 1; }
  .yan .say { font-size: var(--tip-kucuk); font-weight: 900; color: rgba(25, 20, 52, .72); }
  /* Ortadaki sinir cizgisi */
  #sinir {
    position: absolute; top: -6px; bottom: -6px; width: 6px;
    background: var(--murekkep); border-radius: 3px;
    transform: translateX(-50%);
    transition: left .45s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 0 3px var(--cizgi);
  }

  /* ---- alt: iki takimin en cok katki verenleri ---- */
  #mvpler { flex: 1; min-height: 0; display: flex; gap: 14px; }
  .mvpKutu { flex: 1; min-width: 0; padding: 8px 6px; overflow: hidden; }
  .mvpBaslik {
    font-size: 26px; font-weight: 900; letter-spacing: 1.2px;
    padding: 4px 12px 6px; display: flex; justify-content: space-between;
  }

  /* ---- durum rozetleri ---- */
  #durumSar { display: flex; align-items: center; gap: 10px; }
  #speed {
    display: none; align-items: center; gap: 8px;
    background: var(--mercan); color: #191434;
    border: 2px solid var(--cizgi); border-radius: 14px; padding: 6px 16px;
    font-size: 30px; font-weight: 900; letter-spacing: 1px;
  }
  /* Dikkat cekmek icin scale DEGIL opacity: scale, 30px/900 yaziyi her
     karede yeniden rasterletip OBS'te titretiyor. Opacity glifi bozmuyor. */
  #speed.acik { display: inline-flex; animation: speedNabiz .7s ease-in-out infinite alternate; }
  @keyframes speedNabiz { from { opacity: 1; } to { opacity: .58; } }
  html.tt-lite #speed.acik { animation: none; }

  /* ======================================================================
     DIKEY (varsayilan) — PLAN-DIKEY B/pk. Tuval 1080x1920.
     SAHNE 960x672: ust 300 = iki taraf (470'er) · orta 120 = halat · alt 250 =
     iki MVP sutunu. PANO 460x490: son itenler (taraf renginde).
     UST / KOMUT / SPIKER / KAZANAN kabuktan gelir. Yatay kurallar (yukarida)
     html.tt-yatay icin oldugu gibi; burada yalnizca dikey ezilir.
     Hareket yalniz transform/opacity: halat scaleX + sinir translateX.
     ====================================================================== */
  #kartlar, .uc, #pano { display: none; }
  .yatayMetin { display: inline; }
  html.tt-dikey .yatayMetin { display: none; }
  html.tt-dikey #orta { display: block; position: relative; gap: 0; }
  html.tt-dikey #ust { gap: 12px; }
  html.tt-dikey #ust .rozetBuyuk { padding: 4px 12px; }
  html.tt-dikey #durumSar { gap: 8px; }
  html.tt-dikey #speed { padding: 4px 12px; border-radius: 14px; }

  /* -- iki taraf: SAHNE ust 300px -- */
  html.tt-dikey #konuKutu {
    position: absolute; left: 0; top: 0; width: var(--dk-sahne-w); height: 300px; box-sizing: border-box;
    padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none;
  }
  html.tt-dikey #konuUst {
    position: absolute; left: 0; right: 0; top: 0; height: 40px; line-height: 40px;
    font-size: 30px; letter-spacing: 2px; white-space: nowrap; overflow: hidden;
  }
  html.tt-dikey #konu { display: none; }
  html.tt-dikey #kartlar {
    display: flex; gap: 20px;
    position: absolute; left: 0; top: 44px; width: var(--dk-sahne-w); height: 250px;
  }
  html.tt-dikey .kart {
    flex: 1; min-width: 0; box-sizing: border-box;
    background: var(--panel); border: 4px solid var(--cizgi); border-radius: 22px;
    padding: 10px 16px; display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  html.tt-dikey .kart .k1 { display: flex; align-items: center; gap: 12px; }
  html.tt-dikey .kart .ikon { flex: none; font-size: 84px; line-height: 1; }
  html.tt-dikey .kart .ad { flex: 1; min-width: 0; font-size: 56px; font-weight: 900; line-height: 1; overflow: hidden; white-space: nowrap; }
  html.tt-dikey .kart .ad.sar { white-space: normal; overflow-wrap: anywhere; }
  html.tt-dikey .kart .k2 { display: flex; align-items: baseline; justify-content: center; gap: 14px; line-height: 1; }
  html.tt-dikey .kart .yaz { font-size: 30px; font-weight: 900; color: var(--soluk); letter-spacing: 1px; }
  html.tt-dikey .kart .no { font-size: 72px; font-weight: 900; color: var(--murekkep); }
  html.tt-dikey .kart .say { font-size: 30px; font-weight: 800; color: var(--soluk); text-align: center; white-space: nowrap; }

  /* -- halat: SAHNE orta 120px, tam 960 -- */
  html.tt-dikey #metreKutu {
    position: absolute; left: 0; top: 300px; width: var(--dk-sahne-w); height: 120px; box-sizing: border-box;
    padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none;
  }
  html.tt-dikey #metre { width: var(--dk-sahne-w); height: 120px; border: 0; border-radius: 22px; background: #191434; }
  html.tt-dikey .yan { width: 100% !important; padding: 0; transition: transform .45s cubic-bezier(0.16, 1, 0.3, 1); }
  html.tt-dikey #yanA { left: 0; z-index: 1; transform: scaleX(var(--a, .5)); transform-origin: left center; }
  html.tt-dikey #yanB { right: 0; }
  html.tt-dikey .yan > * { display: none; }
  html.tt-dikey #sinir {
    left: 0; top: 0; bottom: 0; width: 8px; border-radius: 4px;
    transform: translateX(calc(var(--a, .5) * var(--dk-sahne-w) - 4px));
    transition: transform .45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  html.tt-dikey .uc { display: block; position: absolute; top: 50%; margin-top: -40px; font-size: 64px; line-height: 80px; z-index: 2; }
  html.tt-dikey #ucA { left: 24px; }
  html.tt-dikey #ucB { right: 24px; }

  /* -- MVP: SAHNE alt 250px, iki sutun -- */
  html.tt-dikey #mvpler {
    position: absolute; left: 0; top: 422px; width: var(--dk-sahne-w); height: 250px; gap: 20px;
  }
  html.tt-dikey .mvpKutu { display: flex; flex-direction: column; padding: 4px 4px 4px; height: 250px; box-sizing: border-box; }
  html.tt-dikey .mvpBaslik { flex: none; font-size: 30px; letter-spacing: .5px; padding: 0 10px 2px; white-space: nowrap; }
  html.tt-dikey .mvpKutu > div:last-child { flex: 1; min-height: 0; overflow: hidden; }
  html.tt-dikey .mvpKutu .sira { padding: 3px 8px; gap: 10px; }
  html.tt-dikey .mvpKutu .rozet { width: 40px; height: 40px; border-radius: 11px; font-size: 30px; }
  html.tt-dikey .mvpKutu .ad { line-height: 1.02; }
  html.tt-dikey .mvpKutu .sira.bos { font-size: 30px; padding: 10px; }

  /* -- PANO: 460x490, son itenler -- */
  html.tt-dikey #pano {
    display: flex; flex-direction: column;
    position: absolute; z-index: 2;
    left: var(--dk-pano-x); top: var(--dk-pano-y);
    width: var(--dk-pano-w); height: var(--dk-pano-h); box-sizing: border-box;
    padding: 8px 6px; overflow: hidden;
  }
  html.tt-dikey #panoBas { flex: none; font-size: 30px; font-weight: 900; letter-spacing: .5px; color: var(--soluk); padding: 2px 10px 6px; white-space: nowrap; }
  html.tt-dikey #panoIc { flex: 1; min-height: 0; overflow: hidden; }
  html.tt-dikey #panoIc .sira { padding: 4px 8px 4px 10px; gap: 10px; border-left: 10px solid var(--renk, #6b5fb8); border-radius: 6px; }
  html.tt-dikey #panoIc .ik { flex: none; font-size: 36px; line-height: 1; }
  html.tt-dikey #panoIc .ad { line-height: 1.02; }
  html.tt-dikey #panoIc .sira.bos { border-left: 0; font-size: 30px; }
</style>
</head>
<body>
<div id="zemin"></div>

<div id="kok" class="tt-oyun">

  <div id="ust" class="kutu">
    <div id="rozet">⚔️</div>
    <div id="baslikSar">
      <div id="baslik">PK Savaşı</div>
      <div id="cagri">her mesaj takımını iter</div>
    </div>
    <div id="komut"><span class="yazEt">YAZ</span> <span id="komutMetin">—</span></div>
    <div id="durumSar">
      <div id="speed">🔥 SPEED x2</div>
      <div class="rozetBuyuk" id="geriSayim">⏳ <span id="sure">3:00</span></div>
    </div>
    <div id="sayac">
      <div id="sayacBuyuk">0</div>
      <div id="sayacKucuk">savaşçı</div>
    </div>
  </div>

  <div id="orta">
    <div id="konuKutu" class="kutu">
      <div id="konuUst">HANGİSİ?</div>
      <div id="konu">—</div>
      <div id="kartlar"><div class="kart" id="kartA"></div><div class="kart" id="kartB"></div></div>
    </div>

    <div id="metreKutu" class="kutu">
      <div id="metre">
        <div class="yan" id="yanA"></div>
        <div class="yan" id="yanB"></div>
        <div id="sinir"></div>
        <div class="uc" id="ucA"></div><div class="uc" id="ucB"></div>
      </div>
    </div>

    <div id="mvpler">
      <div class="mvpKutu kutu"><div class="mvpBaslik" id="mvpBasA"></div><div id="mvpA"></div></div>
      <div class="mvpKutu kutu"><div class="mvpBaslik" id="mvpBasB"></div><div id="mvpB"></div></div>
    </div>

    <div id="kazanan"></div>
  </div>

  <!-- PANO #orta'nin DISINDA: #kok'a gore mutlak (SAHNE'ye gore degil) -->
  <div id="pano" class="kutu"><div id="panoBas">SON İTENLER</div><div id="panoIc"></div></div>

  <div id="akis"></div>

</div>

<script src="_shared/tt.js"></script>
<script src="_shared/kimlik.js"></script>
<script src="_shared/profil.js"></script>
<script src="_shared/spiker.js"></script>
<script src="_shared/finis.js"></script>
<script src="_shared/juice.js"></script>
<script src="_shared/ulti.js"></script>
<script src="_shared/ses.js"></script>
<script src="_shared/kapismalar.js"></script>
<script>
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) || d : d);

  // TikTok PK'nin kendi olculeri: 3 dakikalik savas, sonda "speed" bolumu
  const TUR_SN     = num('sure', 180);
  const SPEED_SN   = num('speed', 30);    // son N saniye: hediye 2x
  const KUTLAMA_SN = num('kutlama', 10);
  const MESAJ      = num('mesaj', 1);     // bir mesajin itisi
  const LIKE       = num('like', 0.12);   // begeni basina
  const HEDIYE     = num('hediye', 14);   // hediyenin KARSI tarafi geri itisi

  // ---- durum ---------------------------------------------------------------
  let kap = null;                 // {a, b, baslik}
  let puanA = 0, puanB = 0;
  let taraf = new Map();          // kid -> 'a' | 'b'
  let katki = new Map();          // kid -> {ad, yan, puan}
  let kalanSn = TUR_SN;
  let durum = 'savas';            // savas | bitti
  let sonKap = [];

  // Kalici: kisi basi kazanilan savas sayisi
  let tablo = new Map();
  try {
    for (const [k, v] of JSON.parse(localStorage.getItem('tt-pk-tablo') || '[]')) tablo.set(k, v);
  } catch { /* sifirdan */ }

  const konuEl = document.getElementById('konu');
  const konuUstEl = document.getElementById('konuUst');
  const yanAEl = document.getElementById('yanA');
  const yanBEl = document.getElementById('yanB');
  const sinirEl = document.getElementById('sinir');
  const speedEl = document.getElementById('speed');
  const kazananEl = document.getElementById('kazanan');
  const metreEl = document.getElementById('metre');
  const panoIcEl = document.getElementById('panoIc');
  const uidler = new Map();
  const DIKEY = !!TT.dikey;
  let sonItenler = [];            // PANO: son itenler [{kid, ad, yan}], en yeni basta

  Spiker.kur(document.getElementById('akis'));

  /** Kimlik gorseli (yalniz gorsel; ad icermez). */
  function kimCipi(kid, boyut) {
    const k = document.createElement('span');
    k.innerHTML = Kimlik.cip(kid, boyut);
    return k.firstChild;
  }
  function el(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  /** Liste: ad 54 -> 40px, sigmazsa satira sar; alta sigmayan en eski satir
   *  dusurulur ("..." yok). */
  function listeSigdir(kap) {
    kap.querySelectorAll('.ad').forEach((a) => TT.adSigdir(a, 54, 40));
    while (kap.scrollHeight > kap.clientHeight + 1 && kap.children.length > 1) kap.lastElementChild.remove();
  }
  Juice.sarsHedef(document.getElementById('kok'));

  /** Turkce karakterleri sadelestir — "çay" ve "cay" ayni eslessin. */
  function sade(t) {
    return String(t || '').toLocaleLowerCase('tr')
      .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g')
      .replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c');
  }

  // ---- tur ------------------------------------------------------------------
  function yeniTur() {
    Ses.muzik('pk');
    durum = 'savas';
    kalanSn = TUR_SN;
    puanA = 0; puanB = 0;
    taraf = new Map(); katki = new Map();
    sonItenler = [];
    speedEl.classList.remove('acik');
    Finis.kapat(kazananEl);

    let i;
    do { i = Math.floor(Math.random() * KAPISMALAR.length); }
    while (KAPISMALAR.length > 6 && sonKap.includes(i));
    sonKap.push(i);
    if (sonKap.length > 5) sonKap.shift();
    kap = KAPISMALAR[i];

    konuUstEl.textContent = kap.baslik || 'HANGİSİ?';
    konuEl.innerHTML =
      `<span style="color:${kap.a.renk}">${kap.a.emoji} ${kap.a.ad}</span>` +
      `<span class="vs">VS</span>` +
      `<span style="color:${kap.b.renk}">${kap.b.ad} ${kap.b.emoji}</span>`;

    /* MVP basligi: yatayda "emoji AD ... EN ÇOK KATKI"; dikeyde 470px'e sigsin
       diye "emoji EN ÇOK KATKI" (taraf adi ustteki kartta). */
    for (const yan of ['a', 'b']) {
      const bas = document.getElementById(yan === 'a' ? 'mvpBasA' : 'mvpBasB');
      bas.textContent = '';
      const sol = el('span', null, kap[yan].emoji + (DIKEY ? '' : ' ' + kap[yan].ad));
      sol.style.color = kap[yan].renk;
      const sag = el('span', null, 'EN ÇOK KATKI');
      sag.style.color = 'var(--soluk)';
      if (DIKEY) { sol.style.marginRight = '10px'; bas.append(sol, sag); sag.style.color = kap[yan].renk; }
      else bas.append(sol, sag);
    }

    document.getElementById('cagri').textContent = DIKEY
      ? 'her mesaj takımını iter'
      : 'her mesaj takımını iter · 🎁 takım mesajlarını katlar';
    // Komut cipi konuya gore: izleyici tam olarak NE yazacagini gorur
    document.getElementById('komutMetin').textContent = DIKEY ? '1 / 2' : kap.a.ad + ' / ' + kap.b.ad;   // dikeyde kartlar "YAZ 1 / YAZ 2" diyor
    document.getElementById('ucA').textContent = kap.a.emoji;
    document.getElementById('ucB').textContent = kap.b.emoji;
    kartTemizle();
    ciz();
    Spiker.soyle(`⚔️ <b>${kap.a.ad} vs ${kap.b.ad}</b> — tarafını yaz!`, { oncelik: 3, sure: 4200 });
    try { if (parent !== window) parent.postMessage({ tt: 'tur-bitti' }, '*'); } catch { /* tek basina */ }
  }

  // ---- cizim ----------------------------------------------------------------
  /** Dikey: iki taraf karti (emoji, ad 56px, "YAZ 1/2", puan ve kisi). */
  function kartTemizle() {
    if (!DIKEY) return;
    for (const yan of ['a', 'b']) {
      const k = document.getElementById(yan === 'a' ? 'kartA' : 'kartB');
      k.textContent = '';
      k.style.borderColor = kap[yan].renk;
      const k1 = el('div', 'k1');
      const ad = el('div', 'ad', kap[yan].ad); ad.style.color = kap[yan].renk;
      k1.append(el('div', 'ikon', kap[yan].emoji), ad);
      const k2 = el('div', 'k2');
      k2.append(el('span', 'yaz', 'YAZ'), el('span', 'no', yan === 'a' ? '1' : '2'));
      k.append(k1, k2, el('div', 'say'));
      TT.adSigdir(ad, 56, 40);
    }
  }

  /* Yazi tipi yuklenince taraf adlarini yeniden sigdir (olcu degisir). */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { if (DIKEY && kap) document.querySelectorAll('.kart .ad').forEach((a) => TT.adSigdir(a, 56, 40)); });
  }

  function ciz() {
    // Yumusatilmis oran: ham pay (puanA/toplam) kullanilinca 1-0 skorunda
    // bar %100'e firliyor ve tur daha baslamadan bitmis gibi gorunuyordu.
    // K sabiti erken skorlari ortaya cekiyor; fark buyudukce etkisi azaliyor.
    //   1-0   -> %52   (ortada, savas yeni basladi)
    //   100-20 -> %79  (net ustunluk gorunuyor)
    const K = 20;
    const fark = puanA - puanB;
    const oranA = 0.5 + 0.5 * (fark / (puanA + puanB + K));
    // Alt sinir %18: kaybeden tarafin adi ve ikonu okunabilir kalsin
    const yuzdeA = Math.max(18, Math.min(82, oranA * 100));

    yanAEl.style.background = kap.a.renk;
    yanBEl.style.background = kap.b.renk;
    const sayA = [...taraf.values()].filter((v) => v === 'a').length;
    const sayB = [...taraf.values()].filter((v) => v === 'b').length;

    if (DIKEY) {
      // yalniz transform: halat scaleX, sinir translateX (CSS --a)
      metreEl.style.setProperty('--a', String(yuzdeA / 100));
      document.querySelector('#kartA .say').textContent = Math.round(puanA) + ' puan · ' + sayA + ' kişi';
      document.querySelector('#kartB .say').textContent = Math.round(puanB) + ' puan · ' + sayB + ' kişi';
    } else {
      yanAEl.style.width = yuzdeA + '%';
      yanBEl.style.width = (100 - yuzdeA) + '%';
      sinirEl.style.left = yuzdeA + '%';
      yanAEl.innerHTML =
        `<div class="ikon">${kap.a.emoji}</div>
         <div class="bilgi"><div class="ad">${kap.a.ad}</div>
         <div class="say">${Math.round(puanA)} puan · ${sayA} kişi</div></div>`;
      yanBEl.innerHTML =
        `<div class="bilgi" style="align-items:flex-end"><div class="ad">${kap.b.ad}</div>
         <div class="say">${Math.round(puanB)} puan · ${sayB} kişi</div></div>
         <div class="ikon">${kap.b.emoji}</div>`;
    }

    document.getElementById('sayacBuyuk').textContent = taraf.size;
    listeBekle();
  }

  /* Listeler (MVP + son itenler) mesaj basina degil, en cok 8/sn yeniden
     kurulur: sohbet hizliyken DOM kurma + olcum her mesajda calismasin. */
  let listeZaman = 0;
  function listeBekle() {
    if (listeZaman) return;
    listeZaman = setTimeout(() => { listeZaman = 0; mvpCiz(); panoCiz(); }, 120);
  }

  function mvpCiz() {
    for (const yan of ['a', 'b']) {
      const list = [...katki.entries()].filter(([, k]) => k.yan === yan)
        .sort((x, y) => y[1].puan - x[1].puan).slice(0, DIKEY ? 3 : 5);
      const hedef = document.getElementById(yan === 'a' ? 'mvpA' : 'mvpB');
      hedef.textContent = '';
      if (!list.length) { hedef.appendChild(el('div', 'sira bos', 'bu tarafta henüz kimse yok')); continue; }
      list.forEach(([kid, k], i) => {
        const sira = el('div', 'sira' + (i === 0 ? ' lider' : ''));
        const roz = el('div', 'rozet', String(i + 1));
        roz.style.background = i === 0 ? 'var(--altin)' : '#6b5fb8';
        roz.style.color = i === 0 ? '#191434' : '#fff';
        sira.appendChild(roz);
        if (!DIKEY) sira.appendChild(kimCipi(kid, 30));
        sira.appendChild(el('div', 'ad', k.ad));
        if (!DIKEY) sira.appendChild(el('div', 'adet', String(Math.round(k.puan))));
        hedef.appendChild(sira);
      });
      if (DIKEY) listeSigdir(hedef);
    }
  }

  /** PANO (dikey): son itenler, taraf renginde; en yeni uste. */
  function panoCiz() {
    if (!DIKEY) return;
    panoIcEl.textContent = '';
    if (!sonItenler.length) { panoIcEl.appendChild(el('div', 'sira bos', 'henüz kimse itmedi')); return; }
    sonItenler.slice(0, 6).forEach((x, i) => {
      const sira = el('div', 'sira' + (i === 0 ? ' lider' : ''));
      sira.style.setProperty('--renk', kap[x.yan].renk);
      sira.append(el('div', 'ik', kap[x.yan].emoji), el('div', 'ad', x.ad));
      panoIcEl.appendChild(sira);
    });
    listeSigdir(panoIcEl);
  }

  // ---- itis -----------------------------------------------------------------
  function it(kid, ad, yan, miktar, carpanUygula) {
    if (carpanUygula) miktar *= yanCarpan(yan);
    if (durum !== 'savas') return;
    if (yan === 'a') puanA += miktar; else puanB += miktar;
    const k = katki.get(kid) || { ad, yan, puan: 0 };
    k.ad = ad; k.yan = yan; k.puan += miktar;
    katki.set(kid, k);
    const onceki = sonItenler.findIndex((x) => x.kid === kid);
    if (onceki >= 0) sonItenler.splice(onceki, 1);
    sonItenler.unshift({ kid, ad, yan });
    if (sonItenler.length > 8) sonItenler.pop();
  }

  /** Yorumdan taraf cikar. Once kelime listesi, sonra 1/2. */
  function tarafBul(metin) {
    const t = sade(metin);
    for (const kel of kap.a.kelimeler) if (t.includes(sade(kel))) return 'a';
    for (const kel of kap.b.kelimeler) if (t.includes(sade(kel))) return 'b';
    if (/(^|\s)1(\s|$)/.test(t)) return 'a';
    if (/(^|\s)2(\s|$)/.test(t)) return 'b';
    return null;
  }

  // ---- saat -----------------------------------------------------------------
  setInterval(() => {
    if (durum === 'bitti') {
      kalanSn -= 0.25;
      if (kalanSn <= 0) yeniTur();
      return;
    }
    kalanSn -= 0.25;
    const dk = Math.floor(Math.max(0, kalanSn) / 60);
    const sn = Math.floor(Math.max(0, kalanSn) % 60);
    document.getElementById('sure').textContent = dk + ':' + String(sn).padStart(2, '0');

    // TikTok PK'nin "speed" bolumu: son saniyelerde hediye 2 katina cikar
    const speedMi = kalanSn <= SPEED_SN;
    if (speedMi && !speedEl.classList.contains('acik')) {
      speedEl.classList.add('acik');
      if (DIKEY) document.getElementById('cagri').textContent = 'hediye 2 KAT';   // UST'te chip + durum satiri birlikte sigsin
      Ses.muzikHizli(1.25);   // son 30 sn: tempo yukselsin
      Spiker.soyle('🔥 <b>SPEED BÖLÜMÜ!</b> Hediyeler 2 KAT — son şans!', { oncelik: 3, sure: 4000 });
      Juice.sars(0.3);
    }
    if (kalanSn <= 0) bitir();
  }, 250);

  function bitir() {
    Ses.muzikDur(0.35);
    // Zafer sesi burada DEGIL: Finis.kart onu ismin 2 kare ARKASINDAN calar.
    // (Hem galip hem berabere dali Finis.kart'a ulasiyor, ses her iki
    //  durumda da caliyor.) Burada birakilsaydi ses HEM cift calardi HEM de
    //  goruntunun onune gecerdi.

    durum = 'bitti';
    kalanSn = KUTLAMA_SN;
    speedEl.classList.remove('acik');

    const beraber = Math.abs(puanA - puanB) < 0.5;
    const kazYan = beraber ? null : (puanA > puanB ? 'a' : 'b');
    const kaz = kazYan ? kap[kazYan] : null;

    // Kazanan tarafin MVP'si
    const mvp = kazYan
      ? [...katki.entries()].filter(([, k]) => k.yan === kazYan)
          .sort((x, y) => y[1].puan - x[1].puan)[0]
      : null;

    if (kaz) {
      Juice.sars(0.5);
      Finis.kart(kazananEl, {
        kupa: kaz.emoji,
        isim: kaz.ad,
        alt: mvp
          ? `${Math.round(kazYan === 'a' ? puanA : puanB)} puanla kazandı · MVP: ${mvp[1].ad}`
          : `${Math.round(kazYan === 'a' ? puanA : puanB)} puanla kazandı`,
      });
      document.getElementById('cagri').textContent = kaz.ad + ' kazandı!';
      Spiker.satir(['🏆 ', { b: kaz.emoji + ' ' + kaz.ad }, ' KAZANDI!']
        .concat(mvp ? [' MVP: ', { kim: mvp[1].ad }] : []), { oncelik: 3, sure: 4500 });

      // Kalici tablo: kazanan taraftaki herkese galibiyet
      for (const [kid, k] of katki) {
        if (k.yan !== kazYan || Kimlik.botMu(kid)) continue;
        // Kaybeden taraf da katkisinin karsiligini alsin: 3 dakika yazip
      // hicbir sey biriktirmemek, o yarim izleyiciyi bir daha getirmez.
      Profil.ekle(kid, k.ad, {
        pkTur: 1, pkGalip: k.yan === kazYan ? 1 : 0,
        xp: Math.round(k.puan * (k.yan === kazYan ? 1 : 0.4)) + 5,
      });
      const t = tablo.get(kid) || { ad: k.ad, galibiyet: 0, puan: 0 };
        t.ad = k.ad; t.galibiyet += 1; t.puan += Math.round(k.puan);
        tablo.set(kid, t);
      }
      try {
        localStorage.setItem('tt-pk-tablo',
          JSON.stringify([...tablo.entries()].sort((a, b) => b[1].puan - a[1].puan).slice(0, 150)));
      } catch { /* depolama yok */ }

      if (mvp && !Kimlik.botMu(mvp[0])) {
        TT.soyle(`⚔️ ${kaz.emoji} ${kaz.ad} kazandı! MVP: @${uidler.get(mvp[0]) || mvp[1].ad} 🏆`);
      }
    } else {
      Finis.kart(kazananEl, { kupa: '🤝', isim: 'BERABERE', alt: 'kimse geri adım atmadı' });
      Spiker.soyle('🤝 <b>BERABERE!</b>', { oncelik: 3, sure: 4000 });
    }
  }

  const DURUM_METNI = () => 'savaşa katıldı';
  /* ILK TEMAS — oyun hangi durumda olursa olsun yazana karsilik ver.
     Olculen kusur: dongunun buyuk kismi "olu pencere"ydi; o aralikta
     yazan kisi ekranda hicbir sey gormuyordu. */
  TT.on('ilktemas', (e) => {
    const p = Profil.ekle(e.kid, isim(e.user), { mesaj: 1, xp: 2 });
    const oz = Profil.ozet(e.kid);
    Spiker.satir([{ kim: isim(e.user) }, ' ' + DURUM_METNI() + ' · '].concat(oz ? [oz] : [{ b: 'İLK KEZ' }]),
         { oncelik: 2, anahtar: 'temas' });
    if (window.Ses) Ses.cal('katil', 150);
  });

  // ---- olaylar --------------------------------------------------------------
  const kimlik = (u) => (u && (u.id || u.uniqueId)) || '';
  const isim = (u) => (u && (u.nickname || u.uniqueId)) || 'anon';

  TT.on('chat', (ev) => {
    const kid = kimlik(ev.user);
    if (!kid || durum !== 'savas') return;
    if (ev.user && ev.user.uniqueId) uidler.set(kid, ev.user.uniqueId);

    let yan = taraf.get(kid);
    if (!yan) {
      // Henuz taraf secmemis: yorumdan cikar
      yan = tarafBul(ev.comment);
      if (!yan) return;                       // alakasiz yorum sayilmaz
      taraf.set(kid, yan);
      // Botlari temizle: gercek oyuncu geldiginde sahne onlarindir
      for (const [bk] of [...taraf.entries()]) {
        if (Kimlik.botMu(bk)) { taraf.delete(bk); katki.delete(bk); }
      }
      sonItenler = sonItenler.filter((x) => !Kimlik.botMu(x.kid));
    }
    // Taraf secilmisse HER mesaj iter — "yazdikca one gecsin"
    it(kid, isim(ev.user), yan, MESAJ, true);   // takim carpani mesajlara uygulanir
    ciz();
  });

  TT.on('like', (ev) => {
    const kid = kimlik(ev.user);
    const yan = taraf.get(kid);
    if (!yan || durum !== 'savas') return;
    it(kid, isim(ev.user), yan, Math.min(3, (ev.likes || 1) * LIKE));
    ciz();
  });

  // Hediye: KARSI tarafi geri iter (kullanicinin istedigi "birbirini geri
  // cekme"). Speed bolumunde 2 kat — TikTok PK'nin kendi mekanigi.
  /* ---- HEDIYE: KARSIYI EZME, KENDI TARAFINI GUCLENDIR ----
     Eski tasarim hediyeyi karsi tarafin puanini SILMEK icin kullaniyordu.
     Iki sorunu vardi:
       1) Ayni sohbetin diger yarisinin emegini para ile yok ediyordu.
          Yayin urunlerinde bunun bilinen bir sonucu var: kaybeden taraf
          "yazmanin anlami yokmus" deyip cikiyor — ki bizim asil sorunumuz
          zaten insanlarin yazmamasi.
       2) Turun basinda karsi taraf 5 puandayken oransal tavan tabana
          vuruyor, 1000 elmas ile 1 elmas ayni etkiyi yapiyordu.

     Yeni tasarim: hediye, gonderenin TAKIMININ mesajlarini 15 saniye
     boyunca carpiyor. Para artik yok etmiyor, TOPLUYOR — hediye gelince
     o tarafin yazmasi daha degerli hale geliyor, yani hediye insanlari
     yazmaya cagiriyor. Kaybeden tarafin emegi de yerinde duruyor.
     Gonderenin adi ekrani kaplayan bir ULTI olarak cikiyor: parayla
     satin alinan sey aslinda buydu. */
  const carpanlar = { a: null, b: null };
  function yanCarpan(yan) {
    const c = carpanlar[yan];
    return (c && performance.now() < c.bitis) ? c.kat : 1;
  }

  /* Dikeyde ULTI bandinin BUYUK satiri ilk arguman (ad), kucuk satiri k.ad:
     etiket tarafsiz bir tesekkur (at.html'deki "🎁 TEŞEKKÜRLER" ile ayni). */
  const TESEKKUR = (k) => ({ ad: 'TEŞEKKÜRLER', emoji: '🎁', renk: k.renk, guc: k.guc });

  TT.on('gift', (ev) => {
    if (ev.gift && ev.gift.streaking) return;   // seri ara tikleri; son tik gelince tek tesekkur
    const kid = kimlik(ev.user);
    const yan = taraf.get(kid);
    if (!yan || durum !== 'savas') {
      /* Taraf secmemis / tur bitmis: hediye oyunu degistirmez ama gonderenin
         adi yine de ekranda — hicbir hediye sessizce dusmez. */
      ULTI.duyur(isim(ev.user), TESEKKUR(ULTI.kademe((ev.gift && ev.gift.value) || 0)), 1800);
      Spiker.satir(['🎁 Sağ ol ', { kim: isim(ev.user) }, durum === 'savas'
        ? ' — tarafını yaz, hediye takımının mesajlarını 15 sn katlar' : ' — yeni savaşta tarafını yaz'], { oncelik: 2 });
      return;
    }
    const elmas = (ev.gift && ev.gift.value) || 0;
    const speedMi = kalanSn <= SPEED_SN;

    const k = ULTI.kademe(elmas);
    const kat = 1 + k.guc * 0.35 * (speedMi ? 1.5 : 1);   // guc 1..5 -> x1.35..x2.75
    carpanlar[yan] = { bitis: performance.now() + 15000, kat };

    /* Anlik itis de var (hediye hemen gorunur bir sey yapmali) ama KUCUK
       ve ORANSAL. Ilk denememde sabit + elmasla buyuyen bir itis koydum ve
       tek hediye bari %53'ten %82'ye tasidi — eski "karsiyi ez" tasariminin
       ayni hatasi, yonu degismis hali. Asil odul carpan; anlik itis sadece
       "hediye bir sey yapti" hissi icin. Tavan: mevcut toplamin %15'i. */
    const toplam = puanA + puanB;
    const guc = Math.max(MESAJ * 3, Math.min(HEDIYE + elmas * 0.05, toplam * 0.15));
    if (yan === 'a') puanA += guc; else puanB += guc;
    it(kid, isim(ev.user), yan, guc);

    ULTI.duyur(isim(ev.user), DIKEY ? TESEKKUR(k) : k, 1800);
    Spiker.satir([k.emoji + ' ', { kim: isim(ev.user) }, ' ▸ ', { b: kap[yan].ad }, ' 15 sn boyunca ', { b: 'x' + kat.toFixed(2) }]
      .concat(speedMi ? [' ', { b: 'SPEED' }] : []), { oncelik: 3, sure: 4200 });
    // sars() lite modda (yani uretimde) calismiyor; hediye bu urunun
    // para kazandigi an, orada hicbir sey hissettirmemek kotu. vur() olcek
    // darbesi: oransal oldugu icin telefonda da goruluyor.
    // Hedef: yanin IKONU. Bar'in kendisi olmaz — #metre overflow:hidden,
    // olcek darbesi kirpilir. Ikon barin icinde ve 62px, buyudugunde
    // tasmadan goruluyor.
    const ikonEl = DIKEY ? document.querySelector(`#${yan === 'a' ? 'kartA' : 'kartB'} .ikon`)
      : document.querySelector(`#${yan === 'a' ? 'yanA' : 'yanB'} .ikon`);
    Juice.vur(ikonEl, 0.6);
    if (window.Ses) Ses.cal('hediye');
    ciz();
  });

  // ---- demo (cazibe modu) ---------------------------------------------------
  // Bos odada botlar iki tarafa dagilip kapisir; gercek oyuncu yazinca
  // botlar sahneden silinir (chat isleyicisinde).
  setInterval(() => {
    if (durum !== 'savas') return;
    const gercekVar = [...taraf.keys()].some((k) => !Kimlik.botMu(k));
    if (gercekVar) return;
    const b = Kimlik.bot(Math.floor(Math.random() * 8));
    const yan = Math.random() < 0.5 ? 'a' : 'b';
    if (!taraf.has(b.kid)) taraf.set(b.kid, yan);
    it(b.kid, b.ad, taraf.get(b.kid), MESAJ);
    ciz();
  }, 1400);

  // ---- basla ----------------------------------------------------------------
  yeniTur();

  TT.uyanis({
    baslik: 'PK SAVAŞI',
    komutlar: ['1', 'VS', '2'],
    aciklama: 'Tarafını sohbete yaz (1 ya da 2) · her mesaj takımını ileri iter · ❤️ beğeni de sayılır · 🎁 hediye takımının mesajlarını 15 sn katlar',
    cagri: 'tarafını seç, takımını kazandır',
  });
})();
</script>
</body>
</html>
