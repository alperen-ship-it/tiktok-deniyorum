      const r = document.createElement('div'); r.className = 'dgSatir' + (k.bas ? ' bas' : '');
      const no = document.createElement('div'); no.className = 'dgNo'; no.textContent = k.bas ? '👑' : String(k.d.no);
      const ad = document.createElement('div'); ad.className = 'dgAd'; ad.textContent = k.d.ad;
      r.append(no, ad); dgTahtaEl.appendChild(r);
      sigdir(ad, 54, 40);
    }
    for (let i = dgTahtaEl.children.length - 1; i >= 1 && dgTahtaEl.scrollHeight > dgTahtaEl.clientHeight + 1; i--) dgTahtaEl.children[i].style.display = 'none';
  }
  let domGorunumImza = '';

  function listeTik() {
    const t = simdi();
    if (t - listeSonSayfa > listeSure) {          // gorunumler sirayla doner
      listeSonSayfa = t;
      const onceki = listeGorunum;
      listeSayfa++; listeKirli = true; listeSonCizim = 0;
      listeCiz(); listeKirli = false; listeSonCizim = t;
      if (listeGorunum !== onceki) listeEl.animate([{ opacity: .35 }, { opacity: 1 }], { duration: 260, easing: 'ease-out' });
      return;
    }
    if (listeKirli && t - listeSonCizim > 280) { listeKirli = false; listeSonCizim = t; listeCiz(); }
  }

  /**
   * Yeni biri girdi: pano SON GİRENLER'e donsun (adini hemen gorsun). Surekli
   * giris panoyu orada KILITLEMESIN diye 15 sn'de en cok bir kez zorlanir.
   */
  function panoYeniGelen() {
    listeKirli = true;
    const t = simdi();
    if (t - panoZorT < 15000) return;
    if (listeSayfa === 0) {                       // zaten orada: bitmek uzereyse biraz uzat
      if (t - listeSonSayfa > listeSure - 4000) { listeSonSayfa = t - (listeSure - 4000); panoZorT = t; }
      return;
    }
    panoZorT = t;
    listeSayfa = 0; listeSonSayfa = t; listeSonCizim = 0;
  }

  function adlariYenidenSigdir() {
    listeKirli = true; domGorunumImza = '';
    for (const s of satirlar) s.metin = null;
    if (basKid) basCiz();
    if (orta) ortaKartCiz();
  }

  // ==========================================================================
  // HAVA (TUR) — basla, bitir, gecenin yildizi
  // ==========================================================================
  function sureYaz() {
    const s = Math.max(0, Math.ceil(kalanSn));
    const metin = durum === 'oyun' ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : '…';
    const e = el('sure');
    if (e.textContent !== metin) e.textContent = metin;
  }
  function cagriYaz() {
    const metin = durum === 'bitti' ? 'gecenin yıldızı'
      : gercekSayi() === 0 ? '🤖 demo · yaz, halaya gir' : '❤️ beğen de olur';
    const e = el('cagri');
    if (e.textContent !== metin) e.textContent = metin;
  }

  function sarkiBasla(ilk) {
    const t = simdi();
    sarkiNo++;
    if (!ilk) {
      // Gecen havada hic katilmayanlar (ne yazdi, ne begendi, ne hediye verdi)
      // sessizce cikar (yazinca yine girerler); boylece sira "su an burada
      // olanlar" olarak kalir. Hediye veren, yazmasa da, o havanin ardindan cikmaz.
      const korunan = new Set([hediyeBas && hediyeBas.kid]);
      for (const b of basKuyruk) korunan.add(b.kid);
      for (const o of ortaKuyruk) { korunan.add(o.kim); korunan.add(o.hedef); }
      for (const d of [...dans.values()]) {
        const hediyeli = d.hediyeSarki != null && d.hediyeSarki >= sarkiNo - 1;   // biten havada (ya da kartinda) hediye verdi
        if (!d.bot && d.puan <= 0 && !hediyeli && !korunan.has(d.kid) && t - d.katildi > 30000) dansciCikar(d);
      }
      let no = 1;
      for (const kid of sira) dans.get(kid).no = no++;          // numaralar yeniden 1..n
      for (const [k, v] of sonDavet) if (t - v > 120000) sonDavet.delete(k);
      for (const [k, v] of sonKaldirilma) if (t - v > 120000) sonKaldirilma.delete(k);
    }
    for (const d of dans.values()) { d.puan = 0; d.begeniPuan = 0; d.begeni = 0; d.duet = 0; }
    durum = 'oyun';
    kalanSn = SARKI_SN;
    cosku = 0; dorukTut = 0; konfetiAtildi = false; basOdul.clear();
    seviyeAyarla(0, true);
    Finis.kapat(kazananEl);
    Ses.muzik('halay');
    listeKirli = true;
    meydan = null; halkaHizYaz(); S3.saat.tempo(BPM[0]);
    if (!ilk) S3.kaliteSifirla();
    cagriYaz(); sureYaz(); botDuzenle();
    if (!ilk) {
      soyle('🥁 <b>YENİ HAVA</b> · yaz ya da ❤️ beğen, halaya gir', { oncelik: 2, sure: 3600 });
      // Oyun merkezi (oyun.html) gecisi TUR ARASINDA yapar; diger oyunlardaki ayni mesaj.
      try { if (parent !== window) parent.postMessage({ tt: 'tur-bitti' }, '*'); } catch { /* tek basina */ }
    }
  }

  function sarkiBitir() {
    durum = 'bitti';
    kalanSn = KUTLAMA_SN;
    Ses.muzikDur(0.35);
    S3.saat.tempo(50); halkaHizYaz();
    // Zafer sesi burada DEGIL: Finis.kart onu ismin 2 kare arkasindan kendisi calar.
    // Ortadaki gosteri kartla kesilir; SIRADA bekleyenler dusmez — yeni hava
    // baslayinca siradan devam eder (kimsenin istegi sessizce silinmez).
    if (orta) ortaBitir();
    okSiraYaz();
    // Bayatlayan GENEL anonslar atilir ("hava oynaklasti"); ADLI olanlar (hediye
    // sozu) kalir, yeni havanin basinda soylenir — kimsenin adi dusmez.
    for (let i = altyazi.length - 1; i >= 0; i--) if (altyazi[i].tur === 'anons' && !altyazi[i].ad) altyazi.splice(i, 1);

    // GECENIN YILDIZI: en cok KATILAN. Hediye sayilmaz — hediye gorunurluk
    // satin alir (halay basi), unvani katilim kazanir.
    const gercekVar = [...dans.values()].some((d) => !d.bot && d.puan > 0);
    let yildiz = null;
    for (const d of dans.values()) {
      if (d.puan <= 0 || (gercekVar && d.bot)) continue;
      if (!yildiz || d.puan > yildiz.puan) yildiz = d;
    }
    for (const d of dans.values()) {
      if (d.bot || d.puan <= 0) continue;
      Profil.ekle(d.kid, d.ad, {
        xp: Math.min(20, Math.round(d.puan)) + 3 + (d === yildiz ? 25 : 0),
        halayYildiz: d === yildiz ? 1 : 0,
      });
    }
    cagriYaz();
    if (!yildiz) {
      Finis.kart(kazananEl, { kupa: '💃', isim: 'HALAY SÜRÜYOR', alt: 'yaz, sıradaki havada gecenin yıldızı sen ol' });
      return;
    }
    Finis.kart(kazananEl, {
      url: Kimlik.al(yildiz.kid).url,
      isim: yildiz.ad,
      alt: yildiz.bot ? '⭐ gecenin yıldızı (demo) · yaz, sıradaki sen ol'
        : `⭐ gecenin yıldızı · ${Math.round(yildiz.puan)} katılım` + (yildiz.duet ? ` · ${yildiz.duet} düet` : ''),
    });
    // Karttaki gorsel: profil fotografi yuklendiyse o. CSSOM ile atanir —
    // adres hicbir zaman HTML/CSS metnine enterpole edilmez.
    const g = kazananEl.querySelector('.fkGorsel');
    if (g && yildiz.avatarTamam) {
      g.style.backgroundImage = 'url("' + yildiz.avatarUrl.replace(/["\\\n\r]/g, '') + '")';
      g.style.backgroundSize = 'cover';
      g.style.borderRadius = '50%';
    }
    soyle(`⭐ <b>GECENİN YILDIZI</b> ${adYer(yildiz.ad)}`, { oncelik: 3, sure: 4500 });
    // Botlar gercek sohbete hicbir sey yazdirmaz.
    if (!yildiz.bot) TT.soyle(`💃 Gecenin yıldızı: @${yildiz.uid || yildiz.ad}, halayı o döktürdü! 🎉`);
  }

  /** 100 ms'lik tik: 3D ile mantigi esler (giris bitisi, figur yeniden kurma, etiketler, balon kaydi). */
  function senkronTik(t) {
    for (const d of dans.values()) {
      if (d.durum === 'giriyor' && t >= d.girisBitis) d.durum = 'sirada';
      if (d.gorunur && !d.fig && kalite !== 'yok') figurKur(d);
    }
    for (let i = cikanlar.length - 1; i >= 0; i--) if (t - cikanlar[i].cikis > 700) cikanlar.splice(i, 1);
    for (let i = balonlar.length - 1; i >= 0; i--) if (t - balonlar[i].t0 > balonlar[i].omur) balonlar.splice(i, 1);
    if (meydan && t >= meydan.bitis) { meydan = null; halkaHizYaz(); }
    etiketTik(t);
  }

  let sonTik = simdi(), tasanSon = 0;
  setInterval(() => {
    const t = simdi();
    const dt = Math.min(1, (t - sonTik) / 1000);
    sonTik = t;
    kalanSn -= dt;
    if (durum === 'oyun') {
      coskuTik(dt);
      if (kalanSn <= 0) sarkiBitir();
    } else if (kalanSn <= 0) sarkiBasla(false);
    // Kutlama karti sahneyi orterken hediyeyle alinan sure ISLEMEZ: gorunmeyen
    // saniyeler gonderenin hakkindan dusmesin.
    if (durum !== 'oyun' && hediyeBas) hediyeBas.bitis += dt * 1000;
    yuruTik(); basTik(); ortaTik(); altyaziTik(); listeTik(); sureYaz(); senkronTik(t);
    if (tasan.size && t - tasanSon > 3000) {             // sira doluyken bekleyenleri al
      tasanSon = t;
      const [, u] = tasan.entries().next().value;
      if (sira.length < MAX || yerAc()) katil(u);
    }
  }, 100);

  // ==========================================================================
  // OLAYLAR
  // ==========================================================================
  const LIKE_TAVAN = 15;       // bir havada begeniden gelebilecek en cok katilim puani

  /* ILK TEMAS — oyun hangi durumda olursa olsun yazana karsilik ver.
     Halayda karsilik zaten "halaya girdin" (asagida, katilGeriBildirim);
     burada sadece omurluk profile ilk mesaj islenir. */
  TT.on('ilktemas', (e) => {
    if (!Kimlik.botMu(e.kid)) Profil.ekle(e.kid, isim(e.user), { mesaj: 1, xp: 2 });
  });

  /** Yeni giren HERKESE (mesajla da begeniyle de) aninda satir: davulcunun
   *  karsilamasi kuyrukta bekleyebilir, bu satir beklemez. */
  function katilGeriBildirim(d) {
    if (d.bot) return;
    const oz = Profil.ozet(d.kid);
    soyle(`${Kimlik.cip(d.kid, 26)} ${adYer(d.ad)} ` +
      (durum === 'oyun' ? 'halaya giriyor' : 'sıradaki havada halayda') +
      (oz ? ` <span class="ok">·</span> ${oz}` : ' <span class="ok">·</span> <b>İLK KEZ</b>'),
      { oncelik: 2, anahtar: 'gir' + d.kid });
  }

  function olayGiris(user) {
    const kid = kimlik(user);
    const vardi = dans.has(kid);
    const d = katil(user);
    if (!d) {
      if (kid) doluBildir(kid, isim(user));
      return null;
    }
    if (!vardi) katilGeriBildirim(d);
    else if (!d.gorunur) sahneyeAl(d);      // yurume sirasi bekliyordu ama yine hareket etti: hemen sahneye
    d.sonAktif = simdi();
    return d;
  }

  /**
   * HALAY DOLU (60 dansci, kimse 20 sn'dir sessiz degil): gelen sessizce
   * beklemez — davulcu ADIYLA "yer acilinca sira sende" der (karsilama
   * kuyrugunda, dusmez) ve alt seritte satir cikar. Kisi basi 60 sn'de bir.
   * Bekleyen, 3 sn'de bir yoklanan "tasan" listesindedir; yer acilinca girer.
   */
  const doluSoz = new Map();
  function doluBildir(kid, ad) {
    const t = simdi(), son = doluSoz.get(kid);
    if (son != null && t - son < 60000) return;
    doluSoz.set(kid, t);
    if (doluSoz.size > 400) doluSoz.delete(doluSoz.keys().next().value);
    selamEkle({ kid, ad, dolu: true });
    soyle(`💃 ${adYer(ad)}, halay dolu, yer açılınca sıra sende`, { oncelik: 2, anahtar: 'dolu' + kid });
  }

  /**
   * Davet/solo isteginin sonucu — istegi yapana HER DURUMDA gorunur karsilik:
   * kendi danscisinin ustunde kisa bir balon (kacmaz, kuyruga takilmaz) +
   * alt seritte bir satir. Reddedilen istek de karsilik alir; soz yumusak,
   * kimseyi utandirmaz.
   */
  function istekSonuc(kod, a, b) {
    if (!a.gorunur) sahneyeAl(a);                    // balon gorunsun: bekliyorsa hemen sahneye
    // Kacinci sirada: "1." = siradaki gosteri sensin. Orta bossa kuyrugun basi
    // zaten HEMEN cikar (bir sonraki tikte), o yuzden sayilmaz.
    // (Kutlama karti sirasinda kimse hemen cikamaz: herkes sayilir.)
    const bekliyor = durum !== 'oyun';
    const kacinci = () => { const i = ortaKuyruk.findIndex((o) => o.kim === a.kid); return i < 0 ? 0 : (orta || bekliyor ? i + 1 : i); };
    if (kod === 'davet' || kod === 'solo') {
      const k = kacinci();
      if (k === 0) return;                           // hemen sahneye cikiyor: orta karti zaten karsilik
      const nerede = bekliyor ? `yeni havada ${k}. sırada` : `${k}. sırada`;
      balonSistem(a, ['sirada', k]);
      soyle(kod === 'davet'
        ? `💃 ${adYer(a.ad)} <span class="ok">▸</span> dansa kaldırıyor <span class="ok">▸</span> ${adYer(b.ad)} <span class="ok">· ${nerede}</span>`
        : `🕺 ${adYer(a.ad)} ortaya çıkıyor <span class="ok">· ${nerede}</span>`, { oncelik: 2 });
    } else if (kod === 'bekle') {
      const kalan = Math.max(1, Math.ceil((DAVET_ARA_SN * 1000 - (simdi() - sonDavet.get(a.kid))) / 1000));
      balonSistem(a, ['bekle', kalan, 'snSonra']);
      soyle(`⏳ ${adYer(a.ad)}, ${kalan} sn sonra yine ortaya çağırabilirsin`, { oncelik: 2, anahtar: 'bekle' + a.kid });
    } else if (kod === 'hedefbekle') {
      balonSistem(a, ['oncekiOrta']);
      soyle(`💃 ${adYer(b.ad)} az önce ortadaydı · ${adYer(a.ad)}, başka birini kaldır`, { oncelik: 2, anahtar: 'hb' + a.kid });
    } else if (kod === 'dolu') {
      balonSistem(a, ['ortaDolu']);
      soyle(`🎪 ${adYer(a.ad)}, orta şu an dolu, az sonra yine dene`, { oncelik: 2, anahtar: 'dolu' + a.kid });
    } else if (kod === 'zaten') {
      const k = kacinci();
      balonSistem(a, orta && orta.kim === a.kid ? ['ortadasin'] : k ? ['siradasin', k] : ['siraSende']);
    }
  }

  TT.on('chat', (ev) => {
    const d = olayGiris(ev.user);
    if (!d) { coskuEkle(1); return; }                // sira dolu: yine de ortak bara katkisi var
    // KUTLAMA KARTI sirasinda (hava bitti): puan/cosku islemez, sahne kartin
    // altinda. Ama "oyna / @isim / numara" istegi DUSMEZ: siraya girer, yeni
    // havada cikar; karsiligi alt seritte soylenir.
    const oyunda = durum === 'oyun';
    const t = simdi();
    let chant = 0;
    if (oyunda) {
      d.zipla = 0.42;                                // her mesaja gorunur karsilik: danscin ziplar,
      efekt(d, 'mendil', 1);                         // omzundan mendil savrulur
      const sayildi = t - d.sonPuanT > 1200;         // katilim puani ve cosku: 1.2 sn'de bir mesaj
      if (sayildi) { d.puan += 1; d.sonPuanT = t; }
      // TEZAHURAT: "hey / hop / hoppa / oley" coskuyu duz mesajdan cok daha fazla iter
      // (duz mesaj +2; "hey" +5, "hey hey" +8, "hey hey hey" +11) — kisi basi hakla sinirli
      chant = tezahurat(ev.comment);
      if (chant && !tezahuratHakki(d, t)) chant = 0;
      coskuEkle((sayildi ? 2 : 0) + 3 * chant);
    }

    // Davet edilen yazdi: KABUL. Mesaj baska bir komut gibi islenmez.
    if (orta && orta.evre === 'davet' && orta.hedef === d.kid) { ortaKabul(); balonEkle(d, balonMetni(ev.comment)); return; }

    // Kopru bir gun yapisal etiketi (WebcastChatMessage.atUser) iletirse onu kullan.
    const yapisal = ev.mention || ev.atUser;
    const yapisalKid = yapisal ? kimlik(yapisal) : '';
    const k = komutCoz(ev.comment);
    if (yapisalKid && dans.has(yapisalKid)) { const h = dans.get(yapisalKid); istekSonuc(ortaIste(d, h), d, h); return; }
    if (!k) {
      // siradan sohbet: yalniz tezahurat/emoji KENDI danscisinin ustunde balon olur (gerisi balonsuz)
      if (oyunda) balonEkle(d, balonMetni(ev.comment), chant ? { renk: '#f6c94f' } : null);
      return;
    }

    if (k.tur === 'oyna') { istekSonuc(ortaIste(d, null), d, d); return; }
    if (k.tur === 'no') {
      let h = null;
      for (const x of dans.values()) if (x.no === k.no) { h = x; break; }
      if (!h) {
        if (!d.gorunur) sahneyeAl(d);
        let enNo = 0;
        for (const x of dans.values()) if (x.no > enNo) enNo = x.no;
        balonSistem(d, ['birIle', enNo, 'arasiYaz']);
        soyle(`🔢 numara yaz: <b>1-${enNo}</b> arası → dansa kaldır`, { oncelik: 1, anahtar: 'nohint' });
        return;
      }
      istekSonuc(ortaIste(d, h), d, h);
      return;
    }
    // @isim: en son hareketli olan once (ayni adda iki kisi varsa o secilir)
    const adaylar = sira.map((kid) => dans.get(kid)).filter(Boolean)
      .sort((x, y) => y.sonAktif - x.sonAktif).map((x) => ({ kid: x.kid, ad: x.ad, uid: x.uid }));
    const r = adEsle(ev.comment, adaylar);
    if (!r) { balonEkle(d, balonMetni(ev.comment)); return; }      // siradaki birine degil: siradan sohbet
    if (r.kid != null) { const h = dans.get(r.kid); istekSonuc(ortaIste(d, h), d, h); return; }
    const nolar = r.belirsiz.slice(0, 4).map((kid) => dans.get(kid)).filter(Boolean).map((x) => x.no).join(' · ');
    if (!d.gorunur) sahneyeAl(d);
    balonSistem(d, ['numara', ...r.belirsiz.slice(0, 3).map((kid) => dans.get(kid)).filter(Boolean).map((x) => x.no)]);
    soyle(`🔎 bu adda birden fazla kişi var · numarasını yaz: <b>${nolar}</b>`, { oncelik: 1, anahtar: 'belirsiz' });
  });

  TT.on('like', (ev) => {
    const d = olayGiris(ev.user);
    if (!d) { coskuEkle(1); return; }                // sira dolu: yine de ortak bara katkisi var
    if (durum !== 'oyun') return;
    const n = Math.max(1, Number(ev.likes) || 1);
    const ek = Math.min(LIKE_TAVAN - d.begeniPuan, n * 0.1);
    if (ek > 0) { d.begeniPuan += ek; d.puan += ek; }
    d.begeni += n;                                   // COSTURANLAR panosu: bu havadaki begeni
    listeKirli = true;
    d.zipla = 0.42;
    efekt(d, 'kalp', n >= 8 ? 2 : 1);                // begeni: O danscinin basindan kalp yukselir
    coskuEkle(begeniKatki(d, n, simdi()));
    if (orta && orta.evre === 'davet' && orta.hedef === d.kid) ortaKabul();
  });

  // Hediye: gonderen HEMEN halay basi (kademeye gore 15 / 25 / 40 sn), birden
  // fazlaysa sirayla. Katilim puanina yazilmaz.
  TT.on('gift', (ev) => {
    if (ev.gift && ev.gift.streaking) return;          // seri surerken sayma, son olayi bekle
    const kid = kimlik(ev.user);
    if (!kid) return;
    const elmas = Math.max(0, Number(ev.gift && ev.gift.value) || 0);
    const k = ULTI.kademe(elmas);
    const vardi = dans.has(kid);
    let d = katil(ev.user, true);
    if (!d && yerAcZorla()) d = katil(ev.user, true);
    // DESTEKCILER panosu (yayin boyunca): dansci acilamasa bile adi yazilir
    const g = destek.get(kid) || { kid, ad: isim(ev.user), adet: 0, elmas: 0, son: 0 };
    g.ad = d ? d.ad : isim(ev.user); g.adet += 1; g.elmas += elmas; g.son = simdi();
    destek.set(kid, g);
    if (!d) {
      // Sirada HERKES korunuyorsa (bas, bekleyenler, ortadakiler) yer acilamaz:
      // hediye yine de sessiz gecmez — adi iri yazilir, tesekkur edilir.
      listeKirli = true;
      // Danscisi yok: kendi balonu da olamaz. Serit satiri HEMEN, iri anons sirasi gelince.
      if (elmas < 10) tempoCosku();
      anonsEkle({ ust: '🎁 SAĞ OL!', ad: g.ad, alt: 'halay şu an dolu · yer açılınca mendil sende', sure: 2400 });
      soyle(`🎁 ${adYer(g.ad)}, sağ ol! Halay şu an dolu, yer açılınca mendil sende`, { oncelik: 3, sure: 3400 });
      if (window.Ses) Ses.cal('hediye');
      return;
    }
    if (!vardi) katilGeriBildirim(d);
    d.sonAktif = simdi();
    d.hediyeSarki = sarkiNo;                           // hava sonu budamasi hediye vereni cikarmasin
    if (destek.size > 300) {                           // sinirsiz buyumesin: en eskiyi at
      let enEski = null;
      for (const x of destek.values()) if (!enEski || x.son < enEski.son) enEski = x;
      destek.delete(enEski.kid);
    }
    listeKirli = true;
    if (orta && orta.evre === 'davet' && orta.hedef === d.kid) ortaKabul();
    if (elmas < 10) { tempoHediye(d, d.ad); return; }          // kucuk hediye = TEMPO (halay basi sirasi acmaz)
    hediyeAl(d, HEDIYE_SN(k.guc), k.guc);
  });

  // Takip: davulcu ADIYLA karsilar (bir kisiye bir kez); takip eden halaya da girer.
  const takipSelam = new Set();
  TT.on('follow', (ev) => {
    const kid = kimlik(ev.user);
    if (!kid || takipSelam.has(kid)) return;
    if (takipSelam.size < 3000) takipSelam.add(kid);
    const vardi = dans.has(kid);
    const d = olayGiris(ev.user);
    const ad = d ? d.ad : isim(ev.user);
    const bekleyen = altyazi.find((a) => a.tur === 'giris' && a.kid === kid && !a.dolu && !a.ek);
    if (bekleyen) { bekleyen.takip = true; return; }   // girisiyle ayni seritte
    // Zaten halaydaydi (ya da halay dolu): yalnizca tesekkur (kuyruk kalabaliksa sayiyla).
    selamEkle({ kid, ad, takip: true, tekrar: vardi || !d });
  });

  /** Hediye veren icin: 20 sn kuralina bakmadan en sessiz kisinin yerini ac. */
  function yerAcZorla() {
    const korunan = new Set([basKid, hediyeBas && hediyeBas.kid, orta && orta.kim, orta && orta.hedef]);
    for (const b of basKuyruk) korunan.add(b.kid);
    let aday = null;
    for (const d of dans.values()) {
      if (korunan.has(d.kid)) continue;
      if (!aday || d.sonAktif < aday.sonAktif) aday = d;
    }
    if (!aday) return false;
    dansciCikar(aday);
    return true;
  }

  // ==========================================================================
  // DEMO BOTLARI — bos odada kucuk bir halay; gercek izleyici geldikce cekilirler
  // ==========================================================================
  function botDuzenle() {
    const gercek = gercekSayi();
    const hedef = gercek === 0 ? 6 : Math.max(0, 4 - gercek);
    const botlar = [];
    for (const d of dans.values()) if (d.bot) botlar.push(d);
    if (botlar.length < hedef) {
      for (let i = 0; i < Kimlik.BOTLAR.length; i++) {
        const b = Kimlik.bot(i);
        if (!dans.has(b.kid)) { katil({ id: b.kid, nickname: b.ad }); break; }
      }
    } else if (botlar.length > hedef) {
      const mesgul = new Set([orta && orta.kim, orta && orta.hedef, hediyeBas && hediyeBas.kid]);
      for (const o of ortaKuyruk) { mesgul.add(o.kim); mesgul.add(o.hedef); }
      for (let i = botlar.length - 1; i >= 0; i--) {
        if (!mesgul.has(botlar[i].kid)) { dansciCikar(botlar[i]); break; }
      }
    }
  }

  /*
   * DEMO DALGASI: bos odada bar yerinde sayarsa oyunun asil hedefi (birlikte
   * coskuyu doldurmak) hic gorunmez. Botlar ~35 sn'de bir kisa bir begeni
   * dalgasi yapar: baslarindan kalp cikar, bar yukselir; bir dalga OYNAK'a,
   * sonraki DORUGA (COSTU) kadar. Gercek izleyici gelince dalga da durur.
   */
  let botDavet = simdi() + 9000, botDalgaT = simdi() + 12000, botDalga = null, botDalgaNo = 0;
  setInterval(() => {
    botDuzenle();
    cagriYaz();
    if (durum !== 'oyun' || gercekSayi() > 0) { botDalga = null; return; }   // gercek izleyici varken botlar sadece oynar
    const botlar = [];
    for (const d of dans.values()) if (d.bot && d.gorunur && d.durum === 'sirada') botlar.push(d);
    if (!botlar.length) return;
    const sec = () => botlar[Math.floor(Math.random() * botlar.length)];
    const t = simdi();
    if (Math.random() < 0.6) { const b = sec(); b.puan += 1; b.zipla = 0.42; b.sonAktif = t; efekt(b, 'mendil', 1); coskuEkle(1.6); }
    if (!botDalga && t > botDalgaT && kalanSn > 14) {
      botDalgaNo++;
      botDalga = { hedef: botDalgaNo % 2 ? 62 : 100, bitis: t + 13000 };
    }
    if (botDalga) {
      for (const b of botlar) if (Math.random() < 0.55) { b.zipla = 0.42; efekt(b, 'kalp', 1); }
      cosku = Math.min(100, cosku + 17);           // botlar kisi basi tavana tabi degil: dogrudan
      seviyeKontrol();
      if (cosku >= botDalga.hedef || t > botDalga.bitis) { botDalga = null; botDalgaT = t + 30000 + Math.random() * 12000; }
    }
    if (t > botDavet && !orta && !ortaKuyruk.length && botlar.length >= 2) {
      botDavet = t + 16000 + Math.random() * 10000;
      const a = sec();
      let b = sec();
      if (Math.random() < 0.25) ortaIste(a, null);
      else { if (b === a) b = botlar[(botlar.indexOf(a) + 1) % botlar.length]; ortaIste(a, b); }
    }
  }, 1500);

  // ---- komut cipi: nasil GIRILIR / nasil KALDIRILIR sirayla -----------------
  const CIP = ['BİR ŞEY → HALAYA GİR', 'HEY HEY → HALAYI COŞTUR', '@İSİM → DANSA KALDIR', 'NUMARA → DANSA KALDIR'];
  let cipNo = 0;
  setInterval(() => { cipNo = (cipNo + 1) % CIP.length; el('komutMetin').textContent = CIP[cipNo]; }, 6500);

  // ---- basla ----------------------------------------------------------------
  el('esik1').style.left = ESIK_CIK[0] + '%';
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(adlariYenidenSigdir);
  // LEJANT: KOMUT seridi komut metni ile 2x2 ikon cipi arasinda dolasir (yalniz opacity).
  let ljAcik = false;
  (function ljDon() { setTimeout(() => { ljAcik = !ljAcik; lejantEl.classList.toggle('acik', ljAcik); ljDon(); }, ljAcik ? 4000 : 7000); })();
  sarkiBasla(true);
  for (let i = 0; i < 6; i++) botDuzenle();          // bos odada sahne ilk saniyede dolsun
  requestAnimationFrame(dongu);

  // Test ve olcum icin SALT OKUNUR pencere (oyun durumunu degistirmez).
  window.Halay = {
    adEsle, komutCoz, sade, katla, tezahurat, balonMetni, kare, sahne3d: S3,
    kareSifirla() { kare.n = 0; kare.toplam = 0; kare.enCok = 0; },
    ozet() {
      const t = simdi();
      return {
        durum, sarkiNo, kalanSn: +kalanSn.toFixed(1), n: sira.length, gercek: gercekSayi(),
        cosku: +cosku.toFixed(1), seviye, bpm: BPM[seviye], faz: +faz.toFixed(2),
        bas: basKid, basNeden,
        hediyeBas: hediyeBas ? { kid: hediyeBas.kid, kalan: +((hediyeBas.bitis - t) / 1000).toFixed(1), sure: hediyeBas.sure } : null,
        basKuyruk: basKuyruk.map((b) => ({ kid: b.kid, sure: b.sure, guc: b.guc })),
        orta: orta ? { tur: orta.tur, evre: orta.evre, kim: orta.kim, hedef: orta.hedef, kalan: +((orta.bitis - t) / 1000).toFixed(1) } : null,
        ortaKuyruk: ortaKuyruk.map((o) => ({ tur: o.tur, kim: o.kim, hedef: o.hedef })),
        altyazi: altyazi.length, girisBekleyen: girisSay(), girisKisi: girisKisi(), anonsBekleyen: anonsSay(), yuru: yuruKuyruk.length,
        altAktif: altAktif ? altAktif.tur : null, tasan: tasan.size, cikan: cikanlar.length,
        gorunum: listeGorunum, kalite, meydan: !!meydan, kamera: +kamR.toFixed(2), halkaSay: halkaSay.slice(), balon: balonlar.length, efekt: efektler.length,
        balonlar: balonlar.map((b) => ({ kid: b.kid, sistem: b.sistem, metin: b.metin })),
        destek: [...destek.values()].map((x) => ({ kid: x.kid, adet: x.adet, elmas: x.elmas })),
        altin: [...altinlar],
        sira: sira.map((kid) => { const d = dans.get(kid); return { kid, ad: d.ad, no: d.no, puan: +d.puan.toFixed(1), begeni: d.begeni, durum: d.durum, gorunur: d.gorunur, avatar: d.avatarTamam, halka: d.halka, yer: d.yer, fig: d.fig }; }),
      };
    },
  };

  TT.uyanis({
    baslik: 'HALAY',
    komutlar: ['bir şey yaz', 'hey hey', '@isim', '12', 'OYNA'],
    aciklama: 'Yazan ya da ❤️ beğenen herkes halaya girer · “hey” yaz: coşku dolar · @isim ya da numara yaz: birini dansa kaldır · 🎁 hediye seni halay başı yapar',
    cagri: 'yaz, halaya gir',
  });
})();
</script>
