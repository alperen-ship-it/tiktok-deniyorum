<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Halay · yaz, halaya gir · @isim yaz, dansa kaldır</title>
<link rel="stylesheet" href="_shared/base.css">
<link rel="stylesheet" href="_shared/oyun-tema.css">
<style>
  /* KIMLIK RENGI — Halay: orkide pembesi (dugun/kina cagrisimi), #17123a'ya karsi 9.51:1. */
  :root { --oyun-renk: #f5a3e6; }

  /* BU OYUN BIR YARISMA DEGIL, ORTAK BIR SAHNE (PLAN-DIKEY B "halay").
     Yazan ya da begenen herkes halaya girer; kimse elenmez. Sahne gercek 3D:
     uc halka (24/40/86 = 150 figur) ve ortada tahta platform. 3D tuvali
     (_shared/sahne3d.js) 1080x1920'in tamamini arkadan kaplar; asagidaki DOM
     ogeleri onun USTUNDE, TT.KUTU kutularinda durur. Yalniz DIKEY.
     DOM animasyonu yalniz transform/opacity (lite: filter/golge/blur yok). */

  /* ---- 3D'nin ustundeki kucuk efekt tuvali (kalp): SAHNE kutusu ---- */
  #efektTuval {
    position: absolute; left: var(--dk-sahne-x); top: var(--dk-sahne-y);
    width: var(--dk-sahne-w); height: var(--dk-sahne-h);
    z-index: 1; pointer-events: none;
  }

  /* ---- COSKU SERIDI: tam genislik, SAHNE'nin alt 76px'i (y 1084-1160) ---- */
  #coskuSerit {
    position: absolute; left: 0; width: 1080px; box-sizing: border-box;
    top: calc(var(--dk-sahne-y) + var(--dk-sahne-h) - 76px); height: 76px; z-index: 2;
    display: flex; align-items: center; gap: 18px; padding: 0 60px;
    background: rgba(23, 18, 58, .9);
    border-top: 4px solid var(--cizgi); border-bottom: 4px solid var(--cizgi);
  }
  #coskuSol { flex: none; display: flex; align-items: baseline; gap: 12px; }
  #coskuEtiket { font-size: var(--tip-kucuk); font-weight: 900; letter-spacing: 1.2px; color: var(--soluk); }
  #coskuSayi {
    font-size: 64px; font-weight: 900; line-height: 1; color: var(--oyun-renk);
    font-variant-numeric: tabular-nums; min-width: 150px;
  }
  #coskuYol {
    flex: 1; min-width: 0; position: relative; height: 30px; border-radius: 15px;
    background: #2e2666; overflow: hidden; border: 3px solid var(--cizgi);
  }
  #coskuDolu {
    position: absolute; inset: 0; background: var(--oyun-renk); border-radius: 12px;
    transform-origin: left center; transform: scaleX(0); transition: transform .3s linear;
  }
  #coskuSerit[data-seviye="0"] #coskuDolu { background: var(--soluk); }
  #coskuSerit[data-seviye="2"] #coskuDolu { background: var(--altin); }
  #coskuSerit[data-seviye="0"] #coskuSayi { color: var(--soluk); }
  #coskuSerit[data-seviye="2"] #coskuSayi, #coskuSerit[data-seviye="2"] #coskuSeviye { color: var(--altin); }
  .coskuEsik { position: absolute; top: 0; bottom: 0; width: 5px; margin-left: -2px; background: #17123a; }
  #coskuSeviye {
    flex: none; min-width: 150px; text-align: right;
    font-size: 34px; font-weight: 900; letter-spacing: .5px; color: var(--murekkep); line-height: 1;
  }

  /* ---- LEJANT: KOMUT seridinin ALTERNATIF hali (2x2 ikon cipi, bir kelime) ---- */
  #lejant {
    position: absolute; z-index: 5; pointer-events: none; box-sizing: border-box;
    left: var(--dk-komut-x); top: var(--dk-komut-y); width: var(--dk-komut-w); height: var(--dk-komut-h);
    display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 34px; align-content: center;
    column-gap: 16px; padding: 0 24px;
    background: var(--panel); border: 4px solid var(--cizgi); border-radius: 22px;
    opacity: 0; transition: opacity .25s ease;
  }
  #lejant.acik { opacity: 1; }
  .lj { display: flex; align-items: center; gap: 10px; min-width: 0; white-space: nowrap; }
  .ljIkon { flex: none; font-size: 30px; line-height: 1; }
  .ljNe { font-size: var(--tip-kucuk); font-weight: 900; color: var(--murekkep); line-height: 1; letter-spacing: .3px; }

  /* ---- ORTA KARTI: platformdaki duet/solo isimleri, SAHNE'nin alt kenari (alt y=1070) ---- */
  #ortaKart {
    display: none; position: absolute; left: var(--dk-sahne-x); width: var(--dk-sahne-w); bottom: calc(1920px - 1070px);
    box-sizing: border-box; z-index: 3; padding: 6px 24px 8px;
    background: rgba(23, 18, 58, .93); border: 4px solid var(--oyun-renk); border-radius: 24px;
  }
  #ortaKart.dolu { display: block; }
  #okUst { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  #okBaslik {
    flex: none; font-size: var(--tip-kucuk); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
    color: var(--oyun-renk); line-height: 1.2; white-space: nowrap;
  }
  #okAlt { flex: 1; min-width: 0; text-align: right; font-size: var(--tip-kucuk); font-weight: 800; color: var(--murekkep); line-height: 1.2; }
  #okAlt b { color: var(--oyun-renk); font-weight: 900; font-variant-numeric: tabular-nums; }
  #okAdlar { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .okAd {
    flex: 1 1 0; min-width: 0; text-align: center;
    font-size: 72px; font-weight: 900; line-height: 1.04; letter-spacing: -1px;
    color: var(--altin); white-space: nowrap;
  }
  /* Sigmayan ad KESILMEZ: 40px tabanda alt satira sarar. */
  .okAd.sar, #basAd.sar, .gAd.sar, .aAd.sar, .kisi .ad.sar, #liderAd.sar, .dgAd.sar { white-space: normal; overflow-wrap: anywhere; word-break: break-word; }
  #okBag { flex: none; font-size: 40px; font-weight: 900; color: var(--soluk); line-height: 1; }

  /* ---- KARSILAMA seridi + ANONS: SAHNE'nin ust kenari (gecici, kuyruklu) ---- */
  #giris, #anons {
    position: absolute; top: calc(var(--dk-sahne-y) + 8px); z-index: 4; pointer-events: none;
    opacity: 0; transition: opacity .2s ease;
  }
  #giris { left: var(--dk-sahne-x); max-width: var(--dk-sahne-w); }
  #anons { left: var(--dk-sahne-x); width: var(--dk-sahne-w); text-align: center; }
  #girisIc, #anonsIc { background: #120d30; border: 4px solid var(--cizgi); border-radius: 18px; padding: 6px 18px 8px; box-sizing: border-box; }
  #girisIc {
    display: flex; align-items: baseline; flex-wrap: nowrap; column-gap: 14px;
    background: #f4f1ff; border: 3px solid #17123a; border-radius: 16px; padding: 2px 16px 4px;
  }
  #girisIc.sar { flex-wrap: wrap; }
  .gUst { flex: none; font-size: var(--tip-kucuk); font-weight: 900; letter-spacing: 1px; color: #7a2f6c; text-transform: uppercase; white-space: nowrap; }
  .gAd { flex: 0 1 auto; min-width: 0; font-size: 54px; font-weight: 900; line-height: 1.05; letter-spacing: -.5px; color: #17123a; white-space: nowrap; }
  .gAyrac { flex: none; font-size: 40px; font-weight: 900; line-height: 1; color: #7a2f6c; }
  .gDaha { flex: none; font-size: 40px; font-weight: 900; line-height: 1.05; color: #7a2f6c; white-space: nowrap; }
  #anonsIc { display: inline-block; text-align: center; max-width: 940px; padding: 8px 26px 10px; border-color: var(--oyun-renk); }
  .aUst { font-size: 54px; font-weight: 900; line-height: 1.05; letter-spacing: -.5px; color: var(--oyun-renk); white-space: nowrap; }
  .aAd { font-size: 64px; font-weight: 900; line-height: 1.05; color: var(--altin); white-space: nowrap; }
  .aAlt { font-size: var(--tip-kucuk); font-weight: 800; color: var(--soluk); }

  /* ---- PANO (460x490, y 1250-1740): halay basi plakasi + donen liste + sayac ---- */
  #pano {
    position: absolute; z-index: 3; display: flex; flex-direction: column; gap: 8px;
    left: var(--dk-pano-x); top: var(--dk-pano-y); width: var(--dk-pano-w); height: var(--dk-pano-h);
  }
  #basKutu { flex: none; padding: 8px 12px 8px; min-width: 0; }
  #basUst { display: flex; align-items: center; gap: 12px; }
  #basKafaSar { flex: none; position: relative; width: 64px; height: 64px; }
  #basKafa {
    width: 64px; height: 64px; border-radius: 50%; object-fit: cover; display: block;
    background: #3a3170; border: 4px solid var(--altin);
  }
  #basTac { position: absolute; left: -12px; top: -18px; font-size: 36px; line-height: 1; transform: rotate(-18deg); }
  #basBilgi { flex: 1; min-width: 0; }
  #basEtiket { font-size: var(--tip-kucuk); font-weight: 900; letter-spacing: 1px; color: var(--soluk); line-height: 1.1; white-space: nowrap; }
  #basAlt { font-size: var(--tip-kucuk); font-weight: 800; color: var(--murekkep); line-height: 1.1; white-space: nowrap; }
  #basSayiSar { flex: none; text-align: right; }
  #basSayi { font-size: 48px; font-weight: 900; line-height: .95; color: var(--altin); font-variant-numeric: tabular-nums; }
  #basSayiEt { font-size: var(--tip-kucuk); font-weight: 800; color: var(--soluk); line-height: 1.1; }
  #basAd {
    font-size: 54px; font-weight: 900; line-height: 1.04; letter-spacing: -.5px; margin-top: 2px;
    color: var(--altin); white-space: nowrap; min-height: 1.04em;
  }
  #liderSatir {
    display: none; align-items: center; gap: 8px; margin-top: 4px; padding-top: 4px;
    border-top: 3px solid var(--cizgi);
  }
  #liderSatir.acik { display: flex; }
  #liderTac { flex: none; font-size: 32px; line-height: 1; }
  #liderKafa { flex: none; width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #3a3170; }
  #liderAd { flex: 1; min-width: 0; font-size: var(--tip-isim); font-weight: 900; line-height: 1.05; white-space: nowrap; letter-spacing: -.3px; }
  #liderSayi { flex: none; font-size: 34px; font-weight: 900; color: var(--altin); font-variant-numeric: tabular-nums; }

  #listeKutu { flex: 1; min-height: 0; padding: 4px 6px; overflow: hidden; display: flex; flex-direction: column; }
  #listeBaslik {
    flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; column-gap: 8px;
    font-size: var(--tip-kucuk); font-weight: 900; letter-spacing: .6px; color: var(--soluk);
    padding: 2px 8px 4px; line-height: 1.15;
  }
  #liste { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  .kisi {
    display: flex; align-items: center; gap: 8px; padding: 0 6px; min-height: 61px;
    border-bottom: 1px solid rgba(179, 168, 230, .13);
  }
  .kisi.bas { background: rgba(246, 201, 79, .1); border-radius: 12px; border-bottom-color: transparent; }
  .kisi .no {
    flex: none; min-width: 56px; height: 46px; padding: 0 6px; border-radius: 12px; box-sizing: border-box;
    display: grid; place-items: center;
    font-size: var(--tip-kucuk); font-weight: 900; color: #17123a; background: var(--oyun-renk);
    border: 3px solid var(--cizgi); font-variant-numeric: tabular-nums;
  }
  .kisi .kafa { flex: none; width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #3a3170; }
  .kisi .ad { flex: 1; min-width: 0; font-size: var(--tip-isim); font-weight: 900; line-height: 1.05; white-space: nowrap; letter-spacing: -.3px; }
  .kisi .iz { flex: none; font-size: var(--tip-kucuk); line-height: 1; }
  .kisi .deger { flex: none; font-size: var(--tip-kucuk); font-weight: 800; color: var(--soluk); font-variant-numeric: tabular-nums; }
  .kisi .deger:empty, .kisi .iz:empty { display: none; }
  #listeBos {
    display: none; position: absolute; left: 0; right: 0; top: 14px; padding: 0 12px;
    text-align: center; font-size: var(--tip-kucuk); font-weight: 800; color: var(--soluk); line-height: 1.25;
  }
  #halkaSay { flex: none; height: 34px; line-height: 34px; text-align: right; padding-right: 8px; font-size: var(--tip-kucuk); font-weight: 800; color: var(--soluk); }

  /* ---- DOM-ONLY GORUNUM (3D 'yok' / ?3d=0): SAHNE'de buyuk cosku + isim tahtasi ---- */
  #domGorunum {
    display: none; position: absolute; box-sizing: border-box; z-index: 2;
    left: var(--dk-sahne-x); top: 580px; width: var(--dk-sahne-w); height: 345px;
    padding: 4px 24px 6px; background: rgba(59, 42, 124, .5); border-radius: 28px; overflow: hidden;
  }
  #kok.sahne3d-yok #domGorunum { display: block; }
  #dgUst { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  #dgSayi { font-size: 112px; font-weight: 900; line-height: 1; color: var(--oyun-renk); font-variant-numeric: tabular-nums; }
  #dgSag { text-align: right; }
  #dgSeviye { font-size: 64px; font-weight: 900; line-height: 1; color: var(--murekkep); }
  #dgEtiket { font-size: var(--tip-kucuk); font-weight: 800; color: var(--soluk); }
  #dgYol { position: relative; height: 34px; margin: 2px 0 6px; border-radius: 20px; background: #2e2666; overflow: hidden; border: 4px solid var(--cizgi); }
  #dgDolu { position: absolute; inset: 0; background: var(--oyun-renk); transform-origin: left center; transform: scaleX(0); transition: transform .3s linear; }
  #domGorunum[data-seviye="2"] #dgSayi { color: var(--altin); }
  #domGorunum[data-seviye="2"] #dgDolu { background: var(--altin); }
  #domGorunum[data-seviye="0"] #dgDolu, #domGorunum[data-seviye="0"] #dgSayi { background: none; }
  #domGorunum[data-seviye="0"] #dgDolu { background: var(--soluk); }
  #domGorunum[data-seviye="0"] #dgSayi { color: var(--soluk); }
  #dgTahta { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; height: 190px; overflow: hidden; align-content: start; }
  .dgSatir { display: flex; align-items: center; gap: 10px; min-height: 61px; min-width: 0; }
  .dgSatir.bas { grid-column: 1 / -1; }
  .dgNo { flex: none; min-width: 56px; height: 46px; border-radius: 12px; box-sizing: border-box; display: grid; place-items: center; font-size: var(--tip-kucuk); font-weight: 900; color: #17123a; background: var(--oyun-renk); border: 3px solid var(--cizgi); }
  .dgAd { flex: 1; min-width: 0; font-size: var(--tip-isim); font-weight: 900; line-height: 1.05; white-space: nowrap; color: var(--murekkep); }
  .dgSatir.bas .dgAd { color: var(--altin); }

  #katilCagri .kcsAlt { font-size: var(--tip-kucuk); }
  #kazanan .kimAd.sar { white-space: normal; overflow-wrap: anywhere; text-overflow: clip; line-height: 1; }
  /* Tur sonu karti TAM opak: arkadaki 3D etiketleri, cosku seridi ve spiker satiri gorunmesin. */
  #kazanan { z-index: 6; background: #120d30; }
</style>

<script type="module">
import { Sahne3D, THREE } from './_shared/sahne3d.js';
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) || d : d);
  const sik = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---- ayarlar (URL'den, diger oyunlardaki gibi) ---------------------------
  const SARKI_SN   = num('sure', 100);              // bir oyun havasi = bir tur
  const KUTLAMA_SN = num('kutlama', 10);            // gecenin yildizi karti
  const MAX        = sik(Math.round(num('max', 150)), 6, 150); // sirada en cok kac dansci (3 halka: 24/40/86)
  const KABUL_SN   = num('kabul', 15);              // davet edilenin cevap suresi
  const DUET_SN    = num('duet', 10);
  const SOLO_SN    = num('solo', 6);                // "oyna" solosu
  const KISA_SOLO_SN = 4;                           // cevapsiz davette davet edenin solosu
  const DAVET_ARA_SN = num('davetara', 30);         // kisi basi: 30 sn'de bir davet/solo
  const HEDEF_ARA_SN = num('hedefara', 45);         // ayni kisi 45 sn'de bir kez kaldirilir
  const ORTA_TAVAN = 5;                             // sahnedeki + bekleyen toplam
  const AVATAR     = q.get('avatar') !== '0';
  const BPM        = [96, 113, 131];                // AGIR / OYNAK / COSTU (ses.js 'halay' tabani 96)
  const HEDIYE_SN  = (guc) => (guc >= 4 ? 40 : guc === 3 ? 25 : 15);   // ULTI.kademe(elmas).guc -> sure

  // ==========================================================================
  // SAF FONKSIYONLAR — isim eslestirme ve komut cozme. DOM'a, zamana, duruma
  // dokunmazlar; tablo testiyle sinaniyorlar (window.Halay uzerinden).
  // ==========================================================================
  /*
   * @isim sohbet metninde DUZ YAZI olarak geliyor ("@Ayşe 🌹 gel"); TikTok
   * uygulamasi @ ile sectirdiginde GORUNEN ADI (nickname) yaziyor, elle
   * yazan ise kullanici adini da yazabiliyor. Ad ile mesajin devami arasinda
   * ayrac yok. O yuzden: (1) hem gorunen ada hem kullanici adina bakilir,
   * (2) metin harf/rakam oltasina bolunur ve EN UZUN on ek once denenir
   * ("Ali Veli gel" -> once "aliveligel", sonra "aliveli", sonra "ali"),
   * (3) kismi eslesme en az 3 karakter ister ve tek adaya iniyorsa gecerlidir.
   */

  /** Turkce duyarli katlama: İ/I/ı/i tek harf, aksanlar duser, bosluklar kalir. */
  function katla(s) {
    return String(s == null ? '' : s)
      .normalize('NFKC')                  // 𝓐𝔂𝓼𝓮 / ＡＹＳＥ -> Ayse
      .replace(/[İIı]/g, 'i')             // tr yereline guvenmeden: dort i de ayni
      .toLowerCase()

  function sade(s) { return katla(s).replace(/[^\p{L}\p{N}]+/gu, ''); }
  /** Katlanmis harf/rakam oltalari: "Ayşe_Gül 🌹" -> ["ayse","gul"]. */
  function parcalar(s) { return katla(s).match(/[\p{L}\p{N}]+/gu) || []; }

  /**
   * Mesajdaki "@isim"i adaylardan birine esle.
   * @param {string} metin    yorumun tamami (ham)
   * @param {Array<{kid:string, ad:string, uid:string}>} adaylar  siradaki danscilar
   * @returns {{kid:string, tur:string, uzunluk:number}|{belirsiz:string[], tur:string, uzunluk:number}|null}
   */
  function adEsle(metin, adaylar) {
    const ham = String(metin == null ? '' : metin).normalize('NFKC');
    let i = ham.indexOf('@');
    if (i < 0 || !adaylar || !adaylar.length) return null;
    const tablo = adaylar.map((c) => {
      const adP = parcalar(c.ad), uidP = parcalar(c.uid);
      return { kid: c.kid, ad: adP.join(''), uid: uidP.join(''), adP, uidP };
    });
    let belirsiz = null;
    while (i >= 0) {
      const son = ham.indexOf('@', i + 1);
      const r = kuyrukEsle(ham.slice(i + 1, son < 0 ? i + 81 : Math.min(son, i + 81)), tablo);
      if (r && r.kid != null) return r;
      if (r && !belirsiz) belirsiz = r;
      i = son;
    }
    return belirsiz;
  }

  function kuyrukEsle(kuyruk, tablo) {
    const olta = parcalar(kuyruk).slice(0, 8);
    if (!olta.length) return null;
    // Yazilan anahtarlar: en uzun on ek ONCE -> "en uzun eslesme kazanir"
    const yazilan = [];
    for (let k = olta.length; k >= 1; k--) yazilan.push(olta.slice(0, k).join(''));

    // 1) TAM: gorunen adin ya da kullanici adinin tamami (en az 2 karakter).
    //    Ayni anahtara birden fazla kisi uyuyorsa (gorunen adlar benzersiz
    //    DEGIL: iki "Ayşe" olabilir) tahmin yurutulmez:
    //      - kelime kelime ayni yazilan TEK kisi varsa o ("ayşegül" -> "Ayşegül",
    //        "ayşe gül" -> "Ayşe Gül")
    //      - yoksa BELIRSIZ: oyun numarayi sorar
    for (let k = olta.length; k >= 1; k--) {
      const a = yazilan[olta.length - k];
      if (a.length < 2) continue;
      const bul = tablo.filter((x) => x.ad === a || x.uid === a);
      if (!bul.length) continue;
      if (bul.length === 1) return { kid: bul[0].kid, tur: 'tam', uzunluk: a.length };
      const yazim = olta.slice(0, k).join(' ');
      const ayni = bul.filter((x) => x.adP.join(' ') === yazim || x.uidP.join(' ') === yazim);
      if (ayni.length === 1) return { kid: ayni[0].kid, tur: 'tam', uzunluk: a.length };
      return { belirsiz: (ayni.length ? ayni : bul).map((x) => x.kid), tur: 'tam', uzunluk: a.length };
    }
    // 2) KISMI: en az 3 karakter; puani en yuksek TEK aday
    //    4 = adin bastaki kelimeleri ("ayşe" -> "Ayşe Gül")
    //    3 = icteki bir kelimenin tamami ("gül" -> "Ayşe Gül")
    //    2 = adin/kullanici adinin basi ("ayş" -> "Ayşe Gül", "meh" -> "mehmet61")
    //    1 = icteki bir kelimenin basi ("yld" -> "burak_yldz")
    const TUR = { 4: 'onad', 3: 'kelime', 2: 'bas', 1: 'kelimebas' };
    for (const a of yazilan) {
      if (a.length < 3) continue;
      let enIyi = 0, bulunan = [];
      for (const x of tablo) {
        let p = 0;
        if (onKelime(x.adP, a) || onKelime(x.uidP, a)) p = 4;
        else if (x.adP.includes(a) || x.uidP.includes(a)) p = 3;
        else if (x.ad.startsWith(a) || x.uid.startsWith(a)) p = 2;
        else if (x.adP.some((k) => k.startsWith(a)) || x.uidP.some((k) => k.startsWith(a))) p = 1;
        if (!p) continue;
        if (p > enIyi) { enIyi = p; bulunan = [x]; } else if (p === enIyi) bulunan.push(x);
      }
      if (bulunan.length === 1) return { kid: bulunan[0].kid, tur: TUR[enIyi], uzunluk: a.length };
      if (bulunan.length > 1) return { belirsiz: bulunan.map((x) => x.kid), tur: TUR[enIyi], uzunluk: a.length };
    }
    return null;
  }

  function onKelime(kel, a) {
    let s = '';
    for (let k = 0; k < kel.length - 1; k++) { s += kel[k]; if (s === a) return true; if (s.length >= a.length) break; }
    return false;
  }

  /**
   * Yorumu komuta cevir.
   *   "oyna"            -> {tur:'oyna'}
   *   "12" / "#12"      -> {tur:'no', no:12}
   *   "kaldır 12", "12'yi kaldır", "dansa kaldır 7" -> {tur:'no', no:..}
   *   icinde @ gecen    -> {tur:'ad'}   (hedefi adEsle bulur)
   */
  function komutCoz(metin) {
    const t = katla(metin).trim();
    if (!t) return null;
    if (t.indexOf('@') >= 0) return { tur: 'ad' };
    let m = t.match(/^#?\s*(\d{1,3})\s*[.!]*$/);
    if (m) return { tur: 'no', no: Number(m[1]) };
    m = t.match(/(?:^|[^\p{L}\p{N}])kaldir(?!ma)\p{L}*\s*:?\s*#?\s*(\d{1,3})(?!\d)/u) ||
        t.match(/(?:^|[^\p{L}\p{N}])#?(\d{1,3})\s*['’]?\p{L}{0,4}\s+(?:dansa\s+)?kaldir/u);
    if (m) return { tur: 'no', no: Number(m[1]) };
    if (sade(t) === 'oyna') return { tur: 'oyna' };
    return null;
  }

   * TEZAHURAT: "hey", "hop", "hoppa", "oley" (uzatmalar dahil: "heyyy", "hopp").
   * Buyuk/kucuk harf ve aksan fark etmez. Mesajdaki tezahurat kelimesi sayisi
   * (en cok 3) doner; 0 = siradan mesaj.

  function tezahurat(metin) {
    let n = 0;
    for (const k of parcalar(metin)) if (/^(?:he+y+|ho+p+a*|ole+y+)$/.test(k)) n++;
    return Math.min(3, n);
  }


  /**
   * KONUSMA BALONU icerigi. Izleyicinin yazdigi serbest metin ASLA ekrana basilmaz
   * (telefon, adres, link, kufur... hicbiri): yorumlar yalniz TETIKLEYICIDIR.
   * Donus: s.simge'ye verilecek PARCALAR DIZISI ya da null (balon yok):
   *   - tezahurat: mesaj yalniz tezahurat kelimelerinden olusuyorsa anahtarlar
   *     ['HEY'], ['HOPPA'], "hey hey" -> ['HEY','HEY'] (en cok 2)
   *   - yalniz emoji mesaji: cekirdegin 40'lik IZINLI listesindekilerden en cok 3

   * ekranda gostermez.

  const EMOJI_BIRIM = /\p{Extended_Pictographic}[\u{1F3FB}-\u{1F3FF}]?/gu;
  const CHANT_KELIME = /^(?:he+y+|ho+p+a*|ole+y+)$/;
  function balonMetni(ham) {
    const m = String(ham == null ? '' : ham).normalize('NFKC');

    const p = parcalar(m);
    if (p.length && p.every((k) => CHANT_KELIME.test(k))) {
      return p.slice(0, 2).map((k) => (/^he/.test(k) ? 'HEY' : /^ole/.test(k) ? 'OLEY' : /a$/.test(k) ? 'HOPPA' : 'HOP'));
    }
    // 2) yalniz emoji: harf/rakam yoksa (noktalama, bosluk, ZWJ, VS16 serbest)
    if (/[\p{L}\p{N}]/u.test(m)) return null;

    const e = (m.match(EMOJI_BIRIM) || []).map((u) => u.replace(/^(\P{Emoji_Presentation})/u, '$1\uFE0F'))
      .filter((u) => izin.includes(u));
    return e.length ? e.slice(0, 3) : null;
  }

      yerBirak(d); halkaDolu[0][bos] = d.kid; halkaSay[0]++; d.halka = 0; d.yer = bos;
      yerlestirHalka(d, 1000);
      return;
    }
    let m = null;
    for (const k of halkaDolu[0]) {
      const x = k && dans.get(k);
      if (!x || x.durum === 'ortada' || (orta && (orta.kim === x.kid || orta.hedef === x.kid))) continue;
      if (!m || x.sonAktif < m.sonAktif) m = x;
    }
    if (!m) return;
    const r1 = d.halka, y1 = d.yer;
    halkaDolu[0][m.yer] = d.kid; halkaDolu[r1][y1] = m.kid;
    d.halka = 0; d.yer = m.yer; m.halka = r1; m.yer = y1;
    yerlestirHalka(d, 1000); yerlestirHalka(m, 1000);
  }

  /** Cekirdekte figuru kur (kapasite ya da 'yok' yuzunden olmazsa d.fig=false; 100 ms'lik tik yeniden dener). */
  function figurKur(d) {
    if (d.fig) return true;
    if (kalite === 'yok' || !d.gorunur) return false;
    if (!S3.figur.ekle(d.kid, { renk: d.renk, bot: d.bot })) return false;
    d.fig = true;
    if (orta && (orta.kim === d.kid || orta.hedef === d.kid)) ortaYerlestir(); else yerlestirHalka(d, 1300);
    if (d.kid === basKid) S3.figur.isaret(d.kid, ['hale', 'mendil']);
    return true;
  }

  // ---- platform ve calgicilar (THREE ilkelleri; renkler oldugu gibi sRGB) ----------
  const props = { grup: null };
  function propKur() {
    if (kalite === 'yok' || !S3.sahne) return;
    const g = new THREE.Group(); S3.sahne.add(g); props.grup = g;
    const lam = (hex) => new THREE.MeshLambertMaterial({ color: hex });
    // platform: ahsap diski (bir doku) + altin kenar halkasi + ic seridi
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#a9794a'; x.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 16; i++) { x.fillStyle = i % 2 ? '#9a6b40' : '#b78652'; x.fillRect(i * 16, 0, 16, 256); }
    x.strokeStyle = 'rgba(60,32,20,.45)'; x.lineWidth = 2;
    for (let i = 1; i < 16; i++) { x.beginPath(); x.moveTo(i * 16, 0); x.lineTo(i * 16, 256); x.stroke(); }
    const tex = new THREE.CanvasTexture(c); tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
    const disk = new THREE.Mesh(new THREE.CircleGeometry(PLATFORM_R, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: tex }));
    disk.position.y = 0.012;
    const kenar = new THREE.Mesh(new THREE.TorusGeometry(PLATFORM_R, 0.08, 6, 48).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xf0b44c }));
    kenar.position.y = 0.045;
    const serit = new THREE.Mesh(new THREE.RingGeometry(1.5, 1.58, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffd25a }));
    serit.position.y = 0.016;
    g.add(disk, kenar, serit);
    const insan = (govde, sapka) => {
      const a = new THREE.Group();
      const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.19, 0.24, 2, 8), lam(govde)); b.position.y = 0.33;
      const k = new THREE.Mesh(new THREE.SphereGeometry(0.235, 10, 8), lam(0xf2c9a0)); k.position.y = 0.85;
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.255, 10, 4, 0, Math.PI * 2, 0, Math.PI / 2), lam(sapka)); s.scale.y = 0.62; s.position.y = 0.9;
      a.add(b, k, s);
      return a;
    };
    // davulcu: sol arka; davul onde, iki cubuk
    const dv = insan(0xf6c94f, 0x2f3a52); dv.position.set(-0.8, 0.03, -1.15); dv.rotation.y = 0.45;
    const davul = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 18).rotateX(Math.PI / 2), lam(0xf4e9d8)); davul.position.set(0, 0.5, 0.3);
    const cop = (hex, r) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.42, 6).translate(0, 0.21, 0), lam(hex)); const p = new THREE.Group(); p.add(m); return p; };
    const sag = cop(0x3a2418, 0.035), sol = cop(0xe9604f, 0.025);
    sag.position.set(0.2, 0.62, 0.3); sol.position.set(-0.2, 0.62, 0.3);
    dv.add(davul, sag, sol);
    // zurnaci: sag arka
    const zr = insan(0x20b2b0, 0x5a4a3a); zr.position.set(0.8, 0.03, -1.15); zr.rotation.y = -0.45;
    const zurna = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.6, 8).translate(0, 0.3, 0), lam(0x6a3a1e)); zurna.position.set(0, 0.8, 0.22); zurna.rotation.x = 1.05;
    zr.add(zurna);
    g.add(dv, zr);
    props.dv = dv; props.sag = sag; props.sol = sol; props.zr = zr;
  }
  function propTik() {
    if (!props.grup || kalite === 'yok') return;
    const v = S3.saat.vurus, i = Math.floor(v) % 4, tt = v - Math.floor(v);
    const dum = i % 2 === 0 ? Math.max(0, 1 - tt * 3.2) : 0, tek = i % 2 === 1 ? Math.max(0, 1 - tt * 4) : 0;
    props.sag.rotation.x = -0.55 + 1.5 * dum;          // vurus aninda cubuk deriye iner, sonra kalkar
    props.sol.rotation.x = -0.55 + 1.5 * tek;
    props.dv.position.y = 0.03 + 0.04 * Math.abs(Math.cos(Math.PI * v));
    props.zr.rotation.z = Math.sin(Math.PI * v) * 0.07;
  }
  propKur();

  // ---- kamera ------------------------------------------------------------------
  /** 'dusuk' basamakta cekirdek 150'den en cok 60 figur cizer: en dis CIZILEN figurun halkasi (500 ms'de bir). */
  let cizDisT = 0, cizDisR = 0;
  function cizilenDisHalka() {
    const t = simdi();
    if (t - cizDisT < 500) return cizDisR;
    cizDisT = t;
    const gizli = new Set(S3.figur.gizli ? S3.figur.gizli() : []);
    const say = [0, 0, 0];       // halka basina CIZILEN figur; birkac oncelikli figur (yeni gelen, etiketliler) halka sayilmaz
    for (const d of dans.values()) if (d.fig && d.halka != null && !gizli.has(d.kid)) say[d.halka]++;
    let r = 0;
    for (let i = 1; i < say.length; i++) if (say[i] >= 8) r = i;
    return (cizDisR = r);
  }
  let kamR = KADRAJ_R[0], kamIstek = 0, kamAzT = 0, kamKirli = true;
  function kameraTik(dt) {
    if (kalite === 'yok') return;
    let en = 0;
    if (kalite === 'dusuk') en = cizilenDisHalka();   // dusukte yalniz CIZILEN figurler: en dis CIZILEN halkaya kadrajla
    else for (let i = 0; i < halkaSay.length; i++) if (halkaSay[i] > 0) en = i;
    if (KAMERA_SABIT) { en = 2; kamIstek = 2; }
    if (en > kamIstek) { kamIstek = en; kamAzT = 0; }
    else if (en < kamIstek) { if (!kamAzT) kamAzT = simdi(); else if (simdi() - kamAzT > 15000) { kamIstek = en; kamAzT = 0; } }
    else kamAzT = 0;
    const hedef = KADRAJ_R[kamIstek];
    if (kamKirli || Math.abs(hedef - kamR) > 0.004) {
      kamR += (hedef - kamR) * (1 - Math.exp(-5 * dt));
      if (Math.abs(hedef - kamR) < 0.01) kamR = hedef;
      kamKirli = false;
      S3.kadrajla(KAMERA_KUTU, kamR, KAMERA_EGIM);
    }
  }

  // ---- etiketler + avatar diskleri (cekirdegin ust katmani; ad yalniz fillText) -----
  /*
   * ETIKET BUTCESI (PLAN B): halay basi, platformdaki cift, en yeni gelen +
   * en son hareket eden 3 kisi (plan: en cok 6; sahne kalabalikken yuzleri
   * kapatmasin diye 3). En cok 8 etiket; geri kalan HERKES yalniz avatar
   * diski tasir (oncelik 0). Cakisanlari cekirdek eler.
   */
  let sonGelen = null, etSon = 0;
  let etMod = '';                 // 'acik' | 'avatar' (afis/ulti suresince yalniz disk) | 'kart' (tur sonu karti: temiz)
  function etiketModu() {
    if (kazananEl.classList.contains('acik')) return 'kart';
    const u = document.getElementById('ulti-bant');
    if ((altAktif && altAktif.tur === 'anons') || (u && u.classList.contains('gorunur'))) return 'avatar';
    return 'acik';
  }
  function etiketTik(t) {
    if (kalite === 'yok') return;
    const mod = etiketModu();
    if (mod === etMod && t - etSon < 300) return;
    etSon = t;
    if (mod === 'kart') { if (etMod !== 'kart') S3.etiket.ayarla([]); etMod = mod; return; }
    etMod = mod;
    const onc = new Map();
    const koy = (kid, p) => { if (kid && dans.has(kid) && !onc.has(kid)) onc.set(kid, p); };
    koy(basKid, 100);
    if (orta) { koy(orta.kim, 96); koy(orta.hedef, 95); }
    koy(sonGelen, 90);
    const son = [];
    for (const d of dans.values()) if (!d.bot && d.fig && t - d.sonAktif < 6000 && !onc.has(d.kid)) son.push(d);
    son.sort((a, b) => b.sonAktif - a.sonAktif);
    for (let i = 0; i < 3 && i < son.length; i++) koy(son[i].kid, 80 - i);
    const liste = [];
    for (const d of dans.values()) {
      if (!d.fig) continue;
      liste.push({ kid: d.kid, ad: d.ad, oncelik: mod === 'avatar' ? 0 : (onc.get(d.kid) || 0), altin: d.kid === basKid || altinlar.has(d.kid),
        avatarUrl: d.avatarTamam ? d.avatarUrl : Kimlik.al(d.kid).url });
    }
    S3.etiket.ayarla(liste);
  }

  // ---- halka hizi / tempo / MEYDAN GOSTERISI -------------------------------------
  let meydan = null;                            // {bitis}: 8 sn tum sahne koreografisi
  function halkaHizYaz() {
    S3.halka.hiz(meydan ? 3 : durum === 'bitti' ? 0.3 : 1 + 0.35 * seviye);
  }
  function meydanBasla() {
    meydan = { bitis: simdi() + 8000 };
    halkaHizYaz();
    for (const d of dans.values()) if (d.fig) S3.figur.hareket(d.kid, 'kollar', { sureMs: 8000 });
  }


  // ==========================================================================
  // DANSCILAR
  // ==========================================================================
  /*
   * KAFA = PROFIL FOTOGRAFI. Figurun basindaki daireyi cekirdek cizer
   * (s.etiket avatarUrl); burada yalniz yuklenip yuklenmedigi izlenir (plaka
   * ve liste <img>'leri ve cekirdege hangi adresin verilecegi icin).
   * Gorsel yoksa / yuklenemezse / ?avatar=0 ise Kimlik kuresi (ayni kisi her
   * yayinda ayni renk-desen). crossOrigin BILEREK verilmiyor.
   */
  function avatarYukle(d, url) {
    if (!AVATAR || !url || d.avatarUrl === url) return;
    if (!/^(https?:|data:image\/)/i.test(url)) return;
    d.avatarUrl = url; d.avatarTamam = false;
    const img = new Image();
    img.referrerPolicy = 'no-referrer';
    img.decoding = 'async';
    img.onload = () => {
      if (d.avatarUrl !== url || !img.naturalWidth) return;
      d.avatarTamam = true; listeKirli = true;
      if (d.kid === basKid) kafaSrc(basKafaEl, d);
      liderGosterilen = '';
    };
    img.onerror = () => { /* kure kalir */ };
    img.src = url;
  }

  function bosNo() {
    const kullanilan = new Set();
    for (const d of dans.values()) kullanilan.add(d.no);
    for (let n = 1; n <= MAX + 8; n++) if (!kullanilan.has(n)) return n;
    return 0;
  }

  /** Yeni dansci. hemen=true: giris sirasi beklemeden sahneye (hediye, davet). */
  function dansciEkle(kid, ad, uid, avatar, hemen) {
    const kim = Kimlik.al(kid);
    const d = {
      kid, ad, uid: uid || '', bot: Kimlik.botMu(kid), no: bosNo(), renk: kim.renk,
      avatarUrl: '', avatarTamam: false,
      halka: null, yer: -1, fig: false, girisBitis: 0, gorunur: false, durum: 'bekliyor',
      puan: 0, begeniPuan: 0, begeni: 0, sonPuanT: -1e9, duet: 0, katildi: simdi(), sonAktif: simdi(),
      zipla: 0, cikis: 0,
    };
    avatarYukle(d, avatar);
    dans.set(kid, d);
    sira.push(kid);
    listeKirli = true;
    // SAHNEYE YURUME, KARSILAMAYI BEKLEMEZ. Dansci hemen kenardan yurur (cok
    // kisi birden geldiyse 0.1 sn arayla, sirayla — ust uste binmesinler).
    // Davulcunun karsilamasi ayri bir kuyruk: adlar sirayla soylenir; kuyruk
    // uzasa da kimsenin danscisi gorunmez kalmaz.
    if (hemen) sahneyeAl(d); else yuruKuyruk.push(kid);
    if (!d.bot) {
      sonGelen = kid;
      // Botlar dekor: davulcu onlari karsilamaz. Gercek izleyici: bekleyen
      // "halay dolu" sozu varsa artik gereksiz; yerine asil karsilama girer.
      for (let i = altyazi.length - 1; i >= 0; i--) {
        const a = altyazi[i];
        if (!a.dolu || a.kid !== kid) continue;
        if (a.ek) { a.kid = null; a.ad = ''; }   // baska kisilerin sayisini da tasiyor: adsiz sayac olarak kalsin
        else altyazi.splice(i, 1);
      }
      selamEkle({ kid, ad, yine: selamlanan.has(kid) });
      if (selamlanan.size < 5000) selamlanan.add(kid);
      panoYeniGelen();
      Profil.ekle(kid, ad, { xp: 5, halayTur: 1 });
    }
    if (window.Ses) Ses.cal('katil', 140);
    return d;
  }

  /** Sirasi gelen danscilari yurut: tikte 1, yigilma varsa 2-3 (aralarinda mesafeyle). */
  const yuruKuyruk = [];
  function yuruTik() {
    let kac = yuruKuyruk.length > 30 ? 3 : yuruKuyruk.length > 12 ? 2 : 1, j = 0;
    while (kac > 0 && yuruKuyruk.length) {
      const d = dans.get(yuruKuyruk.shift());
      if (!d || d.gorunur) continue;
      sahneyeAl(d);
      j++;
      kac--;
    }
  }

  /** Bekleyen danscinin kenardan yurumesini baslat. */
  function sahneyeAl(d) {
    if (d.gorunur) return;
    d.gorunur = true;
    d.durum = 'giriyor'; d.girisBitis = simdi() + 1400;
    yerAl(d);
    figurKur(d);
  }

  /** Dansciyi siradan cikar; yuruyerek cikar ve silinir. */
  function dansciCikar(d) {
    if (!dans.has(d.kid)) return;
    dans.delete(d.kid);
    sira = sira.filter((k) => k !== d.kid);
    listeKirli = true;
    if (basKid === d.kid) basBelirle(null);
    if (sonGelen === d.kid) sonGelen = null;
    yerBirak(d);
    if (d.fig) { S3.figur.cikar(d.kid); d.fig = false; }
    if (d.gorunur) { d.durum = 'cikiyor'; d.cikis = simdi(); cikanlar.push(d); }
  }

  const gercekSayi = () => { let n = 0; for (const d of dans.values()) if (!d.bot) n++; return n; };

  /** Sira doluyken yer ac: once bot, yoksa en uzun suredir sessiz olan. */
  function yerAc() {
    const korunan = new Set([basKid, hediyeBas && hediyeBas.kid, orta && orta.kim, orta && orta.hedef]);
    for (const b of basKuyruk) korunan.add(b.kid);
    for (const o of ortaKuyruk) { korunan.add(o.kim); korunan.add(o.hedef); }
    let aday = null;
    for (const d of dans.values()) {
      if (korunan.has(d.kid)) continue;
      if (d.bot) { aday = d; break; }
      if (simdi() - d.sonAktif < 20000) continue;
      if (!aday || d.sonAktif < aday.sonAktif) aday = d;
    }
    if (!aday) return false;
    dansciCikar(aday);
    return true;
  }

  /**
   * Izleyiciyi halaya al (zaten oradaysa onu dondur).
   * Her sohbet mesaji ve her begeni buradan gecer.
   */
  function katil(user, hemen) {
    const kid = kimlik(user);
    if (!kid) return null;
    let d = dans.get(kid);
    const ad = isim(user);
    if (d) {
      if (d.ad !== ad) { d.ad = ad; listeKirli = true; if (basKid === kid) basCiz(); }
      if (user.uniqueId) d.uid = user.uniqueId;
      if (!d.avatarUrl) avatarYukle(d, user.avatar);
      if (hemen && !d.gorunur) sahneyeAl(d);
      return d;
    }
    if (sira.length >= MAX && !yerAc()) {
      if (tasan.size < 200) tasan.set(kid, user);
      return null;
    }
    tasan.delete(kid);
    d = dansciEkle(kid, ad, user.uniqueId, user.avatar, hemen);
    if (!d.bot) botDuzenle();
    return d;
  }

  // ==========================================================================
  // KISIYE OZEL ETKI + BALON — figur hareketi cekirdekte; kalp kucuk bir tuvalde
  // ==========================================================================
  /*
   * Her begeni ve her mesaj O izleyicinin figurunde gorunur: begenide ziplar
   * ve basindan kalp yukselir; mesajda mendil savurur. Figur hareketi
   * S3.figur.hareket (zaman tabanli, cekirdekte); kalp, #efektTuval'e
   * S3.ekran() konumundan cizilir (yalniz sekil, metin yok). Kalabalikta
   * secilsin diye avatar diski + hareket + kalp birlikte calisir.
   */
  const efektler = [];
  const efCtx = el('efektTuval').getContext('2d');
  let efBos = true;
  const efNokta = { x: 0, y: 0, olcek: 1, gorunur: false };
  function efekt(d, tur, adet) {
    if (!d.gorunur) return;
    const t = simdi();
    if (t - (d.sonEfekt ?? -1e9) < 160) return;           // seri begenide bulut olmasin
    d.sonEfekt = t;
    if (d.fig) S3.figur.hareket(d.kid, tur === 'kalp' ? 'zipla' : 'mendil');
    if (tur === 'kalp' && d.fig && efektler.length < 120) {
      for (let i = 0; i < adet; i++) efektler.push({ d, ox: (Math.random() - 0.5) * 36, p: -i * 0.18, omur: 1.2, f: Math.random() * 6.28 });
    }
  }
  function efektIlerle(dt) {
    for (let i = efektler.length - 1; i >= 0; i--) {
      const e = efektler[i];
      e.p += dt / e.omur;
      if (e.p >= 1 || !e.d.gorunur || e.d.durum === 'cikiyor') efektler.splice(i, 1);
    }
  }
  function efektCiz() {
    if (!efektler.length) { if (!efBos) { efCtx.clearRect(0, 0, 960, 672); efBos = true; } return; }
    efCtx.clearRect(0, 0, 960, 672); efBos = false;
    for (const e of efektler) {
      if (e.p < 0) continue;
      S3.ekran(e.d.kid, efNokta);
      if (!efNokta.gorunur) continue;
      const p = e.p, r = 15 * (0.7 + 0.3 * Math.min(1, p * 4));
      const x = efNokta.x - 60 + e.ox + Math.sin(e.f + p * 5) * 8;
      const y = efNokta.y - 488 - Math.max(20, efNokta.olcek * 0.3) - p * 96;
      if (y < -20 || y > 692 || x < -20 || x > 980) continue;
      efCtx.globalAlpha = Math.min(1, (1 - p) * 2.4);
      efCtx.fillStyle = '#ff6f9c'; efCtx.strokeStyle = '#17123a'; efCtx.lineWidth = 2.5;
      efCtx.beginPath();
      efCtx.moveTo(x, y + r * 0.95);
      efCtx.bezierCurveTo(x - r * 1.55, y - r * 0.25, x - r * 0.8, y - r * 1.3, x, y - r * 0.45);
      efCtx.bezierCurveTo(x + r * 0.8, y - r * 1.3, x + r * 1.55, y - r * 0.25, x, y + r * 0.95);
      efCtx.fill(); efCtx.stroke();
    }
    efCtx.globalAlpha = 1;
  }

  // ---- KONUSMA BALONU (s.simge) ----------------------------------------------------
  /*
   * Yazanin KENDI figurunun ustunde. Iki tur:
   *   sohbet  — yalniz balonMetni'nin dondurdugu parcalar (tezahurat anahtari ya da
   *             izinli emoji; serbest metin HIC cikmaz)
   *   sistem  — istegine verilen cevap (TABLO'daki sabit etiketler + sayilar)
   * Balonu cizen cekirdek; tek kapisi s.simge. Ayni anda en cok 5 (cekirdek).
   */
  const BALON_OMUR = 2600, BALON_TAVAN = 5;
  const balonlar = [];                 // {kid, sistem, metin, t0, omur} — ozet() icin kayit
  function balonEkle(d, parcalar, o) {
    o = o || {};
    if (!d || !d.gorunur || !Array.isArray(parcalar) || !parcalar.length) return false;
    const t = simdi();
    if (!o.sistem) {
      if (t - (d.sonBalon ?? -1e9) < 3000) return false;            // kisi basi 3 sn'de bir sohbet balonu
      let n = 0;
      for (const b of balonlar) if (!b.sistem && t - b.t0 < b.omur) n++;
      if (n >= BALON_TAVAN) return false;
    }
    const omur = o.omur || BALON_OMUR;
    if (!S3.simge(d.kid, parcalar, { renk: o.renk, sureMs: omur })) return false;
    if (!o.sistem) d.sonBalon = t;
    for (let i = balonlar.length - 1; i >= 0; i--) if (balonlar[i].kid === d.kid) balonlar.splice(i, 1);
    balonlar.push({ kid: d.kid, sistem: !!o.sistem, metin: parcalar.map((x) => (typeof x === 'string' && TABLO[x] ? TABLO[x] : String(x))).join(' '), t0: t, omur });
    return true;
  }
  /** Istege verilen kisa cevap: O izleyicinin figurunun ustunde. */
  const balonSistem = (d, parcalar) => balonEkle(d, parcalar, { sistem: true, renk: '#ffe9a8', omur: 3000 });


  // ==========================================================================
  // DONGU
  // ==========================================================================
  /** Vurus fazini ilerlet; muzik caliyorsa onun saatine yumusakca kilitlen. */
  function fazIlerle(dt) {
    const bpm = durum === 'bitti' ? 50 : BPM[seviye];
    const ileri = dt * bpm / 60;
    let duz = 0;
    const s = (durum !== 'bitti' && window.Ses && Ses.muzikSaat) ? Ses.muzikSaat() : null;
    if (s) {
      let fark = (s.adim / 2 - faz) % 4;          // sekizlik adim -> dortluk vurus, olcu icinde
      if (fark > 2) fark -= 4; else if (fark < -2) fark += 4;
      duz = sik(fark * Math.min(1, dt * 5), -0.6 * ileri, 1.2 * ileri);
    }
    faz += ileri + duz;
  }

  function hareket(dt) { efektIlerle(dt); }

  const kare = { n: 0, toplam: 0, enCok: 0 };
  let sonT = 0;
  function dongu(t) {
    requestAnimationFrame(dongu);
    if (!sonT) sonT = t;
    const ham = (t - sonT) / 1000;
    if (ham < 0.028) return;                       // ~30 fps (OBS): gerisi birikir, dt zaman tabanli
    const dt = Math.min(0.1, ham);
    sonT = t;
    const t0 = performance.now();
    fazIlerle(dt);
    hareket(dt);
    kameraTik(dt);
    propTik();
    efektCiz();
    const ms = performance.now() - t0;
    kare.n++; kare.toplam += ms; if (ms > kare.enCok) kare.enCok = ms;
  }

  // ==========================================================================
  // COSKU — ortak tempo: begeni (ve biraz mesaj) doldurur, yavasca soner
  // ==========================================================================
  /*
   * ISBIRLIGI: bar tek, herkesin. Iki sinir, tek kisi bari TEK BASINA
   * dolduramasin diye:
   *   - oda carpani: 1.65/karekok(n), 0.2-1 arasi — kalabalik buyudukce bir
   *     kisinin payi kuculur (3 kiside ~2, 10 kiside ~4, 60 kiside ~9 kisinin
   *     birlikte basmasi gerekir)
   *   - kisi basi tavan: mesaj 1.2 sn'de bir sayilir; begeni kovasi (4 puan,
   *     saniyede 2 dolar); tezahurat hakki (2 hak, 5 sn'de 1 dolar)
   * Yari omru 20 sn. %45'te OYNAK; bar TAM dolunca COSTU: 2.5 sn %100'de
   * tutulur, sonra soner; %72'nin altina inene kadar COSTU surer (kimse
   * basmazsa ~11 sn), %36'nin altinda yine AGIR. Hava bitince sifirlanir.
   */
  const ESIK_CIK = [45, 100], ESIK_IN = [36, 72];     // COSTU = bar TAM doldu
  const SEVIYE_YAZI = ['AĞIR', 'OYNAK', 'COŞTU!'];
  let coskuCizilen = -1, coskuYazilan = -1;
  function coskuEkle(m) {
    if (durum !== 'oyun') return;
    if (!(m > 0)) return;
    cosku = Math.min(100, cosku + m * sik(1.65 / Math.sqrt(Math.max(3, sira.length)), 0.2, 1));
    seviyeKontrol();                 // tam dolma ani bir sonraki sonumu beklemeden yakalansin
  }
  /** Begeninin coskuya katkisi: kisi basi kova (4 puan, saniyede 2 dolar). */
  function begeniKatki(d, n, t) {
    d.bKova = Math.min(4, (d.bKova == null ? 4 : d.bKova) + (t - (d.bKovaT || t)) / 1000 * 2);
    d.bKovaT = t;
    const k = Math.min(d.bKova, n * 0.4);
    d.bKova -= k;
    return k;
  }
  /** Tezahurat hakki: kisi basi 2 hak, 5 sn'de 1 dolar ("hop hop hop" yagdirmak bari tek basina doldurmaz). */
  function tezahuratHakki(d, t) {
    d.cKova = Math.min(2, (d.cKova == null ? 2 : d.cKova) + (t - (d.cKovaT || t)) / 5000);
    d.cKovaT = t;
    if (d.cKova < 1) return false;
    d.cKova -= 1;
    return true;
  }
  function seviyeKontrol() {
    let yeni = seviye;
    while (yeni < 2 && cosku >= ESIK_CIK[yeni]) yeni++;
    while (yeni > 0 && cosku < ESIK_IN[yeni - 1]) yeni--;
    if (yeni !== seviye) seviyeAyarla(yeni, false);
  }
  let dorukTut = 0;                 // doruk ani: bar %100'de kisa sure TUTULUR (sonme bekler)
  function coskuTik(dt) {
    if (simdi() >= dorukTut) cosku = Math.max(0, cosku * Math.pow(0.5, dt / 20) - 0.35 * dt);
    seviyeKontrol();
    coskuCiz();
  }
  function coskuCiz() {
    if (Math.abs(cosku - coskuCizilen) >= 0.5) {
      coskuCizilen = cosku;
      coskuDoluEl.style.transform = dgDoluEl.style.transform = `scaleX(${(cosku / 100).toFixed(3)})`;
    }
    const tam = Math.round(cosku);
    if (tam !== coskuYazilan) { coskuYazilan = tam; coskuSayiEl.textContent = dgSayiEl.textContent = '%' + tam; }
  }
  function seviyeAyarla(yeni, sessiz) {
    const eski = seviye;
    seviye = yeni;
    coskuSeviyeEl.textContent = SEVIYE_YAZI[yeni];
    coskuSeritEl.dataset.seviye = dgEl.dataset.seviye = String(yeni);
    dgSeviyeEl.textContent = SEVIYE_YAZI[yeni];
    S3.saat.tempo(BPM[yeni]); halkaHizYaz();
    if (sessiz) { coskuCizilen = -1; coskuYazilan = -1; coskuCiz(); return; }
    if (yeni > eski) {
      // Hizlanma: muzik de adim da. muzikHizli O ANKI tempoyu carpar.
      Ses.muzikHizli(BPM[yeni] / BPM[eski]);
      Juice.vur(coskuSeviyeEl, 0.6);
      Ses.cal('etap');
      if (yeni === 2) {
        // DORUK: bar tam doldu. Herkes ayni anda ziplar, bar parlar, anons cikar;
        // bar 2.5 sn %100'de durur ki "DOLDU" ani okunabilsin (sonra yine soner).
        dorukTut = simdi() + 2500;
        for (const d of dans.values()) { d.zipla = 0.42; if (d.fig) S3.figur.hareket(d.kid, 'zipla'); }
        Juice.parla(coskuDoluEl);
        anonsEkle({ ust: '🔥 HALAY COŞTU!', alt: 'bar doldu · beğenmeye devam, tempo düşmesin', sure: 2400, renk: 'var(--altin)' });
        soyle('🔥 <b>HALAY COŞTU!</b> bar doldu, herkes döktürüyor', { oncelik: 3, sure: 3600, anahtar: 'sev2' });
        if (!konfetiAtildi) { konfetiAtildi = true; Juice.konfeti({ y: 0.34, adet: 60 }); }   // bir havada bir kez
      } else {
        anonsEkle({ ust: '🥁 HAVA OYNAKLAŞTI', alt: '❤️ beğenin, bar dolsun', sure: 1800 });
        soyle('🥁 <b>HAVA OYNAKLAŞTI</b> · ❤️ beğenin, bar dolsun', { oncelik: 2, anahtar: 'sev1' });
      }
    } else {
      // Yavaslama: muzikHizli 1'in altina inemiyor; mutlak tempoyu ayarla.
      if (Ses.muzikTempo) Ses.muzikTempo(BPM[yeni] / BPM[0]);
      soyle('🥁 hava ağırlaştı · ❤️ beğenin, yine coşsun', { oncelik: 1, anahtar: 'sevin' });
    }
  }

  // ==========================================================================
  // HALAY BASI — varsayilan: en cok katilan · hediye: aninda, sureli, sirayla
  // ==========================================================================
  let basNeden = 'katilim';

  /** <img>'e danscinin yuzunu koy: yuklenmis profil fotografi, yoksa Kimlik kuresi. */
  function kafaSrc(img, d) {
    const src = !d ? '' : d.avatarTamam ? d.avatarUrl : Kimlik.al(d.kid).url;
    if (img._src === src) return;
    img._src = src;
    if (src) img.src = src; else img.removeAttribute('src');
  }
  const yaz = (e, metin) => { if (e.textContent !== metin) e.textContent = metin; };

  function basCiz() {
    const d = dans.get(basKid);
    basAdEl.textContent = d ? d.ad : '';
    if (d) sigdir(basAdEl, 54, 40);
    kafaSrc(basKafaEl, d);
    liderGosterilen = '';
    basSureYaz();
  }
  /** Plakanin degisen kisimlari: sayi (katilim / kalan sn), alt satir, en cok katilan satiri. */
  let liderGosterilen = '';
  function basSureYaz() {
    const d = dans.get(basKid);
    const hediye = !!(d && hediyeBas && hediyeBas.kid === d.kid);
    yaz(basTacEl, hediye ? '🎁' : '👑');
    if (hediye) {
      yaz(basSayiEl, String(Math.max(0, Math.ceil((hediyeBas.bitis - simdi()) / 1000))));
      yaz(basSayiEtEl, 'sn');
      yaz(basAltEl, basKuyruk.length ? 'hediyeyle · sırada ' + basKuyruk.length : 'hediyeyle');
    } else {
      yaz(basSayiEl, d ? String(Math.round(d.puan)) : '0');
      yaz(basSayiEtEl, 'katılım');
      yaz(basAltEl, !d ? 'mendil boşta' : d.bot ? 'demo · sen yaz' : 'en çok katılan');
    }
    // Basta hediye veren dururken havanin EN COK KATILANI gozden kaybolmasin.
    const l = hediye ? katilimLideri() : null;
    const goster = l && l.kid !== basKid && l.puan > 0 ? l : null;
    if (liderSatirEl.classList.contains('acik') !== !!goster) {
      liderSatirEl.classList.toggle('acik', !!goster);
      listeKirli = true;                       // plaka boyu degisti: listeye sigan satir sayisi da
    }
    if (goster) {
      kafaSrc(liderKafaEl, goster);
      yaz(liderSayiEl, String(Math.round(goster.puan)));
      if (liderGosterilen !== goster.kid + '|' + goster.ad) {
        liderGosterilen = goster.kid + '|' + goster.ad;
        liderAdEl.textContent = goster.ad;
        sigdir(liderAdEl, 46, 40);
      }
    } else liderGosterilen = '';
  }

  /** Halay basi degisti: hale + mendil isaretini tasi (3D). */
  function basBelirle(kid) {
    if (basKid === kid) return;
    const eski = dans.get(basKid);
    if (eski && eski.fig) S3.figur.isaret(eski.kid, null);
    basKid = kid;
    const d = kid ? dans.get(kid) : null;
    if (d && d.fig) S3.figur.isaret(d.kid, ['hale', 'mendil']);
  }

  /** d'yi siranin basina (halay basi) al: ic halkaya, hale + mendil. */
  function basYap(d) {
    const i = sira.indexOf(d.kid);
    if (i < 0) return;
    if (i > 0) { sira.splice(i, 1); sira.unshift(d.kid); }
    if (!d.gorunur) sahneyeAl(d);
    const degisti = basKid !== d.kid;
    basBelirle(d.kid);
    basIcHalkaya(d);
    sonBasDegisim = simdi();
    basCiz();
    listeKirli = true;
    if (degisti) Juice.vur(basKutuEl, 0.3);
  }

  /** Katilim lideri: gercek izleyici varken botlar sayilmaz. */
  function katilimLideri() {
    const gercekVar = gercekSayi() > 0;
    let en = null;
    for (const kid of sira) {
      const d = dans.get(kid);
      if (!d || (gercekVar && d.bot)) continue;
      if (!en || d.puan > en.puan) en = d;
    }
    return en;
  }

  function hediyeBasla(g) {
    const d = dans.get(g.kid);
    if (!d) return false;
    // Sure, kademenin soz verdigi sure: sira uzun diye KISALTILMAZ (sira zaten
    // en cok 5 kisi; beklemeyi sinirlayan o).
    hediyeBas = { kid: d.kid, guc: g.guc, sure: g.sure, bitis: simdi() + g.sure * 1000 };
    basNeden = 'hediye';
    basYap(d);
    if (!d.bot) Profil.ekle(d.kid, d.ad, { xp: 15, halayBas: 1 });
    soyle(`🎁 ${adYer(d.ad)} <b>HALAY BAŞI</b> · mendil ${Math.round(hediyeBas.sure)} sn sende`, { oncelik: 3, sure: 4000 });
    return true;
  }

  function basTik() {
    const t = simdi();
    if (hediyeBas && (t >= hediyeBas.bitis || !dans.has(hediyeBas.kid))) hediyeBas = null;
    while (!hediyeBas && basKuyruk.length) hediyeBasla(basKuyruk.shift());
    if (hediyeBas) { basSureYaz(); return; }

    const lider = katilimLideri(), bas = dans.get(basKid);
    if (!lider) { if (basKid) { basBelirle(null); basCiz(); } return; }
    let gec = false;
    if (!bas || (bas.bot && !lider.bot)) gec = true;
    else if (basNeden === 'hediye') gec = true;                       // hediye bitti: lidere don
    else if (lider.kid !== bas.kid && lider.puan >= bas.puan + 2 && t - sonBasDegisim > 8000) gec = true;
    if (basNeden === 'hediye') { basNeden = 'katilim'; if (lider.kid === basKid) basCiz(); }
    if (!gec || lider.kid === basKid) { basSureYaz(); return; }
    basNeden = 'katilim';
    basYap(lider);
    if (durum === 'oyun' && lider.puan > 0) {
      soyle(`👋 ${adYer(lider.ad)} <b>halay başı</b> · mendil sende`, { oncelik: 2, anahtar: 'bas' });
      if (!lider.bot && !basOdul.has(lider.kid)) {
        basOdul.add(lider.kid);
        Profil.ekle(lider.kid, lider.ad, { xp: 10, halayBas: 1 });
      }
    }
  }

  /*
   * TEMPO (kucuk hediye, < 10 elmas): halay basi sirasi ACMAZ; ortak bara +8
   * coşku (20 sn'de en cok 3 kez) ve gonderenin ADI gorunur. Tavan dolunca
   * adi yine soylenir (hediye sessiz dusmez), yalniz bara eklenmez. Hediye
   * kimin kazanacagini degistirmez: cosku bir yarisma degil, ortak hedef.
   */
  const TEMPO_TAVAN = 3, TEMPO_PENCERE = 20000;
  const tempoZaman = [];
  function tempoCosku() {
    const t = simdi();
    while (tempoZaman.length && t - tempoZaman[0] > TEMPO_PENCERE) tempoZaman.shift();
    if (durum !== 'oyun' || tempoZaman.length >= TEMPO_TAVAN) return false;
    tempoZaman.push(t);
    cosku = Math.min(100, cosku + 8);
    seviyeKontrol();
    return true;
  }
  function tempoHediye(d, ad) {
    const verildi = tempoCosku();
    soyle(`🥁 <b>TEMPO</b> · ${adYer(ad)}` + (verildi ? ' halayı hızlandırdı' : ', sağ ol, tempo şu an dolu'), { oncelik: 3, sure: 3000 });
    if (anonsSay() < 2) anonsEkle({ ust: '🥁 TEMPO', ad, alt: verildi ? 'coşku +8' : 'sağ ol', sure: 1800 });
    if (d) { balonSistem(d, ['🎁', 'tempo']); if (d.fig) S3.figur.hareket(d.kid, 'zipla'); }
    if (window.Ses) Ses.cal('hediye');
  }

  /**
   * Hediye geldi: gonderen hemen (ya da sirasi gelince) halay basi.
   * SIRA SINIRLI — bekleyen en cok 5:
   *   - ayni kisi yine verirse yeni sira ACILMAZ: turu uzar (bastaysa kalan
   *     suresi, bekliyorsa bekleyen turu), en cok 60 sn
   *   - sira doluyken gelen hediye, bekleyenlerin EN DUSUK kademelisinden
   *     (esitlikte en eskisinden) YUKSEK kademeliyse onun yerini alir;
   *     degilse siraya giremez — yuksek kademe dusuk icin asla dusurulmez
   *   - her durumda gonderene adi ve sirasi gosterilir
   */
  const BAS_KUYRUK_TAVAN = 5, BAS_SURE_TAVAN = 60;
  function hediyeAl(d, sure, guc) {
    const t = simdi();
    const bekleyen = basKuyruk.find((b) => b.kid === d.kid);
    let hemen = false, alindi = true, uzadi = false;
    if (hediyeBas && hediyeBas.kid === d.kid) {
      hediyeBas.bitis = Math.min(hediyeBas.bitis + sure * 1000, t + BAS_SURE_TAVAN * 1000);
      hemen = true; uzadi = true;
    } else if (bekleyen) {
      bekleyen.sure = Math.min(BAS_SURE_TAVAN, bekleyen.sure + sure);
      bekleyen.guc = Math.max(bekleyen.guc, guc);
      uzadi = true;
    } else if (!hediyeBas && !basKuyruk.length) {
      hemen = hediyeBasla({ kid: d.kid, sure, guc });
    } else if (basKuyruk.length < BAS_KUYRUK_TAVAN) {
      basKuyruk.push({ kid: d.kid, sure, guc });
    } else {
      let en = 0;                                // en dusuk kademe; esitlikte ilk bulunan = en eski
      for (let i = 1; i < basKuyruk.length; i++) if (basKuyruk[i].guc < basKuyruk[en].guc) en = i;
      if (basKuyruk[en].guc < guc) {
        const cikan = dans.get(basKuyruk.splice(en, 1)[0].kid);
        basKuyruk.push({ kid: d.kid, sure, guc });
        if (cikan) {                             // yerini kaybedene de yumusak, gorunur bir soz
          balonSistem(cikan, ['siraDoldu', '🎁']);
          soyle(`🎁 ${adYer(cikan.ad)}, sıra doldu · hediyen için sağ ol, bir sonrakinde mendil sende`, { oncelik: 2, sure: 3600 });
        }
      } else alindi = false;
    }
    const kacinci = basKuyruk.findIndex((b) => b.kid === d.kid) + 1;      // 0 = bekleyenlerde yok

    if (guc >= 4) {
      // TAKI TORENI: ust kademe. Konfeti + oturum boyunca altin rozet.
      if (altinlar.size < 500) altinlar.add(d.kid);
      listeKirli = true;
      Juice.konfeti({ y: 0.3, adet: 70 });
      const alt = hemen ? 'altın rozet yayın boyunca onda' : kacinci ? `altın rozet onda · mendil sırası: ${kacinci}.`
        : alindi ? 'altın rozet yayın boyunca onda' : 'altın rozet onda · mendil sırası şu an dolu';
      anonsEkle({ ust: '💛 TAKI TÖRENİ', ad: d.ad, alt, sure: 3200, renk: 'var(--altin)' });
      soyle(`💛 <b>TAKI TÖRENİ</b> · ${adYer(d.ad)} altın rozeti taktı`, { oncelik: 3, sure: 4200 });
      // MEYDAN GOSTERISI (>= 1000): 8 sn halkalar hizlica ters doner, herkesin kollari havada; halay basi sirasina EK.
      meydanBasla();
      anonsEkle({ ust: '🎪 MEYDAN GÖSTERİSİ', ad: d.ad, alt: 'halkalar hızlandı · kollar havada · 8 sn', sure: 3000, renk: 'var(--oyun-renk)' });
    } else if (uzadi) {
      // tur uzadi: adi zaten plakada / sirada; kendi danscisinda ve seritte soyle
      const kalan = hemen ? Math.ceil((hediyeBas.bitis - t) / 1000) : Math.round(bekleyen.sure);
      balonSistem(d, hemen ? ['🎁', Math.max(0, kalan | 0), 'snDaha'] : ['🎁', 'sira', kacinci, 'uzadi']);
      soyle(`🎁 ${adYer(d.ad)} ` + (hemen ? `mendili ${kalan} sn daha tutuyor` : `sırasını uzattı · ${kacinci}. sırada · ${kalan} sn`), { oncelik: 3, sure: 3400 });
    } else if (!hemen && alindi) {
      // Sirada bekleyecek: adi yine de HEMEN ve iri gorunsun, sirasi yaninda.
      const girdi = anonsEkle({ ust: '🎁 HALAY BAŞI SIRASINDA', ad: d.ad, alt: `${kacinci}. sırada · mendil birazdan sende`, sure: 2400 });
      balonSistem(d, ['🎁', 'sira', kacinci]);
      if (!girdi) soyle(`🎁 ${adYer(d.ad)} halay başı sırasında · ${kacinci}. sırada`, { oncelik: 3, sure: 3000 });
    } else if (!alindi) {
      // Sira dolu ve bekleyenlerin hepsi en az bu kademede: siraya giremedi.
      const girdi = anonsEkle({ ust: '🎁 SAĞ OL!', ad: d.ad, alt: 'mendil sırası şu an dolu · az sonra yine dene', sure: 2400 });
      balonSistem(d, ['siraDolu', '🎁']);
      if (!girdi) soyle(`🎁 ${adYer(d.ad)}, sağ ol! Mendil sırası şu an dolu`, { oncelik: 3, sure: 3000 });
    }
    basSureYaz();
    if (window.Ses) Ses.cal('hediye');
  }

  // ==========================================================================
  // ORTA — dansa kaldir (davet -> duet) ve solo. Kuyruk, toplam 5.
  // ==========================================================================
  const ortaMesgul = (kid) => (orta && orta.kim === kid) || ortaKuyruk.some((o) => o.kim === kid);

  /**
   * Orta istegi. hedefD yoksa ya da kendisiyse solo.
   * @returns 'davet'|'solo'|'bekle'|'hedefbekle'|'dolu'|'zaten'
   */
  function ortaIste(kimD, hedefD) {
    const t = simdi();
    if (ortaMesgul(kimD.kid)) return 'zaten';
    const son = sonDavet.get(kimD.kid);
    if (son != null && t - son < DAVET_ARA_SN * 1000) return 'bekle';
    const solo = !hedefD || hedefD.kid === kimD.kid;
    if (!solo && !hedefD.bot) {                 // botlar dekor: 45 sn kurali izleyiciyi korumak icin
      const sk = sonKaldirilma.get(hedefD.kid);
      if (sk != null && t - sk < HEDEF_ARA_SN * 1000) return 'hedefbekle';
    }
    if ((orta ? 1 : 0) + ortaKuyruk.length >= ORTA_TAVAN) return 'dolu';
    ortaKuyruk.push({ tur: solo ? 'solo' : 'davet', kim: kimD.kid, hedef: solo ? null : hedefD.kid, sure: SOLO_SN });
    sonDavet.set(kimD.kid, t);
    if (!solo) sonKaldirilma.set(hedefD.kid, t);
    okSiraYaz();
    return solo ? 'solo' : 'davet';
  }

  function ortayaAl(d) {
    if (!d.gorunur) sahneyeAl(d);   // yurume sirasini bekliyorsa beklemeden sahneye
    d.durum = 'ortada';
  }
  function siraDon(d) { if (d && d.durum === 'ortada') { d.durum = 'sirada'; yerlestirHalka(d, 1000); } }
  /** Platformdaki figurleri yerlerine yurut: solo ortada; cift yan yana, birbirine hafif donuk. */
  function ortaYerlestir() {
    if (!orta) return;
    const a = dans.get(orta.kim), b = orta.hedef ? dans.get(orta.hedef) : null;
    const cift = !!b && (orta.evre === 'davet' || orta.evre === 'duet');
    if (a && a.fig) S3.figur.yerlestir(a.kid, cift ? { x: -0.62, z: 0.45, yon: 0.45 } : { x: 0, z: 0.4, yon: 0 }, { sureMs: 900 });
    if (cift && b.fig) S3.figur.yerlestir(b.kid, { x: 0.62, z: 0.45, yon: -0.45 }, { sureMs: 900 });
    if (orta.evre !== 'davet') {                                   // oynayanlar kollari havada
      const ms = Math.min(12000, Math.max(1000, orta.bitis - simdi()));
      if (a && a.fig) S3.figur.hareket(a.kid, 'kollar', { sureMs: ms });
      if (cift && b.fig) S3.figur.hareket(b.kid, 'kollar', { sureMs: ms });
    }
  }

  function ortaBasla(g, a, b) {
    const t = simdi();
    if (g.tur === 'davet' && b) {
      orta = { tur: 'davet', kim: a.kid, hedef: b.kid, evre: 'davet', bitis: t + KABUL_SN * 1000, sn: -1,
               botKabul: b.bot ? t + 1600 + Math.random() * 1400 : 0 };
      ortayaAl(a); ortayaAl(b);
      if (window.Ses) Ses.cal('katil');
    } else {
      // hedef bu arada siradan ciktiysa: davet edenin solosu
      orta = { tur: 'solo', kim: a.kid, hedef: null, evre: 'solo', bitis: t + (g.sure || SOLO_SN) * 1000 };
      ortayaAl(a);
      a.puan += 2;                                 // ortaya cikmak da katilimdir (duet: +5, bkz. ortaKabul)
      a.sonAktif = t;
      if (window.Ses) Ses.cal('etap');
    }
    ortaYerlestir();
    ortaKartCiz();
    Juice.vur(ortaKartEl, 0.25);
  }

  /** Davet edilen yazdi / begendi (bot: kendiliginden): DUET. */
  function ortaKabul() {
    if (!orta || orta.evre !== 'davet') return;
    const a = dans.get(orta.kim), b = dans.get(orta.hedef);
    if (!a || !b) { ortaSoloyaDon(); return; }
    orta.evre = 'duet';
    orta.bitis = simdi() + DUET_SN * 1000;
    for (const d of [a, b]) {
      d.puan += 5; d.duet++;
      if (!d.bot) Profil.ekle(d.kid, d.ad, { xp: 12, halayDuet: 1 });
    }
    coskuEkle(6);
    ortaYerlestir();
    ortaKartCiz();
    Juice.vur(ortaKartEl, 0.4);
    Juice.konfeti({ adet: 22, x: 0.5, y: 0.52 });
    if (window.Ses) Ses.cal('dogru');
    soyle(`🎉 ${adYer(a.ad)} <span class="ok">ile</span> ${adYer(b.ad)} birlikte döktürüyor`, { oncelik: 2, sure: 3600 });
  }

  /** Cevap gelmedi: davet edene kisa solo. Davet edilen hakkinda TEK SOZ YOK. */
  function ortaSoloyaDon() {
    if (!orta) return;
    siraDon(dans.get(orta.hedef));
    orta.hedef = null;
    orta.tur = 'solo'; orta.evre = 'solo';
    orta.bitis = simdi() + KISA_SOLO_SN * 1000;
    if (!dans.has(orta.kim)) { ortaBitir(); return; }
    ortaYerlestir();
    ortaKartCiz();
  }

  function ortaBitir() {
    if (orta) { siraDon(dans.get(orta.kim)); siraDon(dans.get(orta.hedef)); }
    orta = null;
    ortaBosluk = simdi() + 700;
    ortaKartEl.classList.remove('dolu');
  }

  function ortaTik() {
    const t = simdi();
    if (!orta) {
      if (durum !== 'oyun' || t < ortaBosluk) return;
      while (ortaKuyruk.length) {
        const g = ortaKuyruk.shift();
        const a = dans.get(g.kim);
        if (!a) continue;
        ortaBasla(g, a, g.hedef ? dans.get(g.hedef) : null);
        okSiraYaz();
        break;
      }
      return;
    }
    if (orta.evre === 'davet') {
      if (orta.botKabul && t >= orta.botKabul) { ortaKabul(); return; }
      if (t >= orta.bitis || !dans.has(orta.hedef) || !dans.has(orta.kim)) { ortaSoloyaDon(); return; }
      const sn = Math.ceil((orta.bitis - t) / 1000);
      if (sn !== orta.sn) { orta.sn = sn; okAltYaz(); }
    } else if (t >= orta.bitis || !dans.has(orta.kim) || (orta.evre === 'duet' && !dans.has(orta.hedef))) {
      ortaBitir();
    }
  }

  function okSiraYaz() { okAltYaz(); }
  function okAltYaz() {
    if (!orta) return;
    okAltEl.textContent = '';
    if (orta.evre === 'davet') {
      okAltEl.append('yaz ya da ❤️ beğen · ');
      const b = document.createElement('b'); b.textContent = String(Math.max(0, orta.sn));
      okAltEl.append(b);
    } else if (orta.evre === 'duet') okAltEl.append('ikisine de +12 XP');
    else okAltEl.append('sen de çık: OYNA');
    if (ortaKuyruk.length) okAltEl.append(` · sırada ${ortaKuyruk.length}`);
  }
  /** Platformdaki cift/solo icin isim karti (SAHNE'nin alt kenari): iki ad 72px, 40px'e iner, sonra sarar. */
  function ortaKartCiz() {
    if (!orta) return;
    const a = dans.get(orta.kim), b = orta.hedef ? dans.get(orta.hedef) : null;
    if (!a) return;
    const cift = !!b && (orta.evre === 'davet' || orta.evre === 'duet');
    ortaKartEl.classList.add('dolu');
    okBaslikEl.textContent = orta.evre === 'davet' ? '💃 DANSA KALDIRIYOR'
      : orta.evre === 'duet' ? '🎉 BİRLİKTE DÖKTÜRÜYORLAR' : '🕺 ORTADA DÖKTÜRÜYOR';
    okAd1El.textContent = a.ad;
    okAd2El.textContent = cift ? b.ad : '';
    okAd2El.style.display = cift ? '' : 'none';
    okBagEl.style.display = cift ? '' : 'none';
    okBagEl.textContent = orta.evre === 'davet' ? '▸' : '&';
    if (orta.evre === 'davet') orta.sn = Math.ceil((orta.bitis - simdi()) / 1000);
    okAltYaz();
    sigdir(okAd1El, 72, 40);
    if (cift) sigdir(okAd2El, 72, 40);
  }

  // ==========================================================================
  // SIRA BANDINDAKI GECICI YAZILAR — karsilama seridi ve anons, TEK TEK
  // ==========================================================================
  /*
   * Karsilama dusurulmez: kuyruk uzadikca serit kisalir ve adlar ikiser /
   * ucer soylenir (kural asagida). Anons ile karsilama AYNI kuyrugun ogeleri:
   * ust uste binmezler, sirayla cikarlar (biri digerini ac birakmaz).
   */
  let altBosluk = 0, girisBoy = { w: 0, h: 0 }, sonAltTur = 'giris';
  const anonsSay = () => { let n = 0; for (const x of altyazi) if (x.tur === 'anons') n++; return n; };
  const girisSay = () => { let n = 0; for (const x of altyazi) if (x.tur === 'giris') n++; return n; };
  /** Bekleyen KISI sayisi: adli sozler + birlesmis sayaclar (ek). */
  const girisKisi = () => { let n = 0; for (const x of altyazi) if (x.tur === 'giris') n += (x.kid ? 1 : 0) + (x.ek || 0); return n; };
  /** Sozun turu: ayni seritte yalnizca ayni turden sozler birlesir (baslik herkese dogru olsun). */
  const cesit = (g) => (g.dolu ? 'dolu' : g.takip ? (g.tekrar ? 'takip' : 'takipyeni') : g.yine ? 'yine' : 'yeni');
  const SELAM_UST = {
    tek: { dolu: '🥁 halay dolu · yer açılınca sıra sende', takip: '🥁 takip etti, sağ ol!',
      takipyeni: '🥁 takip etti, hoş geldin!', yine: '🥁 yine hoş geldin!', yeni: '🥁 hoş geldin, halaya!' },
    cok: { dolu: '🥁 halay dolu · yer açılınca sıra sizde', takip: '🥁 takip ettiler, sağ olun!',
      takipyeni: '🥁 takip ettiler, hoş geldiniz!', yine: '🥁 yine hoş geldiniz!', yeni: '🥁 hoş geldiniz, halaya!' },
  };
  /*
   * KARSILAMA KUYRUGU — kimse dusmez, bekleme SINIRLI:
   *   bekleyen 0     -> tek ad, 3.0 sn
   *   bekleyen 1     -> tek ad, 2.2 sn
   *   bekleyen 2-5   -> ayni turden ardisik en cok 3 ad, 1.7 sn
   *   bekleyen 6+    -> BIRLESIK serit, 2.6 sn: o turden bekleyen HERKES bu
   *                     seritte — ilk ikisi adiyla, gerisi sayiyla:
   *                     "HOŞ GELDİNİZ, HALAYA!  Ayşe · Mehmet  ve 23 kişi daha!"
   * Her tur (hos geldin / yine / takip tesekkuru / takip + hos geldin / halay
   * dolu) en cok bir birlesik seritle biter: kuyruk ne kadar buyurse buyusun
   * bekleme en cok birkac serit (~10 sn). Sayiyla karsilananlarin adi yine de
   * SON GİRENLER panosunda ve kendi danscisinda (yuruyerek giris) gorunur.
   * Bellek: kuyruk en cok 150 soz tutar; doluyken gelen, ayni turden son
   * sozun sayacina (ek) eklenir — yine sayilir, dusmez.
   */
  const GIRIS_TAVAN = 150, BIRLES_ESIK = 6;
  const selamlanan = new Set();        // bu yayinda en az bir kez karsilananlar
  /** Karsilama sozunu kuyruga al. Her zaman true: ya adiyla bekler ya da bir sayaca eklenir. */
  function selamEkle(g) {
    g.tur = 'giris';
    if (girisSay() >= GIRIS_TAVAN) {
      const tur = cesit(g);
      for (let i = altyazi.length - 1; i >= 0; i--) {
        const a = altyazi[i];
        if (a.tur === 'giris' && cesit(a) === tur) { a.ek = (a.ek || 0) + 1; return true; }
      }
    }
    altyazi.push(g);
    return true;
  }
  /** @returns {boolean} kuyruga girdi mi (doluysa cagiran adi baska yoldan gostermeli) */
  function anonsEkle(a) {
    a.tur = 'anons';
    if (anonsSay() >= 6) return false;
    altyazi.push(a);
    return true;
  }

  function altyaziTik() {
    const t = simdi();
    if (altAktif) {
      if (t < altAktif.bitis) return;
      altAktif.el.style.opacity = '0';
      altAktif = null;
      altBosluk = t + (girisSay() >= 5 ? 0 : 230);     // yigilmada nefes yok: serit hemen yenilenir
      return;
    }
    if (durum !== 'oyun' || t < altBosluk || !altyazi.length) return;
    // Anons one gecer AMA ust uste iki anons girisleri ac birakmasin: ikisi de
    // bekliyorsa sirayla (hediye yagarken bile yeni gelen sahneye cikar).
    const ai = altyazi.findIndex((a) => a.tur === 'anons');
    const gi = altyazi.findIndex((a) => a.tur === 'giris');
    const i = (ai >= 0 && gi >= 0) ? (sonAltTur === 'anons' ? gi : ai) : (ai >= 0 ? ai : gi);
    const a = altyazi.splice(i, 1)[0];
    sonAltTur = a.tur;
    if (a.tur === 'anons') anonsGoster(a); else girisGoster(a);
  }

  /**
   * DAVULCUNUN KARSILAMASI: yeni geleni (ve takip edeni) ADIYLA selamlar.
   * Serit hep ayni yerde — bandin ust kenari, kuyrugu davulcuda; izleyici
   * adini nerede arayacagini bilir. Danscisi karsilamayi BEKLEMEZ: o sirada
   * coktan kenardan yuruyup siraya girmistir (bkz. yuruTik).
   */
  function girisGoster(ilk) {
    const bekleyen = girisKisi();                // ilk'ten baska bekleyen KISI
    const tur = cesit(ilk), birles = bekleyen >= BIRLES_ESIK;
    const grup = [ilk];
    for (let i = 0; i < altyazi.length; i++) {
      const a = altyazi[i];
      if (a.tur !== 'giris') continue;
      if (cesit(a) !== tur) { if (birles) continue; break; }    // normalde sira bozulmasin: farkli turde dur
      if (!birles && grup.length >= (bekleyen >= 2 ? 3 : 1)) break;
      grup.push(a); altyazi.splice(i, 1); i--;
    }
    // Ad: dansci hala siradaysa guncel adi, degilse ogede sakli ad (soz dusmez).
    const gelen = [];
    let sayi = 0;
    for (const g of grup) {
      sayi += g.ek || 0;
      const d = g.kid ? dans.get(g.kid) : null;
      const ad = d ? d.ad : g.ad;
      if (!ad) continue;
      if (gelen.length < (birles ? 2 : 3)) gelen.push({ g, d, ad }); else sayi++;
    }
    if (!gelen.length && !sayi) return;
    const sure = birles ? 2600 : bekleyen === 0 ? 3000 : bekleyen === 1 ? 2200 : 1700;

    // TEK SATIR: serit iki satira cikarsa danscilarin KAFALARINI orter. Adlar
    // 54/50px'ten 46'ya kadar birlikte kuculur; 46'da da sigmiyorsa SONDAKI ad
    // seritten cikar — normal seritte kuyrugun basina geri doner (bir sonraki
    // seritte ilk o soylenir), birlesik seritte sayiya eklenir. Tek basina bile
    // sigmayan (cok uzun) ad ancak o zaman kendi icinde sarar. Hicbir ad kesilmez.
    const ciz = () => {
      girisIcEl.textContent = '';
      girisIcEl.classList.remove('sar');
      const ust = document.createElement('div');
      ust.className = 'gUst';
      ust.textContent = SELAM_UST[gelen.length + sayi > 1 ? 'cok' : 'tek'][tur];
      girisIcEl.appendChild(ust);
      const adEller = [];
      for (const { ad } of gelen) {
        if (adEller.length) {
          const ayrac = document.createElement('div');
          ayrac.className = 'gAyrac'; ayrac.textContent = '·';
          girisIcEl.appendChild(ayrac);
        }
        const adEl = document.createElement('div');
        adEl.className = 'gAd'; adEl.textContent = ad;
        girisIcEl.appendChild(adEl);
        adEller.push(adEl);
      }
      if (sayi) {                                // birlesik: gerisi SAYIYLA
        const daha = document.createElement('div');
        daha.className = 'gDaha';
        daha.textContent = gelen.length ? `ve ${sayi} kişi daha!` : `${sayi} kişi`;
        girisIcEl.appendChild(daha);
      }
      return adEller;
    };
    girisIcEl.style.maxWidth = '960px';
    for (;;) {
      const adEller = ciz();
      const tasiyor = () => adEller.some((e) => e.scrollWidth > e.clientWidth + 0.5);
      const boyut = (px) => { for (const e of adEller) e.style.fontSize = px + 'px'; };
      let a = 46, b = adEller.length > 1 ? 50 : 54;
      boyut(b);
      if (!tasiyor()) break;
      boyut(a);
      const daha = girisIcEl.querySelector('.gDaha');
      if (tasiyor() && daha) daha.style.fontSize = '30px';   // once sayi yazisi kuculur (40 -> 30), ad degil
      if (tasiyor()) {
        if (adEller.length > 1) {                // sigmayan son ad bu seritten cikar
          const x = gelen.pop();
          if (birles) sayi++; else altyazi.unshift(x.g);
          continue;
        }
        girisIcEl.classList.add('sar');          // tek ad bile sigmiyor: kendi icinde sarsin
        sigdir(adEller[0], 46, 46);
        break;
      }
      while (b - a > 1) { const o = (a + b) >> 1; boyut(o); if (tasiyor()) b = o; else a = o; }
      boyut(a);
      break;
    }
    for (const { d } of gelen) if (d && !d.gorunur) sahneyeAl(d);
    altAktif = { tur: 'giris', kid: gelen.length ? gelen[0].g.kid : null, bitis: simdi() + sure, el: girisEl };
    girisEl.style.opacity = '1';
  }

  function anonsGoster(a) {
    anonsIcEl.textContent = '';
    const ust = document.createElement('div');
    ust.className = 'aUst'; ust.textContent = a.ust;
    if (a.renk) ust.style.color = a.renk;
    anonsIcEl.appendChild(ust);
    let adEl = null;
    if (a.ad) {
      adEl = document.createElement('div');
      adEl.className = 'aAd'; adEl.textContent = a.ad;
      anonsIcEl.appendChild(adEl);
    }
    if (a.alt) {
      const alt = document.createElement('div');
      alt.className = 'aAlt'; alt.textContent = a.alt;
      anonsIcEl.appendChild(alt);
    }
    anonsIcEl.style.maxWidth = '940px';
    sigdir(ust, 54, 36);
    if (adEl) sigdir(adEl, 72, 56);
    anonsEl.style.opacity = '1';
    // bekleyen anons coksa her biri kisalir
    altAktif = { tur: 'anons', bitis: simdi() + Math.min(a.sure || 2000, anonsSay() >= 2 ? 1500 : 9999), el: anonsEl };
  }

  // ==========================================================================
  // PANO — 460x490 kutu: halay basi plakasi + donen liste + "halkada N kisi"
  // ==========================================================================
  /*
   * Tek kutu, sirayla UC gorunum (PLAN B):
   *   SON GİRENLER   — halaydakiler, en yeni giren ustte: numara + yuz + isim.
   *                    Dansa kaldirmak icin YAZILACAK numara burada okunur.
   *   COŞTURANLAR    — bu havada en cok BEGENENLER
   *   DESTEKÇİLER    — yayin boyunca hediye verenler (tesekkur duvari; elmas tutari yok)
   * Satir 61px; ad 54px, sigmazsa 40px'e iner, sonra SARAR ("…" yok). Sigmayan
   * satirlar alttan gizlenir (kesik satir gorunmez). 3D kapaliyken ayni
   * veriden SAHNE'deki buyuk isim tahtasi (domCiz) da beslenir.
   * Yeni biri girince pano SON GİRENLER'e doner: adini, yuzunu, numarasini gorur.
   */
  const destek = new Map();            // kid -> {kid, ad, adet, elmas, son} — yayin boyunca
  const SATIR_MAX = 8;
  let listeKirli = true, listeSayfa = 0, listeSonCizim = 0, listeSonSayfa = 0, listeSure = 8000, listeGorunum = '';
  let satirlar = [], bosEl = null;
  let panoZorT = -1e9;

  function listeKur() {
    if (satirlar.length) return;
    listeEl.textContent = '';
    for (let i = 0; i < SATIR_MAX; i++) {
      const r = document.createElement('div'); r.className = 'kisi';
      const no = document.createElement('div'); no.className = 'no';
      const kafa = document.createElement('img'); kafa.className = 'kafa'; kafa.alt = '';
      kafa.referrerPolicy = 'no-referrer';
      const ad = document.createElement('div'); ad.className = 'ad';
      const iz = document.createElement('div'); iz.className = 'iz';
      const deger = document.createElement('div'); deger.className = 'deger';
      r.append(no, kafa, ad, iz, deger);
      r.style.display = 'none';
      listeEl.appendChild(r);
      satirlar.push({ r, no, kafa, ad, iz, deger, dolu: false, metin: null, src: '' });
    }
    bosEl = document.createElement('div');
    bosEl.id = 'listeBos';
    listeEl.appendChild(bosEl);
  }

  /** O anki gorunumler: {ad, sag, sure, bos, satir:[{d, ad, kid, deger}]} */
  function gorunumler() {
    // Gercek izleyici varken botlar panoda YOK (dekorlar; cekilmek uzereler).
    const gercekVar = gercekSayi() > 0;
    const yeni = [...dans.values()].filter((d) => !(gercekVar && d.bot)).sort((a, b) => b.katildi - a.katildi || b.no - a.no);
    const N = yeni.length;
    let enBuyukNo = 0;
    for (const d of yeni) if (d.no > enBuyukNo) enBuyukNo = d.no;
    const g = [{ ad: 'SON GİRENLER', sag: N ? `yaz: 1-${enBuyukNo}` : '', sure: 8000, satir: yeni.slice(0, SATIR_MAX).map((d) => ({ d })) }];
    // COSTURANLAR: bu havada en cok begenenler (botlar yok).
    const begenen = yeni.filter((d) => d.begeni > 0 && !d.bot).sort((a, b) => b.begeni - a.begeni).slice(0, SATIR_MAX);
    g.push({ ad: 'COŞTURANLAR', sag: '❤️ bu hava', sure: begenen.length ? 5500 : 3000, bos: '❤️ beğen · adın burada, coşturanlar arasında',
             satir: begenen.map((d) => ({ d, deger: '❤️ ' + TT.short(d.begeni) })) });
    // DESTEKCILER: en son veren ustte; yaninda sadece kac hediye (elmas tutari yok).
    const des = [...destek.values()].sort((a, b) => b.son - a.son).slice(0, SATIR_MAX);
    g.push({ ad: 'DESTEKÇİLER', sag: '🎁 sağ olun', sure: des.length ? 5500 : 3000, bos: '🎁 hediye veren halay başı olur, adı burada kalır',
             satir: des.map((x) => ({ d: dans.get(x.kid) || null, kid: x.kid, ad: x.ad, deger: '🎁 ' + x.adet })) });
    return g;
  }

  function satirDoldur(gr) {
    for (let i = 0; i < satirlar.length; i++) {
      const s = satirlar[i], x = gr.satir[i];
      if (!x) { if (s.dolu) { s.r.style.display = 'none'; s.dolu = false; s.metin = null; } continue; }
      if (!s.dolu) { s.r.style.display = ''; s.dolu = true; }
      const d = x.d, kid = d ? d.kid : x.kid, ad = d ? d.ad : x.ad;
      yaz(s.no, d ? String(d.no) : '🎁');
      const src = d && d.avatarTamam ? d.avatarUrl : Kimlik.al(kid).url;
      if (s.src !== src) { s.src = src; s.kafa.src = src; }
      const basMi = kid === basKid;
      s.r.classList.toggle('bas', basMi);
      s.ad.style.color = basMi ? 'var(--altin)' : '';
      const iz = altinlar.has(kid) ? '💛' : '', deger = x.deger || '';
      yaz(s.iz, iz);
      yaz(s.deger, deger);
      const anahtar = ad + '|' + iz + '|' + deger.length + '|' + s.no.textContent.length;
      if (s.metin !== anahtar) {                 // ad / rozet / deger genisligi degisti
        s.metin = anahtar;
        s.ad.textContent = ad;
        sigdir(s.ad, 54, 40);
      }
    }
    // Sigmayan alt satirlar gizlenir: kesik satir yok.
    for (let i = satirlar.length - 1; i >= 1 && listeEl.scrollHeight > listeEl.clientHeight + 1; i--) {
      if (satirlar[i].dolu) satirlar[i].r.style.display = 'none';
    }
  }

  function listeCiz() {
    listeKur();
    const g = gorunumler();
    if (listeSayfa >= g.length) listeSayfa = 0;
    const gr = g[listeSayfa];
    listeSure = gr.sure; listeGorunum = gr.ad;
    yaz(listeAdEl, gr.ad);
    yaz(listeAralikEl, gr.sag);
    const n = gr.satir.length;
    if (bosEl) { bosEl.style.display = n ? 'none' : 'block'; if (!n) yaz(bosEl, gr.bos || ''); }
    satirDoldur(gr);
    yaz(sayacBuyukEl, String(sira.length));
    yaz(halkaSayEl, `halkada ${sira.length} kişi`);
    if (kalite === 'yok') domCiz();
  }

  /** 3D kapaliyken SAHNE'deki isim tahtasi: halay basi + son girenler (2 sutun). */
  function domCiz() {
    const yeni = [...dans.values()].filter((d) => !(gercekSayi() > 0 && d.bot)).sort((a, b) => b.katildi - a.katildi || b.no - a.no);
    const bas = dans.get(basKid);
    const kayit = [];
    if (bas) kayit.push({ d: bas, bas: true });
    for (const d of yeni) { if (kayit.length >= 9) break; if (d !== bas) kayit.push({ d }); }
    const imza = kayit.map((k) => k.d.kid + k.d.ad + k.d.no).join('|');
    if (domGorunumImza === imza) return;
    domGorunumImza = imza;
    dgTahtaEl.textContent = '';
    for (const k of kayit) {
