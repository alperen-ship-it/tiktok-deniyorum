<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Son Ayakta Kalan — sohbet battle royale</title>
<link rel="stylesheet" href="_shared/base.css">
<link rel="stylesheet" href="_shared/oyun-tema.css">
<style>
  /* Battle royale'in dramasi SIRALAMA degil AZALMA: buyuk sayi kucule
     kucule 1'e iner. Kurgu buna gore: solda daralan bolge (arena), sagda
     dev "N KALDI" sayaci + elenenlerin akisi. Izleyici iki sey izler:
     sayinin dususu ve kendi adinin listede OLMAMASI. */
  #orta { flex: 1; min-height: 0; display: flex; gap: 14px; }

  /* ---- arena ---- */
  #arenaKutu { flex: 1; position: relative; overflow: hidden; }

  /* Daralan bolge — battle royale'lerdeki cember. Her turda kuculuyor,
     jetonlar iceri surukleniyor. transform: scale = bedava animasyon. */
  #halka {
    position: absolute; left: 50%; top: 50%;
    width: 660px; height: 660px;
    margin: -330px 0 0 -330px;
    border: 5px solid rgba(255, 210, 63, .55);
    border-radius: 50%;
    background: rgba(255, 210, 63, .05);
    transform: scale(1);
    transition: transform .9s cubic-bezier(.3, .7, .3, 1);
  }
  html.tt-lite #halka { transition: none; }

  #jetonlar { position: absolute; inset: 0; }

  /* Oyuncu jetonu: kimlik kuresi. Isim SADECE finalde gorunur — 60 isim
     ayni anda okunmaz, kalabalik anonim bir kitle olarak dogru his. */
  .jeton {
    position: absolute; left: 0; top: 0;
    width: 48px; height: 48px; margin: -24px 0 0 -24px;
    background-size: contain; background-repeat: no-repeat;
    transform: translate(0, 0) scale(0);
    transition: transform .7s cubic-bezier(.3, .7, .3, 1), opacity .35s ease;
    will-change: transform;
  }
  .jeton.geldi { }
  .jeton .jetonAd {
    display: none;
    position: absolute; left: 50%; top: 100%;
    transform: translateX(-50%);
    margin-top: 6px;
    font-size: var(--tip-kucuk); font-weight: 900; color: #fff;
    text-shadow: 0 3px 0 var(--cizgi);
    white-space: nowrap; max-width: 220px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .jeton.kalkan { box-shadow: 0 0 0 5px var(--altin); border-radius: 50%; }
  .jeton.elendi { transition: transform .42s ease-in, opacity .42s ease-in; opacity: 0; }
  html.tt-lite .jeton { transition: opacity .2s ease; }

  /* Final: 6 kisi kalinca isimler acilir, jetonlar buyur — anonim kitle
     adim adim taninan finalistlere donusur. */
  #arenaKutu.final .jeton { width: 72px; height: 72px; margin: -36px 0 0 -36px; }
  #arenaKutu.final .jeton .jetonAd { display: block; }
  #arenaKutu.duello .jeton { width: 108px; height: 108px; margin: -54px 0 0 -54px; }
  #arenaKutu.duello .jeton .jetonAd { font-size: 40px; }

  /* Felaket uyarisi: vurmadan once NEREYE vuracagi gorunur — izleyici
     kacabilsin diye. Arka plan gradyanlari JS'te piksel cinsinden kurulur. */
  #tehlike {
    position: absolute; left: 50%; top: 50%;
    border-radius: 50%;
    pointer-events: none; display: none; z-index: 2;
    animation: tehlikeNabiz 0.7s ease-in-out infinite alternate;
  }
  #tehlike.acik { display: block; }
  @keyframes tehlikeNabiz { from { opacity: .55; } to { opacity: .95; } }
  html.tt-lite #tehlike { animation: none; opacity: .8; }
  #tehlikeIkon {
    position: absolute; z-index: 3; font-size: 58px; line-height: 1;
    transform: translate(-50%, -50%);
    pointer-events: none; display: none;
    text-shadow: 0 4px 0 var(--cizgi);
  }
  #tehlikeIkon.acik { display: block; }

  #vs {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 120px; font-weight: 900; color: var(--altin);
    text-shadow: 0 6px 0 var(--cizgi);
    display: none; pointer-events: none;
  }
  #arenaKutu.duello #vs { display: block; }

  #geriSayim { position: absolute; top: 14px; right: 14px; z-index: 4; }
  #turRozet { position: absolute; top: 14px; left: 14px; z-index: 4; }

  /* ---- sag ray ---- */
  #ray { flex: none; width: 470px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  #kaldiKutu { flex: none; text-align: center; padding: 18px 12px 14px; }
  #kaldiSayi {
    font-size: var(--tip-dev); font-weight: 900; line-height: .9;
    color: #fff; text-shadow: 0 6px 0 var(--cizgi);
    font-variant-numeric: tabular-nums;
  }
  #kaldiSayi.pat { animation: pat .45s ease; }
  @keyframes pat {
    0% { transform: scale(1); }
    35% { transform: scale(1.18); color: var(--pembe); }
    100% { transform: scale(1); }
  }
  html.tt-lite #kaldiSayi.pat { animation: none; }
  #kaldiEtiket {
    font-size: var(--tip-kucuk); font-weight: 900; letter-spacing: 5px;
    color: #a89ce0; margin-top: 2px;
  }

  #feedKutu { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  #feedKutu::before {
    content: 'SON ELENENLER';
    font-size: 17px; font-weight: 900; letter-spacing: 1.6px;
    color: #a89ce0; padding: 0 4px 4px;
  }
  .dusen {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0, 0, 0, .32); border-radius: 12px; padding: 7px 11px;
    animation: gel .35s ease;
  }
  @keyframes gel { from { transform: translateX(60px); opacity: 0; } }
  html.tt-lite .dusen { animation: none; }
  .dusen .kuru { font-size: 22px; flex: none; }
  .dusen .ad {
    flex: 1; min-width: 0; font-size: var(--tip-kucuk); font-weight: 900;
    text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #d9d2ff;
  }
  .dusen .sira { flex: none; font-size: 20px; font-weight: 900; color: #8a7fc4;
                 background: none; padding: 0; font-variant-numeric: tabular-nums; }
  .dusen.bos { justify-content: center; color: #8a7fc4; font-size: var(--tip-kucuk); font-weight: 800; }
</style>
</head>
<body>
<div id="zemin"></div>

<div id="kok" class="tt-oyun">

  <div id="ust" class="kutu">
    <div id="rozet">💀</div>
    <div id="baslikSar">
      <div id="baslik">Son Ayakta Kalan</div>
      <div id="cagri">sohbete yaz · oyuna gir</div>
    </div>
    <div id="sayac">
      <div id="sayacBuyuk">0</div>
      <div id="sayacKucuk">katıldı</div>
    </div>
  </div>

  <div id="orta">
    <div id="arenaKutu" class="kutu">
      <div id="halka"></div>
      <div id="tehlike"></div>
      <div id="tehlikeIkon">☄️</div>
      <div id="jetonlar"></div>
      <div id="vs">VS</div>
      <div class="rozetBuyuk" id="turRozet">TUR <span id="turNo">—</span></div>
      <div class="rozetBuyuk" id="geriSayim">⏳ <span id="geriSn">0</span></div>
      <div id="kazanan"></div>
    </div>

    <div id="ray">
      <div id="kaldiKutu" class="kutu">
        <div id="kaldiSayi">0</div>
        <div id="kaldiEtiket">KALDI</div>
      </div>
      <div id="feedKutu" class="kutu">
        <div class="dusen bos">henüz kimse elenmedi</div>
      </div>
    </div>
  </div>

  <div id="akis"></div>

</div>

<script src="_shared/tt.js"></script>
<script src="_shared/kimlik.js"></script>
<script src="_shared/spiker.js"></script>
<script src="_shared/finis.js"></script>
<script src="_shared/juice.js"></script>
<script>
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) || d : d);

  const KATILIM_SN = num('katilim', 30);
  const TUR_SN     = num('tur', 4);
  const KUTLAMA_SN = num('kutlama', 9);
  const MIN_OYUNCU = num('min', 3);
  const ANAHTAR    = (q.get('kelime') || '').toLowerCase();

  // Eleme cumleleri — mizah burada. Kisisel/asagilayici degil, sacma-komik:
  // izleyici kendi adini boyle bir cumlede gormekten keyif almali.
  const OLUMLER = [
    '%s çayı döktü, diskalifiye',
    '%s şarj kablosunu evde unuttu',
    'annesi yemeğe çağırdı, %s eve gitti',
    'ayı çıktı, %s kaçamadı',
    '%s yanlış otobüse bindi',
    '%s kahve molasından dönmedi',
    'internet koptu, %s düştü',
    '%s ayakkabı bağcığına takıldı',
    '%s kestirecekti, uyandırılamadı',
    '%s zili duyup kapıya koştu',
    '%s kediyi sevmeye gitti',
    '%s haritayı ters tuttu',
    '%s asansörde mahsur kaldı',
    '%s son sandviçi düşürdü, moral çöktü',
    '%s selfie çekerken düştü',
    '%s rüzgâra karşı yürüyemedi',
    '%s "bir dakika" dedi, dönmedi',
    '%s kendi tuzağına bastı',
    '%s dizinin yeni bölümüne gitti',
    '%s ışıkları kapatmayı unuttu, geri döndü',
  ];
  const CIFT = [
    '%s ile %b kafa kafaya çarpıştı',
    '%s ve %b aynı sandalyeye oturdu',
    '%s ile %b tartışırken ikisi de düştü',
  ];

  // ---- durum ---------------------------------------------------------------
  let oyuncular = new Map();   // kid -> {ad, el, canli, kalkan, aci, uzak}
  let kuyruk = new Map();
  let durum = 'katilim';
  let sayacSn = KATILIM_SN;
  let baslangicSayisi = 0;
  let elenmeSirasi = 0;
  let turNo = 0;

  const arenaEl = document.getElementById('arenaKutu');
  const halkaEl = document.getElementById('halka');
  const jetonlarEl = document.getElementById('jetonlar');
  const feedEl = document.getElementById('feedKutu');
  const kazananEl = document.getElementById('kazanan');
  const kaldiEl = document.getElementById('kaldiSayi');

  Spiker.kur(document.getElementById('akis'));

  const canlilar = () => [...oyuncular.values()].filter((o) => o.canli);

  // ---- arena yerlesimi -----------------------------------------------------
  const HALKA_R = 330;   // halka temel yaricapi (css ile ayni)
  let halkaOlcek = 1;

  /** Jetonu acisina/uzakligina gore halkaya yerlestir. */
  function konumla(o) {
    // clientWidth/Height: YERLESIM pikseli. getBoundingClientRect kullanmak
    // hataydi — o, #kok'un scale()'inden GECMIS olcuyu verir; transform ise
    // yerel uzayda calisir. Kucuk pencerede (LIVE Studio onizlemesi) jetonlar
    // sol uste yigiliyordu.
    const cx = arenaEl.clientWidth / 2, cy = arenaEl.clientHeight / 2;
    const jetonPay = arenaEl.classList.contains('duello') ? 60 : 34;
    const yaricap = Math.max(20, HALKA_R * halkaOlcek - jetonPay);
    const x = cx + Math.cos(o.aci) * o.uzak * yaricap;
    const y = cy + Math.sin(o.aci) * o.uzak * yaricap;
    o.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(1)`;
  }

  function hepsiniKonumla() {
    for (const o of canlilar()) konumla(o);
  }

  /** Bolgeyi mevcut nufusa gore daralt; jetonlar iceri suruklenir. */
  function bolgeDaralt() {
    const canli = canlilar().length;
    const oran = baslangicSayisi ? canli / baslangicSayisi : 1;
    halkaOlcek = 0.34 + 0.66 * oran;
    if (arenaEl.classList.contains('duello')) halkaOlcek = 0.5;
    halkaEl.style.transform = `scale(${halkaOlcek.toFixed(3)})`;
    hepsiniKonumla();
  }

  // ---- oyuncu --------------------------------------------------------------
  function oyuncuEkle(kid, ad) {
    if (oyuncular.has(kid)) return;
    const kim = Kimlik.al(kid);
    const el = document.createElement('div');
    el.className = 'jeton';
    el.style.backgroundImage = `url(${kim.url})`;
    el.innerHTML = `<span class="jetonAd">${ad}</span>`;
    jetonlarEl.appendChild(el);

    const o = {
      ad, el, canli: true, kalkan: false,
      aci: Math.random() * 6.2832,
      uzak: 0.15 + Math.random() * 0.8,
    };
    oyuncular.set(kid, o);
    // Bir kare sonra konumla ki scale(0) -> scale(1) gecisi oynasin
    requestAnimationFrame(() => konumla(o));
    sayacCiz();
  }

  function ele(o) {
    o.canli = false;
    o.el.classList.add('elendi');
    o.el.style.transform += ' scale(0) rotate(-120deg)';
    setTimeout(() => o.el.remove(), 450);

    elenmeSirasi++;
    const sira = baslangicSayisi - elenmeSirasi + 1;
    const bos = feedEl.querySelector('.dusen.bos');
    if (bos) bos.remove();
    const satir = document.createElement('div');
    satir.className = 'dusen';
    satir.innerHTML = `<span class="kuru">💀</span><span class="ad">${o.ad}</span><span class="sira">#${sira}</span>`;
    feedEl.insertBefore(satir, feedEl.children[0] || null);
    while (feedEl.children.length > 9) feedEl.lastChild.remove();
  }

  // ---- goruntu -------------------------------------------------------------
  function sayacCiz() {
    const canli = canlilar().length;
    document.getElementById('sayacBuyuk').textContent =
      durum === 'katilim' ? oyuncular.size : canli;
    document.getElementById('sayacKucuk').textContent =
      durum === 'katilim' ? 'katıldı' : 'hayatta';
    document.getElementById('geriSn').textContent = Math.max(0, Math.ceil(sayacSn));
    document.getElementById('turNo').textContent = turNo || '—';

    const yeni = String(durum === 'katilim' ? oyuncular.size : canli);
    if (kaldiEl.textContent !== yeni) {
      kaldiEl.textContent = yeni;
      kaldiEl.classList.remove('pat');
      void kaldiEl.offsetWidth;         // animasyonu yeniden tetikle
      kaldiEl.classList.add('pat');
    }
  }

  // ---- FELAKETLER ----------------------------------------------------------
  // "Cok bos" elestirisinin cevabi: elemeler artik gorunmez zar degil,
  // IZLENEBILIR OLAYLAR. Her tur bir felaket geliyor, vurmadan once nereye
  // vuracagi gosteriliyor ve o esnada sohbete yazan oyuncunun jetonu
  // guvenli bolgeye KACIYOR. Izleyiciye oyun ortasinda da is cikiyor.
  const tehlikeEl = document.getElementById('tehlike');
  const tehlikeIkonEl = document.getElementById('tehlikeIkon');
  const FELAKETLER = [
    { tip: 'meteor',   ikon: '☄️', uyari: '☄️ METEOR geliyor — işaretli alandan KAÇ! (yaz = kaç)',
      cumle: '☄️ meteor düştü — %s altında kaldı' },
    { tip: 'dalga',    ikon: '🌊', uyari: '🌊 DALGA geliyor — kenardakiler İÇERİ! (yaz = kaç)',
      cumle: '🌊 dalga vurdu — %s sürüklendi' },
    { tip: 'cukur',    ikon: '🕳️', uyari: '🕳️ ORTA ÇÖKÜYOR — merkezdekiler KENARA! (yaz = kaç)',
      cumle: '🕳️ zemin çöktü — %s düştü' },
    { tip: 'yildirim', ikon: '⚡', uyari: '⚡ YILDIRIM geliyor — işaretli dilimden KAÇ! (yaz = kaç)',
      cumle: '⚡ yıldırım çarptı — %s kömür oldu' },
  ];
  let felaket = null;      // {f, macı, muzak, sekAci, uyariBitis, kacanlar:Set}
  let bosVurus = 0;

  function bolgede(o) {
    if (!felaket) return false;
    const f = felaket.f;
    if (f.tip === 'dalga') return o.uzak > 0.6;
    if (f.tip === 'cukur') return o.uzak < 0.45;
    if (f.tip === 'yildirim') {
      let fark = ((o.aci - felaket.sekAci) % 6.2832 + 6.2832) % 6.2832;
      return fark < 1.75;   // ~100 derecelik dilim
    }
    // meteor: normalize kutupsal -> kartezyen mesafe
    const dx = o.uzak * Math.cos(o.aci) - felaket.muzak * Math.cos(felaket.macı);
    const dy = o.uzak * Math.sin(o.aci) - felaket.muzak * Math.sin(felaket.macı);
    return Math.hypot(dx, dy) < 0.46;
  }

  /** Guvenli bolgeye tasi (kacis). */
  function kac(o) {
    for (let i = 0; i < 14; i++) {
      const aday = { aci: Math.random() * 6.2832, uzak: 0.12 + Math.random() * 0.78 };
      if (!bolgede(aday)) { o.aci = aday.aci; o.uzak = aday.uzak; konumla(o); return true; }
    }
    return false;
  }

  function felaketBaslat() {
    const f = FELAKETLER[Math.floor(Math.random() * FELAKETLER.length)];
    felaket = {
      f,
      macı: Math.random() * 6.2832,
      muzak: 0.15 + Math.random() * 0.55,
      sekAci: Math.random() * 6.2832,
      uyariBitis: Date.now() + 3200,
      kacanlar: new Set(),
    };

    // Uyari katmanini halkanin GUNCEL boyutuna gore piksel piksel kur
    const cap = 660 * halkaOlcek;
    tehlikeEl.style.width = tehlikeEl.style.height = cap + 'px';
    tehlikeEl.style.margin = `${-cap / 2}px 0 0 ${-cap / 2}px`;
    const R = 'rgba(255,77,77,.32)';
    let arka = '', ikonX = 50, ikonY = 50;
    if (f.tip === 'dalga') {
      arka = `radial-gradient(circle, transparent 0 ${cap * 0.29}px, ${R} ${cap * 0.3}px)`;
      ikonY = 8;
    } else if (f.tip === 'cukur') {
      arka = `radial-gradient(circle, ${R} 0 ${cap * 0.22}px, transparent ${cap * 0.23}px)`;
    } else if (f.tip === 'yildirim') {
      const derece = felaket.sekAci * 180 / Math.PI + 90;   // conic 12 yonunden baslar
      arka = `conic-gradient(from ${derece.toFixed(0)}deg, ${R} 0deg 100deg, transparent 100deg)`;
      const orta = felaket.sekAci + 0.87;
      ikonX = 50 + Math.cos(orta) * 32; ikonY = 50 + Math.sin(orta) * 32;
    } else {
      const mx = 50 + felaket.muzak * 50 * Math.cos(felaket.macı);
      const my = 50 + felaket.muzak * 50 * Math.sin(felaket.macı);
      arka = `radial-gradient(circle at ${mx.toFixed(1)}% ${my.toFixed(1)}%, ${R} 0 ${cap * 0.22}px, transparent ${cap * 0.23}px)`;
      ikonX = mx; ikonY = my;
    }
    tehlikeEl.style.background = arka;
    tehlikeEl.classList.add('acik');

    const ar = arenaEl.clientWidth, ab = arenaEl.clientHeight;
    tehlikeIkonEl.textContent = f.ikon;
    tehlikeIkonEl.style.left = (ar / 2 - cap / 2 + cap * ikonX / 100) + 'px';
    tehlikeIkonEl.style.top = (ab / 2 - cap / 2 + cap * ikonY / 100) + 'px';
    tehlikeIkonEl.classList.add('acik');

    Spiker.soyle(f.uyari, { oncelik: 2, sure: 3000 });

    // Botlar da kacsin (kusurlu: %55 sans, rastgele gecikme) — demo turlari
    // olu durmasin, gercek oyunculara da ornek olsun
    for (const [kid, o] of oyuncular) {
      if (!o.canli || !Kimlik.botMu(kid) || !bolgede(o)) continue;
      if (Math.random() < 0.55) {
        setTimeout(() => { if (felaket && o.canli) kac(o); }, 400 + Math.random() * 2200);
      }
    }
  }

  function felaketVur() {
    const f = felaket.f;
    tehlikeEl.classList.remove('acik');
    tehlikeIkonEl.classList.remove('acik');

    const c = canlilar();
    // Eski tempo formulu artik TAVAN: felaket dogal olarak kac kisiyi
    // yakalarsa o kadar, ama tempoyu bozacak kadar cok olmasin.
    let tavan;
    if (c.length > 40) tavan = Math.ceil(c.length * 0.3);
    else if (c.length > 12) tavan = Math.ceil(c.length * 0.24);
    else tavan = 2;
    tavan = Math.min(tavan, c.length - 1);

    let kurbanlar = c.filter((o) => bolgede(o));
    // sansli kurtulanlar: tavani asani rastgele affet
    while (kurbanlar.length > tavan) kurbanlar.splice(Math.floor(Math.random() * kurbanlar.length), 1);

    const gidenler = [];
    for (const o of kurbanlar) {
      if (o.kalkan) {
        o.kalkan = false;
        o.el.classList.remove('kalkan');
        Spiker.soyle(`🛡️ <span class="kim">${o.ad}</span> kalkanla kurtuldu`, { oncelik: 2 });
        continue;
      }
      gidenler.push(o);
      ele(o);
    }

    if (!gidenler.length) {
      bosVurus++;
      Spiker.soyle('😮 herkes kaçtı — kimse elenmedi!', { oncelik: 1 });
      // iki bos vurus ust uste: oyun surunmesin, klasik eleme devreye girer
      if (bosVurus >= 2) {
        bosVurus = 0;
        const kalanlar = canlilar();
        if (kalanlar.length > 1) {
          const kurban = kalanlar[Math.floor(Math.random() * kalanlar.length)];
          ele(kurban);
          Spiker.soyle('💀 ' + Spiker.sec(OLUMLER, `<b>${kurban.ad}</b>`));
        }
      }
    } else {
      bosVurus = 0;
      Juice.sars(0.3 + Math.min(0.4, gidenler.length * 0.08));
      let cumle = f.cumle.replace('%s', `<b>${gidenler[0].ad}</b>`);
      if (gidenler.length > 1) cumle += ` <span style="opacity:.7">+${gidenler.length - 1} kişi</span>`;
      Spiker.soyle(cumle);
    }

    felaket = null;
    sayacSn = TUR_SN;   // vurusdan sonra sayac tazelenmezse turlar ust uste biner
    turSonu();
  }

  // ---- eleme turu ----------------------------------------------------------
  function tur() {
    const c = canlilar();
    if (c.length <= 1) { bitir(c[0]); return; }
    turNo++;

    // Kalabalik: felaket sistemi (izlenebilir olay + kacis penceresi).
    // Final (<=4 kisi): klasik hizli eleme — kucuk grupta bolge oyunu
    // anlamini yitiriyor, gerilim tek tek dususte.
    if (c.length > 4) { felaketBaslat(); sayacCiz(); return; }

    let elenecek = 1;
    elenecek = Math.min(elenecek, c.length - 1);

    const karisik = c.slice();
    for (let i = karisik.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [karisik[i], karisik[j]] = [karisik[j], karisik[i]];
    }

    const gidenler = [];
    for (const o of karisik) {
      if (gidenler.length >= elenecek) break;
      if (o.kalkan) {
        o.kalkan = false;
        o.el.classList.remove('kalkan');
        Spiker.soyle(`🛡️ <span class="kim">${o.ad}</span> kalkanla kurtuldu`, { oncelik: 2 });
        continue;
      }
      gidenler.push(o);
      ele(o);
    }

    // Spiker: tur basina TEK cumle — one cikan kurban + varsa kalabalik notu.
    // Her elenene ayri cumle kurmak spikeri bogar; tam kayit zaten feed'de.
    if (gidenler.length === 2 && Math.random() < 0.5) {
      const s = CIFT[Math.floor(Math.random() * CIFT.length)];
      Spiker.soyle('💥 ' + s.replace('%s', `<b>${gidenler[0].ad}</b>`).replace('%b', `<b>${gidenler[1].ad}</b>`));
    } else if (gidenler.length) {
      let cumle = '💀 ' + Spiker.sec(OLUMLER, `<b>${gidenler[0].ad}</b>`);
      if (gidenler.length > 1) cumle += ` <span style="opacity:.7">+${gidenler.length - 1} kişi</span>`;
      Spiker.soyle(cumle);
    }

    turSonu();
  }

  /** Tur kapanisi: final/duello gecisleri + bolge daralmasi (ortak yol). */
  function turSonu() {
    const kalan = canlilar();
    arenaEl.classList.toggle('final', kalan.length <= 6 && kalan.length > 2);
    if (kalan.length === 2) {
      arenaEl.classList.add('duello');
      arenaEl.classList.remove('final');
      // Iki finalist karsi karsiya: sol ve sag
      const [a, b] = kalan;
      a.aci = Math.PI; a.uzak = 0.55;
      b.aci = 0;       b.uzak = 0.55;
      Spiker.soyle(`⚔️ <b>SON DÜELLO</b> — ${a.ad} × ${b.ad}`, { oncelik: 3, sure: 4000 });
      Finis.agirCekim(2.2, 0.4);
    } else if (kalan.length <= 6 && kalan.length > 2) {
      Spiker.soyle(`🔥 <b>FİNAL ${kalan.length}</b> — isimler açıldı`, { oncelik: 2, anahtar: 'final' });
    }

    bolgeDaralt();
    sayacCiz();
    if (kalan.length <= 1) bitir(kalan[0]);
  }

  function bitir(o) {
    durum = 'bitti';
    sayacSn = KUTLAMA_SN;
    arenaEl.classList.remove('final', 'duello');
    const ad = o ? o.ad : '—';
    const kazananKid = o ? [...oyuncular.entries()].find(([, v]) => v === o)[0] : null;
    Finis.kart(kazananEl, {
      url: kazananKid ? Kimlik.al(kazananKid).url : null,
      isim: ad,
      alt: kazananKid && Kimlik.botMu(kazananKid)
        ? 'demo oyun — sohbete yaz, sıradakinde SEN varsın'
        : `${baslangicSayisi} kişi arasından son ayakta kalan`,
    });
    document.getElementById('cagri').textContent = ad + ' kazandı';
    Spiker.soyle(`👑 <span class="kim">${ad}</span> SON AYAKTA KALAN`, { oncelik: 3, sure: 4500 });
    if (o && kazananKid && !Kimlik.botMu(kazananKid)) {
      TT.soyle(`💀 @${uidler.get(kazananKid) || ad} son ayakta kalan! ${baslangicSayisi} kişiyi devirdi 👑`);
      try {
        const ss = JSON.parse(localStorage.getItem('tt-kalan-sampiyonlar') || '[]');
        ss.unshift(ad);
        localStorage.setItem('tt-kalan-sampiyonlar', JSON.stringify(ss.slice(0, 5)));
      } catch { /* olsun */ }
    }
  }

  function katilimaDon() {
    durum = 'katilim';
    // Oyun merkezi (oyun.html) icinde calisiyorsak tur bitisini haber ver —
    // merkez oyun gecisini TUR ARASINDA yapar, yaris ortasinda degil.
    try { if (parent !== window) parent.postMessage({ tt: 'tur-bitti' }, '*'); } catch { /* tek basina */ }
    sayacSn = KATILIM_SN;
    turNo = 0; elenmeSirasi = 0;
    Finis.kapat(kazananEl);
    arenaEl.classList.remove('final', 'duello');
    document.getElementById('cagri').textContent = 'sohbete yaz · oyuna gir';
    jetonlarEl.innerHTML = '';
    felaket = null; bosVurus = 0;
    tehlikeEl.classList.remove('acik');
    tehlikeIkonEl.classList.remove('acik');
    // Sampiyonlar duvari: onceki kazananlar katilim ekraninda gorunur —
    // "gecen sefer ben kazandim" geri getirme kancasi.
    let duvar = '';
    try {
      const ss = JSON.parse(localStorage.getItem('tt-kalan-sampiyonlar') || '[]');
      if (ss.length) duvar = ss.map((ad) =>
        `<div class="dusen"><span class="kuru">👑</span><span class="ad">${ad}</span></div>`).join('');
    } catch { /* olsun */ }
    feedEl.innerHTML = duvar || '<div class="dusen bos">henüz kimse elenmedi</div>';
    oyuncular = new Map();
    halkaOlcek = 1;
    halkaEl.style.transform = 'scale(1)';
    for (const [kid, ad] of kuyruk) oyuncuEkle(kid, ad);
    kuyruk = new Map();
    sayacCiz();
    Spiker.soyle('💀 <b>YENİ OYUN</b> — sohbete yaz, katıl', { oncelik: 2 });
  }

  let demoTur = false;

  function oyunBasla() {
    // CAZIBE MODU: yeterli oyuncu yoksa botlarla doldur — oda bos diye
    // ekran olu kalmasin; gelen izleyici elemeleri izleyip oyunu anlasin.
    const gercek = oyuncular.size;
    demoTur = gercek === 0;
    if (gercek < MIN_OYUNCU + 2) {
      const hedef = gercek === 0 ? 8 : MIN_OYUNCU + 3;
      for (let i = 0; oyuncular.size < hedef && i < 8; i++) {
        const b = Kimlik.bot(i);
        oyuncuEkle(b.kid, b.ad);
      }
    }
    if (demoTur) {
      document.getElementById('cagri').textContent = '🤖 demo — sohbete yaz, sıradaki oyunda sen de varsın';
      Spiker.soyle('🤖 <b>DEMO OYUN</b> — sohbete bir şey yaz, katıl', { oncelik: 2, sure: 4200 });
    }
    durum = 'oyun';
    sayacSn = TUR_SN;
    baslangicSayisi = oyuncular.size;
    elenmeSirasi = 0;
    Spiker.soyle(`🚦 <b>BAŞLADI</b> — ${oyuncular.size} kişi, tek kişi kalana kadar`, { oncelik: 2 });
    bolgeDaralt();
    sayacCiz();
  }

  setInterval(() => {
    sayacSn -= 0.25;
    if (sayacSn <= 0) {
      if (durum === 'katilim') oyunBasla();
      else if (durum === 'oyun') {
        // Felaket uyarisi surerken TUR ACMA ve (kritik) asagidaki 'bitti'
        // dalina da DUSME — onceki hali "oyun+felaket" durumunu else'e
        // dusurup oyunu uyarinin ortasinda bastan baslatiyordu.
        if (!felaket) { tur(); sayacSn = TUR_SN; }
      }
      else if (durum === 'bitti') katilimaDon();
    }
    document.getElementById('geriSn').textContent = Math.max(0, Math.ceil(sayacSn));
    if (felaket && Date.now() > felaket.uyariBitis) felaketVur();
  }, 250);

  // Gezinme: jetonlar arada kipirdasinca ekran olu durmuyor. Uyari
  // sirasinda durur — kacis hareketi net gorunsun.
  setInterval(() => {
    if (durum !== 'oyun' || felaket) return;
    for (const o of canlilar()) {
      o.aci += (Math.random() - 0.5) * 0.5;
      o.uzak = Math.max(0.1, Math.min(0.9, o.uzak + (Math.random() - 0.5) * 0.12));
      konumla(o);
    }
  }, 2600);

  // ---- olaylar -------------------------------------------------------------
  const kimlik = (u) => (u && (u.id || u.uniqueId)) || '';
  const isim = (u) => (u && (u.nickname || u.uniqueId)) || 'anon';

  const uidler = new Map();   // kid -> uniqueId (@etiket icin)

  TT.on('chat', (ev) => {
    const kid = kimlik(ev.user);
    if (!kid) return;
    if (ev.user && ev.user.uniqueId) uidler.set(kid, ev.user.uniqueId);
    if (ANAHTAR && !String(ev.comment || '').toLowerCase().includes(ANAHTAR)) return;
    if (durum === 'katilim') { oyuncuEkle(kid, isim(ev.user)); return; }
    // OYUN ICI ETKI: felaket uyarisi sirasinda yazan oyuncu kacar (tur
    // basina bir kez). Izleyicinin oyun ortasinda da yapacak isi var.
    const o = oyuncular.get(kid);
    if (felaket && o && o.canli && !felaket.kacanlar.has(kid)) {
      felaket.kacanlar.add(kid);
      // Her yazan GORUNUR sekilde kacar — tehlikede degilse bile kipirdar.
      // "Yazdim, bir sey oldu" geri bildirimi mekanikten onemli.
      kac(o);
      return;
    }
    if (!oyuncular.has(kid)) kuyruk.set(kid, isim(ev.user));
  });

  // Hediye: BIR turluk kalkan. Eleneni geri getirmiyoruz — "para verince
  // olmezlik" oyunu sahtelestirir; kalkan sadece bir tur dayaniklilik.
  TT.on('gift', (ev) => {
    const o = oyuncular.get(kimlik(ev.user));
    if (!o || !o.canli || o.kalkan) return;
    o.kalkan = true;
    o.el.classList.add('kalkan');
    Spiker.soyle(`🎁 <span class="kim">${o.ad}</span> kalkan kuşandı`, { oncelik: 1 });
  });

  addEventListener('resize', hepsiniKonumla);
  sayacCiz();

  // ?debug=1: dis testlerin ic durumu okuyabilmesi icin
  if (q.get('debug') === '1') {
    window.KALAN_DBG = () => ({
      durum, n: oyuncular.size, canli: canlilar().length,
      tur: turNo, sayacSn: +sayacSn.toFixed(1),
      felaket: felaket ? felaket.f.tip : null, bosVurus,
      kacan: felaket ? felaket.kacanlar.size : -1,
    });
  }

  TT.uyanis({
    baslik: 'SON AYAKTA KALAN',
    komutlar: ['bir şey yaz'],
    aciklama: 'Yazan oyuna girer · felaket uyarısında YAZ = kaç · 🎁 hediye bir turluk kalkan',
    cagri: 'yaz, jetonunu arenada gör',
  });
})();
</script>
