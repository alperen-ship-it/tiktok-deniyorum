<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>At Yarışı — sohbet tahmin yapıyor</title>
<link rel="stylesheet" href="_shared/base.css">
<link rel="stylesheet" href="_shared/oyun-tema.css">
<style>
  /* KIMLIK RENGI — At: cimen yesili — pist cagrisimi, yuksek luma.
     Rotasyonda izleyici bu oyunu BASLIGI OKUMADAN taniyabilsin diye. */
  :root { --oyun-renk: #9be04f; }
  /* At yarisinin cekiciligi atlardan degil BAHISTEN gelir. Izleyici
     yarismaci degil bahisci: 8 SABIT at var — kalici isim, kalici forma,
     tur ustu galibiyet sayisi. Sabit kadro zamanla taraftar biriktirir
     ("ben hep Şimşek'e oynarım"); her tur degisen rastgele atlarda bu bag
     kurulamazdi. Jelle'nin takim kimligi dersi burada, gercekten sabit
     kadronun oldugu yerde uygulaniyor. */
  #orta { flex: 1; min-height: 0; display: flex; gap: 14px; }

  /* ---- saha: 8 kulvar ---- */
  #sahaKutu { flex: 1; min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .kulvar {
    flex: 1; min-height: 0; position: relative;
    background: rgba(0, 0, 0, .26);
    border: 3px solid var(--cizgi);
    border-radius: 12px;
    overflow: hidden;
  }
  /* Bitis: damali serit */
  .kulvar::after {
    content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 14px;
    background: repeating-linear-gradient(180deg, #fff 0 9px, #17123a 9px 18px);
    opacity: .85;
  }
  /* Genislik 292 -> 336: --tip-isim 34'ten 46'ya cikinca 8 at adindan 5'i
     kesiliyordu (en uzunu "Karayel" 211px istiyor, 173px vardi). Sabit kadro
     bu oyunun kimligi — adin yarisini gostermek o kimligi bozar. */
  .kInfo {
    position: absolute; left: 0; top: 0; bottom: 0; width: 336px;
    display: flex; align-items: center; gap: 9px; padding: 0 10px;
    background: rgba(10, 6, 30, .45);
    border-right: 3px solid var(--cizgi);
    z-index: 2;
  }
  .kNo {
    flex: none; width: 34px; height: 34px; border-radius: 9px;
    display: grid; place-items: center;
    font-size: 26px; font-weight: 900; color: #17123a;
    border: 3px solid var(--cizgi);
  }
  .kForma { flex: none; width: 44px; height: 32px; }
  .kForma img { width: 100%; height: 100%; display: block; }
  .kAdSar { flex: 1; min-width: 0; }
  .kAd {
    font-size: var(--tip-isim); font-weight: 900; text-transform: uppercase;
    letter-spacing: -.3px; line-height: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kGalibiyet { font-size: 26px; font-weight: 800; color: var(--altin); margin-top: 2px; }

  .kAt {
    position: absolute; left: 348px; top: 50%;
    z-index: 3; will-change: transform;
  }
  .kAt .govde {
    font-size: 46px; line-height: 1; display: inline-block;
    transform: translateY(-50%) scaleX(-1);   /* emoji sola bakiyor; yaris saga */
  }
  /* Tezahurat cubugu — kulvarin altinda, atin renginde dolar.
     Takim yaris sirasinda yazip begendikce buyur, sessizlesince soner. */
  .kTez {
    position: absolute; left: 336px; bottom: 0; height: 7px; width: 0;
    border-radius: 4px 4px 0 0; opacity: .85; z-index: 1;
    transition: width .25s linear;
  }

  /* Dortnal sallantisi: transform-only, GPU'suz renderda da ucuz.
     will-change ile kendi katmanina alinir — yoksa donen emoji her karede
     yeniden rasterlenip titriyor (OBS/CEF'te belirgin). */
  #sahaKutu.kosuyor .kAt .govde { animation: dortnal .36s ease-in-out infinite alternate; will-change: transform; }
  @keyframes dortnal {
    from { transform: translateY(-50%) scaleX(-1) translateY(-3px) rotate(-2deg); }
    to   { transform: translateY(-50%) scaleX(-1) translateY(3px) rotate(2deg); }
  }
  html.tt-lite #sahaKutu.kosuyor .kAt .govde { animation: none; }

  /* ---- sag ray: faza gore icerik degistirir ---- */
  #ray { flex: none; width: 470px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #fazKutu { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  #fazBaslik {
    font-size: 26px; font-weight: 900; letter-spacing: 1.2px;
    color: #a89ce0; padding: 0 4px 5px; flex: none;
  }
  .fSatir {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0, 0, 0, .32); border-radius: 12px; padding: 7px 11px;
  }
  .fSatir .fNo {
    flex: none; width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center;
    font-size: 26px; font-weight: 900; color: #17123a; border: 3px solid var(--cizgi);
  }
  .fSatir .fForma { flex: none; width: 38px; height: 27px; }
  .fSatir .fForma img { width: 100%; height: 100%; display: block; }
  .fSatir .fAd {
    flex: 1; min-width: 0; font-size: var(--tip-kucuk); font-weight: 900;
    text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fSatir .fSag {
    flex: none; font-size: var(--tip-kucuk); font-weight: 900; color: var(--altin);
    font-variant-numeric: tabular-nums;
  }
  .fSatir .fKucuk { flex: none; font-size: 26px; font-weight: 800; color: #a89ce0; font-variant-numeric: tabular-nums; }
  .fSatir.bos { justify-content: center; color: #8a7fc4; font-weight: 800; font-size: var(--tip-kucuk); padding: 13px; }

  #liderlikKutu { flex: none; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  #liderlikKutu::before {
    content: 'EN İYİ TAHMİNCİLER';
    font-size: 26px; font-weight: 900; letter-spacing: 1.2px;
    color: #a89ce0; padding: 0 4px 5px;
  }

  /* ULTI bandi: eski yatay duzende ulti.js'nin kucuk yazilari telefonda cok
     kuculuyordu; bu kurallar YALNIZ html.tt-yatay'da kalir. Dikeyde bant
     ulti.js'nin kendi html.tt-dikey kurallariyla gelir (top/boyut ezilmez). */
  html.tt-yatay #ulti-bant { top: calc(84px * var(--tt-olcek, 1)); }
  html.tt-yatay #ulti-bant .u-kim, html.tt-yatay.tt-vertical #ulti-bant .u-kim { font-size: 34px; }
  html.tt-yatay.tt-vertical #ulti-bant .u-ad { font-size: 54px; letter-spacing: -2px; }

  #fazIc { display: flex; flex-direction: column; gap: 7px; flex: 1; min-height: 0; overflow: hidden; }
  #geriSayimSar { display: flex; align-items: center; gap: 10px; }

  /* =====================================================================
     DIKEY (1080x1920) — PLAN-DIKEY B "at". Tum yeni kurallar html.tt-dikey
     altinda; yatay kurallar yukarida oldugu gibi.
     SAHNE 960x672: 8 kulvar x 84px (kenarlik/bosluk yok, toplam 672).
     Kulvarin sol 300px'i: numara 56px + at adi 40px; at kalan 660px'te kosar.
     PANO 460x490 (--dk-pano-*): faza gore tahta / canli sira / sonuc, lobide
     tahta ile EN IYI TAHMINCILER 8 sn aralikla doner.
     ===================================================================== */
  html.tt-dikey #orta { flex: 1; min-height: 0; display: block; }
  html.tt-dikey #sahaKutu {
    height: 100%; padding: 0; gap: 0; border: 0; border-radius: 0;
    background: transparent; box-shadow: none;
  }
  html.tt-dikey .kulvar { border-width: 2px; border-radius: 10px; }
  html.tt-dikey .kulvar::after { width: 14px; }
  html.tt-dikey .kInfo { width: 300px; gap: 10px; padding: 0 8px; border-right-width: 2px; }
  html.tt-dikey .kNo { width: 56px; height: 56px; border-radius: 14px; font-size: 40px; border-width: 3px; }
  html.tt-dikey .kForma, html.tt-dikey .kGalibiyet { display: none; }
  html.tt-dikey .kAd { font-size: 40px; letter-spacing: -.5px; }
  html.tt-dikey .kAt { left: 312px; }
  html.tt-dikey .kAt .govde { font-size: 56px; }
  /* Tezahurat cubugu: genislik yerine transform (yalniz transform/opacity canlanir) */
  /* Tahmin acikken kulvarin bos kosu alaninda o ata SON tahmin yapanin adi
     (54px -> 40px -> 2 satira sar, "…" yok). Kosu baslayinca gizlenir. */
  .kTah { display: none; }
  html.tt-dikey .kTah {
    position: absolute; left: 392px; right: 28px; top: 0; bottom: 0; z-index: 2;
    align-items: center; gap: 12px; opacity: 0;
  }
  html.tt-dikey #sahaKutu.tahmin .kTah.dolu { display: flex; opacity: 1; }
  html.tt-dikey .kTahAd {
    flex: 1; min-width: 0; font-size: 54px; font-weight: 800; line-height: 1; color: var(--murekkep);
    white-space: nowrap; overflow: hidden; text-overflow: clip;
  }
  html.tt-dikey .kTahAd.sar { white-space: normal; overflow-wrap: anywhere; max-height: 80px; }
  html.tt-dikey .kTahSay { flex: none; font-size: 30px; font-weight: 900; color: var(--altin); font-variant-numeric: tabular-nums; }
  html.tt-dikey .kTez {
    left: 300px; right: 14px; width: auto; height: 8px;
    transform: scaleX(0); transform-origin: left center; transition: transform .25s linear;
  }

  html.tt-dikey #ray {
    position: absolute; width: auto; display: block;
    left: var(--dk-pano-x); top: var(--dk-pano-y);
    width: var(--dk-pano-w); height: var(--dk-pano-h);
  }
  html.tt-dikey #fazKutu { height: 100%; padding: 6px 8px; gap: 4px; box-sizing: border-box; }
  html.tt-dikey #liderlikKutu { display: none; }
  html.tt-dikey #fazBaslik { font-size: 30px; padding: 0 4px; line-height: 1.1; letter-spacing: .6px; }
  html.tt-dikey #fazIc { gap: 6px; }
  html.tt-dikey #fazIc.izgara {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: repeat(4, minmax(0, 1fr)); grid-auto-flow: column; gap: 4px 6px;
  }
  html.tt-dikey .fSatir { gap: 8px; padding: 5px 10px; border-radius: 12px; }
  html.tt-dikey .fSatir .fNo { width: 34px; height: 34px; font-size: 30px; border-width: 2px; border-radius: 9px; }
  html.tt-dikey .fSatir .fAd { font-size: 40px; line-height: 1.05; text-overflow: clip; }
  html.tt-dikey .fSatir .fAd.sar { white-space: normal; overflow-wrap: anywhere; }
  html.tt-dikey .fSatir .fAd.izl { text-transform: none; font-weight: 800; }
  html.tt-dikey .fSatir .fSag, html.tt-dikey .fSatir .fKucuk { font-size: 30px; }
  html.tt-dikey .fSatir.bos { font-size: 30px; padding: 14px 10px; text-align: center; }
  html.tt-dikey .fSatir.pod { padding: 3px 10px; }
  html.tt-dikey .fSatir.izl { padding: 4px 10px; }
  /* Tahta hucresi: 3 satir (no+ad / carpan+kisi / galibiyet+form) */
  html.tt-dikey .hucre {
    display: flex; flex-direction: column; justify-content: center; gap: 0; min-width: 0;
    background: rgba(0, 0, 0, .32); border-radius: 12px; padding: 3px 8px; overflow: hidden;
  }
  html.tt-dikey .hucre .h1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  html.tt-dikey .hucre .fNo { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    font-size: 30px; font-weight: 900; color: #17123a; border: 2px solid var(--cizgi); }
  html.tt-dikey .hucre .fAd { flex: 1; min-width: 0; font-size: 40px; line-height: 1.05; font-weight: 900;
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: clip; letter-spacing: -.5px; }
  html.tt-dikey .hucre .h2 { font-size: 30px; font-weight: 900; color: var(--altin); line-height: 1.05; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  html.tt-dikey .hucre .h3 { font-size: 30px; font-weight: 800; color: #a89ce0; line-height: 1.05; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="zemin"></div>

<div id="kok" class="tt-oyun">

  <div id="ust" class="kutu">
    <div id="rozet">🏇</div>
    <div id="baslikSar">
      <div id="baslik">At Yarışı</div>
      <div id="cagri">tahmin açık</div>
    </div>
    <div id="komut"><span class="yazEt">YAZ</span> <span id="komutMetin">1 – 8 ARASI</span></div>
    <div id="geriSayimSar">
      <div class="rozetBuyuk" id="turRozet">KOŞU <span id="turNo">1</span></div>
      <div class="rozetBuyuk" id="geriSayim">⏳ <span id="geriSn">0</span></div>
    </div>
    <div id="sayac">
      <div id="sayacBuyuk">0</div>
      <div id="sayacKucuk">tahmin</div>
    </div>
  </div>

  <div id="orta">
    <div id="sahaKutu" class="kutu">
      <!-- kulvarlar JS ile kuruluyor -->
      <div id="kazanan"></div>
    </div>

    <div id="ray">
      <div id="fazKutu" class="kutu">
        <div id="fazBaslik">ÇARPAN TAHTASI</div>
        <div id="fazIc"></div>
      </div>
      <div id="liderlikKutu" class="kutu"></div>
    </div>
  </div>

  <div id="akis"></div>

</div>

<script src="_shared/tt.js"></script>
<script src="_shared/kimlik.js"></script>
<script src="_shared/profil.js"></script>
<script src="_shared/spiker.js"></script>
<script src="_shared/finis.js"></script>
<script src="_shared/juice.js"></script>
<script src="_shared/ses.js"></script>
<script src="_shared/ulti.js"></script>
<script>
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) || d : d);

  // ?tahmin= asil parametre; ?bahis= eski OBS linkleri icin takma ad.
  const BAHIS_SN   = num('tahmin', num('bahis', 25));
  const YARIS_SN   = num('sure', 20);
  const KUTLAMA_SN = num('kutlama', 10);

  // SABIT KADRO — isimler ve formalar tasarlanmis, hash'e birakilmamis.
  // Galibiyet sayilari localStorage'da: kadro yayindan yayina tarih biriktirir.
  const ATLAR = [
    { ad: 'Şimşek',  renk: '#ffd23f', ikincil: '#17123a', desen: 'cizgi' },
    { ad: 'Poyraz',  renk: '#3fb9ff', ikincil: '#ffffff', desen: 'yarim' },
    { ad: 'Fırtına', renk: '#ff4d4d', ikincil: '#ffffff', desen: 'halka' },
    { ad: 'Karayel', renk: '#21d1a1', ikincil: '#17123a', desen: 'duz' },
    { ad: 'Bozkır',  renk: '#e0b06b', ikincil: '#17123a', desen: 'benek' },
    { ad: 'Sedef',   renk: '#ff5fc8', ikincil: '#ffffff', desen: 'burgu' },
    { ad: 'Duman',   renk: '#b9aee8', ikincil: '#17123a', desen: 'benek' },
    { ad: 'Rüzgar',  renk: '#7ed957', ikincil: '#17123a', desen: 'yarim' },
  ];

  let galibiyet;
  try { galibiyet = JSON.parse(localStorage.getItem('tt-at-galibiyet')) || []; }
  catch { galibiyet = []; }
  while (galibiyet.length < ATLAR.length) galibiyet.push(0);

  // Atlarin "karakteri": gizli guc katsayisi (0.94-1.06) her kosuda hafif
  // kayar; son 5 varis kulvarda GORUNUR. Boylece bahis yazi-tura olmaktan
  // cikip form okumaya donusur — ve pari-mutuel bunu kendisi dengeler:
  // formda olan ata herkes oynar, orani duser, kazandirdigi azalir.
  let veriAt;
  try { veriAt = JSON.parse(localStorage.getItem('tt-at-veri')) || {}; }
  catch { veriAt = {}; }
  if (!Array.isArray(veriAt.guc) || veriAt.guc.length !== ATLAR.length) {
    veriAt.guc = ATLAR.map(() => 0.97 + Math.random() * 0.06);
  }
  if (!Array.isArray(veriAt.son) || veriAt.son.length !== ATLAR.length) {
    veriAt.son = ATLAR.map(() => []);
  }

  // Formalari bir kez pisir
  ATLAR.forEach((a) => {
    a.formaURL = Kimlik.formaPisir(a.renk, a.ikincil, a.desen).toDataURL();
    // Kazanan karti icin 4x buyuk surum — kucugu buyutunce bulaniyor
    a.formaBuyukURL = Kimlik.formaPisir(a.renk, a.ikincil, a.desen, 4).toDataURL();
  });

  // ---- durum ---------------------------------------------------------------
  let durum = 'bahis';           // bahis | yaris | bitti
  let sayacSn = BAHIS_SN;
  let turNo = Number(localStorage.getItem('tt-at-kosu') || 1);
  let bahisler = new Map();      // kid -> {ad, at}  (tahminler)
  let puanlar = new Map();       // kid -> {ad, puan} — localStorage yedekli
  let ilerleme = ATLAR.map(() => 0);
  let hiz = ATLAR.map(() => 1);
  let fotoFinisDendi = false, sonDuzlukDendi = false;
  let sonLider = -1;
  let varis = [];                       // bitis cizgisini gecis sirasi
  let kazananIlan = false, kazananZaman = 0, sonDagitilan = [], kazananKart = null;
  let tezahurat = ATLAR.map(() => 0);   // decay'li tezahurat enerjisi
  const uidler = new Map();             // kid -> uniqueId (@etiket icin)

  try {
    for (const [kid, o] of JSON.parse(localStorage.getItem('tt-at-puan') || '[]')) puanlar.set(kid, o);
  } catch { /* bozuk kayit -> sifirdan */ }

  const sahaEl = document.getElementById('sahaKutu');
  const fazIcEl = document.getElementById('fazIc');
  const fazBaslikEl = document.getElementById('fazBaslik');
  const liderlikEl = document.getElementById('liderlikKutu');
  const kazananEl = document.getElementById('kazanan');
  Spiker.kur(document.getElementById('akis'));

  // Dikey kabuk mu (TT.dikey): yalniz yerlesim/boyut farki; oyun mantigi ayni.
  const DIKEY = !!TT.dikey;
  /** DOM yardimcisi: izleyici metni YALNIZ textContent ile girer. */
  function h(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function cipEl(kid, px) {
    const e = h('span');
    e.style.cssText = `display:inline-block;flex:none;width:${px}px;height:${px}px;background-size:contain;vertical-align:middle`;
    e.style.backgroundImage = 'url(' + Kimlik.al(kid).url + ')';
    return e;
  }
  /** Dikeyde ad satirini kutuya sigdir: 54px -> 40px -> sar (asla "…"). */
  function adSigdir(el) { if (DIKEY) TT.adSigdir(el, 54, 40); }
  /** Dikeyde ust durum satirina sigsin diye kisa metin. */
  const cagriMetni = (uzun, kisa) => (DIKEY ? kisa : uzun);

  // ---- kulvarlar -----------------------------------------------------------
  const atEl = [], tezEl = [], formEl = [], tahEl = [];
  ATLAR.forEach((a, i) => {
    const k = document.createElement('div');
    k.className = 'kulvar';
    k.innerHTML = `
      <div class="kInfo">
        <div class="kNo" style="background:${a.renk}">${i + 1}</div>
        <div class="kForma"><img alt="" src="${a.formaURL}"></div>
        <div class="kAdSar">
          <div class="kAd">${a.ad}</div>
          <div class="kGalibiyet">🏆 ${galibiyet[i]}</div>
        </div>
      </div>
      <div class="kTah"><div class="kTahAd"></div><div class="kTahSay"></div></div>
      <div class="kTez" style="background:${a.renk}"></div>
      <div class="kAt"><span class="govde">🏇</span></div>`;
    sahaEl.insertBefore(k, kazananEl);
    atEl.push(k.querySelector('.kAt'));
    tezEl.push(k.querySelector('.kTez'));
    formEl.push(k.querySelector('.kGalibiyet'));
    tahEl.push(k.querySelector('.kTah'));
  });

  function formYaz() {
    ATLAR.forEach((a, i) => {
      const son = veriAt.son[i];
      formEl[i].textContent = '🏆 ' + galibiyet[i] + (son.length ? ' · ' + son.join('-') : '');
    });
  }
  formYaz();

  // BASLA, .kAt'in CSS'teki left degeriyle AYNI olmali (336px bilgi kutusu
  // + 12px pay). Ikisi ayrisirsa atlar kulvarda kaymis basliyor.
  const BASLA = DIKEY ? 312 : 348, BITIS_PAY = 34, AT_EN = DIKEY ? 56 : 46;
  function atlariYerlestir() {
    for (let i = 0; i < ATLAR.length; i++) {
      const en = atEl[i].parentNode.clientWidth;
      const yol = Math.max(0, en - BASLA - BITIS_PAY - AT_EN);
      atEl[i].style.transform = `translateX(${(ilerleme[i] * yol).toFixed(1)}px)`;
    }
  }

  // ---- oranlar (pari-mutuel) ----------------------------------------------
  // Gercek hipodrom mantigi: oran sabit degil, havuzdan gelir. Az oynanan
  // at kazanirsa cok oder — kalabaligin tersine oynamak odullenir ve
  // oranlar kendi kendini dengeler.
  function oranlar() {
    const say = new Array(ATLAR.length).fill(0);
    for (const b of bahisler.values()) say[b.at]++;
    const havuz = bahisler.size;
    return say.map((n) => {
      if (!havuz || !n) return null;             // hic oynanmamis: oran yok
      return Math.max(1.2, Math.min(15, havuz / n));
    });
  }

  // ---- ray fazlari ---------------------------------------------------------
  function fSatir(i, sag, kucuk) {
    const a = ATLAR[i];
    return `<div class="fSatir">
      <div class="fNo" style="background:${a.renk}">${i + 1}</div>
      <div class="fForma"><img alt="" src="${a.formaURL}"></div>
      <div class="fAd">${a.ad}</div>
      ${kucuk ? `<div class="fKucuk">${kucuk}</div>` : ''}
      <div class="fSag">${sag}</div>
    </div>`;
  }

  /** Dikey: her kulvarda o ata SON tahmin yapanin adi (+ diger kisi sayisi). */
  function kulvarTahmin() {
    if (!DIKEY) return;
    const son = ATLAR.map(() => null), say = ATLAR.map(() => 0);
    for (const b of bahisler.values()) { son[b.at] = b.ad; say[b.at]++; }
    tahEl.forEach((el, i) => {
      el.classList.toggle('dolu', say[i] > 0);
      if (!say[i]) return;
      const ad = el.firstChild;
      ad.textContent = son[i];
      el.lastChild.textContent = say[i] > 1 ? '+' + (say[i] - 1) : '';
      el.classList.add('dolu');
      TT.adSigdir(ad, 54, 40);
    });
  }

  // ---- dikey PANO (460x490) ------------------------------------------------
  const MADALYA = ['🥇', '🥈', '🥉'];
  function noEl(i, cls) {
    const n = h('div', cls || 'fNo', String(i + 1));
    n.style.background = ATLAR[i].renk;
    return n;
  }
  /** Izleyici satiri (ad textContent): cip + ad + sag deger. Dikeyde ad 54->40->sar. */
  function izlSatir(kid, ad, sag, rank) {
    const r = h('div', 'fSatir izl');
    if (rank != null) {
      const n = h('div', 'fNo', String(rank + 1));
      n.style.background = ['#ffd23f', '#d8dbe6', '#e29a5a', '#6b5fb8', '#6b5fb8'][rank];
      n.style.color = rank > 2 ? '#fff' : '#17123a';
      r.append(n);
    }
    if (!DIKEY) r.append(cipEl(kid, 30));   // dikeyde 460px PANO'da yer ada kalsin
    const a = h('div', DIKEY ? 'fAd izl' : 'fAd', ad);
    r.append(a, h('div', 'fSag', sag));
    return r;
  }
  /** PANO'ya sigmayan son izleyici satirlarini at (en az 1 kalir). */
  function sigdirListe(toplam) {
    const sat = [...fazIcEl.querySelectorAll('.fSatir.izl')];
    sat.forEach((r) => adSigdir(r.querySelector('.fAd')));
    if (!DIKEY) return;
    // Sigmayan satirlar atilir; atilan olursa son satir "+N kisi daha" der (sessiz kayip yok).
    const fazla = h('div', 'fSatir bos');
    const guncelle = () => { fazla.textContent = '+' + (toplam - sat.length) + ' kişi daha'; };
    if (toplam > sat.length) { guncelle(); fazIcEl.append(fazla); }
    while (sat.length > 1 && fazIcEl.scrollHeight > fazIcEl.clientHeight + 1) {
      sat.pop().remove();
      if (!fazla.parentNode) fazIcEl.append(fazla);
      guncelle();
    }
  }

  function rayOran() {
    fazBaslikEl.textContent = 'ÇARPAN TAHTASI';
    const o = oranlar();
    const say = new Array(ATLAR.length).fill(0);
    for (const b of bahisler.values()) say[b.at]++;
    if (DIKEY) {
      fazIcEl.className = 'izgara';
      fazIcEl.replaceChildren(...ATLAR.map((a, i) => {
        const c = h('div', 'hucre'), r1 = h('div', 'h1');
        const ad = h('div', 'fAd', a.ad);
        r1.append(noEl(i), ad);
        const son = veriAt.son[i].slice(0, 3);
        c.append(r1,
          h('div', 'h2', (o[i] ? 'x' + o[i].toFixed(1) : '—') + (say[i] ? ' · ' + say[i] + '👤' : '')),
          h('div', 'h3', '🏆 ' + galibiyet[i] + (son.length ? ' · ' + son.join('-') : '')));
        return c;
      }));
      fazIcEl.querySelectorAll('.hucre .fAd').forEach((e) => TT.adSigdir(e, 40, 30));
      return;
    }
    fazIcEl.innerHTML = ATLAR.map((a, i) =>
      fSatir(i, o[i] ? 'x' + o[i].toFixed(1) : '—', say[i] ? say[i] + '👤' : '')
    ).join('');
  }

  function rayPozisyon() {
    fazBaslikEl.textContent = 'CANLI POZİSYON';
    let sira = ATLAR.map((a, i) => i).sort((x, y) => ilerleme[y] - ilerleme[x]);
    if (DIKEY) {
      fazIcEl.className = '';
      fazIcEl.replaceChildren(...sira.slice(0, 4).map((i, poz) => {
        const r = h('div', 'fSatir');
        r.append(h('div', 'fSag', (poz + 1) + '.'), noEl(i), h('div', 'fAd', ATLAR[i].ad),
          h('div', 'fKucuk', Math.round(ilerleme[i] * 100) + '%'));
        return r;
      }));
      return;
    }
    fazIcEl.innerHTML = sira.map((i, poz) =>
      fSatir(i, (poz + 1) + '.', Math.round(ilerleme[i] * 100) + '%')
    ).join('');
  }

  function rayOdeme(kazananAt, dagitilan, sira) {
    fazBaslikEl.textContent = 'SONUÇ & ÖDÜLLER';
    // Podyum: tam siralama geldiyse ilk 3, gelmediyse sadece kazanan
    const ilk = (sira || [kazananAt]).slice(0, 3);
    fazIcEl.className = '';
    fazIcEl.replaceChildren();
    ilk.forEach((atIdx, p) => {
      if (DIKEY) {
        const r = h('div', 'fSatir pod');
        r.append(h('div', 'fSag', MADALYA[p] || ''), noEl(atIdx), h('div', 'fAd', ATLAR[atIdx].ad));
        fazIcEl.append(r);
      } else {
        fazIcEl.insertAdjacentHTML('beforeend', fSatir(atIdx, MADALYA[p] || ''));
      }
    });
    if (dagitilan.length) {
      dagitilan.slice(0, 5).forEach((d) => fazIcEl.append(izlSatir(d.kid, d.ad, '+' + d.kazanc)));
      sigdirListe(dagitilan.length);
    } else {
      fazIcEl.append(h('div', 'fSatir bos', 'kimse bilemedi — sıradaki koşuda dene'));
    }
  }

  function liderListe() {
    return [...puanlar.entries()]
      .map(([kid, o]) => ({ kid, ...o }))
      .sort((a, b) => b.puan - a.puan).slice(0, 5);
  }
  function liderSatirlari(list) {
    return list.length
      ? list.map((o, i) => izlSatir(o.kid, o.ad, String(o.puan), i))
      : [h('div', 'fSatir bos', 'ilk koşu sonrası dolacak')];
  }
  /** Yatay: sag raydaki ayri kutu. */
  function liderlikCiz() {
    liderlikEl.replaceChildren(...liderSatirlari(liderListe()));
  }
  /** Dikey: lobide PANO'da tahta ile dönüşümlü. */
  function rayLider() {
    fazBaslikEl.textContent = 'EN İYİ TAHMİNCİLER';
    fazIcEl.className = '';
    const list = liderListe();
    fazIcEl.replaceChildren(...liderSatirlari(list));
    sigdirListe(list.length);
  }
  // Lobi: dikeyde tahta ile liderlik 8 sn aralikla doner (liste bossa donmez).
  let lobiSayfa = 0, lobiSn = 0;
  function rayLobi() {
    kulvarTahmin();
    if (DIKEY && lobiSayfa === 1 && puanlar.size) rayLider(); else rayOran();
  }

  function sayacCiz() {
    document.getElementById('sayacBuyuk').textContent = bahisler.size;
    document.getElementById('turNo').textContent = turNo;
    document.getElementById('geriSn').textContent = Math.max(0, Math.ceil(sayacSn));
  }

  // ---- yaris ---------------------------------------------------------------
  let demoTur = false;

  function yarisBasla() {
    // CAZIBE MODU: bahis yoksa botlar oynasin — kosu her turda kalksin,
    // oran tahtasi dolu gorunsun, gelen izleyici mekanigi izleyerek anlasin.
    const gercek = bahisler.size;
    demoTur = gercek === 0;
    if (gercek < 3) {
      for (let i = 0; i < (gercek === 0 ? 6 : 4 - gercek); i++) {
        const b = Kimlik.bot(i);
        if (!bahisler.has(b.kid)) {
          bahisler.set(b.kid, { ad: b.ad, at: Math.floor(Math.random() * ATLAR.length) });
        }
      }
      rayLobi(); sayacCiz();
    }
    if (demoTur) {
      document.getElementById('cagri').textContent = cagriMetni('koşu başlıyor — sıradakinde sen de tahmin yap', 'koşu başlıyor');
      Spiker.soyle('👇 <b>1 – 8 ARASI YAZ</b> — sıradaki koşuda tahminin geçerli', { oncelik: 2, sure: 4200 });
    }
    durum = 'yaris';
    ilerleme = ATLAR.map(() => 0);
    // Temel hiz x gizli guc: formdaki at hafif avantajli — form gorunur
    // oldugu icin bu hile degil, okunabilir bilgi.
    hiz = ATLAR.map((a, i) => (0.85 + Math.random() * 0.3) * veriAt.guc[i]);
    fotoFinisDendi = false; sonDuzlukDendi = false; sonLider = -1;
    varis = []; kazananIlan = false; kazananZaman = 0; sonDagitilan = []; kazananKart = null;
    tezahurat = ATLAR.map(() => 0);
    sahaEl.classList.add('kosuyor'); sahaEl.classList.remove('tahmin');
    Ses.muzik('at');
    document.getElementById('cagri').textContent = cagriMetni('koşu sürüyor — yaz & beğen, atına güç ver!', 'koşu sürüyor');
    Spiker.soyle(`🚦 <b>KAPILAR AÇILDI</b> — ${bahisler.size} tahmin`, { oncelik: 3 });
  }

  let sonZaman = 0, rayZaman = 0;
  function dongu(t) {
    requestAnimationFrame(dongu);
    if (!sonZaman) sonZaman = t;
    let dt = Math.min(0.05, (t - sonZaman) / 1000);
    sonZaman = t;
    dt *= Finis.carpan;                      // foto finiste agir cekim

    if (durum !== 'yaris') return;

    let birinci = -1, enIleri = -1;
    for (let i = 0; i < ATLAR.length; i++) {
      if (ilerleme[i] >= 1) { if (1 > enIleri) { enIleri = 1; if (birinci < 0) birinci = i; } continue; }
      hiz[i] += (Math.random() - 0.5) * 1.6 * dt;
      hiz[i] = Math.max(0.55, Math.min(1.5, hiz[i]));

      // Tezahurat: destekcilerin yaris sirasindaki mesaj/begenileri.
      // TAVANLI (+%12) ve hizla sonumleniyor (yarilanma ~1.5sn) — sonucu
      // sohbet degil hala guc + sans belirliyor; tezahurat "itis" hissi.
      tezahurat[i] *= Math.pow(0.5, dt / 1.5);
      const itis = Math.min(0.12, tezahurat[i] * 0.012);

      ilerleme[i] += (hiz[i] * (1 + itis) / YARIS_SN) * dt;
      if (ilerleme[i] > enIleri) { enIleri = ilerleme[i]; birinci = i; }
      if (ilerleme[i] >= 1) {
        ilerleme[i] = 1;
        varis.push(i);
        if (!kazananIlan) { kazananIlan = true; kazananZaman = t; kazananIslemleri(i); }
      }
    }
    atlariYerlestir();

    // Kazanan ilan edildi ama kosu bitmedi: digerleri cizgiye kadar kossun.
    // Hepsi vardiginda ya da 2.6sn sonra kapat, kalanlari konumuna gore siraya yaz.
    if (kazananIlan && (varis.length === ATLAR.length || t - kazananZaman > 2600)) {
      finalize();
      return;
    }

    // Spiker olaylari
    if (durum === 'yaris' && !kazananIlan) {
      if (birinci !== sonLider && sonLider >= 0 && enIleri > 0.15 && enIleri < 0.88) {
        Spiker.soyle('⚡ ' + Spiker.sec(
          ['<b>%s</b> öne geçiyor!', '<b>%s</b> başı aldı!', '<b>%s</b> dışarıdan geliyor!', '<b>%s</b> temposunu artırdı!'],
          ATLAR[birinci].ad), { oncelik: 2, anahtar: 'lider' });
      }
      sonLider = birinci;

      if (!sonDuzlukDendi && enIleri > 0.78) {
        sonDuzlukDendi = true;
        Spiker.soyle('🔥 <b>SON DÜZLÜK!</b>', { oncelik: 3 });
      }

      // Foto finis: ilk iki at arasi %2.5'ten az ve cizgiye yaklasildi
      if (!fotoFinisDendi && enIleri > 0.9) {
        const sirali = [...ilerleme].sort((a, b) => b - a);
        if (sirali[0] - sirali[1] < 0.025) {
          fotoFinisDendi = true;
          Juice.sars(0.35);
          Finis.agirCekim(2, 0.3);
          Spiker.soyle('🎬 <b>FOTO FİNİŞ!</b>', { oncelik: 3 });
        }
      }
      if ((t - rayZaman) > 250) { rayZaman = t; rayPozisyon(); tezCiz(); }
    }
  }

  /** Bitis sirasi: varanlar + kalanlar mevcut konuma gore. */
  function tamSiralama() {
    const kalan = ATLAR.map((a, i) => i).filter((i) => !varis.includes(i))
      .sort((x, y) => ilerleme[y] - ilerleme[x]);
    return varis.concat(kalan);
  }

  function finalize() {
    durum = 'bitti';
    sayacSn = KUTLAMA_SN;
    sahaEl.classList.remove('kosuyor');
    Ses.muzikDur(0.35);
    // Perde ANCAK simdi aciliyor: saha durdu, herkes cizgiyi gecti.
    // Kart kendi sahnesini kuruyor (isim once, ses 2 kare arkadan,
    // konfeti 3.5 sn sonra) — finis.js'teki nota bak.
    if (kazananKart) { Finis.kart(kazananEl, kazananKart); kazananKart = null; }

    // Form guncelle: varis pozisyonu son-5 listesine girer, gizli guc kayar
    const sira = tamSiralama();
    sira.forEach((atIdx, poz) => {
      veriAt.son[atIdx].unshift(poz + 1);
      if (veriAt.son[atIdx].length > 5) veriAt.son[atIdx].pop();
      veriAt.guc[atIdx] = Math.max(0.94, Math.min(1.06,
        veriAt.guc[atIdx] + (Math.random() - 0.5) * 0.024));
    });
    localStorage.setItem('tt-at-veri', JSON.stringify(veriAt));
    formYaz();
    rayOdeme(sira[0], sonDagitilan, sira);   // podyumla yeniden ciz
    tezEl.forEach((e) => { if (DIKEY) e.style.transform = 'scaleX(0)'; else e.style.width = '0'; });
  }

  function kazananIslemleri(i) {
    const at = ATLAR[i];

    galibiyet[i]++;
    localStorage.setItem('tt-at-galibiyet', JSON.stringify(galibiyet));
    sahaEl.querySelectorAll('.kGalibiyet')[i].textContent = '🏆 ' + galibiyet[i];

    // Odul: havuzdan gelen carpan x 10, dogru bilen herkese AYNI formul.
    // Hediye odulu BUYUTMEZ. (Yarista tezVer ile tavanli tezahurat eklenir: bkz. gift handler.)
    const o = oranlar()[i] || 2;
    const dagitilan = [];
    for (const [kid, b] of bahisler) {
      if (b.at !== i) continue;
      const kazanc = Math.round(10 * o);
      // Botlar odeme listesinde gorunur (demo canli dursun) ama KALICI
      // puan tablosuna girmez — EN IYI BAHISCILER gercek izleyicilerin.
      if (!Kimlik.botMu(kid)) {
        Profil.ekle(kid, b.ad, { atBahis: 1, atKazanc: kazanc,
          xp: Math.round((10 + kazanc / 8) * kademe().carpan) });
        const m = puanlar.get(kid) || { ad: b.ad, puan: 0 };
        m.ad = b.ad; m.puan += kazanc;
        puanlar.set(kid, m);
      }
      dagitilan.push({ kid, ad: b.ad, kazanc });
    }
    dagitilan.sort((a, b) => b.kazanc - a.kazanc);
    sonDagitilan = dagitilan;
    // SIRALA, sonra kes. Siralamadan slice(0,100) JavaScript'te EN ONCE
    // EKLENENI tutar — yani 100 farkli bahisciden sonra gelen herkesin
    // puani her yazmada sessizce cope gidiyordu.
    localStorage.setItem('tt-at-puan', JSON.stringify(
      [...puanlar.entries()].sort((a, b) => (b[1].puan || 0) - (a[1].puan || 0)).slice(0, 100)));

    // Kazanan bahiscileri SOHBETTE etiketle (kopru botu; yoksa sessiz).
    const gercekKazanan = dagitilan.filter((d) => !Kimlik.botMu(d.kid));
    if (gercekKazanan.length) {
      const etiketler = gercekKazanan.slice(0, 3)
        .map((d) => '@' + (uidler.get(d.kid) || d.ad)).join(' ');
      const fazla = gercekKazanan.length > 3 ? ` +${gercekKazanan.length - 3} kişi` : '';
      TT.soyle(`🏇 ${at.ad} kazandı! Tebrikler ${etiketler}${fazla} 🎉`);
    } else if (!demoTur) {
      TT.soyle(`🏇 ${at.ad} kazandı — kimse görmedi! Sıradaki koşuda tahminini yap 🎯`);
    }
    // demo kosuda sohbete hic yazma — bos odaya bot mesaji spam olur

    // Kart burada ACILMIYOR — sadece hazirlaniyor. Ilk at cizgiyi gectiginde
    // digerleri hala kosuyor (finalize'a kadar 2.6 sn'ye kadar var); perdeyi
    // o anda acmak, yarisin en gerilimli anini %82 opakligin arkasina
    // gomuyordu. Odeme/sohbet hemen isliyor, perde finalize()'da aciliyor.
    kazananKart = {
      url: at.formaBuyukURL,
      isim: at.ad,
      alt: dagitilan.length
        ? `#${i + 1} · çarpan x${o.toFixed(1)} · ${dagitilan.length} kişi bildi`
        : `#${i + 1} · kimse bilemedi — sürpriz koşu`,
    };
    document.getElementById('cagri').textContent = at.ad + ' kazandı';
    Spiker.soyle(`🏆 <b>${at.ad}</b> ` + (dagitilan.length ? `— ${dagitilan.length} kişi bildi` : '— kimse görmedi bunu'),
      { oncelik: 3, sure: 4500 });
    rayOdeme(i, dagitilan);
    liderlikCiz();
  }

  function bahseDon() {
    durum = 'bahis';
    // Oyun merkezi (oyun.html) icinde calisiyorsak tur bitisini haber ver —
    // merkez oyun gecisini TUR ARASINDA yapar, yaris ortasinda degil.
    try { if (parent !== window) parent.postMessage({ tt: 'tur-bitti' }, '*'); } catch { /* tek basina */ }
    sayacSn = BAHIS_SN;
    turNo++;
    localStorage.setItem('tt-at-kosu', String(turNo));
    bahisler = new Map();
    ilerleme = ATLAR.map(() => 0);
    atlariYerlestir();
    Finis.kapat(kazananEl);
    sahaEl.classList.add('tahmin');
    document.getElementById('cagri').textContent = 'tahmin açık';
    lobiSayfa = 0; lobiSn = 0;
    rayLobi(); sayacCiz();
    Spiker.soyle(`🏇 <b>${turNo}. KOŞU</b> — 1-${ATLAR.length} yaz, tahminini yap`, { oncelik: 2 });
  }

  setInterval(() => {
    sayacSn -= 0.25;
    if (sayacSn <= 0) {
      if (durum === 'bahis') yarisBasla();
      else if (durum === 'bitti') bahseDon();
    }
    document.getElementById('geriSn').textContent = Math.max(0, Math.ceil(sayacSn));
    if (DIKEY && durum === 'bahis') {
      lobiSn += 0.25;
      if (lobiSn >= 8) { lobiSn = 0; lobiSayfa ^= 1; rayLobi(); }
    }
  }, 250);

  const DURUM_METNI = () => durum === 'bahis' ? '— tahminin geçerli' : '— tahminin sıradaki koşuda geçerli';
  /* ILK TEMAS — oyun hangi durumda olursa olsun yazana karsilik ver.
     Olculen kusur: dongunun buyuk kismi "olu pencere"ydi; o aralikta
     yazan kisi ekranda hicbir sey gormuyordu. */
  TT.on('ilktemas', (e) => {
    const p = Profil.ekle(e.kid, isim(e.user), { mesaj: 1, xp: 2 });
    const oz = Profil.ozet(e.kid);
    Spiker.satir([{ kim: isim(e.user) }, ' ' + DURUM_METNI() + ' · ', oz ? oz : { b: 'İLK KEZ' }],
         { oncelik: 2, anahtar: 'temas' });
    if (window.Ses) Ses.cal('katil', 150);
  });

  const KADEME_SAYI = () => bahisler.size;
  /* ---- KADEME: kalabalik odulu buyutur ----
     Tek basina yazan biri "bunun ne anlami var" hissediyordu. Kademe
     sistemi katilimi KOLEKTIF bir sey haline getiriyor: kisi sayisi
     artinca odul carpani goruniyor bicimde buyuyor.
     Onemli ayrinti: duyuru SADECE kademe DEGISINCE yapiliyor. 500 kisi
     katilsa bile ~5 duyuru cikar, her katilimda bir satir degil. */
  const KADEMELER = [
    { esik: 3,   ad: 'MAHALLE',    carpan: 1.0 },
    { esik: 8,   ad: 'ŞEHİR KUPASI', carpan: 1.4 },
    { esik: 18,  ad: 'BÜYÜK PRİ',  carpan: 1.8 },
    { esik: 35,  ad: 'ŞAMPİYONA',  carpan: 2.4 },
    { esik: 1e9, ad: 'EFSANE TUR', carpan: 3.0 },
  ];
  function kademe() { return KADEMELER.find((k) => KADEME_SAYI() <= k.esik); }

  // ---- olaylar -------------------------------------------------------------
  const kimlik = (u) => (u && (u.id || u.uniqueId)) || '';
  const isim = (u) => (u && (u.nickname || u.uniqueId)) || 'anon';

  // At adiyla da bahis: "şimşek" yazan 1'e oynamis olur
  const adTablo = new Map(ATLAR.map((a, i) =>
    [a.ad.toLocaleLowerCase('tr').replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g')
      .replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c'), i]));

  function tezVer(kid, miktar) {
    const b = bahisler.get(kid);
    if (!b) return;
    tezahurat[b.at] = Math.min(14, tezahurat[b.at] + miktar);
    // Esik asilinca spiker coskusu (at basina 4sn kilit)
    if (tezahurat[b.at] > 7) {
      Spiker.soyle(`📣 <b style="color:${ATLAR[b.at].renk}">${ATLAR[b.at].ad}</b> tribünü coştu!`,
        { oncelik: 1, anahtar: 'tez' + b.at });
    }
  }

  function tezCiz() {
    for (let i = 0; i < ATLAR.length; i++) {
      const oran = Math.min(100, tezahurat[i] * 8);
      // dikeyde yalniz transform canlanir (genislik degil)
      if (DIKEY) tezEl[i].style.transform = 'scaleX(' + (oran / 100).toFixed(3) + ')';
      else tezEl[i].style.width = oran.toFixed(0) + '%';
    }
  }

  TT.on('chat', (ev) => {
    const kid = kimlik(ev.user);
    if (!kid) return;
    if (ev.user && ev.user.uniqueId) uidler.set(kid, ev.user.uniqueId);

    // Yaris sirasinda: mesaj = kendi atina tezahurat
    if (durum === 'yaris') { tezVer(kid, 1); return; }
    if (durum !== 'bahis') return;
    const metin = String(ev.comment || '');
    let at = -1;
    const m = metin.match(/\b([1-8])\b/);
    if (m) at = Number(m[1]) - 1;
    else {
      const sade = metin.toLocaleLowerCase('tr').replace(/ı/g, 'i').replace(/ş/g, 's')
        .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c')
        .replace(/[^a-z]/g, '');
      if (adTablo.has(sade)) at = adTablo.get(sade);
    }
    if (at < 0 || at >= ATLAR.length) return;

    const yeni = !bahisler.has(kid);
    bahisler.set(kid, { ad: isim(ev.user), at });
    rayLobi(); sayacCiz();
    if (yeni) {
      Spiker.satir([{ kim: isim(ev.user) }, ' ▸ ', { b: ATLAR[at].ad }], { oncelik: 1 });
    }
  });

  // Begeni: yaris sirasinda kucuk tezahurat (seri geldigi icin bolunmus)
  TT.on('like', (ev) => {
    if (durum !== 'yaris') return;
    tezVer(kimlik(ev.user), Math.min(2.5, (ev.likes || 1) * 0.12));
  });

  // Hediye: odulu BUYUTMEZ. Gonderen her durumda ekranda tesekkur gorur (ULTI
  // bandi + spiker). Yarista tahmini olan icin hediye, mesajla ayni tavanli
  // tezahurat sayilir (tezVer 5; tezahurat tavani +%12 hiz) — ikisi de tavanli.
  TT.on('gift', (ev) => {
    if (ev.gift && ev.gift.streaking) return;   // seri ara tiklari (bridge.js:683 / tt.js:349); son tik gelince tek tesekkur
    const kid = kimlik(ev.user);
    const ad = isim(ev.user);
    const elmas = (ev.gift && ev.gift.value) || 0;
    const b = kid ? bahisler.get(kid) : null;
    const k = ULTI.kademe(elmas);
    // Dikeyde ILK arguman 64px buyuk satir (gonderenin ADI), opts.ad 30px etiket.
    if (TT.dikey) ULTI.duyur(isim(ev.user), { ad: '🎁 TEŞEKKÜRLER', emoji: '🎁', renk: k.renk, guc: k.guc }, 1500);
    else ULTI.duyur('🎁 TEŞEKKÜRLER', { ad: isim(ev.user), emoji: '🎁', renk: k.renk, guc: k.guc }, 1500);
    if (durum === 'yaris') {
      if (b) {
        tezVer(kid, 5);
        Spiker.satir(['🎁 Sağ ol ', { kim: ad }, ' — ', { b: ATLAR[b.at].ad }, ' tribünü coştu'], { oncelik: 2 });
      } else {
        Spiker.satir(['🎁 Sağ ol ', { kim: ad }, ' — sıradaki koşuda ', { b: '1-' + ATLAR.length }, ' yaz, tahminini yap'], { oncelik: 2 });
      }
      return;
    }
    const sira = durum === 'bahis' ? '' : ' sıradaki koşuda';
    Spiker.satir(b
      ? ['🎁 Sağ ol ', { kim: ad }, ' — tahminin ', { b: ATLAR[b.at].ad }, ', tribün seninle']
      : ['🎁 Sağ ol ', { kim: ad }, ' —' + sira + ' ', { b: '1-' + ATLAR.length }, ' yaz, tahminini yap'], { oncelik: 3 });
  });

  // ---- basla ---------------------------------------------------------------
  sahaEl.classList.add('tahmin');
  atlariYerlestir();
  rayLobi(); liderlikCiz(); sayacCiz();
  addEventListener('resize', atlariYerlestir);
  requestAnimationFrame(dongu);

  TT.uyanis({
    baslik: 'AT YARIŞI',
    komutlar: ['1', '5', 'şimşek'],
    aciklama: 'Atının numarasını (1-8) ya da adını yaz · az seçilen atın çarpanı büyük · koşuda yaz & beğen: tezahürat atını iter',
    cagri: 'tahminini yap, koşu başlasın',
  });
})();
</script>
</body>
</html>
