<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>At Yarışı — sohbet bahis oynuyor</title>
<link rel="stylesheet" href="_shared/base.css">
<link rel="stylesheet" href="_shared/oyun-tema.css">
<style>
  #alan { overflow: hidden; flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 10px; }
  #ust { padding: 9px 14px; }
  #baslik { font-size: 28px; }
  #rozet { font-size: 27px; }

  /* --- seritler --- */
  .serit {
    flex: 1; min-height: 0; position: relative;
    background: rgba(0,0,0,.24);
    border-radius: 12px;
    border: 3px solid var(--cizgi);
    overflow: hidden;
  }
  /* Bitis cizgisi — damali serit */
  .serit::after {
    content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 10px;
    background:
      repeating-linear-gradient(180deg, #fff 0 8px, #17123a 8px 16px);
    opacity: .8;
  }
  .no {
    position: absolute; left: 7px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center;
    font-size: 14px; font-weight: 900; color: #17123a;
    border: 3px solid var(--cizgi); z-index: 2;
  }
  .atAd {
    position: absolute; left: 40px; top: 50%; transform: translateY(-50%);
    font-size: 13px; font-weight: 800; color: #b9aee8; z-index: 2;
    text-transform: uppercase; letter-spacing: .3px;
  }
  /* Bahis sayaci — o ata kac kisi oynadi */
  .bahis {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    font-size: 15px; font-weight: 900; color: var(--altin); z-index: 2;
    font-variant-numeric: tabular-nums;
  }
  .at {
    position: absolute; top: 50%; left: 116px;   /* etiket sutunundan sonra */
    font-size: 30px; line-height: 1;
    transform: translate(0, -50%);
    will-change: transform; z-index: 3;
    filter: drop-shadow(0 2px 0 var(--cizgi));
  }
  html.tt-lite .at { filter: none; }

  /* Geri sayim serit alaninda DEGIL baslikta: mutlak konumlandirilinca
     1. seridin sag ucunu ve bahis sayacini kesiyordu. */
  #geriSayim { flex: none; font-size: 16px; padding: 4px 10px; }

  /* Alt: en cok kazanan bahisciler */
  #siralama {
    position: absolute; left: 12px; bottom: 12px; z-index: 4;
    width: min(300px, 44%);
    padding: 8px; gap: 5px;
    background: rgba(18,12,51,.78);
    border: 3px solid var(--cizgi); border-radius: 16px;
    box-shadow: 0 4px 0 var(--cizgi);
    display: none;
  }
  #siralama.acik { display: flex; }
  .sira { padding: 4px 8px; gap: 7px; background: rgba(0,0,0,.3); }
  .sira .rozet { width: 24px; height: 24px; font-size: 13px; border-width: 2px; }
  .sira .ad { font-size: 15px; }
  .sira .adet { font-size: 16px; min-width: 34px; }
  .sira.bos { font-size: 13px; padding: 8px; }

  html.tt-yatay #kok { display: flex; flex-direction: column; }
  html.tt-yatay #alan { grid-area: auto; }
  html.tt-yatay .at { font-size: 36px; }
</style>
</head>
<body>
<div id="zemin"></div>

<div id="kok" class="tt-oyun">

  <div id="ust" class="kutu">
    <div id="rozet">🏇</div>
    <div id="baslikSar">
      <div id="baslik">At Yarışı</div>
      <div id="cagri">1-6 yaz · atını seç</div>
    </div>
    <div class="rozetBuyuk" id="geriSayim">⏳ <span id="geriSn">0</span></div>
    <div id="sayac">
      <div id="sayacBuyuk">0</div>
      <div id="sayacKucuk">bahis</div>
    </div>
  </div>

  <div id="alan" class="kutu">
    <div id="seritler" style="flex:1;min-height:0;display:flex;flex-direction:column;gap:6px"></div>
    <div id="siralama"></div>
    <div id="kazanan">
      <div>
        <div class="kupa">🏆</div>
        <div class="kimAd" id="kazananAd">—</div>
        <div class="altYazi" id="kazananAlt">kazandı</div>
      </div>
    </div>
  </div>

  <div id="akis"></div>

</div>

<script src="_shared/tt.js"></script>
<script>
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) || d : d);

  const AT_SAYISI  = Math.max(2, Math.min(8, num('at', 6)));
  const BAHIS_SN   = num('bahis', 22);    // bahis penceresi
  const KUTLAMA_SN = num('kutlama', 8);
  const YARIS_SN   = num('sure', 22);     // yaklasik yaris suresi

  const ATLAR = [
    { ad: 'Rüzgâr',  renk: '#ff4d4d' },
    { ad: 'Şimşek',  renk: '#3fb9ff' },
    { ad: 'Yıldız',  renk: '#ffd23f' },
    { ad: 'Kasırga', renk: '#7ed957' },
    { ad: 'Kartal',  renk: '#ff5fc8' },
    { ad: 'Alev',    renk: '#ffa62b' },
    { ad: 'Gölge',   renk: '#a86bff' },
    { ad: 'Tufan',   renk: '#21d1a1' },
  ].slice(0, AT_SAYISI);

  // ---- durum ---------------------------------------------------------------
  let durum = 'bahis';           // bahis | yaris | bitti
  let sayacSn = BAHIS_SN;
  let bahisler = new Map();      // kid -> {ad, at, kat}
  let puanlar = new Map();       // kid -> {ad, puan}
  let ilerleme = [];             // her atin 0..1 arasi ilerlemesi
  let hiz = [];

  const seritlerEl = document.getElementById('seritler');
  const siralamaEl = document.getElementById('siralama');
  const kazananEl = document.getElementById('kazanan');
  const akisEl = document.getElementById('akis');
  let atEl = [], bahisEl = [];

  function akis(html) {
    const d = document.createElement('div');
    d.className = 'satir'; d.innerHTML = html;
    akisEl.innerHTML = ''; akisEl.appendChild(d);
    setTimeout(() => d.remove(), 3600);
  }

  // ---- seritleri kur -------------------------------------------------------
  ATLAR.forEach((a, i) => {
    const s = document.createElement('div');
    s.className = 'serit';
    s.innerHTML =
      `<div class="no" style="background:${a.renk}">${i + 1}</div>` +
      `<div class="atAd">${a.ad}</div>` +
      `<div class="bahis" data-i="${i}">0</div>` +
      `<div class="at" data-i="${i}">🏇</div>`;
    seritlerEl.appendChild(s);
    atEl.push(s.querySelector('.at'));
    bahisEl.push(s.querySelector('.bahis'));
  });

  // At, numara rozeti + isim etiketinin sagindan basliyor (CSS left:116px);
  // yol da oradan bitis seridine kadar.
  const BASLA = 116, BITIS_PAY = 46;

  function atlariYerlestir() {
    for (let i = 0; i < ATLAR.length; i++) {
      const en = atEl[i].parentNode.clientWidth;
      const yol = Math.max(0, en - BASLA - BITIS_PAY);
      atEl[i].style.transform = `translate(${ilerleme[i] * yol}px, -50%)`;
    }
  }

  function bahisSayilariCiz() {
    const say = new Array(ATLAR.length).fill(0);
    for (const b of bahisler.values()) say[b.at]++;
    for (let i = 0; i < ATLAR.length; i++) {
      bahisEl[i].textContent = say[i] ? say[i] + ' 👤' : '';
    }
    document.getElementById('sayacBuyuk').textContent = bahisler.size;
  }

  function siralamaCiz() {
    const list = [...puanlar.values()].sort((a, b) => b.puan - a.puan).slice(0, 5);
    if (!list.length) { siralamaEl.classList.remove('acik'); return; }
    siralamaEl.classList.add('acik');
    const MADALYA = ['🥇', '🥈', '🥉'];
    siralamaEl.innerHTML = list.map((o, i) => {
      const rz = MADALYA[i] || (i + 1);
      const stil = i < 3 ? `background:${['#ffd23f', '#d8dbe6', '#e29a5a'][i]}` : 'background:#6b5fb8;color:#fff';
      return `<div class="sira">
        <div class="rozet" style="${stil}">${rz}</div>
        <div class="ad">${o.ad}</div>
        <div class="adet">${o.puan}</div>
      </div>`;
    }).join('');
  }

  // ---- yaris ---------------------------------------------------------------
  function yarisBasla() {
    if (!bahisler.size) { sayacSn = BAHIS_SN; return; }   // kimse oynamadiysa bekle
    durum = 'yaris';
    ilerleme = ATLAR.map(() => 0);
    // Her ata farkli temel hiz + tur icinde degisen anlik hiz:
    // lider surekli degissin, son ana kadar belli olmasin.
    hiz = ATLAR.map(() => 0.85 + Math.random() * 0.3);
    document.getElementById('cagri').textContent = 'yarış sürüyor!';
    akis(`🚦 <b>START</b> — ${bahisler.size} bahis oynandı`);
  }

  let sonZaman = 0;
  function dongu(t) {
    requestAnimationFrame(dongu);
    if (!sonZaman) sonZaman = t;
    const dt = Math.min(0.05, (t - sonZaman) / 1000);
    sonZaman = t;

    if (durum === 'yaris') {
      let kazanan = -1;
      for (let i = 0; i < ATLAR.length; i++) {
        // Anlik hiz sallanmasi: bazen atilim, bazen yorulma
        hiz[i] += (Math.random() - 0.5) * 1.6 * dt;
        hiz[i] = Math.max(0.55, Math.min(1.5, hiz[i]));
        ilerleme[i] += (hiz[i] / YARIS_SN) * dt;
        if (ilerleme[i] >= 1) { ilerleme[i] = 1; if (kazanan < 0) kazanan = i; }
      }
      atlariYerlestir();
      if (kazanan >= 0) bitir(kazanan);
    }
  }

  function bitir(i) {
    durum = 'bitti';
    sayacSn = KUTLAMA_SN;
    const at = ATLAR[i];

    // Odul dagit: dogru bilen herkese puan, hediye kati varsa carpanla
    let kazananSayisi = 0;
    for (const [kid, b] of bahisler) {
      if (b.at !== i) continue;
      kazananSayisi++;
      const mevcut = puanlar.get(kid) || { ad: b.ad, puan: 0 };
      mevcut.ad = b.ad;
      mevcut.puan += 10 * (b.kat || 1);
      puanlar.set(kid, mevcut);
    }

    document.getElementById('kazananAd').textContent = `${i + 1}. ${at.ad}`;
    document.getElementById('kazananAlt').textContent =
      kazananSayisi ? `${kazananSayisi} kişi bildi` : 'kimse bilemedi';
    kazananEl.classList.add('acik');
    document.getElementById('cagri').textContent = at.ad + ' kazandı';
    akis(`🏆 <b style="color:${at.renk}">${at.ad}</b> <span class="ok">▸</span> ${kazananSayisi} kişi kazandı`);
    siralamaCiz();
  }

  function bahseDon() {
    durum = 'bahis';
    sayacSn = BAHIS_SN;
    bahisler = new Map();
    ilerleme = ATLAR.map(() => 0);
    atlariYerlestir();
    bahisSayilariCiz();
    kazananEl.classList.remove('acik');
    document.getElementById('cagri').textContent = '1-6 yaz · atını seç';
    akis('🏇 <b>YENİ YARIŞ</b> — atını seç, 1-' + ATLAR.length + ' yaz');
  }

  setInterval(() => {
    sayacSn -= 0.25;
    document.getElementById('geriSn').textContent = Math.max(0, Math.ceil(sayacSn));
    if (sayacSn <= 0) {
      if (durum === 'bahis') yarisBasla();
      else if (durum === 'bitti') bahseDon();
    }
  }, 250);

  // ---- olaylar -------------------------------------------------------------
  const kimlik = (u) => (u && (u.id || u.uniqueId)) || '';
  const isim = (u) => (u && (u.nickname || u.uniqueId)) || 'anon';

  TT.on('chat', (ev) => {
    if (durum !== 'bahis') return;
    const kid = kimlik(ev.user);
    if (!kid) return;
    const m = String(ev.comment || '').match(/\b([1-8])\b/);
    if (!m) return;
    const at = Number(m[1]) - 1;
    if (at < 0 || at >= ATLAR.length) return;

    const yeni = !bahisler.has(kid);
    bahisler.set(kid, { ad: isim(ev.user), at, kat: 1 });
    bahisSayilariCiz();
    if (yeni) {
      akis(`<span class="kim">${isim(ev.user)}</span> <span class="ok">▸</span> <b style="color:${ATLAR[at].renk}">${ATLAR[at].ad}</b>`);
    }
  });

  // Hediye: bahsi katlar — dogru bilirse daha cok puan.
  // Yarisi HIZLANDIRMIYOR: para verenin ati onde bitiyor olsa oyun sahte olur.
  TT.on('gift', (ev) => {
    const kid = kimlik(ev.user);
    const b = bahisler.get(kid);
    if (!b) return;
    b.kat = Math.min(5, (b.kat || 1) + 1);
    akis(`🎁 <span class="kim">${b.ad}</span> <span class="ok">▸</span> bahis x${b.kat}`);
  });

  // ---- basla ---------------------------------------------------------------
  ilerleme = ATLAR.map(() => 0);
  atlariYerlestir();
  bahisSayilariCiz();
  addEventListener('resize', atlariYerlestir);
  addEventListener('tt-yon', atlariYerlestir);
  requestAnimationFrame(dongu);

  TT.uyanis({
    baslik: 'AT YARIŞI',
    komutlar: ['1', '3', '6'],
    aciklama: 'Atının numarasını yaz, bahsini oyna · 🎁 hediye bahsini katlar',
    cagri: '1-' + ATLAR.length + ' arası yaz, atını seç',
  });
})();
</script>
</body>
</html>
