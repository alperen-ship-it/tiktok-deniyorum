<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>At Yarışı — sohbet bahis oynuyor</title>
<link rel="stylesheet" href="_shared/base.css">
<link rel="stylesheet" href="_shared/oyun-tema.css">
<style>
  /* At yarisinin cekiciligi atlardan degil BAHISTEN gelir. Izleyici
     yarismaci degil bahisci: 8 SABIT at var — kalici isim, kalici forma,
     tur ustu galibiyet sayisi. Sabit kadro zamanla taraftar biriktirir
     ("ben hep Şimşek'e oynarım"); her tur degisen rastgele atlarda bu bag
     kurulamazdi. Jelle'nin takim kimligi dersi burada, gercekten sabit
     kadronun oldugu yerde uygulaniyor. */
  #orta { flex: 1; min-height: 0; display: flex; gap: 14px; }

  /* ---- saha: 8 kulvar ---- */
  #sahaKutu { flex: 1; min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .kulvar {
    flex: 1; min-height: 0; position: relative;
    background: rgba(0, 0, 0, .26);
    border: 3px solid var(--cizgi);
    border-radius: 12px;
    overflow: hidden;
  }
  /* Bitis: damali serit */
  .kulvar::after {
    content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 14px;
    background: repeating-linear-gradient(180deg, #fff 0 9px, #17123a 9px 18px);
    opacity: .85;
  }
  .kInfo {
    position: absolute; left: 0; top: 0; bottom: 0; width: 292px;
    display: flex; align-items: center; gap: 9px; padding: 0 10px;
    background: rgba(10, 6, 30, .45);
    border-right: 3px solid var(--cizgi);
    z-index: 2;
  }
  .kNo {
    flex: none; width: 34px; height: 34px; border-radius: 9px;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 900; color: #17123a;
    border: 3px solid var(--cizgi);
  }
  .kForma { flex: none; width: 44px; height: 32px; }
  .kForma img { width: 100%; height: 100%; display: block; }
  .kAdSar { flex: 1; min-width: 0; }
  .kAd {
    font-size: var(--tip-isim); font-weight: 900; text-transform: uppercase;
    letter-spacing: -.3px; line-height: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kGalibiyet { font-size: 17px; font-weight: 800; color: var(--altin); margin-top: 2px; }

  .kAt {
    position: absolute; left: 304px; top: 50%;
    z-index: 3; will-change: transform;
  }
  .kAt .govde {
    font-size: 46px; line-height: 1; display: inline-block;
    transform: translateY(-50%) scaleX(-1);   /* emoji sola bakiyor; yaris saga */
  }
  /* Dortnal sallantisi: transform-only, GPU'suz renderda da ucuz */
  #sahaKutu.kosuyor .kAt .govde { animation: dortnal .36s ease-in-out infinite alternate; }
  @keyframes dortnal {
    from { transform: translateY(-50%) scaleX(-1) translateY(-3px) rotate(-2deg); }
    to   { transform: translateY(-50%) scaleX(-1) translateY(3px) rotate(2deg); }
  }
  html.tt-lite #sahaKutu.kosuyor .kAt .govde { animation: none; }

  /* ---- sag ray: faza gore icerik degistirir ---- */
  #ray { flex: none; width: 470px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #fazKutu { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  #fazBaslik {
    font-size: 17px; font-weight: 900; letter-spacing: 1.6px;
    color: #a89ce0; padding: 0 4px 4px; flex: none;
  }
  .fSatir {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0, 0, 0, .32); border-radius: 12px; padding: 7px 11px;
  }
  .fSatir .fNo {
    flex: none; width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center;
    font-size: 17px; font-weight: 900; color: #17123a; border: 3px solid var(--cizgi);
  }
  .fSatir .fForma { flex: none; width: 38px; height: 27px; }
  .fSatir .fForma img { width: 100%; height: 100%; display: block; }
  .fSatir .fAd {
    flex: 1; min-width: 0; font-size: var(--tip-kucuk); font-weight: 900;
    text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fSatir .fSag {
    flex: none; font-size: var(--tip-kucuk); font-weight: 900; color: var(--altin);
    font-variant-numeric: tabular-nums;
  }
  .fSatir .fKucuk { flex: none; font-size: 19px; font-weight: 800; color: #a89ce0; font-variant-numeric: tabular-nums; }
  .fSatir.bos { justify-content: center; color: #8a7fc4; font-weight: 800; font-size: var(--tip-kucuk); padding: 13px; }

  #liderlikKutu { flex: none; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  #liderlikKutu::before {
    content: 'EN İYİ BAHİSÇİLER';
    font-size: 17px; font-weight: 900; letter-spacing: 1.6px;
    color: #a89ce0; padding: 0 4px 4px;
  }

  #geriSayimSar { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div id="zemin"></div>

<div id="kok" class="tt-oyun">

  <div id="ust" class="kutu">
    <div id="rozet">🏇</div>
    <div id="baslikSar">
      <div id="baslik">At Yarışı</div>
      <div id="cagri">atının numarasını yaz · bahsini oyna</div>
    </div>
    <div id="geriSayimSar">
      <div class="rozetBuyuk" id="turRozet">KOŞU <span id="turNo">1</span></div>
      <div class="rozetBuyuk" id="geriSayim">⏳ <span id="geriSn">0</span></div>
    </div>
    <div id="sayac">
      <div id="sayacBuyuk">0</div>
      <div id="sayacKucuk">bahis</div>
    </div>
  </div>

  <div id="orta">
    <div id="sahaKutu" class="kutu">
      <!-- kulvarlar JS ile kuruluyor -->
      <div id="kazanan"></div>
    </div>

    <div id="ray">
      <div id="fazKutu" class="kutu">
        <div id="fazBaslik">ORAN TAHTASI</div>
        <div id="fazIc" style="display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow:hidden"></div>
      </div>
      <div id="liderlikKutu" class="kutu"></div>
    </div>
  </div>

  <div id="akis"></div>

</div>

<script src="_shared/tt.js"></script>
<script src="_shared/kimlik.js"></script>
<script src="_shared/spiker.js"></script>
<script src="_shared/finis.js"></script>
<script>
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) || d : d);

  const BAHIS_SN   = num('bahis', 25);
  const YARIS_SN   = num('sure', 20);
  const KUTLAMA_SN = num('kutlama', 10);

  // SABIT KADRO — isimler ve formalar tasarlanmis, hash'e birakilmamis.
  // Galibiyet sayilari localStorage'da: kadro yayindan yayina tarih biriktirir.
  const ATLAR = [
    { ad: 'Şimşek',  renk: '#ffd23f', ikincil: '#17123a', desen: 'cizgi' },
    { ad: 'Poyraz',  renk: '#3fb9ff', ikincil: '#ffffff', desen: 'yarim' },
    { ad: 'Fırtına', renk: '#ff4d4d', ikincil: '#ffffff', desen: 'halka' },
    { ad: 'Karayel', renk: '#21d1a1', ikincil: '#17123a', desen: 'duz' },
    { ad: 'Bozkır',  renk: '#e0b06b', ikincil: '#17123a', desen: 'benek' },
    { ad: 'Sedef',   renk: '#ff5fc8', ikincil: '#ffffff', desen: 'burgu' },
    { ad: 'Duman',   renk: '#b9aee8', ikincil: '#17123a', desen: 'benek' },
    { ad: 'Rüzgar',  renk: '#7ed957', ikincil: '#17123a', desen: 'yarim' },
  ];

  let galibiyet;
  try { galibiyet = JSON.parse(localStorage.getItem('tt-at-galibiyet')) || []; }
  catch { galibiyet = []; }
  while (galibiyet.length < ATLAR.length) galibiyet.push(0);

  // Formalari bir kez pisir
  ATLAR.forEach((a) => {
    a.formaURL = Kimlik.formaPisir(a.renk, a.ikincil, a.desen).toDataURL();
    // Kazanan karti icin 4x buyuk surum — kucugu buyutunce bulaniyor
    a.formaBuyukURL = Kimlik.formaPisir(a.renk, a.ikincil, a.desen, 4).toDataURL();
  });

  // ---- durum ---------------------------------------------------------------
  let durum = 'bahis';           // bahis | yaris | bitti
  let sayacSn = BAHIS_SN;
  let turNo = Number(localStorage.getItem('tt-at-kosu') || 1);
  let bahisler = new Map();      // kid -> {ad, at, kat}
  let puanlar = new Map();       // kid -> {ad, puan} — localStorage yedekli
  let ilerleme = ATLAR.map(() => 0);
  let hiz = ATLAR.map(() => 1);
  let fotoFinisDendi = false, sonDuzlukDendi = false;
  let sonLider = -1;

  try {
    for (const [kid, o] of JSON.parse(localStorage.getItem('tt-at-puan') || '[]')) puanlar.set(kid, o);
  } catch { /* bozuk kayit -> sifirdan */ }

  const sahaEl = document.getElementById('sahaKutu');
  const fazIcEl = document.getElementById('fazIc');
  const fazBaslikEl = document.getElementById('fazBaslik');
  const liderlikEl = document.getElementById('liderlikKutu');
  const kazananEl = document.getElementById('kazanan');
  Spiker.kur(document.getElementById('akis'));

  // ---- kulvarlar -----------------------------------------------------------
  const atEl = [];
  ATLAR.forEach((a, i) => {
    const k = document.createElement('div');
    k.className = 'kulvar';
    k.innerHTML = `
      <div class="kInfo">
        <div class="kNo" style="background:${a.renk}">${i + 1}</div>
        <div class="kForma"><img alt="" src="${a.formaURL}"></div>
        <div class="kAdSar">
          <div class="kAd">${a.ad}</div>
          <div class="kGalibiyet">🏆 ${galibiyet[i]}</div>
        </div>
      </div>
      <div class="kAt"><span class="govde">🏇</span></div>`;
    sahaEl.insertBefore(k, kazananEl);
    atEl.push(k.querySelector('.kAt'));
  });

  const BASLA = 304, BITIS_PAY = 34;
  function atlariYerlestir() {
    for (let i = 0; i < ATLAR.length; i++) {
      const en = atEl[i].parentNode.clientWidth;
      const yol = Math.max(0, en - BASLA - BITIS_PAY - 46);
      atEl[i].style.transform = `translateX(${(ilerleme[i] * yol).toFixed(1)}px)`;
    }
  }

  // ---- oranlar (pari-mutuel) ----------------------------------------------
  // Gercek hipodrom mantigi: oran sabit degil, havuzdan gelir. Az oynanan
  // at kazanirsa cok oder — kalabaligin tersine oynamak odullenir ve
  // oranlar kendi kendini dengeler.
  function oranlar() {
    const say = new Array(ATLAR.length).fill(0);
    for (const b of bahisler.values()) say[b.at]++;
    const havuz = bahisler.size;
    return say.map((n) => {
      if (!havuz || !n) return null;             // hic oynanmamis: oran yok
      return Math.max(1.2, Math.min(15, havuz / n));
    });
  }

  // ---- ray fazlari ---------------------------------------------------------
  function fSatir(i, sag, kucuk) {
    const a = ATLAR[i];
    return `<div class="fSatir">
      <div class="fNo" style="background:${a.renk}">${i + 1}</div>
      <div class="fForma"><img alt="" src="${a.formaURL}"></div>
      <div class="fAd">${a.ad}</div>
      ${kucuk ? `<div class="fKucuk">${kucuk}</div>` : ''}
      <div class="fSag">${sag}</div>
    </div>`;
  }

  function rayOran() {
    fazBaslikEl.textContent = 'ORAN TAHTASI';
    const o = oranlar();
    const say = new Array(ATLAR.length).fill(0);
    for (const b of bahisler.values()) say[b.at]++;
    fazIcEl.innerHTML = ATLAR.map((a, i) =>
      fSatir(i, o[i] ? 'x' + o[i].toFixed(1) : '—', say[i] ? say[i] + '👤' : '')
    ).join('');
  }

  function rayPozisyon() {
    fazBaslikEl.textContent = 'CANLI POZİSYON';
    const sira = ATLAR.map((a, i) => i).sort((x, y) => ilerleme[y] - ilerleme[x]);
    fazIcEl.innerHTML = sira.map((i, poz) =>
      fSatir(i, (poz + 1) + '.', Math.round(ilerleme[i] * 100) + '%')
    ).join('');
  }

  function rayOdeme(kazananAt, dagitilan) {
    fazBaslikEl.textContent = 'ÖDEMELER';
    if (!dagitilan.length) {
      fazIcEl.innerHTML = fSatir(kazananAt, 'kazandı') +
        '<div class="fSatir bos">kimse bilemedi — puanlar yandı</div>';
      return;
    }
    fazIcEl.innerHTML = fSatir(kazananAt, 'kazandı') + dagitilan.slice(0, 7).map((d) =>
      `<div class="fSatir">${Kimlik.cip(d.kid, 30)}<div class="fAd">${d.ad}</div><div class="fSag">+${d.kazanc}</div></div>`
    ).join('');
  }

  function liderlikCiz() {
    const list = [...puanlar.entries()]
      .map(([kid, o]) => ({ kid, ...o }))
      .sort((a, b) => b.puan - a.puan).slice(0, 5);
    liderlikEl.innerHTML = list.length
      ? list.map((o, i) =>
          `<div class="fSatir">
            <div class="fNo" style="background:${['#ffd23f', '#d8dbe6', '#e29a5a', '#6b5fb8', '#6b5fb8'][i]};color:${i > 2 ? '#fff' : '#17123a'}">${i + 1}</div>
            ${Kimlik.cip(o.kid, 30)}
            <div class="fAd">${o.ad}</div>
            <div class="fSag">${o.puan}</div>
          </div>`).join('')
      : '<div class="fSatir bos">ilk koşu sonrası dolacak</div>';
  }

  function sayacCiz() {
    document.getElementById('sayacBuyuk').textContent = bahisler.size;
    document.getElementById('turNo').textContent = turNo;
    document.getElementById('geriSn').textContent = Math.max(0, Math.ceil(sayacSn));
  }

  // ---- yaris ---------------------------------------------------------------
  function yarisBasla() {
    if (!bahisler.size) { sayacSn = BAHIS_SN; return; }
    durum = 'yaris';
    ilerleme = ATLAR.map(() => 0);
    hiz = ATLAR.map(() => 0.85 + Math.random() * 0.3);
    fotoFinisDendi = false; sonDuzlukDendi = false; sonLider = -1;
    sahaEl.classList.add('kosuyor');
    document.getElementById('cagri').textContent = 'koşu sürüyor!';
    Spiker.soyle(`🚦 <b>KAPILAR AÇILDI</b> — ${bahisler.size} bahis`, { oncelik: 3 });
  }

  let sonZaman = 0, rayZaman = 0;
  function dongu(t) {
    requestAnimationFrame(dongu);
    if (!sonZaman) sonZaman = t;
    let dt = Math.min(0.05, (t - sonZaman) / 1000);
    sonZaman = t;
    dt *= Finis.carpan;                      // foto finiste agir cekim

    if (durum !== 'yaris') return;

    let birinci = -1, enIleri = -1;
    for (let i = 0; i < ATLAR.length; i++) {
      hiz[i] += (Math.random() - 0.5) * 1.6 * dt;
      hiz[i] = Math.max(0.55, Math.min(1.5, hiz[i]));
      ilerleme[i] += (hiz[i] / YARIS_SN) * dt;
      if (ilerleme[i] > enIleri) { enIleri = ilerleme[i]; birinci = i; }
      if (ilerleme[i] >= 1 && durum === 'yaris') { ilerleme[i] = 1; bitir(i); }
    }
    atlariYerlestir();

    // Spiker olaylari
    if (durum === 'yaris') {
      if (birinci !== sonLider && sonLider >= 0 && enIleri > 0.15 && enIleri < 0.88) {
        Spiker.soyle('⚡ ' + Spiker.sec(
          ['<b>%s</b> öne geçiyor!', '<b>%s</b> başı aldı!', '<b>%s</b> dışarıdan geliyor!', '<b>%s</b> temposunu artırdı!'],
          ATLAR[birinci].ad), { oncelik: 2, anahtar: 'lider' });
      }
      sonLider = birinci;

      if (!sonDuzlukDendi && enIleri > 0.78) {
        sonDuzlukDendi = true;
        Spiker.soyle('🔥 <b>SON DÜZLÜK!</b>', { oncelik: 3 });
      }

      // Foto finis: ilk iki at arasi %2.5'ten az ve cizgiye yaklasildi
      if (!fotoFinisDendi && enIleri > 0.9) {
        const sirali = [...ilerleme].sort((a, b) => b - a);
        if (sirali[0] - sirali[1] < 0.025) {
          fotoFinisDendi = true;
          Finis.agirCekim(2, 0.3);
          Spiker.soyle('🎬 <b>FOTO FİNİŞ!</b>', { oncelik: 3 });
        }
      }
      if ((t - rayZaman) > 250) { rayZaman = t; rayPozisyon(); }
    }
  }

  function bitir(i) {
    durum = 'bitti';
    sayacSn = KUTLAMA_SN;
    sahaEl.classList.remove('kosuyor');
    const at = ATLAR[i];

    galibiyet[i]++;
    localStorage.setItem('tt-at-galibiyet', JSON.stringify(galibiyet));
    sahaEl.querySelectorAll('.kGalibiyet')[i].textContent = '🏆 ' + galibiyet[i];

    // Odeme: pari-mutuel oran uzerinden. Hediye kati carpani (kat) burada
    // devreye girer — yarisi HIZLANDIRMAZ, sadece dogru bilenin odulunu buyutur.
    const o = oranlar()[i] || 2;
    const dagitilan = [];
    for (const [kid, b] of bahisler) {
      if (b.at !== i) continue;
      const kazanc = Math.round(10 * o * (b.kat || 1));
      const m = puanlar.get(kid) || { ad: b.ad, puan: 0 };
      m.ad = b.ad; m.puan += kazanc;
      puanlar.set(kid, m);
      dagitilan.push({ kid, ad: b.ad, kazanc });
    }
    dagitilan.sort((a, b) => b.kazanc - a.kazanc);
    localStorage.setItem('tt-at-puan', JSON.stringify([...puanlar.entries()].slice(0, 100)));

    Finis.kart(kazananEl, {
      url: at.formaBuyukURL,
      isim: at.ad,
      alt: dagitilan.length
        ? `#${i + 1} · oran x${o.toFixed(1)} · ${dagitilan.length} bahisçi kazandı`
        : `#${i + 1} · kimseye yatan yok — sürpriz koşu`,
    });
    document.getElementById('cagri').textContent = at.ad + ' kazandı';
    Spiker.soyle(`🏆 <b>${at.ad}</b> ` + (dagitilan.length ? `— ${dagitilan.length} bahisçiye ödeme` : '— kimse görmedi bunu'),
      { oncelik: 3, sure: 4500 });
    rayOdeme(i, dagitilan);
    liderlikCiz();
  }

  function bahseDon() {
    durum = 'bahis';
    sayacSn = BAHIS_SN;
    turNo++;
    localStorage.setItem('tt-at-kosu', String(turNo));
    bahisler = new Map();
    ilerleme = ATLAR.map(() => 0);
    atlariYerlestir();
    Finis.kapat(kazananEl);
    document.getElementById('cagri').textContent = 'atının numarasını yaz · bahsini oyna';
    rayOran(); sayacCiz();
    Spiker.soyle(`🏇 <b>${turNo}. KOŞU</b> — 1-${ATLAR.length} yaz, bahsini oyna`, { oncelik: 2 });
  }

  setInterval(() => {
    sayacSn -= 0.25;
    if (sayacSn <= 0) {
      if (durum === 'bahis') yarisBasla();
      else if (durum === 'bitti') bahseDon();
    }
    document.getElementById('geriSn').textContent = Math.max(0, Math.ceil(sayacSn));
  }, 250);

  // ---- olaylar -------------------------------------------------------------
  const kimlik = (u) => (u && (u.id || u.uniqueId)) || '';
  const isim = (u) => (u && (u.nickname || u.uniqueId)) || 'anon';

  // At adiyla da bahis: "şimşek" yazan 1'e oynamis olur
  const adTablo = new Map(ATLAR.map((a, i) =>
    [a.ad.toLocaleLowerCase('tr').replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g')
      .replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c'), i]));

  TT.on('chat', (ev) => {
    if (durum !== 'bahis') return;
    const kid = kimlik(ev.user);
    if (!kid) return;
    const metin = String(ev.comment || '');
    let at = -1;
    const m = metin.match(/\b([1-8])\b/);
    if (m) at = Number(m[1]) - 1;
    else {
      const sade = metin.toLocaleLowerCase('tr').replace(/ı/g, 'i').replace(/ş/g, 's')
        .replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c')
        .replace(/[^a-z]/g, '');
      if (adTablo.has(sade)) at = adTablo.get(sade);
    }
    if (at < 0 || at >= ATLAR.length) return;

    const yeni = !bahisler.has(kid);
    const onceki = bahisler.get(kid);
    bahisler.set(kid, { ad: isim(ev.user), at, kat: (onceki && onceki.kat) || 1 });
    rayOran(); sayacCiz();
    if (yeni) {
      Spiker.soyle(`<span class="kim">${isim(ev.user)}</span> ▸ <b style="color:${ATLAR[at].renk}">${ATLAR[at].ad}</b>`,
        { oncelik: 1 });
    }
  });

  // Hediye: bahsi katlar (x5'e kadar). Yarisi HIZLANDIRMAZ — para verenin
  // ati one gecseydi izleyici bunu anlar, oyun sahtelesirdi.
  TT.on('gift', (ev) => {
    const b = bahisler.get(kimlik(ev.user));
    if (!b) return;
    b.kat = Math.min(5, (b.kat || 1) + 1);
    Spiker.soyle(`🎁 <span class="kim">${b.ad}</span> bahsini katladı — x${b.kat}`, { oncelik: 2 });
  });

  // ---- basla ---------------------------------------------------------------
  atlariYerlestir();
  rayOran(); liderlikCiz(); sayacCiz();
  addEventListener('resize', atlariYerlestir);
  requestAnimationFrame(dongu);

  TT.uyanis({
    baslik: 'AT YARIŞI',
