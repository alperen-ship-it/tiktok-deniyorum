<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Durum Kartı — dışarıdan çekilen veri</title>
<link rel="stylesheet" href="_shared/base.css">
<style>
  /* Bu bir OYUN degil, kose widget'i — sıkı alanı kullanmasina gerek yok,
     ama olu bolgelerin disinda durmali. */
  #kart {
    position: fixed;
    top: var(--dz-ust);
    left: var(--dz-sol);
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px 12px 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(16,18,28,.93), rgba(28,30,45,.93));
    border: 1px solid rgba(255,255,255,.14);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .35s, transform .35s;
  }
  #kart.gorunur { opacity: 1; transform: none; }

  /* Sag ust / sag alt / sol alt kose secenekleri */
  html.kose-sag-ust  #kart { left: auto; right: var(--dz-sag); }
  html.kose-sol-alt  #kart { top: auto; bottom: var(--dz-alt); }
  html.kose-sag-alt  #kart { top: auto; bottom: var(--dz-alt); left: auto; right: var(--dz-sag); }

  #gorsel {
    width: 62px; height: 62px;
    object-fit: contain;
    flex: none;
    display: none;
  }
  #gorsel.var { display: block; }

  #metin { min-width: 0; }

  #baslik {
    font-size: 11px; font-weight: 800; letter-spacing: 2.5px;
    opacity: .6; margin-bottom: 1px;
  }
  #anaDeger {
    font-size: 30px; font-weight: 900; letter-spacing: -.6px;
    line-height: 1.05;
    white-space: nowrap;
  }
  #altSatir {
    font-size: 15px; opacity: .88; margin-top: 2px;
    display: flex; align-items: center; gap: 10px;
  }
  .artis { color: #7ee787; font-weight: 800; }
  .azalis { color: #ff6b6b; font-weight: 800; }
  .nokta { opacity: .35; }

  #hata {
    font-size: 14px; color: #ff8fa3; font-weight: 700;
  }

  html.tt-yatay #anaDeger { font-size: 26px; }
  html.tt-yatay #gorsel { width: 52px; height: 52px; }
</style>
</head>
<body>

<div id="kart" class="tt-oyun">
  <img id="gorsel" alt="">
  <div id="metin">
    <div id="baslik">—</div>
    <div id="anaDeger">—</div>
    <div id="altSatir"></div>
  </div>
</div>

<script src="_shared/tt.js"></script>
<script>
(() => {
  'use strict';

  const q = new URLSearchParams(location.search);

  // ?kaynak=valorant   hangi veri kaynagini gosterecegi (veri-kaynaklari.json'daki "ad")
  // ?baslik=RANK       ust satirdaki kucuk etiket
  // ?ana=rank          buyuk gosterilecek alan
  // ?alt=puan,sonMac   alt satirda gosterilecek alanlar (virgulle)
  // ?gorsel=gorsel     gorsel olarak kullanilacak alan
  // ?kose=sag-ust      sol-ust (varsayilan) | sag-ust | sol-alt | sag-alt
  // ?ek=RR             alt satirdaki ilk degerin sonuna eklenecek birim
  const KAYNAK = q.get('kaynak') || '';
  const ANA    = q.get('ana') || 'rank';
  const ALT    = (q.get('alt') || 'puan,sonMac').split(',').map((s) => s.trim()).filter(Boolean);
  const GORSEL = q.get('gorsel') || 'gorsel';
  const EK     = q.get('ek') || '';
  const KOSE   = q.get('kose') || 'sol-ust';

  if (KOSE !== 'sol-ust') document.documentElement.classList.add('kose-' + KOSE);
  document.getElementById('baslik').textContent = q.get('baslik') || (KAYNAK || 'DURUM').toUpperCase();

  const el = {
    kart: document.getElementById('kart'),
    gorsel: document.getElementById('gorsel'),
    ana: document.getElementById('anaDeger'),
    alt: document.getElementById('altSatir'),
  };

  /** Sayiyi isaretiyle goster: +19 yesil, -12 kirmizi. */
  function degisimYaz(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return `<span>${TT.esc(v)}</span>`;
    if (n > 0) return `<span class="artis">▲ ${n}</span>`;
    if (n < 0) return `<span class="azalis">▼ ${Math.abs(n)}</span>`;
    return `<span style="opacity:.6">— 0</span>`;
  }

  TT.on('veri', (ev) => {
    // Birden fazla kaynak varsa sadece bizimkini dinle
    if (KAYNAK && ev.kaynak !== KAYNAK) return;

    el.kart.classList.add('gorunur');

    if (ev.hata) {
      el.gorsel.classList.remove('var');
      el.ana.innerHTML = '<span id="hata">veri alınamadı</span>';
      el.alt.textContent = ev.hata.slice(0, 60);
      return;
    }

    const a = ev.alanlar || {};

    // Gorsel
    const g = a[GORSEL];
    if (g && typeof g === 'string' && /^https?:\/\//.test(g)) {
      el.gorsel.src = g;
      el.gorsel.classList.add('var');
    } else {
      el.gorsel.classList.remove('var');
    }

    // Ana deger
    el.ana.textContent = a[ANA] != null && a[ANA] !== '' ? String(a[ANA]) : '—';

    // Alt satir: ilk alan duz, sonrakiler degisim gostergesi olarak
    const parcalar = [];
    ALT.forEach((ad, i) => {
      const v = a[ad];
      if (v == null || v === '') return;
      if (i === 0) {
        parcalar.push(`<span>${TT.esc(String(v))}${EK ? ' ' + TT.esc(EK) : ''}</span>`);
      } else {
        parcalar.push(degisimYaz(v));
      }
    });
    el.alt.innerHTML = parcalar.join('<span class="nokta">·</span>');
  });

  // Hic veri gelmezse ne yapilacagini soyle
  setTimeout(() => {
    if (el.kart.classList.contains('gorunur')) return;
    el.kart.classList.add('gorunur');
    el.ana.innerHTML = '<span id="hata">veri kaynağı yok</span>';
    el.alt.textContent = 'server/veri-kaynaklari.json oluştur';
  }, 6000);
})();
</script>
</body>
</html>
