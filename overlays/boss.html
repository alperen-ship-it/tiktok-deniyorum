<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Boss Dövüşü — sohbet birlikte savaşır</title>
<link rel="stylesheet" href="_shared/base.css">
<style>
  /* Sahne, TikTok arayuzunun kapladigi olu bolgelerin DISINDA duruyor.
     Paylar _shared/base.css'te --dz-* degiskenleriyle tanimli, URL'den
     ayarlanabiliyor. Yerlesimi gormek icin: ?guvenli=1 */
  #sahne {
    position: fixed;
    top: var(--dz-ust); bottom: var(--dz-alt);
    left: var(--dz-sol); right: var(--dz-sag);
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 6px;
  }

  #ust { width: min(760px, 100%); flex: none; }

  #bossAd { font-size: 26px; font-weight: 900; letter-spacing: -.3px; text-align: center; }
  #bossAlt { font-size: 13px; text-align: center; opacity: .6; letter-spacing: 2px; margin-bottom: 9px; }

  #canDis {
    position: relative; height: 34px; border-radius: 17px;
    background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.18); overflow: hidden;
  }
  /* Gecikmeli hayalet bar: vurusun ne kadar yediginin gozle gorulmesini saglar */
  #canHayalet { position: absolute; inset: 0 auto 0 0; background: rgba(255,255,255,.45); transition: width .55s ease .18s; }
  #canIc      { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg,#ff3b5c,#ff7a3d); transition: width .18s linear; }
  #canYazi {
    position: absolute; inset: 0; display: grid; place-content: center;
    font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
  }

  #fazlar { display: flex; gap: 4px; margin-top: 5px; }
  .faz { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); }
  .faz.gecti { background: var(--tt-pink); }

  #komboSar { margin-top: 8px; }

  #orta { flex: 1; display: grid; place-content: center; position: relative; width: 100%; }
  /* Guvenli alan daraldigi icin sabit px yerine oranli buyukluk */
  #boss { font-size: clamp(90px, 22vmin, 260px); line-height: 1; user-select: none; transform-origin: 50% 80%; animation: sallan 3.2s ease-in-out infinite; }
  @keyframes sallan { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-14px) rotate(1.5deg); } }
  #boss.vuruldu { animation: vurul .18s ease; }
  @keyframes vurul {
    0%   { transform: translateX(0) scale(1); filter: brightness(3); }
    30%  { transform: translateX(-14px) scale(1.06); filter: brightness(3); }
    100% { transform: translateX(0) scale(1); filter: brightness(1); }
  }
  #boss.olu { animation: ol 1.1s cubic-bezier(.4,0,.6,1) forwards; }
  @keyframes ol { to { transform: translateY(120px) rotate(85deg) scale(.6); opacity: 0; } }

  #alt { width: min(760px, 100%); flex: none; }
  #talimat { text-align: center; font-size: 17px; margin-bottom: 10px; line-height: 1.6; }
  #talimat b { color: var(--tt-cyan); }
  #talimat .h { color: var(--tt-pink); }
  #talimat .k { color: #7ee787; }

  #liste { display: flex; flex-direction: column; gap: 5px; }
  .satir {
    display: flex; align-items: center; gap: 9px; padding: 6px 12px;
    border-radius: 10px; background: rgba(10,12,20,.68); font-size: 15px;
  }
  .satir .sira { width: 20px; opacity: .55; font-weight: 800; }
  .satir img { width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .satir .ad { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .satir .hasar { font-variant-numeric: tabular-nums; font-weight: 800; color: #ffb84d; }
  .satir.birinci { background: linear-gradient(90deg, rgba(255,184,77,.28), rgba(10,12,20,.68)); }

  canvas#fx { position: fixed; inset: 0; pointer-events: none; }

  /* Ulti sirasinda ekrani boyayan katman */
  #ekranTon {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity .18s;
  }

  #zafer {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    background: rgba(0,0,0,.62); opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  #zafer.on { opacity: 1; }
  #zafer .b {
    font-size: 72px; font-weight: 900; letter-spacing: -3px;
    background: linear-gradient(180deg,#fff,#ffb84d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: patla .6s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes patla { from { transform: scale(.3); opacity: 0; } }
  #zafer .k { font-size: 22px; opacity: .9; margin-top: 8px; }
  #zafer .mvp { font-size: 26px; margin-top: 14px; color: #ffb84d; font-weight: 800; }

  html.tt-vertical #bossAd { font-size: 21px; }
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div id="ekranTon"></div>

<div id="sahne" class="tt-oyun">
  <div id="ust">
    <div id="bossAd">—</div>
    <div id="bossAlt">SEVİYE 1</div>
    <div id="canDis"><div id="canHayalet"></div><div id="canIc"></div><div id="canYazi">—</div></div>
    <div id="fazlar"><div class="faz"></div><div class="faz"></div><div class="faz"></div><div class="faz"></div></div>
    <div id="komboSar"></div>
  </div>

  <div id="orta"><div id="boss">🐉</div></div>

  <div id="alt">
    <div id="talimat">
      <b>Yaz</b> = saldır · <span class="k">beğeni</span> = sohbet gücünü doldur · <span class="h">hediye</span> = ULTİ
    </div>
    <div id="liste"></div>
  </div>
</div>

<div id="zafer"><div>
  <div class="b">BOSS DÜŞTÜ!</div>
  <div class="k" id="zaferAlt"></div>
  <div class="mvp" id="mvp"></div>
</div></div>

<script src="_shared/tt.js"></script>
<script src="_shared/ulti.js"></script>
<script>
(() => {
  'use strict';

  const q = new URLSearchParams(location.search);
  const BAS_HP   = Number(q.get('hp')) || 4000;
  const BUYUME   = Number(q.get('buyume')) || 1.6;
  const VURUS    = Number(q.get('vurus')) || 10;
  const HEDIYE_K = Number(q.get('hediye')) || 5;
  const LISTE_N  = Number(q.get('liste')) || 5;
  const KOMBO    = Number(q.get('kombo')) || 150;   // kombo bari hedefi

  const BOSSLAR = [
    { ad: 'Kızıl Ejder',     emoji: '🐉' },
    { ad: 'Kadim Gulyabani', emoji: '👹' },
    { ad: 'Çelik Muhafız',   emoji: '🤖' },
    { ad: 'Derin Kraken',    emoji: '🦑' },
    { ad: 'Piksel İblisi',   emoji: '👾' },
    { ad: 'Kemik Kralı',     emoji: '💀' },
    { ad: 'Kayıp Titan',     emoji: '🦖' },
    { ad: 'Gölge Kedisi',    emoji: '🐈‍⬛' },
  ];

  const el = {
    ad: document.getElementById('bossAd'),
    alt: document.getElementById('bossAlt'),
    canIc: document.getElementById('canIc'),
    canHayalet: document.getElementById('canHayalet'),
    canYazi: document.getElementById('canYazi'),
    fazlar: [...document.querySelectorAll('.faz')],
    boss: document.getElementById('boss'),
    liste: document.getElementById('liste'),
    zafer: document.getElementById('zafer'),
    zaferAlt: document.getElementById('zaferAlt'),
    mvp: document.getElementById('mvp'),
    ton: document.getElementById('ekranTon'),
  };

  let seviye = 0, maxHp = BAS_HP, hp = BAS_HP, olu = false;
  const hasarlar = new Map();

  // Kombo bari: yorum ve begenilerle doluyor, dolunca BEDAVA takim ultisi.
  // Hediye gonderemeyen izleyicinin de "ulti attim" hissi yasamasi icin.
  const kombo = ULTI.KomboBari({
    hedef: KOMBO,
    kap: document.getElementById('komboSar'),
    dolunca: () => ulti({ nickname: 'SOHBET', uniqueId: '__sohbet__' }, ULTI.TAKIM, maxHp * 0.10),
  });

  function bossKur() {
    const b = BOSSLAR[seviye % BOSSLAR.length];
    const tur = Math.floor(seviye / BOSSLAR.length);
    el.ad.textContent = b.ad + (tur ? ' ' + '★'.repeat(Math.min(tur, 5)) : '');
    el.alt.textContent = 'SEVİYE ' + (seviye + 1);
    el.boss.textContent = b.emoji;
    el.boss.className = '';
    maxHp = Math.round(BAS_HP * Math.pow(BUYUME, seviye));
    hp = maxHp;
    olu = false;
    canCiz();
  }

  function canCiz() {
    const oran = Math.max(0, hp / maxHp);
    el.canIc.style.width = oran * 100 + '%';
    el.canHayalet.style.width = oran * 100 + '%';
    el.canYazi.textContent = `${TT.short(Math.max(0, Math.ceil(hp)))} / ${TT.short(maxHp)}`;
    el.fazlar.forEach((f, i) => f.classList.toggle('gecti', oran <= (3 - i) / 4));
  }

  let listeZaman = 0;
  function listeCiz(zorla) {
    const t = performance.now();
    if (!zorla && t - listeZaman < 250) return;   // her vuruşta DOM kurmak pahali
    listeZaman = t;
    const ilk = [...hasarlar.values()].sort((a, b) => b.hasar - a.hasar).slice(0, LISTE_N);
    el.liste.replaceChildren(...ilk.map((k, i) => {
      const d = document.createElement('div');
      d.className = 'satir' + (i === 0 ? ' birinci' : '');
      d.innerHTML =
        `<span class="sira">${i + 1}</span><img src="${TT.esc(k.avatar)}" alt="">` +
        `<span class="ad">${TT.esc(k.ad)}</span><span class="hasar">${TT.short(Math.round(k.hasar))}</span>`;
      return d;
    }));
  }

  function hasarYaz(user, miktar) {
    const id = user?.uniqueId || 'anon';
    let k = hasarlar.get(id);
    if (!k) { k = { ad: user?.nickname || id, avatar: TT.avatar(user), hasar: 0 }; hasarlar.set(id, k); }
    k.hasar += miktar;
  }

  function vur(user, miktar, tip) {
    if (olu || miktar <= 0) return;
    hp -= miktar;
    hasarYaz(user, miktar);
    canCiz();
    listeCiz();
    hasarYazisi(miktar, tip);

    el.boss.classList.remove('vuruldu');
    void el.boss.offsetWidth;
    el.boss.classList.add('vuruldu');

    if (hp <= 0) oldu();
  }

  // ---- ULTI ---------------------------------------------------------------
  function ulti(user, kademe, hasar) {
    if (olu) return;

    ULTI.duyur(user?.nickname || user?.uniqueId || '?', kademe, 1500);
    ekranTonu(kademe.renk, kademe.guc);
    sarsinti(10 + kademe.guc * 6);
    ultiEfekti(kademe);

    // Ulti hasari tek seferde degil, birkac vuruşta insin: bar erirken izlemek
    // "buyuk bir sey oldu" hissini guclendiriyor.
    const parca = 6;
    for (let i = 0; i < parca; i++) {
      setTimeout(() => {
        if (olu) return;
        hp -= hasar / parca;
        hasarYaz(user, hasar / parca);
        canCiz();
        listeCiz();
        if (i === parca - 1) { hasarYazisi(hasar, 'ulti'); listeCiz(true); }
        if (hp <= 0) oldu();
      }, 180 + i * 90);
    }
  }

  // ---- olaylar ------------------------------------------------------------
  TT.on('chat', (ev) => {
    const kritik = Math.random() < 0.12;
    const temel = VURUS + Math.floor(Math.random() * VURUS * 0.5);
    vur(ev.user, kritik ? temel * 3 : temel, kritik ? 'kritik' : 'chat');
    kombo.ekle(1);
  });

  TT.on('like', (ev) => {
    const n = Math.min(20, ev.likes || 1);
    vur(ev.user, n, 'like');
    kombo.ekle(n * 0.5);      // begeni asil olarak KOMBO'yu doldurur
  });

  TT.on('follow', (ev) => { vur(ev.user, VURUS * 12, 'buff'); kombo.ekle(15); });
  TT.on('share',  (ev) => { vur(ev.user, VURUS * 8,  'buff'); kombo.ekle(10); });

  TT.on('gift', (ev) => {
    if (ev.gift.streaking) return;
    const deger = ev.gift.value || ev.gift.diamonds * (ev.gift.count || 1);
    const k = ULTI.kademe(deger);

    // İNFAZ (en ust kademe) yuzdesel calisir: dev bosslarda bile his verir.
    const hasar = k.guc >= 5
      ? Math.max(deger * HEDIYE_K, maxHp * 0.35)
      : Math.max(VURUS * 6 * k.guc, deger * HEDIYE_K);

    ulti(ev.user, k, hasar);
  });

  TT.on('subscribe', (ev) => ulti(ev.user, ULTI.kademe(500), maxHp * 0.12));

  function oldu() {
    olu = true; hp = 0; canCiz();
    el.boss.className = 'olu';
    const ilk = [...hasarlar.values()].sort((a, b) => b.hasar - a.hasar)[0];
    el.zaferAlt.textContent = `Seviye ${seviye + 1} tamamlandı`;
    el.mvp.textContent = ilk ? `⭐ ${ilk.ad} — ${TT.short(Math.round(ilk.hasar))} hasar` : '';
    el.zafer.classList.add('on');
    patlama(200);
    setTimeout(() => {
      el.zafer.classList.remove('on');
      seviye++; hasarlar.clear(); listeCiz(true); bossKur();
    }, 5200);
  }

  // ---- efektler -----------------------------------------------------------
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;

  function boyut() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', boyut); boyut();

  let yazilar = [], parcalar = [], mermiler = [], simsekler = [];
  let sars = 0;

  function bossMerkez() {
    const r = el.boss.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, r };
  }

  function hasarYazisi(miktar, tip) {
    const m = bossMerkez();
    const renk = tip === 'ulti' ? '#fff' : tip === 'kritik' ? '#ffd93d' : tip === 'like' ? '#ff8fab' : '#fff';
    const buyuk = tip === 'ulti' || tip === 'kritik';
    yazilar.push({
      x: m.x + (Math.random() - .5) * m.r.width * 0.6,
      y: m.y - m.r.height * 0.05,
      vx: (Math.random() - .5) * 60, vy: -110 - Math.random() * 70,
      metin: (tip === 'kritik' ? 'KRİTİK ' : '') + TT.short(Math.round(miktar)),
      renk, boy: tip === 'ulti' ? 56 : buyuk ? 40 : 24, omur: 1,
    });
    if (yazilar.length > 60) yazilar = yazilar.slice(-60);
  }

  function ekranTonu(renk, guc) {
    el.ton.style.background =
      `radial-gradient(circle at 50% 45%, ${renk}00 30%, ${renk}${guc >= 4 ? '55' : '33'} 100%)`;
    el.ton.style.opacity = '1';
    setTimeout(() => { el.ton.style.opacity = '0'; }, 500 + guc * 120);
  }

  /** Her ulti kademesinin kendi gorseli var — sadece sayi buyumesin. */
  function ultiEfekti(k) {
    const m = bossMerkez();

    if (k.guc === 1) {
      // ATES TOPU: yanlardan gelen tek bir alev
      mermiler.push({ x: -60, y: H * 0.5, hx: m.x, hy: m.y, emoji: '🔥', boy: 62, t: 0, sure: 0.45 });

    } else if (k.guc === 2) {
      // YILDIRIM: yukaridan zikzak deşarjlar
      for (let i = 0; i < 5; i++) {
        simsekler.push({ x: m.x + (Math.random() - .5) * 220, omur: 1, gecikme: i * 0.06 });
      }

    } else if (k.guc === 3) {
      // METEOR YAGMURU: ustten cok sayida meteor
      for (let i = 0; i < 14; i++) {
        const bx = m.x + (Math.random() - .5) * 320;
        mermiler.push({
          x: bx - 240, y: -80 - Math.random() * 260, hx: bx, hy: m.y + (Math.random() - .5) * 90,
          emoji: '☄️', boy: 40, t: -i * 0.05, sure: 0.5,
        });
      }

    } else if (k.guc === 4) {
      // KIYAMET: yerden yukselen lav sutunlari + agir parcacik
      for (let i = 0; i < 10; i++) {
        mermiler.push({
          x: m.x + (Math.random() - .5) * 300, y: H + 60,
          hx: m.x + (Math.random() - .5) * 200, hy: m.y, emoji: '🌋', boy: 52,
          t: -i * 0.04, sure: 0.55,
        });
      }
      patlama(120);

    } else {
      // INFAZ: ekran karar, tek dev vurus
      mermiler.push({ x: m.x, y: -160, hx: m.x, hy: m.y, emoji: '💀', boy: 150, t: 0, sure: 0.5 });
      patlama(220);
    }
  }

  function patlama(n) {
    const m = bossMerkez();
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, h = 120 + Math.random() * 620;
      parcalar.push({
        x: m.x, y: m.y, vx: Math.cos(a) * h, vy: Math.sin(a) * h - 160,
        r: 2 + Math.random() * 5, omur: 1,
        renk: ['#ffb84d', '#ff3b5c', '#fff', '#25f4ee'][(Math.random() * 4) | 0],
      });
    }
    if (parcalar.length > 700) parcalar = parcalar.slice(-700);
  }

  function sarsinti(g) { sars = Math.max(sars, g); }

  const yaziTipi = () => getComputedStyle(document.body).fontFamily;

  TT.loop((dt) => {
    ctx.clearRect(0, 0, W, H);

    if (sars > 0.2) {
      sars *= Math.pow(0.001, dt);
      document.getElementById('sahne').style.transform =
        `translate(${(Math.random() - .5) * sars}px, ${(Math.random() - .5) * sars}px)`;
    } else if (sars) {
      sars = 0;
      document.getElementById('sahne').style.transform = '';
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    // --- ulti mermileri (baslangictan bossa dogru) ---
    for (const mm of mermiler) {
      mm.t += dt;
      if (mm.t < 0) continue;
      const o = Math.min(1, mm.t / mm.sure);
      const x = mm.x + (mm.hx - mm.x) * o;
      const y = mm.y + (mm.hy - mm.y) * o;
      ctx.save();
      ctx.globalAlpha = o >= 1 ? Math.max(0, 1 - (mm.t - mm.sure) * 3) : 1;
      ctx.font = `${mm.boy}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
      ctx.fillText(mm.emoji, x, y);
      ctx.restore();
      if (o >= 1 && !mm.carpti) { mm.carpti = true; patlama(22); sarsinti(6); }
    }
    mermiler = mermiler.filter((m) => m.t < m.sure + 0.4);

    // --- simsekler ---
    for (const s of simsekler) {
      s.gecikme -= dt;
      if (s.gecikme > 0) continue;
      s.omur -= dt / 0.28;
      if (s.omur <= 0) continue;
      const m = bossMerkez();
      ctx.save();
      ctx.globalAlpha = Math.max(0, s.omur);
      ctx.strokeStyle = '#ffd93d';
      ctx.lineWidth = 4;
      ctx.beginPath();
      let yy = 0, xx = s.x;
      ctx.moveTo(xx, yy);
      while (yy < m.y) { yy += 26; xx += (Math.random() - .5) * 46; ctx.lineTo(xx, yy); }
      ctx.stroke();
      ctx.restore();
    }
    simsekler = simsekler.filter((s) => s.omur > 0);

    // --- hasar yazilari ---
    for (const y of yazilar) {
      y.vy += 130 * dt; y.x += y.vx * dt; y.y += y.vy * dt;
      y.omur -= dt / 1.15;
      if (y.omur <= 0) continue;
      ctx.save();
      ctx.globalAlpha = Math.min(1, y.omur * 1.7);
      ctx.font = `900 ${y.boy}px ${yaziTipi()}`;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.85)';
      ctx.strokeText(y.metin, y.x, y.y);
      ctx.fillStyle = y.renk;
      ctx.fillText(y.metin, y.x, y.y);
      ctx.restore();
    }
    yazilar = yazilar.filter((y) => y.omur > 0);

    // --- parcaciklar ---
    for (const p of parcalar) {
      p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.omur -= dt / 1.9;
      if (p.omur <= 0) continue;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.omur));
      ctx.fillStyle = p.renk;
      ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }
    ctx.globalAlpha = 1;
    parcalar = parcalar.filter((p) => p.omur > 0 && p.y < H + 80);
  });

  bossKur();
  listeCiz(true);
})();
</script>
</body>
</html>
