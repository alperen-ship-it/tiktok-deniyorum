<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Bilgi Yarışması — ilk doğru cevap kazanır</title>
<link rel="stylesheet" href="_shared/base.css">
<link rel="stylesheet" href="_shared/oyun-tema.css">
<style>
  /* KIMLIK RENGI — Bilgi: turkuaz — yuksek parlaklik, sikistirmada saglam.
     Rotasyonda izleyici bu oyunu BASLIGI OKUMADAN taniyabilsin diye. */
  :root { --oyun-renk: #4fd6c9; }
  /* TikTok'un kendi viral formati (TikTok Trivia) uyarlamasi. Yazma
     rekabetini DOGRUDAN kullanir: soru cikar, sohbete A/B/C/D yazilir,
     ILK dogru cevaplayan en cok puani alir. Spam odullendirmez —
     hiz + bilgi kazandirir, o yuzden ekran da sakin kalir. */
  #orta { flex: 1; min-height: 0; display: flex; gap: 14px; }
  #sahne { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

  /* ---- soru karti ---- */
  #soruKutu { flex: none; padding: 22px 26px; position: relative; overflow: hidden; }
  #kategori {
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    color: var(--soluk); text-transform: uppercase;
  }
  #soru {
    margin-top: 8px;
    font-size: 46px; font-weight: 700; line-height: 1.15;
    color: var(--murekkep);
  }
  /* Sure cubugu: kartin alt kenari boyunca akar */
  #sureCubuk {
    position: absolute; left: 0; bottom: 0; height: 7px;
    background: var(--altin); width: 100%;
    transition: width .25s linear;
  }
  #sureCubuk.az { background: var(--mercan); }

  /* ---- siklar ---- */
  #siklar { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .sik {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 16px;
    padding: 0 22px;
    background: var(--panel); border: 2px solid var(--cizgi); border-radius: 20px;
    box-shadow: 0 5px 0 rgba(12, 8, 34, .55);
    transition: background .35s ease, opacity .35s ease;
  }
  .sik .harf {
    flex: none; width: 62px; height: 62px; border-radius: 16px;
    display: grid; place-items: center;
    font-size: 34px; font-weight: 900; color: #191434;
    background: var(--soluk); border: 2px solid var(--cizgi);
  }
  .sik .metin { flex: 1; min-width: 0; font-size: 34px; font-weight: 700; color: var(--murekkep); }
  /* Kac kisi bu sikki secti — cevap acilinca gorunur */
  .sik .oy {
    flex: none; font-size: var(--tip-kucuk); font-weight: 900; color: var(--soluk);
    font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .3s ease;
  }
  .sik.acik .oy { opacity: 1; }
  .sik.dogru { background: #1f5c3a; }
  .sik.dogru .harf { background: #7ed957; }
  .sik.yanlis { opacity: .38; }
  .sik.elendi { opacity: .22; }   /* begeni ipucuyla elenen sik */

  /* ---- sag ray ---- */
  #ray { flex: none; width: 470px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #ipucuKutu { flex: none; padding: 12px 14px; }
  #ipucuBaslik {
    font-size: 26px; font-weight: 900; letter-spacing: 1.2px; color: var(--soluk);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  #ipucuYol {
    margin-top: 8px; height: 14px; border-radius: 8px;
    background: rgba(0, 0, 0, .3); overflow: hidden;
  }
  #ipucuDolu { height: 100%; width: 0; background: var(--altin); transition: width .3s ease; }

  #tabloKutu { flex: 1; min-height: 0; padding: 8px 6px; overflow: hidden; }
  #tabloKutu::before {
    content: '🏆 TUR PUAN TABLOSU'; display: block;
    font-size: 26px; font-weight: 900; letter-spacing: 1.2px;
    color: var(--soluk); padding: 4px 12px 6px;
  }
  .seri { flex: none; font-size: 28px; font-weight: 900; color: var(--mercan); }

  /* ---- ilk dogru bilenler seridi ---- */
  #hizli { flex: none; min-height: 46px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hizliFis {
    display: flex; align-items: center; gap: 8px;
    background: rgba(246, 201, 79, .14); border: 2px solid var(--cizgi);
    border-radius: 999px; padding: 5px 14px 5px 6px;
    font-size: var(--tip-kucuk); font-weight: 700; color: var(--murekkep);
    animation: fisGel .3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fisGel { from { transform: scale(.7); opacity: 0; } }
  html.tt-lite .hizliFis { animation: none; }
  .hizliFis b { color: var(--altin); }

  /* ======================================================================
     DIKEY (varsayilan) — PLAN-DIKEY B/bilgi. Tuval 1080x1920.
     SAHNE 960x672: soru karti 250 + 4 sik satiri (96) ; PANO 460x490: ilk 6.
     UST / KOMUT / SPIKER / KAZANAN kabuktan gelir. Yatay kurallar (yukarida)
     html.tt-yatay icin oldugu gibi kalir; burada yalnizca dikey ezilir.
     Hareket: yalniz transform + opacity (sure cubugu, ipucu cubugu, oy cubugu
     scaleX; width/background gecisi YOK).
     ====================================================================== */
  #sureRozet { display: none; }
  .dikeyMetin { display: none; }
  .sik .bar { display: none; }
  html.tt-dikey #sureRozet { display: inline-flex; }
  /* UST 960x128: baslik + durum satiri + 2 cip + sayac sigsin diye cipler dar */
  html.tt-dikey #ust { gap: 12px; }
  html.tt-dikey #ust .rozetBuyuk { padding: 4px 12px; }
  html.tt-dikey #soruNo .soz { display: none; }
  html.tt-dikey #hizli { display: none; }
  html.tt-dikey .yatayMetin { display: none; }
  html.tt-dikey .dikeyMetin { display: inline; }
  html.tt-dikey #orta { display: flex; gap: 0; }
  html.tt-dikey #sahne { gap: 14px; }
  html.tt-dikey #ray { display: contents; }

  html.tt-dikey #soruKutu {
    flex: none; height: 250px; box-sizing: border-box; padding: 12px 26px 0;
    border-radius: 22px;
  }
  html.tt-dikey #kategori { font-size: 30px; line-height: 40px; height: 40px; letter-spacing: 1.5px; white-space: nowrap; overflow: hidden; }
  html.tt-dikey #soru { margin-top: 4px; font-size: 52px; line-height: 1.1; height: 184px; overflow: hidden; }
  html.tt-dikey #sureCubuk {
    height: 10px; width: 100%; transform: scaleX(var(--oran, 1)); transform-origin: left center;
    transition: transform .25s linear;
  }

  /* ipucu cubugu: soru kartinin sag ust kosesi, tek satir */
  html.tt-dikey #ipucuKutu {
    position: absolute; z-index: 2;
    left: calc(var(--dk-sahne-x) + 380px); top: calc(var(--dk-sahne-y) + 12px);
    width: 554px; height: 40px; box-sizing: border-box;
    padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none;
    display: flex; align-items: center; gap: 12px;
  }
  html.tt-dikey #ipucuBaslik { display: contents; font-size: 30px; letter-spacing: 0; }
  html.tt-dikey #ipucuBaslik > span { font-size: 30px; font-weight: 900; color: var(--soluk); white-space: nowrap; letter-spacing: 0; }
  html.tt-dikey #ipucuBaslik > span:first-child { order: 1; }
  html.tt-dikey #ipucuBaslik > span:last-child { order: 3; }
  html.tt-dikey #ipucuYol { order: 2; flex: 1; min-width: 40px; margin-top: 0; height: 16px; }
  html.tt-dikey #ipucuDolu { width: 100%; transform: scaleX(var(--oran, 0)); transform-origin: left center; transition: transform .3s ease; }

  html.tt-dikey #siklar { flex: none; display: grid; grid-template-columns: 1fr; grid-auto-rows: 96px; gap: 8px; }
  html.tt-dikey .sik {
    height: 96px; box-sizing: border-box; gap: 18px; padding: 0 20px; border-radius: 22px;
    transition: opacity .35s ease;
  }
  html.tt-dikey .sik .bar {
    display: block; position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
    background: rgba(255, 255, 255, .12);
    transform: scaleX(0); transform-origin: left center;
    transition: transform .6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  html.tt-dikey .sik.acik .bar { transform: scaleX(var(--p, 0)); }
  html.tt-dikey .sik > :not(.bar) { position: relative; }
  html.tt-dikey .sik .harf { width: 72px; height: 72px; border-radius: 18px; font-size: 44px; }
  html.tt-dikey .sik .metin { font-size: 44px; line-height: 1.05; }
  html.tt-dikey .sik .oy { font-size: 34px; }

  /* PANO: 460x490 — ilk 6 puan */
  html.tt-dikey #tabloKutu {
    position: absolute; z-index: 2;
    left: var(--dk-pano-x); top: var(--dk-pano-y);
    width: var(--dk-pano-w); height: var(--dk-pano-h); box-sizing: border-box;
    display: flex; flex-direction: column; padding: 8px 6px; overflow: hidden;
  }
  html.tt-dikey #tabloKutu::before { content: '🏆 TUR TABLOSU'; flex: none; font-size: 30px; letter-spacing: .5px; padding: 2px 10px 6px; }
  html.tt-dikey #tabloIc { flex: 1; min-height: 0; overflow: hidden; }
  html.tt-dikey #tabloIc .sira { padding: 5px 8px; gap: 10px; }
  html.tt-dikey #tabloIc .ad { line-height: 1.02; }
  html.tt-dikey #tabloIc .adet { font-size: 36px; min-width: 0; }
  html.tt-dikey #tabloIc .seri { font-size: 30px; }
  html.tt-dikey #tabloKutu.cevap::before { content: '✍️ CEVAP VERENLER'; }
  html.tt-dikey #tabloIc .sira .tik { flex: none; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 30px; font-weight: 900; background: #7ed957; color: #191434; border: 3px solid var(--cizgi); }
  html.tt-dikey #tabloIc .sira.bos { font-size: 34px; line-height: 1.15; text-align: center; }
</style>
</head>
<body>
<div id="zemin"></div>

<div id="kok" class="tt-oyun">

  <div id="ust" class="kutu">
    <div id="rozet">🧠</div>
    <div id="baslikSar">
      <div id="baslik">Bilgi Yarışması</div>
      <div id="cagri">ilk doğru en çok puanı alır</div>
    </div>
    <div id="komut"><span class="yazEt">YAZ</span> <span id="komutMetin">A · B · C · D</span></div>
    <div class="rozetBuyuk" id="soruNo"><span class="soz">SORU </span><span id="soruSayi">1</span></div>
    <div class="rozetBuyuk" id="sureRozet">⏳ <span id="sureSn">25</span></div>
    <div id="sayac">
      <div id="sayacBuyuk">0</div>
      <div id="sayacKucuk">yarışan</div>
    </div>
  </div>

  <div id="orta">
    <div id="sahne">
      <div id="soruKutu" class="kutu">
        <div id="kategori">GENEL</div>
        <div id="soru">Hazırlanıyor…</div>
        <div id="sureCubuk"></div>
      </div>
      <div id="siklar"></div>
      <div id="hizli"></div>
    </div>

    <div id="ray">
      <div id="ipucuKutu" class="kutu">
        <div id="ipucuBaslik"><span><span class="yatayMetin">❤️ İPUCU BARI</span><span class="dikeyMetin">❤️ İPUCU</span></span><span id="ipucuDurum">beğeni gönder</span></div>
        <div id="ipucuYol"><div id="ipucuDolu"></div></div>
      </div>
      <div id="tabloKutu" class="kutu"><div id="tabloIc"></div></div>
    </div>
  </div>

  <div id="akis"></div>

</div>

<script src="_shared/tt.js"></script>
<script src="_shared/kimlik.js"></script>
<script src="_shared/profil.js"></script>
<script src="_shared/spiker.js"></script>
<script src="_shared/finis.js"></script>
<script src="_shared/ulti.js"></script>
<script src="_shared/juice.js"></script>
<script src="_shared/ses.js"></script>
<script src="_shared/sorular.js"></script>
<script>
(function () {
  'use strict';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) || d : d);

  const SORU_SN  = num('sure', 25);     // cevap penceresi
  const ACIK_SN  = num('acik', 9);      // cevap gosterim suresi
  const IPUCU    = num('ipucu', 60);    // kac begeni bir sikki eler
  /* Bir TUR kac soru. Yarismanin basi ve sonu olmasi icin: "SORU 12/40"
     gormek, izleyiciye devam eden ve biten bir sey oldugunu anlatiyor;
     sonsuz soru akisi turnuva hissi vermiyordu. Tur bitince sampiyon
     acilaniyor ve tur tablosu sifirlaniyor. */
  const TUR_SORU = Math.max(5, Math.min(200, num('soru', 40)));

  const HARFLER = ['A', 'B', 'C', 'D'];

  // ---- durum ---------------------------------------------------------------
  let soru = null, soruIdx = -1;
  let durum = 'soru';          // soru | acik
  let kalanSn = SORU_SN;
  let cevaplar = new Map();    // kid -> {ad, sik, sira, kat}
  let elenen = new Set();      // ipucuyla elenen sik indeksleri
  let begeniSayaci = 0;
  let soruSayisi = Number(localStorage.getItem('tt-bilgi-no') || 1);

  // Kalici tablo: kid -> {ad, puan, dogru, seri, enIyiSeri}
  let tablo = new Map();
  try {
    for (const [k, v] of JSON.parse(localStorage.getItem('tt-bilgi-tablo') || '[]')) tablo.set(k, v);
  } catch { /* sifirdan */ }

  /* ---- TUR (40 soruluk yarisma) ----
     Deste: turun basinda 40 FARKLI soru karilip siraya diziliyor. Eskiden
     her soru bagimsiz rastgele seciliyordu ve 40 soruluk bir turda ayni
     soru rahatlikla iki kez cikabiliyordu. */
  let deste = [], destePos = 0;
  /* Tur ilerlemesi diske yaziliyor: merkez oyun degistirince iframe
     bastan yukleniyor ve tur 1/40'a donuyordu — 40 soruluk yarisma
     hicbir zaman bitmiyordu. Artik kaldigi yerden devam ediyor. */
  try {
    const kayit = JSON.parse(localStorage.getItem('tt-bilgi-deste') || 'null');
    if (kayit && Array.isArray(kayit.d) && kayit.d.length && kayit.p < kayit.d.length) {
      deste = kayit.d; destePos = kayit.p;
    }
  } catch { /* sifirdan */ }
  let turNo = Number(localStorage.getItem('tt-bilgi-tur') || 1);
  let turTablo = new Map();     // bu turun puanlari: kid -> {ad, puan, dogru, seri, enIyiSeri}

  function desteKar() {
    const idx = SORULAR.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    // Soru bankasi turdan kisaysa bastan devam et (79 soru / 40'lik tur -> sorun yok)
    deste = [];
    while (deste.length < TUR_SORU) deste = deste.concat(idx);
    deste = deste.slice(0, TUR_SORU);
    destePos = 0;
    desteKaydet();
  }
  function desteKaydet() {
    try { localStorage.setItem('tt-bilgi-deste', JSON.stringify({ d: deste, p: destePos })); }
    catch { /* olsun */ }
  }
  if (!deste.length) desteKar();

  const soruEl = document.getElementById('soru');
  const katEl = document.getElementById('kategori');
  const siklarEl = document.getElementById('siklar');
  const cubukEl = document.getElementById('sureCubuk');
  const hizliEl = document.getElementById('hizli');
  const tabloEl = document.getElementById('tabloIc');
  const ipucuDoluEl = document.getElementById('ipucuDolu');
  const ipucuDurumEl = document.getElementById('ipucuDurum');
  const sureSnEl = document.getElementById('sureSn');
  const uidler = new Map();
  const DIKEY = !!TT.dikey;

  Spiker.kur(document.getElementById('akis'));

  /* Cubuklar: dikeyde width DEGIL scaleX (yalniz transform animasyonu);
     yatayda eskisi gibi width. */
  function cubukYaz(el, oran) {
    if (DIKEY) el.style.setProperty('--oran', String(oran));
    else el.style.width = (oran * 100).toFixed(1) + '%';
  }

  /* Soru metnini kartin 184px yuksekligine sigdir: 56px -> 40px (PLAN B/bilgi). */
  function soruSigdir() {
    if (!DIKEY) return;
    for (let px = 56; px >= 40; px -= 2) {
      soruEl.style.fontSize = px + 'px';
      if (soruEl.scrollHeight <= soruEl.clientHeight) return;
    }
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(soruSigdir);

  /* Liste satiri: ad textContent ile (ham HTML yok). */
  function kimCipi(kid, boyut) {
    const k = document.createElement('span');
    k.innerHTML = Kimlik.cip(kid, boyut);   // yalniz kimlik gorseli (ad yok)
    return k.firstChild;
  }

  // ---- soru akisi ----------------------------------------------------------
  function yeniSoru() {
    Ses.cal('start');
    Ses.muzik('bilgi');
    durum = 'soru';
    kalanSn = SORU_SN;
    cevaplar = new Map();
    elenen = new Set();
    begeniSayaci = 0;
    cubukYaz(ipucuDoluEl, 0);
    ipucuDurumEl.textContent = 'beğeni gönder';
    hizliEl.textContent = '';

    // Turun destesinden sirayla — tur icinde ayni soru iki kez cikmaz
    if (destePos >= deste.length) desteKar();
    const i = deste[destePos];

    soruIdx = i;
    /* SIKLARI KARISTIR. Iki sebep:
       1) Banka elle yazildigi icin dogru cevaplar dengesiz dagilmisti
          (B %58). Hep "B" yazan biri hicbir sey bilmeden kazanirdi.
       2) Ayni soru sonraki turda ayni sirayla cikmasin — cevabin YERINI
          ezberlemek, cevabi bilmek degildir.
       Karistirma her gosterimde yapiliyor, bankaya dokunmuyoruz. */
    const ham = SORULAR[i];
    const sira = [0, 1, 2, 3];
    for (let a = 3; a > 0; a--) {
      const bb = Math.floor(Math.random() * (a + 1));
      [sira[a], sira[bb]] = [sira[bb], sira[a]];
    }
    soru = { s: ham.s, k: ham.k, c: sira.map((k) => ham.c[k]), d: sira.indexOf(ham.d) };
    katEl.textContent = soru.k;
    soruEl.textContent = soru.s;
    soruSigdir();
    document.getElementById('soruSayi').textContent = (destePos + 1) + '/' + TUR_SORU;

    siklarEl.textContent = '';
    soru.c.forEach((metin, k) => {
      const sik = document.createElement('div');
      sik.className = 'sik'; sik.dataset.k = String(k);
      const bar = document.createElement('div'); bar.className = 'bar';
      const harf = document.createElement('div'); harf.className = 'harf'; harf.textContent = HARFLER[k];
      const m = document.createElement('div'); m.className = 'metin'; m.textContent = metin;
      const oy = document.createElement('div'); oy.className = 'oy'; oy.dataset.oy = String(k); oy.textContent = '0';
      sik.append(bar, harf, m, oy);
      siklarEl.appendChild(sik);
    });

    cubukEl.classList.remove('az');
    cubukYaz(cubukEl, 1);
    document.getElementById('cagri').textContent = DIKEY ? 'ilk doğru en çok puan' : 'ilk doğru en çok puanı alır';
    sureSnEl.textContent = Math.ceil(kalanSn);
    sayacCiz();
    panoCiz();
  }

  function cevabiAc() {
    Ses.muzikDur(0.3);
    durum = 'acik';
    kalanSn = ACIK_SN;

    // Sik oylarini goster, dogruyu isaretle
    const oySay = [0, 0, 0, 0];
    for (const c of cevaplar.values()) oySay[c.sik]++;
    const oyToplam = Math.max(1, oySay[0] + oySay[1] + oySay[2] + oySay[3]);
    siklarEl.querySelectorAll('.sik').forEach((el) => {
      const k = Number(el.dataset.k);
      el.style.setProperty('--p', String(oySay[k] / oyToplam));
      el.classList.add('acik');
      el.querySelector('.oy').textContent = oySay[k] + ' 👤';
      el.classList.add(k === soru.d ? 'dogru' : 'yanlis');
    });

    // Puanlama: ilk dogru en cok alir (hiz odulu), sonrakiler azalarak
    const dogrular = [...cevaplar.entries()]
      .filter(([, c]) => c.sik === soru.d)
      .sort((a, b) => a[1].sira - b[1].sira);

    dogrular.forEach(([kid, c], sira) => {
      /* Siraya gore normalize: taban HER ZAMAN tepenin yarisi.
         Eskiden sabit 8 puan dusuyordu ve 30'da tabana vuruyordu —
         yani 9. siradan sonra 200 kisi de ayni puani aliyordu, oyun
         onlari ayirt etmeyi birakiyordu. */
      const taban = dogrular.length <= 1
        ? 100
        : Math.round(100 - (sira / (dogrular.length - 1)) * 50);
      const t = tablo.get(kid) || { ad: c.ad, puan: 0, dogru: 0, seri: 0, enIyiSeri: 0 };
      t.ad = c.ad;
      t.seri = (t.seri || 0) + 1;
      t.enIyiSeri = Math.max(t.enIyiSeri || 0, t.seri);
      // Seri carpani: ust uste dogru bilmek katlanarak odullendirilir
      const carpan = Math.min(3, 1 + (t.seri - 1) * 0.25) * (c.kat || 1);
      const kazanc = Math.round(taban * carpan);
      t.puan += kazanc;
      t.dogru += 1;
      if (!Kimlik.botMu(kid)) {
        Profil.ekle(kid, c.ad, { bilgiDogru: 1, xp: Math.round(kazanc / 4) });
        tablo.set(kid, t);
        // Tur tablosu: ekranda gosterilen, tur sonunda sifirlanan puan
        const tt = turTablo.get(kid) || { ad: c.ad, puan: 0, dogru: 0 };
        tt.ad = c.ad; tt.puan += kazanc; tt.dogru += 1;
        turTablo.set(kid, tt);
      }
    });
    // Yanlis bilenin serisi kirilir
    for (const [kid, c] of cevaplar) {
      if (c.sik === soru.d) continue;
      const t = tablo.get(kid);
      if (t) { t.seri = 0; tablo.set(kid, t); }
    }
    localStorage.setItem('tt-bilgi-tablo',
      JSON.stringify([...tablo.entries()].sort((a, b) => b[1].puan - a[1].puan).slice(0, 150)));

    // Ilk dogru bilenler seridi
    hizliEl.textContent = '';
    dogrular.slice(0, 6).forEach(([kid, c], i) => {
      const f = document.createElement('div'); f.className = 'hizliFis';
      const ad = document.createElement('span'); ad.textContent = c.ad;
      f.append(kimCipi(kid, 30), ad);
      if (i === 0) { f.append(' '); const b = document.createElement('b'); b.textContent = 'EN HIZLI'; f.append(b); }
      hizliEl.appendChild(f);
    });
    if (!dogrular.length) {
      const f = document.createElement('div'); f.className = 'hizliFis';
      f.style.background = 'rgba(0,0,0,.25)'; f.textContent = 'kimse bilemedi 😶';
      hizliEl.appendChild(f);
    }

    if (dogrular.length) {
      Ses.cal('dogru');
      const [kid, c] = dogrular[0];
      const t = tablo.get(kid);
      Juice.konfeti({ y: 0.42, adet: 26 });
      Spiker.satir(['⚡ ', { kim: c.ad }, ' ilk doğru cevabı verdi!']
        .concat(t && t.seri > 2 ? [' ', { b: t.seri + ' SERİ' }] : []), { oncelik: 3, sure: 4200 });
      if (!Kimlik.botMu(kid)) {
        TT.soyle(`🧠 Doğru cevap: ${soru.c[soru.d]} — en hızlı @${uidler.get(kid) || c.ad}! 🎉`);
      }
    } else {
      Ses.cal('yanlis');
      Spiker.soyle(`😶 Kimse bilemedi — doğrusu: <b>${soru.c[soru.d]}</b>`, { oncelik: 2, sure: 4000 });
    }

    soruSayisi++;
    destePos++;
    localStorage.setItem('tt-bilgi-no', String(soruSayisi));
    panoCiz();
    document.getElementById('cagri').textContent = DIKEY ? '✔ cevap açıldı' : 'doğru cevap: ' + soru.c[soru.d];

    if (destePos >= TUR_SORU) turBitir();
    desteKaydet();

    /* Merkeze haber SORU sinirinda gider. Sorunun ortasinda kesilmek
       izleyici icin kotu; soru arasi ise temiz bir kesit. Tur (40 soru)
       kaldigi yerden devam ettigi icin yarisma yarim kalmiyor — sadece
       arada baska oyunlar oynaniyor. Eskiden turun tamaminin bitmesi
       bekleniyordu ve trivia yayinin yarisindan fazlasini yiyordu. */
    try { if (parent !== window) parent.postMessage({ tt: 'tur-bitti' }, '*'); } catch { /* tek basina */ }
  }

  /* 40 soru doldu: turun sampiyonu aciklanir, tur tablosu sifirlanir,
     yeni deste karilir. Kalici (tum zamanlar) tablo silinmez. */
  function turBitir() {
    const sira = [...turTablo.entries()].sort((a, b) => b[1].puan - a[1].puan);
    const kazanan = sira[0];
    if (kazanan) {
      const [kid, t] = kazanan;
      Juice.konfeti({ y: 0.4, adet: 90 });
      Spiker.satir(['🏆 ', { b: turNo + '. TUR BİTTİ' }, ' — şampiyon ', { kim: t.ad }, ' · ' + t.puan + ' puan'],
        { oncelik: 4, sure: 7000 });
      TT.soyle(`🏆 ${turNo}. tur bitti! Şampiyon: @${uidler.get(kid) || t.ad} — ${t.puan} puan. ` +
        `Yeni tur başlıyor, ${TUR_SORU} soru!`);
    } else {
      Spiker.soyle(`🏁 <b>${turNo}. TUR BİTTİ</b> — yeni tur başlıyor`, { oncelik: 4, sure: 5000 });
    }
    turNo++;
    localStorage.setItem('tt-bilgi-tur', String(turNo));
    turTablo = new Map();
    desteKar();
  }

  // ---- goruntu -------------------------------------------------------------
  /* Ekrandaki tablo TURUN tablosu: 40 soruluk yarismanin puani. Boylece
     sonradan gelen biri de "yetisebilirim" diyor — tum zamanlar tablosunda
     aylardir oynayanla yarismak yeni geleni cesaretlendirmiyor.
     (Tum zamanlar tablosu localStorage'da duruyor, silinmiyor.) */
  function tabloCiz() {
    const list = [...turTablo.entries()]
      .map(([kid, t]) => ({ kid, ...t, seri: (tablo.get(kid) || {}).seri || 0 }))
      .sort((a, b) => b.puan - a.puan).slice(0, DIKEY ? 6 : 7);
    tabloEl.textContent = '';
    if (!list.length) {
      const bos = document.createElement('div'); bos.className = 'sira bos';
      bos.textContent = turNo + '. tur başladı — ilk doğruyu sen yaz';
      tabloEl.appendChild(bos);
      return;
    }
    const renkler = ['var(--altin)', '#d8dbe6', '#e29a5a'];
    list.forEach((t, i) => {
      const sira = document.createElement('div'); sira.className = 'sira' + (i === 0 ? ' lider' : '');
      const roz = document.createElement('div'); roz.className = 'rozet';
      roz.style.background = renkler[i] || '#6b5fb8'; roz.style.color = i > 2 ? '#fff' : '#191434';
      roz.textContent = String(i + 1);
      const ad = document.createElement('div'); ad.className = 'ad'; ad.textContent = t.ad;
      sira.appendChild(roz);
      if (!DIKEY) sira.appendChild(kimCipi(t.kid, 30));
      sira.appendChild(ad);
      if (t.seri > 1) { const se = document.createElement('div'); se.className = 'seri'; se.textContent = '🔥' + t.seri; sira.appendChild(se); }
      const pu = document.createElement('div'); pu.className = 'adet'; pu.textContent = String(t.puan);
      sira.appendChild(pu);
      tabloEl.appendChild(sira);
    });
    if (DIKEY) {
      /* ad: 54px -> 40px -> satira sar (TT.adSigdir). Alta sigmayan en dusuk
         siralar dusurulur — "…" yok. */
      tabloEl.querySelectorAll('.ad').forEach((el) => TT.adSigdir(el, 54, 40));
      while (tabloEl.scrollHeight > tabloEl.clientHeight + 1 && tabloEl.children.length > 1) {
        tabloEl.lastElementChild.remove();
      }
    }
  }

  /* PANO (dikey): soru sirasinda "CEVAP VERENLER" (yalniz ad + ✔; hangi sik
     OLDUGU gosterilmez), cevap acilinca "TUR TABLOSU" ilk 6. Yatayda tablo hep gorunur. */
  let panoZaman = 0;
  function panoCiz() {
    if (!DIKEY || durum === 'acik') { document.getElementById('tabloKutu').classList.remove('cevap'); tabloCiz(); return; }
    document.getElementById('tabloKutu').classList.add('cevap');
    tabloEl.textContent = '';
    const son = [...cevaplar.values()].reverse().slice(0, 6);   // en yeni uste
    if (!son.length) {
      const bos = document.createElement('div'); bos.className = 'sira bos';
      bos.textContent = 'şıkkı yaz, adın burada çıksın';
      tabloEl.appendChild(bos);
      return;
    }
    son.forEach((c) => {
      const sira = document.createElement('div'); sira.className = 'sira';
      const tik = document.createElement('div'); tik.className = 'tik'; tik.textContent = '✔';
      const ad = document.createElement('div'); ad.className = 'ad'; ad.textContent = c.ad;
      sira.append(tik, ad);
      tabloEl.appendChild(sira);
    });
    tabloEl.querySelectorAll('.ad').forEach((el) => TT.adSigdir(el, 54, 40));
    while (tabloEl.scrollHeight > tabloEl.clientHeight + 1 && tabloEl.children.length > 1) tabloEl.lastElementChild.remove();
  }

  function sayacCiz() {
    document.getElementById('sayacBuyuk').textContent = cevaplar.size;
    if (DIKEY && !panoZaman) panoZaman = setTimeout(() => { panoZaman = 0; if (durum === 'soru') panoCiz(); }, 120);
  }

  // ---- saat ----------------------------------------------------------------
  setInterval(() => {
    kalanSn -= 0.25;
    sureSnEl.textContent = Math.max(0, Math.ceil(kalanSn));
    if (durum === 'soru') {
      const oran = Math.max(0, kalanSn / SORU_SN);
      cubukYaz(cubukEl, oran);
      cubukEl.classList.toggle('az', oran < 0.3);
      if (kalanSn <= 0) cevabiAc();
    } else if (kalanSn <= 0) {
      yeniSoru();
    }
  }, 250);

  const DURUM_METNI = () => durum === 'soru' ? '— cevabını yaz' : '— sıradaki soruda yarışıyorsun';
  /* ILK TEMAS — oyun hangi durumda olursa olsun yazana karsilik ver.
     Olculen kusur: dongunun buyuk kismi "olu pencere"ydi; o aralikta
     yazan kisi ekranda hicbir sey gormuyordu. */
  TT.on('ilktemas', (e) => {
    const p = Profil.ekle(e.kid, isim(e.user), { mesaj: 1, xp: 2 });
    const oz = Profil.ozet(e.kid);
    Spiker.satir([{ kim: isim(e.user) }, ' ' + DURUM_METNI() + ' · '].concat(oz ? [oz] : [{ b: 'İLK KEZ' }]),
         { oncelik: 2, anahtar: 'temas' });
    if (window.Ses) Ses.cal('katil', 150);
  });

  // ---- olaylar -------------------------------------------------------------
  const kimlik = (u) => (u && (u.id || u.uniqueId)) || '';
  const isim = (u) => (u && (u.nickname || u.uniqueId)) || 'anon';

  /** Yorumdan sik cikar: "A", "b", "1", "şık c", "cevap 2"... */
  function sikBul(metin) {
    const t = String(metin || '').trim().toLocaleLowerCase('tr');
    // Uzun mesaj cevap degil sohbettir: "b" ya da "bence b" cevaptir ama
    // icinde tesadufen " a " gecen uzun bir cumle cevap sayilmamali.
    if (t.length > 24) return -1;
    const harf = t.match(/(?:^|\s)([abcd])(?:\s|$|\)|\.)/);
    if (harf) return HARFLER.indexOf(harf[1].toLocaleUpperCase('tr'));
    const rakam = t.match(/(?:^|\s)([1-4])(?:\s|$|\)|\.)/);
    if (rakam) return Number(rakam[1]) - 1;
    return -1;
  }

  TT.on('chat', (ev) => {
    const kid = kimlik(ev.user);
    if (!kid || durum !== 'soru') return;
    if (ev.user && ev.user.uniqueId) uidler.set(kid, ev.user.uniqueId);
    const sik = sikBul(ev.comment);
    if (sik < 0 || sik > 3) return;
    if (cevaplar.has(kid)) return;              // ilk cevap gecerli, spam ise yaramaz
    if (elenen.has(sik)) return;                // ipucuyla elenmis sik secilemez
    cevaplar.set(kid, { ad: isim(ev.user), sik, sira: cevaplar.size, kat: 1 });
    sayacCiz();
  });

  // Begeni: ORTAK ipucu bari. Dolunca yanlis siklardan biri elenir —
  // bireysel avantaj degil, herkese acik kolaylik. Begeni boylece
  // trivia'nin adaletini bozmadan oyuna giriyor.
  TT.on('like', (ev) => {
    if (durum !== 'soru') return;
    begeniSayaci += (ev.likes || 1);
    const kalanYanlis = [0, 1, 2, 3].filter((k) => k !== soru.d && !elenen.has(k));
    if (kalanYanlis.length <= 1) { ipucuDurumEl.textContent = 'ipucu bitti'; return; }
    const oran = Math.min(1, begeniSayaci / IPUCU);
    cubukYaz(ipucuDoluEl, oran);
    if (oran >= 1) {
      begeniSayaci = 0;
      cubukYaz(ipucuDoluEl, 0);
      const ele = kalanYanlis[Math.floor(Math.random() * kalanYanlis.length)];
      elenen.add(ele);
      const el = siklarEl.querySelector(`.sik[data-k="${ele}"]`);
      if (el) el.classList.add('elendi');
      Spiker.soyle(`❤️ İpucu açıldı — <b>${HARFLER[ele]}</b> şıkkı elendi!`, { oncelik: 2 });
    }
  });

  // Hediye: o soru icin PUAN KATLAYICI. Dogru cevabi satin almaz —
  // yine bilmen ve hizli olman gerekir, sadece odulu buyur.
  TT.on('gift', (ev) => {
    if (ev.gift && ev.gift.streaking) return;   // seri ara tikleri; son tik gelince tek tesekkur
    const kid = kimlik(ev.user);
    const ad = isim(ev.user);
    /* Hicbir hediye sessizce dusmez: gonderenin adi HER hediyede ekranda
       (ortak ULTI bandi: ad buyuk, etiket tarafsiz). Hediye kimin kazanacagini
       degistirmez: yalnizca o soruda ZATEN cevap yazmis olanin puanini katlar. */
    const k = ULTI.kademe((ev.gift && ev.gift.value) || 0);
    ULTI.duyur(ad, { ad: 'TEŞEKKÜRLER', emoji: '🎁', renk: k.renk, guc: k.guc }, 1800);
    const c = kid ? cevaplar.get(kid) : null;
    if (c) {
      c.kat = Math.min(3, (c.kat || 1) + 1);
      Spiker.satir(['🎁 ', { kim: c.ad }, ' puanını katladı — x' + c.kat], { oncelik: 2 });
    } else {
      Spiker.satir(['🎁 Sağ ol ', { kim: ad }, ' — şıkkı yaz, hediye puanını katlar'], { oncelik: 2 });
    }
  });

  // ---- demo (cazibe modu) --------------------------------------------------
  // Bos odada botlar cevap verir; ekran olu kalmaz, gelen izleyici formati
  // anlar. Botlar kalici tabloya YAZILMAZ (yukarida botMu kontrolu).
  setInterval(() => {
    if (durum !== 'soru' || kalanSn > SORU_SN * 0.7) return;
    const gercekVar = [...cevaplar.keys()].some((k) => !Kimlik.botMu(k));
    if (gercekVar || cevaplar.size >= 4) return;
    const b = Kimlik.bot(Math.floor(Math.random() * 8));
    if (cevaplar.has(b.kid)) return;
    // Botlar cogunlukla dogru bilir ama her zaman degil — sahte his olmasin
    const sik = Math.random() < 0.6 ? soru.d : Math.floor(Math.random() * 4);
    if (elenen.has(sik)) return;
    cevaplar.set(b.kid, { ad: b.ad, sik, sira: cevaplar.size, kat: 1 });
    sayacCiz();
  }, 1800);

  // ---- basla ---------------------------------------------------------------
  yeniSoru();

  TT.uyanis({
    baslik: 'BİLGİ YARIŞMASI',
    komutlar: ['A', 'B', 'C', 'D'],
    aciklama: 'Soruyu oku, şıkkı sohbete yaz · ilk doğru en çok puan · ❤️ beğeni ipucu açar · 🎁 hediye puanı katlar',
    cagri: 'şıkkı yaz, en hızlı sen ol',
  });
})();
</script>
</body>
</html>
