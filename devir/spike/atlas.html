<!doctype html><meta charset="utf-8"><body><script type="module">
import * as THREE from './v/three.module.min.js';
import { GLTFLoader } from './v/jsm/loaders/GLTFLoader.js';
const CW = 96, CH = 128, YON = 8, KARE = 8, KLIP = ['Walking_A', 'Cheer'];
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(CW * 2, CH * 2); r.setClearColor(0, 0);

const g = await new GLTFLoader().loadAsync('./Rogue.glb'); const o = g.scene; const sil = []; o.traverse((x) => { if (x.isMesh && !x.isSkinnedMesh) sil.push(x); if (x.isSkinnedMesh) x.frustumCulled = false; }); sil.forEach((x) => x.parent.remove(x)); sc.add(o);

  for (let f = 0; f < KARE; f++) { mx.setTime(klip.duration * f / KARE); for (let y = 0; y < YON; y++) { o.rotation.y = y / YON * Math.PI * 2; r.render(sc, cam); ax.drawImage(r.domElement, (k * KARE + f) * CW, y * CH, CW, CH); } } }
window.__atlas = at.toDataURL('image/png'); window.__bilgi = { w: at.width, h: at.height, ucgen: r.info.render.triangles };
</script>
